e traz esses aromas.", "O longo estágio em madeira dá-lhe as notas de flores e de laranja.", "O açúcar que fica por fermentar é que lhe dá o cheiro a uva."], "a": 0, "k": "Moscatel: casta perfumada e meses com as películas.", "e": ["O aroma vem sobretudo da uva.", "O Moscatel tem muitos compostos aromáticos na película; a maceração longa extrai-os. A aguardente serve para travar a fermentação.", "Diz-lhe: \"É a uva que fala: uma casta perfumada e meses com as películas.\""], "fonte": "https://jmf.pt/pdf/pt/ABT_P.pdf (ficha de produtor: maceração pelicular de 5 meses); falta fonte oficial (CVRPS)."}, {"id": "uva-2-s10", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente estranha os 14,5% de um tinto seco alentejano. De onde vem tanto álcool?", "o": ["Juntou-se aguardente durante a fermentação, como num vinho do Porto.", "Uvas mais maduras, de clima quente, têm mais açúcar para fermentar.", "O estágio em barrica tende a concentrar o vinho e a subir o álcool.", "Fermentou mais tempo, e cada semana a mais acrescenta álcool."], "a": 1, "k": "Uva mais madura, mais açúcar, mais álcool.", "e": ["O álcool vem do açúcar da uva.", "Na maturação o açúcar sobe; a fermentação transforma-o em álcool. Sem mais açúcar, fermentar mais tempo não dá mais álcool.", "Se o cliente quer menos álcool, sugere uma região mais fresca. Diz-lhe: \"Sol alentejano, uva madura, mais grau.\""]}, {"id": "uva-3-s03", "nivel": 3, "tipo": "escolha", "sit": true, "tema": "sala", "q": "\"O que quer dizer 'fermentação espontânea' no rótulo deste tinto?\", pergunta um cliente. O que é rigoroso dizer?", "o": ["Fermentou sem controlo de temperatura, ao ritmo natural da própria adega.", "Fermentou sem sulfitos adicionados, por isso é um vinho natural.", "Fermentou com leveduras da uva e da adega, sem leveduras compradas.", "Fermentou uma segunda vez na garrafa, sem a ajuda do enólogo."], "a": 2, "k": "Espontânea: só leveduras da uva e da adega.", "e": ["A diferença está nas leveduras, não na temperatura nem nos sulfitos.", "Muitas leveduras da uva não aguentam muito álcool; a que costuma acabar a fermentação vive sobretudo na adega.", "Diz-lhe: \"Fermentou com as leveduras da casa.\" Apresenta-o como escolha de estilo, não como garantia de qualidade."]}, {"id": "uva-3-s05", "nivel": 3, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente diz que o tinto do Minho não cheira ao \"vinho morangueiro\" do avô. Porquê?", "o": ["O morangueiro vem de uvas americanas, como a Isabel; o DOC usa só Vitis vinifera.", "O morangueiro vem de vinhas velhas de Vinhão, com aroma a morango.", "O tinto do Minho perdeu esse aroma com as novas técnicas de adega e de vinha.", "É a mesma uva, mas o vinho do avô era mais velho e mais evoluído."], "a": 0, "k": "Morangueiro é de uvas americanas; o DOC é vinifera.", "e": ["São uvas de espécies diferentes.", "A Isabel é um híbrido com Vitis labrusca, que dá aquele aroma a morango e a rebuçado.", "Responde com respeito pela memória do cliente e apresenta o Vinhão como o tinto tradicional do Minho."], "fonte": "https://stg.portugalresident.com/have-you-heard-of-portugals-forbidden-wine/"}, {"id": "uva-3-s06", "nivel": 3, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente acha um tinto jovem de Colares, servido à temperatura certa, \"duro e ácido\". Qual é a explicação mais provável?", "o": ["A Ramisco tende a dar acidez alta e taninos firmes, que pedem tempo.", "Foi servido frio de mais, e o frio tende a realçar a acidez e o tanino.", "Está em fim de vida: com a idade, a fruta cai e o tanino endurece.", "As vinhas na areia tendem a dar uvas pouco maduras e vinho aguado."], "a": 0, "k": "Ramisco jovem: ácido e firme, pede tempo e comida.", "e": ["Com a temperatura certa e o vinho jovem, o mais provável é o perfil da casta.", "A Ramisco dá tintos de acidez elevada e taninos firmes, que tendem a mostrar-se melhor com a idade.", "Sugere-o com um prato com alguma gordura, que tende a amaciar o tanino (Serviço 4)."]}, {"id": "uva-3-s07", "nivel": 3, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente pede \"Moscatel Roxo\", mas só há Moscatel de Setúbal. Podes dizer que é o mesmo?", "o": ["Sim: Roxo é só o nome dado ao Moscatel de Setúbal com mais idade.", "Sim: é a mesma casta, só que vindimada mais tarde, com uvas mais maduras.", "Não: o Moscatel Roxo é um tinto seco de mesa, e não um vinho generoso.", "Não: são castas diferentes; Setúbal usa sobretudo Moscatel de Alexandria."], "a": 3, "k": "Moscatel Roxo e Moscatel de Alexandria: castas diferentes.", "e": ["Os dois vinhos vêm de castas diferentes; a idade e a data da vindima não mudam a casta.", "O Moscatel de Setúbal tradicional é de Moscatel de Alexandria (Graúdo); o Moscatel Roxo é uma casta rara da península.", "Sê honesto e propõe o Moscatel de Setúbal como alternativa próxima."]}, {"id": "uva-3-s08", "nivel": 3, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente acha que o Alvarinho \"não cheira a nada\". Está servido muito gelado. O que fazes?", "o": ["Deixas o copo aquecer um pouco: o frio excessivo esconde parte do aroma.", "Pões a garrafa de volta no gelo, para o aroma ficar mais fresco e intenso.", "Serves num copo mais pequeno, que concentra melhor o aroma.", "Dizes que o Alvarinho é uma casta neutra, quase sem aroma."], "a": 0, "k": "Alvarinho gelado de mais esconde o aroma.", "e": ["O aroma está lá, mas está escondido.", "Os compostos aromáticos (como os terpenos florais) evaporam menos a temperaturas muito baixas.", "Servir brancos aromáticos fresco, mas não gelado, ajuda o vinho a mostrar-se."]}, {"id": "uva-3-s10", "nivel": 3, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente acha um tinto alentejano \"quase preto\". No contrarrótulo, lê que o sumo da uva já sai tinto ao esmagar. Que casta ajuda a explicar?", "o": ["A Touriga Nacional, de bago pequeno e de película grossa e escura.", "A Alicante Bouschet, tintureira, com cor na película e na polpa.", "O Aragonez, com estágio longo em barrica, que escurece a cor.", "A Trincadeira, com maceração longa, que tira cor às grainhas."], "a": 1, "k": "Sumo tinto ao esmagar? Casta tintureira, como a Alicante Bouschet.", "e": ["A cor vem também da polpa, e a Alicante Bouschet é muito plantada no Alentejo.", "Na maioria das castas, a cor está só na película. A Alicante Bouschet é tintureira: tem também polpa tinta.", "Prepara o cliente: estes tintos tendem a ser intensos na cor e na boca."], "fonte": "https://en.wikipedia.org/wiki/Alicante_Bouschet"}], "temas": {"bago": "O bago por dentro", "composicao": "O que há dentro da uva", "especies": "Espécies, castas e clones", "castas": "Castas portuguesas", "aromas": "Aromas da uva", "sala": "Situação de sala"}, "mesa": 1, "num": 1};
window.FASE_VINHA={"fase": "vinha", "num": 2, "titulo": "A Vinha", "mesa": 2, "versao": "2026-10-17 v1: 31 perguntas de planta vindas da Uva + 55 novas (teoria e situações de sala). Revistas a 17 out 2026 contra os slides WSET 3 (sessão 2): sem erros; 4 explicações afinadas; as que têm fonte foram confirmadas. Factos de regiões portuguesas que os slides não cobrem ficam por confirmar pela autora.", "niveis": [{"n": 1, "id": "iniciante", "nome": "Iniciante", "alcunha": "Ruby"}, {"n": 2, "id": "intermedio", "nome": "Intermédio", "alcunha": "Tawny"}, {"n": 3, "id": "avancado", "nome": "Avançado", "alcunha": "Vintage"}], "regra": {"perguntas_por_ronda": 8, "bagos": 3, "sobe_com_erros_ate": 1, "fica_com_erros": 2, "desce_com_erros": 3, "erradas_por_ronda_max": 3, "nota_rever": "Perguntas com \"rever\": true ficam guardadas mas fora das rondas até serem confirmadas.", "situacoes_por_ronda": 2}, "temas": {"videira": "A videira", "ciclo": "O ano da videira", "clima": "Clima e tempo", "solo": "Solo e paisagem", "viticultura": "Trabalho na vinha", "filoxera": "Filoxera e enxertia", "vinhas-velhas": "Vinhas velhas", "doencas": "Doenças e perigos", "sala": "Situação de sala"}, "licao": {"titulo": "O ano da videira", "fases": [{"id": "abrolhamento", "t": "Abrolhamento", "m": "Março e abril", "d": "A videira acorda: os gomos incham, abrem e saem os primeiros rebentos. Tão tenros que uma geada os pode queimar."}, {"id": "floracao", "t": "Floração", "m": "Maio e junho", "d": "Nascem flores pequeninas e verdes nos futuros cachos. A videira poliniza-se sozinha, mas chuva ou frio podem estragar o vingamento."}, {"id": "vingamento", "t": "Vingamento", "m": "Junho", "d": "As flores fecundadas viram bagos verdes e duros. As que não vingam caem."}, {"id": "pintor", "t": "Pintor", "m": "Julho e agosto", "d": "Os bagos amolecem e mudam de roupa: os tintos ganham cor, os brancos ficam translúcidos."}, {"id": "maturacao", "t": "Maturação", "m": "Agosto a outubro", "d": "Os bagos enchem-se de açúcar e perdem acidez. Os taninos e os aromas também vão amadurecendo."}, {"id": "vindima", "t": "Vindima", "m": "Agosto a outubro", "d": "Hora de apanhar a uva! Colhe-se quando ela chega ao ponto que o estilo de vinho pede."}, {"id": "queda", "t": "Queda da folha", "m": "Outubro e novembro", "d": "Antes de as folhas caírem, a videira guarda reservas na madeira e nas raízes. É a despensa para o inverno."}, {"id": "repouso", "t": "Repouso", "m": "Dezembro a fevereiro", "d": "A videira dorme, despida de folhas, e poupa energia. É a altura da poda principal."}], "quando": [{"q": "Os bagos amolecem e mudam de cor.", "a": "pintor"}, {"q": "Faz-se a poda principal, com a videira sem folhas.", "a": "repouso"}, {"q": "Os gomos abrem e saem os primeiros rebentos.", "a": "abrolhamento"}, {"q": "As flores fecundadas viram bagos verdes e duros.", "a": "vingamento"}, {"q": "Os rebentos acabados de nascer temem uma geada.", "a": "abrolhamento"}, {"q": "Os bagos já mudaram de cor e continuam a ganhar açúcar.", "a": "maturacao"}]}, "perguntas": [{"id": "vinha-1-01", "nivel": 1, "tipo": "escolha", "q": "Como se chama o processo em que as folhas fazem açúcar com a luz do sol?", "o": ["Fotossíntese", "Respiração", "Transpiração", "Atempamento"], "a": 0, "e": "As folhas são a cozinha da videira: com luz, água e o dióxido de carbono do ar, fazem açúcar. Parte dele viaja até aos bagos.", "tema": "videira", "origem": "uva-1-06", "k": "Fotossíntese: as folhas cozinham açúcar com a luz do sol."}, {"id": "vinha-1-02", "nivel": 1, "tipo": "vf", "q": "A flor da videira é grande e vistosa, como a da macieira.", "a": false, "e": "Falso: as flores são pequenas e esverdeadas, juntas em cachinhos. Passam quase despercebidas, mas é delas que nascem os bagos.", "tema": "videira", "origem": "uva-1-13", "k": "Flor da videira: pequenina, verde e discreta."}, {"id": "vinha-1-03", "nivel": 1, "tipo": "escolha", "q": "As gavinhas e os cachos nascem do mesmo tipo de órgão. Por isso, uma gavinha pode, às vezes…", "o": ["Dar alguns bagos", "Virar raiz", "Cair no inverno e voltar a nascer no mesmo sítio", "Transformar-se num sarmento"], "a": 0, "e": "Gavinhas e cachos nascem no mesmo sítio do pâmpano. Às vezes, uma gavinha fica a meio caminho e dá uns bagos.", "tema": "videira", "sala": "Mais açúcar na uva tende a dar mais álcool no vinho, se a fermentação for até ao fim.", "origem": "uva-1-14", "k": "Gavinha e cacho: primos com a mesma origem."}, {"id": "vinha-1-04", "nivel": 1, "tema": "videira", "tipo": "escolha", "q": "O tronco da videira também tem outro nome. Qual?", "o": ["Cepa", "Engaço", "Bago", "Gomo"], "a": 0, "e": "No dia a dia, “cepa” também quer dizer a própria videira: “uma cepa velha”. Uma palavra, dois empregos. A língua também dá rebentos.", "sala": "Vais ouvir \"cepas velhas\" e \"vinhas velhas\" nos rótulos e na conversa com os clientes.", "origem": "uva-1-16", "k": "Cepa: o tronco e, muitas vezes, a videira inteira."}, {"id": "vinha-1-05", "nivel": 1, "tema": "videira", "tipo": "escolha", "q": "Que parte leva a água das raízes até às folhas e aos cachos?", "o": ["O tronco", "As gavinhas", "As grainhas", "A pruína"], "a": 0, "e": "A seiva sobe pelo tronco, passa pelos braços e chega aos ramos e às folhas, como água num sistema de canos. Só que estes canos estão vivos e crescem.", "origem": "uva-1-22", "k": "Tronco: a canalização viva da videira.", "rever": true}, {"id": "vinha-1-06", "nivel": 1, "tema": "videira", "tipo": "vf", "q": "Uma videira pode viver mais de 100 anos.", "a": true, "e": "Com a idade, tendem a dar menos uva. Mas idade, só por si, não garante melhor vinho: contam também a casta, o solo, o clima e os cuidados na vinha.", "sala": "\"Vinhas velhas\" no rótulo diz a idade das videiras. Não garante, sozinho, um vinho melhor.", "origem": "uva-1-23", "k": "Há videiras centenárias, e continuam a dar uvas."}, {"id": "vinha-1-07", "nivel": 1, "tema": "videira", "tipo": "escolha", "q": "Para que servem as gavinhas?", "o": ["Agarrar a videira a um apoio", "Guardar água para o verão", "Proteger os cachos do sol", "Segurar as folhas ao ramo"], "a": 0, "e": "Nascem enquanto o rebento cresce e enrolam-se mal tocam num arame, numa estaca ou numa árvore. Assim a videira sobe em direção à luz.", "origem": "uva-1-30", "k": "Gavinhas: as mãozinhas com que a videira trepa."}, {"id": "vinha-1-08", "nivel": 1, "tipo": "escolha", "tema": "ciclo", "q": "Em que estação se faz a poda principal?", "o": ["No inverno", "Na primavera", "No verão", "Durante a vindima"], "a": 0, "e": "Sem folhas, vê-se bem a planta. A poda decide quantos gomos ficam e, com isso, quanta uva a videira vai tentar amadurecer. No verão há uma poda mais leve, nas partes verdes.", "sala": "Uma vinha podada no inverno parece morta. Não está: está a descansar.", "fonte": "WSET Nível 3, sessão 2 (slides): poda de inverno e de verão", "k": "Poda principal: no inverno, com a videira a dormir."}, {"id": "vinha-1-09", "nivel": 1, "tipo": "escolha", "tema": "ciclo", "q": "Os gomos abrem-se e nascem os primeiros rebentos. Como se chama este momento?", "o": ["Abrolhamento", "Pintor", "Atempamento", "Vindima"], "a": 0, "e": "Em Portugal costuma acontecer entre março e abril. Os rebentos ainda são muito tenros, e uma geada nesta altura pode queimá-los.", "k": "Abrolhamento: a videira acorda e abre os gomos."}, {"id": "vinha-1-10", "nivel": 1, "tipo": "escolha", "tema": "ciclo", "q": "Os bagos amolecem e mudam de cor. Em que fase está a uva?", "o": ["Pintor", "Floração", "Repouso", "Abrolhamento"], "a": 0, "e": "Em francês diz-se véraison. As uvas tintas ganham cor e as brancas ficam mais translúcidas. A partir daqui, o açúcar começa a subir depressa.", "sala": "Quem visita uma vinha em agosto vê às vezes cachos meio verdes, meio tintos: é o pintor a meio.", "k": "Pintor: a uva muda de roupa e amolece."}, {"id": "vinha-1-11", "nivel": 1, "tipo": "vf", "tema": "ciclo", "q": "A videira dá flor antes de dar uvas.", "a": true, "e": "São flores pequenas e verdes, quase não se dão por elas. Em Portugal, a floração costuma ser entre maio e junho.", "k": "Primeiro flores, depois bagos. Cada flor que vinga, um bago.", "rever": true}, {"id": "vinha-1-12", "nivel": 1, "tipo": "escolha", "tema": "ciclo", "q": "Em Portugal, quando se faz sobretudo a vindima?", "o": ["Entre agosto e outubro", "Entre junho e julho", "Entre outubro e dezembro", "Só em setembro"], "a": 0, "e": "Arranca em agosto nas zonas mais quentes e nas uvas para espumante. Nas zonas mais frescas, ou com castas tardias, pode ir até outubro.", "k": "Vindima em Portugal: de agosto a outubro."}, {"id": "vinha-1-13", "nivel": 1, "tipo": "escolha", "tema": "clima", "q": "Do que precisa a videira para amadurecer as uvas?", "o": ["Calor e luz do sol", "Solo muito fértil e rico", "Muita água no verão", "Muita sombra das folhas"], "a": 0, "e": "A luz alimenta a fotossíntese e o calor põe a planta a trabalhar. Abaixo de uns 10 °C, a videira quase não cresce.", "sala": "Mais sol e calor tendem a dar uvas mais maduras: mais açúcar, mais álcool no vinho e fruta mais madura.", "fonte": "WSET Nível 3, sessão 2 (slides): o que a videira precisa (calor, luz, água)", "k": "Luz e calor: o combustível da maturação."}, {"id": "vinha-1-14", "nivel": 1, "tipo": "vf", "tema": "solo", "q": "No Douro, os \"patamares\" são socalcos modernos, de terra, sem muros de pedra.", "a": true, "e": "Verdadeiro: os patamares, feitos à máquina desde os anos 70, seguram a terra com taludes em vez de muros de xisto. Os socalcos antigos, de pedra, são Património Mundial da UNESCO desde 2001.", "sala": "Socalcos no rótulo ou na conversa querem dizer vinha em escada, trabalhada sobretudo à mão.", "k": "Patamares: socalcos modernos, com taludes de terra."}, {"id": "vinha-1-15", "nivel": 1, "tipo": "escolha", "tema": "solo", "q": "Que rocha manda nos solos do Douro?", "o": ["Xisto", "Areia", "Calcário", "Basalto"], "a": 0, "e": "As raízes descem pelas fendas entre as lâminas à procura de água. Também há manchas de granito na região.", "k": "Douro: xisto, uma rocha que se parte em folhas."}, {"id": "vinha-1-16", "nivel": 1, "tipo": "escolha", "tema": "clima", "q": "Porque é que o Minho, terra do Vinho Verde, é tão verde?", "o": ["Chove muito, por causa do Atlântico", "Os solos de calcário guardam a água", "As vinhas são regadas todo o verão", "Tem invernos com muita neve"], "a": 0, "e": "Chove sobretudo no outono e no inverno, e é das regiões mais chuvosas do país. Bom para o verde, mais trabalho na vinha: humidade a mais favorece os fungos.", "sala": "Clima fresco e húmido ajuda a explicar a acidez viva dos brancos do Minho.", "k": "Minho: o Atlântico ao lado, a chuva por perto."}, {"id": "vinha-1-17", "nivel": 1, "tipo": "escolha", "tema": "viticultura", "q": "Como se chama a apanha das uvas?", "o": ["Vindima", "Poda", "Enxertia", "Mergulhia"], "a": 0, "e": "Nos socalcos do Douro, muitas vinhas só se vindimam à mão: as máquinas não chegam onde chegam as pessoas.", "fonte": "WSET Nível 3, sessão 2 (slides): vindima manual e mecânica", "k": "Vindima: a festa (e o trabalho) da apanha.", "rever": true}, {"id": "vinha-1-18", "nivel": 1, "tipo": "escolha", "tema": "clima", "q": "Uma geada de primavera, logo depois do abrolhamento, pode…", "o": ["Queimar os rebentos novos e reduzir a colheita", "Atrasar a vindima umas semanas, sem perder uva", "Dar bagos mais pequenos, mais doces e concentrados", "Afetar só as uvas que já estão maduras no cacho"], "a": 0, "e": "A videira pode lançar rebentos de reserva, mas costumam dar menos uva. As zonas baixas sofrem mais, porque o ar frio desce e fica lá parado.", "fonte": "WSET Nível 3, sessão 2 (slides): riscos de temperatura (geadas de primavera)", "k": "Geada de primavera: rebentos tenros, colheita em risco."}, {"id": "vinha-1-19", "nivel": 1, "tipo": "escolha", "tema": "viticultura", "q": "Para que serve a poda?", "o": ["Escolher quantos gomos ficam e controlar quanto a videira produz", "Tirar as folhas que fazem sombra aos cachos antes da vindima", "Tratar a videira contra o míldio e outras doenças de fungos", "Aumentar sempre o número de cachos que cada videira produz"], "a": 0, "e": "Cada gomo que fica pode dar um rebento com cachos. Menos gomos tendem a dar menos uva por videira. E a tesoura também dá forma à planta.", "fonte": "WSET Nível 3, sessão 2 (slides): poda e condução", "k": "Poda: decidir hoje quanta uva vem amanhã."}, {"id": "vinha-1-s01", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente lê \"vinhas em socalcos\" no rótulo de um tinto do Douro e pergunta o que é. O que lhe dizes?", "o": ["Vinhas plantadas em degraus na encosta, com muros de pedra", "Vinhas junto ao rio, regadas naturalmente pelas cheias do inverno", "Vinhas plantadas entre oliveiras e amendoeiras", "Uvas postas a secar ao sol depois da vindima"], "a": 0, "e": ["É uma palavra de paisagem, não de técnica de adega.", "As encostas do Douro são muito inclinadas: os degraus deixam plantar e seguram a terra.", "Diz-lhe: \"É a vinha em escada do Douro, quase toda trabalhada à mão. A paisagem é Património Mundial.\""], "k": "Socalcos: degraus de pedra na encosta."}, {"id": "vinha-1-s02", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Uma cliente vê \"Colheita 2024\" num branco do Dão e pergunta o que quer dizer. O que respondes?", "o": ["É o ano em que as uvas foram vindimadas", "É o ano em que a vinha foi plantada", "É a data-limite para beber o vinho", "É o ano em que o vinho foi engarrafado"], "a": 0, "e": ["Num vinho tranquilo, a colheita é o ano da vindima: pelo menos 85% das uvas são desse ano.", "Cada ano tem o seu tempo, com mais ou menos chuva e calor, e isso muda a uva.", "Diz-lhe: \"O mesmo vinho, de anos diferentes, pode saber diferente. Faz parte da graça.\""], "k": "Colheita no rótulo: o ano da vindima."}, {"id": "vinha-1-s03", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente pergunta porque é que um Vinho Verde tende a ser mais fresco e ácido do que um branco do Alentejo. Qual é a melhor explicação?", "o": ["O Minho é mais fresco e chuvoso; com menos calor, a uva guarda mais acidez", "O Vinho Verde faz-se com uvas verdes, apanhadas antes de amadurecerem", "No Minho junta-se ácido a todos os vinhos, por regra da região", "Os solos de calcário do Minho dão muita acidez às uvas"], "a": 0, "e": ["A diferença começa no clima de cada região.", "Com mais calor, a uva perde acidez mais depressa ao amadurecer; no Minho, fresco e atlântico, guarda-a.", "Usa o contraste para ajudar a escolher: mais frescura, Minho; um branco mais redondo, Alentejo."], "k": "Menos calor, mais acidez guardada na uva."}, {"id": "vinha-1-s04", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um turista quer ver a vindima no Douro e pergunta em que mês deve ir. O que sugeres?", "o": ["Setembro", "Julho", "Novembro", "Junho"], "a": 0, "e": ["No Douro, a vindima concentra-se em setembro.", "Pode começar no fim de agosto e ir até outubro: depende do calor do ano e da casta.", "Diz-lhe: \"Vá em setembro, mas confirme as datas perto da viagem: mudam de ano para ano.\""], "k": "Vindima no Douro: aposta em setembro."}, {"id": "vinha-1-s05", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente lê \"Vinhas Velhas\" num tinto do Douro e pergunta: \"Então o vinho é velho?\" O que respondes?", "o": ["Não: velhas são as videiras, não o vinho", "Sim, o vinho tem mais de 30 anos", "É um vinho feito com uvas passas", "Quer dizer que o vinho estagiou numa adega antiga"], "a": 0, "e": ["\"Vinhas Velhas\" fala da idade das cepas, não da idade do vinho.", "Videiras velhas tendem a dar menos uva e têm raízes mais fundas; o vinho pode ser bem jovem.", "Diz-lhe que é uma pista de estilo, não uma garantia de qualidade, e mostra o ano da colheita no rótulo."], "k": "Vinhas Velhas: velhas são as cepas, não o vinho."}, {"id": "vinha-1-s06", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Uma cliente conta que, em março, viu gotas a escorrer dos cortes da poda numa vinha. Pergunta se as plantas estavam doentes. O que lhe dizes?", "o": ["Não: é o choro, a seiva a subir quando a videira acorda", "Sim, é um sinal de míldio, que ataca nesta altura", "É orvalho da noite que entrou pelos cortes do tronco", "São restos dos tratamentos de inverno a escorrer"], "a": 0, "e": ["É o choro da videira: a seiva escorre pelos cortes no fim do inverno.", "Com o solo a aquecer, as raízes voltam a empurrar seiva para cima; o abrolhamento está perto.", "Diz-lhe: \"Fique descansada: é sinal de que a vinha está viva e prestes a rebentar.\""], "k": "Choro: a videira a acordar, não a adoecer."}, {"id": "vinha-1-s07", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um turista acabou de chegar do Pico, nos Açores, e pergunta porque é que lá as vinhas estão rodeadas de muros baixos de pedra negra. O que lhe explicas?", "o": ["Os currais protegem as videiras do vento e do sal do mar e guardam calor", "Servem para marcar a casta plantada em cada curral", "São restos de casas antigas, abandonadas depois de uma erupção vulcânica", "Guardam a água da chuva para regar as vinhas no verão"], "a": 0, "e": ["Os muros são os currais, feitos com a pedra vulcânica da ilha.", "Abrigam do vento atlântico e dos salpicos do mar, e a pedra escura guarda o calor do dia.", "Conta que a paisagem é Património Mundial da UNESCO desde 2004. Boa deixa para um branco dos Açores."], "k": "Currais do Pico: abrigo de pedra contra vento e mar."}, {"id": "vinha-1-s08", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente pede um tinto \"de um ano quente\". O que é que esse ano tende a mudar no vinho?", "o": ["Uvas mais maduras: tende a dar mais álcool e fruta mais madura, com menos acidez", "Uvas menos maduras: tende a dar mais acidez, menos álcool e fruta mais verde", "Vinho mais claro e mais leve, porque o sol queima a cor da uva", "Nada de especial: o ano da colheita quase não muda o vinho"], "a": 0, "e": ["O tempo de cada ano muda a maturação da uva.", "Com mais calor, a uva tende a juntar mais açúcar e a perder acidez mais depressa; na fermentação, o açúcar vira álcool.", "É tendência, não promessa: produtor, vinha, como correu o ano e adega pesam. Confirma esse vinho antes de o recomendares."], "k": "Ano quente: tende a dar mais álcool e menos acidez."}, {"id": "vinha-2-01", "nivel": 2, "tipo": "escolha", "q": "A videira trepa agarrada a uns fios em espiral. Como se chamam?", "o": ["Gavinhas", "Sarmentos", "Gomos", "Engaços"], "a": 0, "e": "Formam-se enquanto o pâmpano cresce e enrolam-se assim que tocam num apoio. A estratégia é simples: crescer e agarrar-se pelo caminho.", "tema": "videira", "origem": "uva-2-10", "k": "Gavinhas: as mãozinhas com que a videira trepa."}, {"id": "vinha-2-02", "nivel": 2, "tipo": "escolha", "q": "Entre o verão e o outono, os ramos do ano ficam duros como madeira. Passam a chamar-se…", "o": ["Sarmentos", "Raízes", "Braços", "Gavinhas"], "a": 0, "e": "Enquanto são verdes e tenros, chamam-se pâmpanos. Na poda de inverno, muitos sarmentos são cortados para orientar a produção.", "tema": "videira", "origem": "uva-2-11", "k": "Pâmpano verde, sarmento castanho: o mesmo ramo, noutra idade."}, {"id": "vinha-2-03", "nivel": 2, "tipo": "escolha", "q": "Os pequenos botões de onde nascem os ramos novos chamam-se…", "o": ["Gomos", "Grainhas", "Bagos", "Gavinhas"], "a": 0, "e": "Na primavera, incham e abrem-se: é o abrolhamento, o despertador anual da videira.", "tema": "videira", "origem": "uva-2-12", "k": "Gomos: os botões onde dormem os ramos novos."}, {"id": "vinha-2-04", "nivel": 2, "tipo": "escolha", "q": "Além de beber água, para que servem as raízes?", "o": ["Segurar a planta e guardar reservas para o inverno", "Fazer a fotossíntese quando as folhas ainda não nasceram", "Produzir os taninos que depois sobem até aos bagos", "Dar cor às uvas através dos minerais do solo"], "a": 0, "e": "Seguram a planta e absorvem água e minerais. Também guardam reservas, mas não sozinhas: a madeira da videira ajuda. A despensa é partilhada.", "tema": "videira", "origem": "uva-2-13", "k": "Raízes: âncora, palhinha e um pedaço da despensa."}, {"id": "vinha-2-05", "nivel": 2, "tipo": "escolha", "q": "O que é a filoxera?", "o": ["Um inseto que ataca as raízes", "Um fungo que ataca as folhas", "Uma doença do vinho na garrafa", "Uma casta americana"], "a": 0, "e": "É parente dos pulgões, e a forma que vive nas raízes faz estragos sérios na videira europeia (Vitis vinifera). Por isso, enxertar em porta-enxertos resistentes mudou a viticultura.", "tema": "filoxera", "origem": "uva-2-14", "k": "Filoxera: um pequeno inseto que ataca as raízes."}, {"id": "vinha-2-06", "nivel": 2, "tipo": "escolha", "q": "De onde veio a filoxera?", "o": ["América do Norte", "Ásia", "Norte de África", "Austrália"], "a": 0, "e": "Chegou à Europa no século XIX, escondida em material vegetal. Uma passageira clandestina que ninguém pediu.", "tema": "filoxera", "origem": "uva-2-15", "k": "Filoxera: veio da América do Norte, sem convite."}, {"id": "vinha-2-07", "nivel": 2, "tema": "videira", "tipo": "escolha", "q": "Na folha da videira, como se chama a parte larga e plana?", "o": ["Limbo", "Pecíolo", "Nervura", "Gavinha"], "a": 0, "e": "O pecíolo é o “cabinho” que liga o limbo ao ramo. Juntos, fazem a folha.", "origem": "uva-2-25", "k": "Limbo: a parte larga da folha. Pecíolo: o cabinho."}, {"id": "vinha-2-08", "nivel": 2, "tema": "videira", "tipo": "escolha", "q": "Porque é que a forma da folha interessa a quem estuda castas?", "o": ["Ajuda a identificar a casta", "Diz quanto açúcar tem a uva", "Mostra se a vinha é regada", "Mostra a idade da videira"], "a": 0, "e": "Isto chama-se ampelografia. Hoje, olhar para a folha pode juntar-se à análise de ADN: lupa e laboratório, dupla de detetives.", "origem": "uva-2-26", "k": "A folha é o bilhete de identidade da casta."}, {"id": "vinha-2-09", "nivel": 2, "tema": "videira", "tipo": "escolha", "q": "Os rebentos que nascem ao lado do ramo principal chamam-se…", "o": ["Netas", "Gavinhas", "Braços", "Raízes"], "a": 0, "e": "Também se chamam feminelas. Podem tirar-se para arrumar a folhagem e arejar a vinha, mas a decisão depende do vigor e do clima de cada vinha.", "origem": "uva-2-27", "k": "Netas: os rebentos que nascem de lado."}, {"id": "vinha-2-10", "nivel": 2, "tema": "videira", "tipo": "escolha", "q": "O ramo novo, ainda verde e tenro, chama-se…", "o": ["Pâmpano", "Engaço", "Pedicelo", "Garfo"], "a": 0, "e": "Quando amadurece e fica lenhoso, passa a sarmento: troca a roupa de verão pelo casaco de inverno.", "origem": "uva-2-28", "k": "Pâmpano: o ramo verde e tenro. Como este nível!"}, {"id": "vinha-2-11", "nivel": 2, "tema": "videira", "tipo": "vf", "q": "A maioria das videiras cultivadas consegue polinizar as próprias flores.", "a": true, "e": "Na maioria das castas, cada flor tem partes masculinas e femininas. Os insetos podem aparecer de visita, mas geralmente não fazem falta.", "origem": "uva-2-30", "k": "Em regra, a videira trata da polinização sozinha."}, {"id": "vinha-2-12", "nivel": 2, "tipo": "escolha", "tema": "ciclo", "q": "Qual é a ordem certa do ano da videira?", "o": ["Abrolhamento, floração, vingamento, pintor, vindima", "Floração, abrolhamento, pintor, vingamento, vindima", "Abrolhamento, pintor, floração, vindima, vingamento", "Vingamento, floração, abrolhamento, vindima, pintor"], "a": 0, "e": "Os gomos abrem, as flores fecundadas viram bagos, os bagos mudam de cor no pintor e amadurecem até à vindima. Depois, as folhas caem e a videira descansa.", "k": "Acorda, floresce, vinga, muda de cor e vai à vindima."}, {"id": "vinha-2-13", "nivel": 2, "tipo": "escolha", "tema": "ciclo", "q": "Como se chama a fase em que as flores fecundadas passam a pequenos bagos verdes?", "o": ["Vingamento", "Pintor", "Abrolhamento", "Atempamento"], "a": 0, "e": "É normal cair uma parte das flores. Com chuva, frio ou vento na floração, caem muitas mais: é o desavinho.", "k": "Vingamento: a flor fecundada passa a bago."}, {"id": "vinha-2-14", "nivel": 2, "tipo": "escolha", "tema": "ciclo", "q": "O que é o atempamento?", "o": ["Os pâmpanos verdes ficam lenhosos e passam a sarmentos", "As uvas mudam de cor e começam a amadurecer", "A poda de inverno, que corta os sarmentos velhos", "As flores são fecundadas e passam a pequenos bagos"], "a": 0, "e": "Acontece desde o pintor até ao outono: os ramos verdes endurecem, ganham cor de madeira e aguentam o inverno.", "fonte": "WSET Nível 3, sessão 2 (slides): partes lenhosas da videira (pâmpanos, vara)", "k": "Atempamento: o ramo verde veste o casaco de madeira."}, {"id": "vinha-2-15", "nivel": 2, "tipo": "escolha", "tema": "clima", "q": "Nas vinhas altas da Beira Interior, dias quentes e noites frescas ajudam a uva a…", "o": ["Guardar acidez e aromas enquanto amadurece", "Amadurecer mais depressa e com mais álcool", "Perder acidez durante a noite", "Ganhar açúcar sobretudo à noite"], "a": 0, "e": "A essa diferença chama-se amplitude térmica. De dia, o calor amadurece a uva; à noite, o fresco abranda a perda de acidez e ajuda a guardar aromas.", "sala": "\"Vinha de altitude\" num rótulo é uma pista de frescura.", "fonte": "WSET Nível 3, sessão 2 (slides): fatores do clima: altitude, amplitude térmica diária", "k": "Dia quente, noite fresca: a uva guarda a acidez."}, {"id": "vinha-2-16", "nivel": 2, "tipo": "escolha", "tema": "clima", "q": "Na vinha, qual é a diferença entre clima e tempo?", "o": ["Clima é o padrão de muitos anos; tempo é o que acontece em cada ano", "São a mesma coisa", "Clima é o inverno; tempo é o verão", "Tempo é o padrão de muitos anos; clima é o que acontece em cada dia"], "a": 0, "e": "O clima diz o que costuma acontecer numa região; o tempo, o que aconteceu num ano concreto. O tempo de cada ano é uma das grandes razões por que colheitas do mesmo vinho sabem diferente.", "k": "Clima: o que se espera. Tempo: o que calha."}, {"id": "vinha-2-17", "nivel": 2, "tipo": "escolha", "tema": "solo", "q": "Porque é que o xisto do Douro pode ajudar a videira num verão seco?", "o": ["As raízes descem pelas fendas da rocha até à água guardada lá no fundo", "O xisto aquece pouco ao sol e mantém a vinha fresca no verão", "O xisto é muito fértil e alimenta a videira com muitos nutrientes", "O xisto guarda a água da chuva à superfície, perto das raízes"], "a": 0, "e": "O xisto parte-se em placas quase verticais. As raízes entram pelas fendas, às vezes vários metros abaixo, até à água que o verão não secou. As pedras à superfície também guardam calor.", "k": "No xisto, as raízes descem pelas fendas atrás de água."}, {"id": "vinha-2-18", "nivel": 2, "tipo": "escolha", "tema": "solo", "q": "Que tipo de solo domina na Bairrada, terra da Baga?", "o": ["Argilo-calcário", "Xisto", "Areia vulcânica", "Granito"], "a": 0, "e": "Há também zonas de areia. A argila guarda água: ajuda nos verões secos, mas pesa nos anos de muita chuva.", "sala": "Na Bairrada, muitos produtores falam do barro: é a argila destes solos.", "k": "Bairrada: argila e calcário, a casa da Baga."}, {"id": "vinha-2-19", "nivel": 2, "tipo": "escolha", "tema": "clima", "q": "O Dão está rodeado de serras, como a Estrela e o Caramulo. Que proteção lhe dão?", "o": ["Abrigam a vinha do Atlântico direto e dos ventos secos do interior", "Dão sombra a todas as vinhas durante as horas de mais calor", "Trazem mais chuva do Atlântico e mais humidade às vinhas", "Aquecem as vinhas à noite com o ar quente que desce das serras"], "a": 0, "e": "As serras a oeste travam parte da chuva e do vento do Atlântico; a Serra da Estrela abriga do lado do interior. Resultado: uma região mais equilibrada, com solos sobretudo de granito.", "fonte": "CCDR Centro, 'Conheça os vinhos DOP da região Centro: Dão' (serras e solos de granito)", "k": "Dão: vinhas abrigadas pelas serras, como num abraço."}, {"id": "vinha-2-20", "nivel": 2, "tipo": "escolha", "tema": "viticultura", "q": "Muitas vinhas do Alentejo têm rega gota a gota. Porque é útil lá?", "o": ["Os verões são quentes e secos, e sem água a maturação pode bloquear", "Para baixar a acidez das uvas, que ali tende a ser demasiado alta", "Para aumentar a acidez do solo, que ajuda a videira a crescer", "Para proteger as vinhas da geada, que é frequente no verão"], "a": 0, "e": "Com muita sede, a videira fecha os poros das folhas e a maturação pode parar. A rega controlada evita isso; água a mais dá uvas diluídas e folha a mais.", "fonte": "WSET Nível 3, sessão 2 (slides): água: rega gota a gota, seca", "k": "Gota a gota: água q.b., nem mais nem menos."}, {"id": "vinha-2-21", "nivel": 2, "tipo": "escolha", "tema": "viticultura", "q": "No Minho, as vinhas tradicionais em ramada põem as videiras bem acima do chão. Que vantagem tem isso numa região húmida?", "o": ["Mais ar à volta dos cachos, o que ajuda contra fungos", "Mais calor do solo a chegar diretamente aos cachos", "Menos trabalho na poda, porque a videira cresce sozinha", "Uvas mais doces, mesmo com pouco sol durante o verão"], "a": 0, "e": "Longe do chão húmido e com mais vento, os cachos secam mais depressa depois da chuva. Por baixo ficava espaço para outras culturas; hoje, muitas vinhas usam sistemas mais baixos, como o cordão.", "k": "Ramada: cachos lá no alto, a secar ao vento."}, {"id": "vinha-2-s01", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente provou o mesmo Alvarinho de dois anos seguidos. Sabem diferente, e ele acha que um tem defeito. O que lhe dizes?", "o": ["Ouves o que notou e provas: pode ser o ano, mas primeiro excluis um defeito", "Garantes que não há defeito, porque colheitas diferentes sabem sempre diferente", "Concordas que um dos dois está estragado e trocas logo as duas garrafas", "Explicas que o produtor mudou de casta, o que é comum entre colheitas"], "a": 0, "e": ["Vinhos de anos diferentes podem saber diferente sem defeito, mas um defeito também é possível.", "O tempo do ano muda a uva. Provar diz-te se é a marca do ano ou um defeito, como gosto a rolha.", "Diz-lhe: \"Deixe-me provar este. Se for do ano, explico-lhe a diferença; se houver defeito, troco a garrafa.\""], "k": "Colheitas diferentes podem saber diferente. Prova antes de concluir."}, {"id": "vinha-2-s02", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente reparou que os tintos do Douro Superior tendem a ser mais encorpados e alcoólicos do que os do Baixo Corgo. Porquê?", "o": ["O Douro Superior é mais quente e seco, e as uvas juntam mais açúcar", "O Baixo Corgo fica mais longe do rio, por isso as uvas têm menos água", "No Douro Superior junta-se aguardente aos tintos DOC Douro", "O Baixo Corgo tem solos de granito, que dão vinhos mais leves"], "a": 0, "e": ["Dentro do Douro há climas diferentes.", "Baixo Corgo, a oeste: mais fresco e chuvoso. Douro Superior, a leste: mais quente e seco. Mais açúcar, mais álcool.", "Usa isto para afinar a escolha. Diz-lhe: \"Se procura frescura, Baixo Corgo; se quer potência, Douro Superior.\""], "fonte": "WSET, blog 'Three Douro subregions that define Port' (2025): Baixo Corgo mais fresco e chuvoso, Douro Superior mais quente e seco", "k": "Douro: mais fresco a oeste, mais quente a leste."}, {"id": "vinha-2-s03", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente pergunta porque é que o contrarrótulo deste tinto do Dão fala em vinhas a 500 metros de altitude. O que lhe dizes?", "o": ["Vinhas mais altas são mais frescas: a uva amadurece mais devagar e guarda acidez", "A altitude dá mais sol e mais calor, por isso o vinho tem mais álcool", "É só para impressionar no rótulo: a altitude não muda o vinho", "As vinhas altas não precisam de tratamentos, por isso o vinho é mais puro"], "a": 0, "e": ["A altitude é uma pista de frescura.", "Quanto mais alto, mais fresco, sobretudo à noite. A uva amadurece mais devagar e guarda mais acidez.", "Diz-lhe: \"Espere um tinto mais fresco e tenso.\" Ótimo para quem acha os tintos do Dão pesados."], "k": "Mais alto, mais fresco: a altitude ajuda a guardar acidez."}, {"id": "vinha-2-s04", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente pede um tinto \"de influência atlântica\". Entre um tinto de Lisboa, de vinhas perto do mar, e um do interior alentejano, qual tende a servir melhor?", "o": ["O de Lisboa, de vinhas expostas ao ar fresco do mar", "O do interior alentejano", "São iguais", "Nenhum: só os brancos podem ter influência atlântica no copo"], "a": 0, "e": ["O cliente procura frescura vinda do mar.", "Perto da costa, vento e nuvens do Atlântico suavizam o calor. No interior alentejano, o verão é mais quente e seco.", "Serve o de Lisboa. Diz-lhe: \"É mais fresco e menos maduro do que um tinto do interior.\""], "k": "Influência atlântica: o mar faz de ar condicionado."}, {"id": "vinha-2-s05", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente conta que a geada de abril atingiu a vinha da família, mas só no fundo do vale. As videiras da encosta escaparam. Porquê?", "o": ["O ar frio é mais pesado e junta-se nas zonas baixas", "Na encosta estavam plantadas castas mais resistentes ao frio", "No vale chove mais", "As videiras do vale eram mais novas"], "a": 0, "e": ["As zonas baixas são as mais expostas à geada.", "Em noites calmas e limpas, o ar frio escorre pela encosta, como água, e junta-se no fundo do vale.", "Diz-lhe: \"Na vinha, o sítio conta muito.\" É uma das razões por que se escolhe bem onde plantar."], "k": "O ar frio escorre pela encosta e fica no fundo."}, {"id": "vinha-2-s06", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Uma cliente pergunta se \"vinha em modo biológico\" quer dizer que não leva tratamento nenhum. O que lhe respondes?", "o": ["Sim: a vinha não leva tratamento nenhum, só poda, monda e vindima à mão", "Não: leva tratamentos, mas cobre e enxofre são proibidos, por serem químicos", "Não: leva tratamentos, mas em regra sem síntese; cobre e enxofre são aceites", "Não: leva tratamentos na vinha, mas o vinho já não pode levar sulfitos"], "a": 2, "e": ["Biológico não quer dizer sem tratamentos, nem sem sulfitos.", "Em regra, excluem-se os produtos de síntese. Mas são permitidos cobre, em dose limitada, contra o míldio, e enxofre contra o oídio.", "Explica sem exagerar. Diz-lhe: \"É uma forma de cultivar, não uma promessa de sabor.\""], "fonte": "WSET Nível 3, sessão 2 (slides): práticas de viticultura (biológica)", "k": "Biológico: há tratamentos, mas em regra nada de síntese."}, {"id": "vinha-2-s07", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente acha caro um tinto do Douro de vinhas em socalcos e pergunta porquê. Qual é o melhor argumento?", "o": ["Nos socalcos, estreitos e inclinados, quase todo o trabalho é feito à mão", "O vinho tem de estagiar mais tempo por lei, só por vir de socalcos", "As castas do Douro são raras e as plantas custam mais a comprar", "Os socalcos recebem menos sol, e as uvas demoram muito mais a amadurecer"], "a": 0, "e": ["O custo começa na vinha.", "Nos socalcos, as máquinas mal entram. Poda, tratamentos e vindima pedem muitas horas de trabalho à mão.", "Conta a história da paisagem. O cliente passa a ver no preço esforço, não capricho."], "k": "Socalcos: degraus onde as máquinas mal entram."}, {"id": "vinha-2-s08", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Numa prova, um cliente pergunta o que quer dizer \"vinha virada a sul\" num tinto do Douro. O que lhe explicas?", "o": ["Apanha mais sol e calor, e as uvas tendem a amadurecer mais", "Apanha menos sol e dá uvas mais verdes, com mais acidez", "Fica protegida do sol da tarde, o mais quente do dia", "Tem mais humidade e menos calor, como as encostas a norte"], "a": 0, "e": ["A orientação da encosta muda a luz que a vinha recebe.", "No hemisfério norte, a encosta virada a sul apanha mais sol e aquece mais. Virada a norte, é mais fresca.", "Usa a pista para prever o estilo: a sul, tintos que tendem a ser mais maduros; a norte, vinhos mais frescos."], "fonte": "WSET Nível 3, sessão 2 (slides): orientação e luz solar", "k": "Virada a sul: mais sol, uva tendencialmente mais madura."}, {"id": "vinha-3-01", "nivel": 3, "tipo": "escolha", "q": "Porque é que se usam raízes de videira americana?", "o": ["Aguentam a filoxera", "Dão mais açúcar à uva", "Dão aroma foxy ao vinho", "Crescem mais depressa"], "a": 0, "e": "Muitas espécies americanas cresceram lado a lado com a filoxera e aprenderam a aguentá-la. Mas não há raiz mágica: escolhe-se o porta-enxerto certo para cada solo e casta.", "tema": "filoxera", "sala": "Quase todas as vinhas portuguesas são enxertadas, por isso \"pé-franco\" num rótulo é raro e merece ser contado.", "origem": "uva-3-01", "k": "Raiz americana: o escudo da videira contra a filoxera."}, {"id": "vinha-3-02", "nivel": 3, "tipo": "escolha", "q": "Numa videira enxertada, como se chama a parte de baixo, com a raiz americana?", "o": ["Porta-enxerto", "Garfo", "Sarmento", "Pé-franco"], "a": 0, "e": "O porta-enxerto dá as raízes; o garfo, enxertado por cima, dá a casta que queremos. São duas plantas a trabalhar como uma só videira.", "tema": "filoxera", "origem": "uva-3-02", "k": "Porta-enxerto em baixo, garfo em cima: dupla de sucesso."}, {"id": "vinha-3-03", "nivel": 3, "tipo": "escolha", "q": "Uma videira que não foi enxertada chama-se…", "o": ["Pé-franco", "Pé-de-cabra", "Videira-mãe", "Híbrido"], "a": 0, "e": "Sem enxertia, raiz e parte de cima são a mesma planta. Tudo em família, mas sem a proteção da raiz americana contra a filoxera.", "tema": "filoxera", "sala": "\"Pé-franco\" no rótulo quer dizer videiras sobre as próprias raízes, sem enxertia.", "origem": "uva-3-03", "k": "Pé-franco: videira nas suas próprias raízes."}, {"id": "vinha-3-04", "nivel": 3, "tipo": "escolha", "q": "Que região portuguesa escapou à filoxera graças aos solos de areia?", "o": ["Colares", "Douro", "Dão", "Alentejo"], "a": 0, "e": "Na areia, a filoxera tem dificuldade em sobreviver e espalhar-se. Por isso Colares ainda guarda videiras que nunca precisaram de enxertia.", "tema": "filoxera", "sala": "Colares é uma das poucas zonas com vinhas antigas em pé-franco. É uma boa história para contar ao cliente.", "origem": "uva-3-04", "k": "Colares: a areia que fechou a porta à filoxera."}, {"id": "vinha-3-05", "nivel": 3, "tipo": "escolha", "q": "Quando chegou a filoxera ao Douro?", "o": ["Por volta de 1868", "Por volta de 1700", "Por volta de 1950", "Por volta de 1756, com o Marquês de Pombal"], "a": 0, "e": "Foi identificada por essa altura e depois espalhou-se, arrasando muitas vinhas. As datas exatas variam de sítio para sítio, mas o século XIX foi um verdadeiro terramoto na vinha.", "tema": "filoxera", "fonte": "Revista Povos e Culturas (UCP): filoxera notada pela primeira vez no Douro de 1868 para 1869", "origem": "uva-3-15", "k": "Filoxera no Douro: por volta de 1868."}, {"id": "vinha-3-06", "nivel": 3, "tema": "vinhas-velhas", "tipo": "escolha", "q": "Com a idade, o que acontece à produção de uma videira?", "o": ["Tende a dar menos uva, muitas vezes em cachos e bagos mais pequenos", "Dá cada vez mais uva, porque as raízes chegam mais fundo", "Deixa de dar uva aos 20 anos e tem de ser arrancada", "Dá bagos maiores e mais diluídos, que dão vinhos com menos sabor"], "a": 0, "e": "Muitos ligam isto a vinhos mais concentrados. Mas a idade sozinha não garante qualidade: a casta, o solo, o clima e os cuidados também contam.", "origem": "uva-3-31", "k": "Videira velha: menos uva, cachos e bagos mais pequenos."}, {"id": "vinha-3-07", "nivel": 3, "tema": "vinhas-velhas", "tipo": "escolha", "q": "O que pode ajudar uma videira velha a aguentar melhor a seca do que uma acabada de plantar?", "o": ["Raízes bem instaladas, que exploram mais solo", "Folhas maiores e mais grossas, que gastam menos água", "Bagos que guardam água para as raízes", "A idade, por si só"], "a": 0, "e": "Com os anos, as raízes exploram mais terra e, se o solo deixar, chegam a água mais funda. Mas sem água ao alcance, as vinhas velhas também sofrem.", "origem": "uva-3-32", "k": "O trunfo da videira velha está debaixo do chão."}, {"id": "vinha-3-08", "nivel": 3, "tema": "vinhas-velhas", "tipo": "escolha", "q": "Muitas vinhas velhas do Douro e do Dão têm castas misturadas. O que quer isto dizer?", "o": ["Várias castas plantadas na mesma parcela", "Uma só casta, toda do mesmo clone", "Videiras plantadas entre oliveiras", "Uvas compradas a vários produtores da região"], "a": 0, "e": "Por vezes são dezenas de castas lado a lado, tradicionalmente vindimadas e vinificadas juntas: é o field blend. Atenção: \"vinhas velhas\" fala de idade, não de mistura.", "sala": "Num tinto de vinha velha do Douro, \"castas misturadas\" quer dizer várias castas plantadas e vindimadas juntas.", "origem": "uva-3-33", "k": "Castas misturadas: o lote começa logo na vinha."}, {"id": "vinha-3-09", "nivel": 3, "tema": "vinhas-velhas", "tipo": "escolha", "q": "Para tapar uma falha na vinha, enterra-se parte de um sarmento da cepa vizinha, ainda ligado a ela, até ganhar raízes. Como se chama?", "o": ["Mergulhia", "Enxertia", "Desladroamento", "Empa"], "a": 0, "e": "A ponta fica à superfície e a ligação à cepa-mãe mantém-se. Quando enraíza, pode ser separada e passa a ser uma nova videira da mesma casta.", "origem": "uva-3-34", "k": "Mergulhia: primeiro ganha raízes, depois ganha independência."}, {"id": "vinha-3-10", "nivel": 3, "tema": "doencas", "tipo": "escolha", "q": "Que doença da madeira pode fazer uma cepa adulta colapsar de repente, em pleno verão?", "o": ["Esca", "Míldio", "Oídio", "Filoxera"], "a": 0, "e": "Vários fungos estragam o lenho, a madeira da videira. Pode avançar devagar ou de repente: na apoplexia, a folhagem murcha e seca em poucos dias e a cepa pode morrer.", "origem": "uva-3-35", "k": "Esca: fungos que comem a videira por dentro."}, {"id": "vinha-3-11", "nivel": 3, "tema": "doencas", "tipo": "escolha", "q": "O míldio e o oídio, as duas grandes doenças das folhas e dos cachos, chegaram à Europa…", "o": ["Vindos da América do Norte, no século XIX", "Da Ásia, na Idade Média", "Do Norte de África, já no início do século XX", "Sempre existiram na Europa"], "a": 0, "e": "Tal como a filoxera: primeiro o oídio, depois o míldio. A videira europeia tinha poucas defesas contra eles, e por isso ainda hoje precisa de tratamentos.", "origem": "uva-3-36", "k": "Míldio e oídio: \"turistas\" americanos do século XIX."}, {"id": "vinha-3-12", "nivel": 3, "tema": "doencas", "tipo": "escolha", "q": "Qual é o elemento ativo da calda bordalesa, usada há mais de um século contra o míldio?", "o": ["Cobre", "Enxofre", "Ferro", "Cálcio"], "a": 0, "e": "Mistura sulfato de cobre, cal e água e protege a folha por fora. O enxofre é outra história: é o aliado clássico contra o oídio.", "origem": "uva-3-37", "k": "Calda bordalesa: cobre. O azul nas folhas denuncia-a."}, {"id": "vinha-3-13", "nivel": 3, "tema": "doencas", "tipo": "escolha", "q": "A Baga, estrela da Bairrada, tem cachos apertados e pode apodrecer em certos anos. Que doença gosta de chuva perto da vindima?", "o": ["Podridão cinzenta", "Oídio", "Desavinho", "Esca"], "a": 0, "e": "Com humidade persistente, apodrece os bagos; cachos apertados secam devagar. Já em uvas maduras, com humidade e secura alternadas, pode dar podridão nobre, que concentra açúcar.", "fonte": "INIAV, ficha da casta Baga (cacho compacto; película de espessura média; sensível ao míldio e à podridão em certos anos)", "sala": "Um ano chuvoso perto da vindima ajuda a explicar diferenças entre colheitas do mesmo tinto de Baga.", "origem": "uva-3-38", "k": "Botrytis: o mesmo fungo pode estragar ou fazer vinho doce."}, {"id": "vinha-3-14", "nivel": 3, "tipo": "escolha", "tema": "doencas", "q": "Mau tempo na floração faz cair muitas flores e o cacho fica ralo. Como se chama isto?", "o": ["Desavinho", "Bagoinha", "Míldio", "Escaldão"], "a": 0, "e": "Chuva, frio ou vento na floração favorecem-no, e há castas mais sensíveis do que outras. Em francês diz-se coulure. Resultado: menos uva.", "k": "Desavinho: as flores não vingam, o cacho fica careca."}, {"id": "vinha-3-15", "nivel": 3, "tipo": "escolha", "tema": "doencas", "q": "Num cacho com bagoinha, o que se vê?", "o": ["Bagos normais misturados com bagos pequenos e sem grainha", "Bagos cobertos de um pó branco, como se fosse farinha", "Cachos sem nenhum bago, só com o engaço seco", "Bagos rachados pela chuva, abertos e a apodrecer"], "a": 0, "e": "Flores mal fecundadas dão bagos pequenos e sem grainha ao lado dos normais. Em francês, millerandage. Há menos uva, mas os pequenos podem concentrar sabor.", "k": "Bagoinha: cacho de bagos grandes e pequeninos."}, {"id": "vinha-3-16", "nivel": 3, "tipo": "escolha", "tema": "viticultura", "q": "Na monda de cachos (ou vindima em verde), o viticultor…", "o": ["Corta alguns cachos ainda verdes para a videira amadurecer melhor os restantes", "Vindima todos os cachos antes do pintor, para fazer um vinho mais fresco e leve", "Arranca as folhas todas para os cachos apanharem mais sol", "Corta as raízes mais fundas para a videira dar menos uva"], "a": 0, "e": "Faz-se entre o vingamento e o pintor, e a energia vai para os cachos que ficam. Ajuda em vinhas vigorosas ou anos difíceis, mas custa uva e trabalho.", "k": "Monda de cachos: menos bocas para alimentar."}, {"id": "vinha-3-17", "nivel": 3, "tipo": "escolha", "tema": "viticultura", "q": "Numa região húmida como o Minho, tirar folhas à volta dos cachos serve sobretudo para…", "o": ["Arejar e expor os cachos, baixando o risco de fungos", "Acelerar a floração e o vingamento dos cachos", "Proteger os cachos do sol forte da tarde", "Aumentar o tamanho e o peso dos bagos antes da vindima"], "a": 0, "e": "Com menos folhas, os cachos secam mais depressa e os tratamentos chegam melhor. Mas em zonas quentes, desfolhar de mais pode queimar os bagos: é o escaldão.", "fonte": "WSET Nível 3, sessão 2 (slides): gestão da canópia contra doenças", "k": "Desfolha: abrir a janela para os cachos respirarem."}, {"id": "vinha-3-18", "nivel": 3, "tipo": "escolha", "tema": "clima", "q": "Porque é que o granizo de verão é tão temido na vinha?", "o": ["Fere folhas e bagos, e as feridas abrem a porta a fungos", "Arrefece o solo de repente e atrasa a maturação", "Faz a videira abrolhar outra vez, fora de época", "Provoca desavinho nos cachos que já estão quase maduros"], "a": 0, "e": "Rasga folhas, parte rebentos e fere bagos, que depois apodrecem com facilidade. Uma só trovoada pode estragar a colheita de uma parcela.", "fonte": "WSET Nível 3, sessão 2 (slides): riscos da água: granizo", "k": "Granizo: minutos de pedra, meses de trabalho perdidos."}, {"id": "vinha-3-19", "nivel": 3, "tipo": "escolha", "tema": "clima", "q": "Grandes massas de água, como o estuário do Tejo ou o mar junto a Setúbal, influenciam a vinha porque…", "o": ["Suavizam as temperaturas à volta, mas podem trazer humidade e nevoeiro", "Regam as vinhas por baixo da terra, através dos lençóis de água subterrâneos", "Aumentam o açúcar das uvas à noite, com o ar mais húmido", "Impedem para sempre a geada e o granizo nas vinhas à volta"], "a": 0, "e": "A água aquece e arrefece devagar, por isso os verões tendem a ser menos quentes e os invernos menos frios. Em troca, humidade e nevoeiro podem ajudar os fungos.", "fonte": "WSET Nível 3, sessão 2 (slides): grandes corpos de água moderam a temperatura", "k": "Água por perto: um ar condicionado natural."}, {"id": "vinha-3-20", "nivel": 3, "tipo": "escolha", "tema": "solo", "q": "Os solos de granito, comuns no Dão e no Minho, tendem a ser…", "o": ["Arenosos, bem drenados e pobres em nutrientes", "Pesados, argilosos e muitas vezes encharcados", "Ricos em calcário, que dá acidez às uvas", "Feitos de cinza vulcânica, escuros e férteis"], "a": 0, "e": "Ao desfazer-se, o granito dá uma areia grossa que deixa escorrer a água. Com poucos nutrientes, a videira tende a crescer com menos vigor.", "k": "Granito: areia grossa, água que passa, pouca comida."}, {"id": "vinha-3-21", "nivel": 3, "tipo": "escolha", "tema": "viticultura", "q": "Na vinha \"ao alto\" do Douro, as linhas de videiras são plantadas…", "o": ["A direito pela encosta, de cima para baixo, sem socalcos", "Em degraus estreitos, segurados por muros de pedra", "Em patamares largos de terra, sem muros, que seguem a curva da encosta", "Em ramada, com as videiras bem acima do chão"], "a": 0, "e": "É a alternativa aos socalcos de pedra e aos patamares (terraços largos de terra), usada em encostas menos inclinadas. Cabem mais videiras por hectare.", "k": "Vinha ao alto: linhas a descer a encosta, sem degraus."}, {"id": "vinha-3-22", "nivel": 3, "tipo": "escolha", "tema": "viticultura", "q": "Limitar a quantidade de uva por videira tende a…", "o": ["Ajudar a videira a amadurecer bem os cachos que ficam", "Garantir sempre um vinho melhor, seja qual for o ano", "Aumentar a acidez da uva e baixar o açúcar", "Proteger a vinha da geada e do granizo"], "a": 0, "e": "Ajuda sobretudo em vinhas vigorosas ou anos frescos. Não é regra fixa: com boa luz, água e nutrientes, a videira amadurece bem mais uva; com poucos recursos, só pouca.", "fonte": "WSET Nível 3, sessão 2 (slides): rendimentos e qualidade", "k": "Menos cachos, mais atenção para cada um."}, {"id": "vinha-3-s01", "nivel": 3, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente vê um tinto de Colares na carta e pergunta porque é tão raro. O que lhe contas?", "o": ["A filoxera destruiu quase todas as vinhas, e quase nenhuma se replantou", "Só se faz em anos excecionais, como acontece com um Porto Vintage declarado", "As vinhas ficam em socalcos de xisto, onde as máquinas quase não entram", "Região minúscula, de vinhas na areia junto ao mar, muitas em pé-franco"], "a": 3, "e": ["Colares faz muito pouco vinho, e a área de vinha tem vindo a encolher.", "As videiras são plantadas fundo, pela areia abaixo até ao barro; a areia travou a filoxera e muitas continuam em pé-franco.", "Diz-lhe: \"É vinha de areia à beira do Atlântico, onde a filoxera quase não entrou. Uma raridade com memória.\""], "k": "Colares: pouca vinha, muita areia, muita história."}, {"id": "vinha-3-s02", "nivel": 3, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente pergunta o que muda quando um tinto do Douro diz \"Vinhas Velhas\" no rótulo. O que é mais rigoroso dizer?", "o": ["Tende a dar mais uva por cepa, porque a videira velha já tem raízes fundas", "Tende a dar menos uva, mais concentrada, mas o local e o trabalho contam", "Tende a dar vinhos mais leves, porque as cepas velhas perdem vigor e cor", "Tende a dar vinho mais mineral, porque as raízes puxam sabor às rochas"], "a": 1, "e": ["O rótulo diz a idade das cepas; é uma pista, não uma garantia.", "Cepas velhas tendem a dar menos uva e a aguentar melhor a seca; a casta, o solo e o produtor também contam.", "Diz-lhe: \"Costuma dar uvas mais concentradas, mas não faz milagres sozinho. Vale a pena provar!\""], "k": "\"Vinhas Velhas\": uma pista, não uma promessa."}, {"id": "vinha-3-s03", "nivel": 3, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente madeirense conta que, na ilha, as vinhas crescem em latada sobre poios. O que são poios?", "o": ["Socalcos estreitos, com muros de pedra, nas encostas da ilha", "Barris de carvalho enterrados onde o vinho estagia", "Poços de pedra que guardam a água da chuva para regar as vinhas", "Castas antigas da ilha, plantadas antes da filoxera"], "a": 0, "e": ["Poios são os socalcos da Madeira: pequenos patamares de terra seguros por muros de pedra.", "As encostas são muito íngremes; a latada levanta as videiras do chão para os cachos arejarem no clima húmido.", "Diz-lhe: \"Muita da vinha da Madeira é trabalhada à mão, em degraus sobre o Atlântico.\""], "k": "Poios: os degraus de pedra das vinhas da Madeira."}, {"id": "vinha-3-s04", "nivel": 3, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente // Explicações longas sem frase-chave (Uva): a primeira frase fica à vista, o resto vai para "Saber mais".
function partir(e){
  if(!e || e.length<=150) return [e, ""];
  const m = e.match(/^([\s\S]{40,}?[.!?])\s+(?=[A-ZÁÉÍÓÚÂÊÔÃÕÇÑ"«¿¡(])/);
  if(!m || e.length - m[0].length < 25) return [e, ""];
  return [m[1], e.slice(m[0].length)];
}

function criarFase(DATA){
const UVA_F = DATA.fase==="uva"; // textos que dizem o nome da fase
const R = DATA.regra;
const LV = DATA.niveis;
const PARTS = {pelicula:"Película",polpa:"Polpa",grainhas:"Grainhas",engaco:"Engaço",pruina:"Pruína"};
const CHEERS = ["Oh yeah! That was GRAPE TO KNOW!","Grape job!","Spot on!","Cheers to that!"];
const CORKS = ["Corked!","Corked! Esta volta para a desforra.","Corked! A próxima é tua."];
const KEY = "gtk-niveis-"+DATA.fase;

// decide(erros, nivel) -> novo nivel e veredito. É a única regra de progressão.
function decide(erros, nivel){
  if(erros <= R.sobe_com_erros_ate) return nivel < LV.length ? {nivel:nivel+1, v:"sobe"} : {nivel, v:"dominada"};
  // Primeiro teste (19 out 2026): três erros acabam a ronda, mas o nível nunca desce.
  if(erros >= R.desce_com_erros) return {nivel, v:"reforca"};
  return {nivel, v:"fica"};
}

let P = {nivel:1, max:1, dominada:false, falhadas:[], acertadas:[], vistas:[], rondas:0, char:"ms", som:true, recorde:{}};
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) P=Object.assign(P,s); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }
load(); P.acertadas = P.acertadas || []; P.falhadas = P.falhadas || []; P.recorde = P.recorde || {}; if(P.som===undefined) P.som=true;
// Respondidas = vistas guardadas + as que já acertou ou falhou (o progresso antigo não tinha "vistas").
P.vistas = [...new Set([...(Array.isArray(P.vistas)?P.vistas:[]), ...P.acertadas, ...P.falhadas])];
// Perguntas com "rever": true ficam guardadas no ficheiro, mas fora das rondas até serem confirmadas.
const ATIVAS = DATA.perguntas.filter(q=>!q.rever);
// Repertório: nível mais alto, perguntas diferentes respondidas e acertadas (pelo menos uma vez). Não é prova de domínio.
function repertorio(){ const ids = new Set(ATIVAS.map(q=>q.id));
  return {max:LV[P.max-1].alcunha, respondidas:P.vistas.filter(id=>ids.has(id)).length, acertadas:P.acertadas.filter(id=>ids.has(id)).length, total:ids.size, superado:!!P.dominada}; }

const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $app = document.getElementById("app");
const CALM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- som e vibração (sintetizados, sem ficheiros) ---------- */
let AC = null;
function tone(f, t0, dur, type="sine", vol=.18, f2){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,AC.currentTime+t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+t0+dur);
  g.gain.setValueAtTime(vol,AC.currentTime+t0); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t0+dur);
  o.connect(g).connect(AC.destination); o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+dur+.02);
}
function fizz(t0, dur){
  const n=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate), d=n.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length)*(Math.random()<.08?1:.25);
  const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); f.type="highpass"; f.frequency.value=3000; g.gain.value=.12;
  s.buffer=n; s.connect(f).connect(g).connect(AC.destination); s.start(AC.currentTime+t0);
}
const SFX = {
  tap:()=>tone(660,0,.05,"triangle",.08),
  certo:()=>{ tone(660,0,.12,"triangle"); tone(990,.09,.18,"triangle"); },
  errado:()=>{ tone(220,0,.18,"square",.07,110); tone(140,.05,.22,"sine",.2,70); },
  rolha:()=>{ tone(900,0,.05,"square",.1,300); fizz(.04,.6); tone(523,.12,.1,"triangle"); tone(784,.2,.1,"triangle"); tone(1047,.28,.2,"triangle"); },
  sobe:()=>[523,659,784,1047,1319].forEach((f,k)=>tone(f,k*.09,.22,"triangle",.15)),
  desce:()=>[392,330,262,196].forEach((f,k)=>tone(f,k*.14,.25,"sine",.15)),
  tique:()=>tone(1200,0,.03,"square",.04)
};
function sfx(n){ if(!state.sound) return; try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); SFX[n](); }catch(e){} }
function buzz(p){ try{ if(state.sound && navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* ---------- efeitos: bolhas de espumante e kg a voar ---------- */
function bubbles(n=26, colors=["var(--cork)","var(--grape-hi)","var(--good)","var(--azul)"]){
  if(CALM) return;
  const box=document.createElement("div"); box.className="fx"; box.setAttribute("aria-hidden","true");
  for(let k=0;k<n;k++){ const b=document.createElement("i"); const sz=6+Math.random()*12;
    b.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:${pick(colors)};animation-delay:${Math.random()*.5}s;animation-duration:${1.4+Math.random()*1.2}s`;
    box.appendChild(b); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),3200);
}
function flyKg(txt){
  const hud=document.querySelector(".kg"); if(!hud||CALM) return;
  const r=hud.getBoundingClientRect(), f=document.createElement("div"); f.className="fly"; f.textContent=txt; f.setAttribute("aria-hidden","true");
  f.style.left=(r.left+r.width/2+scrollX)+"px"; f.style.top=(r.top+scrollY)+"px"; document.body.appendChild(f); setTimeout(()=>f.remove(),1300);

function countUp(el, to){
  if(CALM||!el) return; const t0=performance.now(), d=900;
  (function step(t){ const k=Math.min(1,(t-t0)/d); el.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); })(t0);
}
// tempo para ler e responder: mais texto, mais tempo
const timeFor = Q => Math.round(Math.min(30, 9 + (Q.q.length + (Q.o?Q.o.join("").length:0)) / 14));
const mult = n => n>=6?3:n>=3?2:1;

// Monta a ronda do nível: até 3 lugares para perguntas que falhaste neste nível, depois as que nunca viste,
// depois as já respondidas. Sem repetidas; a ordem final e as alternativas são baralhadas (a resposta certa acompanha).
// Em cada ronda entram até 2 situações de sala (sit:true) do nível; o resto é teoria. O limite de falhadas conta para as duas.
function pickFrom(pool, n, maxf){
  const wrong = shuffle(pool.filter(q=>P.falhadas.includes(q.id))).slice(0, Math.min(maxf, n));
  const usadas = new Set(wrong.map(q=>q.id));
  const novas = shuffle(pool.filter(q=>!usadas.has(q.id) && !P.vistas.includes(q.id)));
  novas.forEach(q=>usadas.add(q.id));
  const vistas = shuffle(pool.filter(q=>!usadas.has(q.id)));
  return [...wrong, ...novas, ...vistas].slice(0, n);
}
function buildRound(nivel){
  const pool = ATIVAS.filter(q=>q.nivel===nivel), N = R.perguntas_por_ronda, MAXF = R.erradas_por_ronda_max ?? 3;
  const sits = pickFrom(pool.filter(q=>q.sit), Math.min(R.situacoes_por_ronda ?? 2, N), MAXF);
  const fs = sits.filter(q=>P.falhadas.includes(q.id)).length;
  const teoria = pickFrom(pool.filter(q=>!q.sit), N - sits.length, Math.max(0, MAXF - fs));
  return shuffle([...sits, ...teoria]).map(q=>{
    if(q.tipo!=="escolha") return q;
    const order = shuffle(q.o.map((_,k)=>k));
    return Object.assign({}, q, {o:order.map(k=>q.o[k]), a:order.indexOf(q.a)});
  });
}

let S = null; // estado da ronda
// Para refazer (perfil, 18 out 2026): uma ronda só com as que falhaste; acertar tira da lista, errar volta a pôr.
function startRefazer(){
  const qs = shuffle(ATIVAS.filter(q=>P.falhadas.includes(q.id))).slice(0, R.perguntas_por_ronda).map(q=>{
    if(q.tipo!=="escolha") return q;
    const order = shuffle(q.o.map((_,k)=>k));
    return Object.assign({}, q, {o:order.map(k=>q.o[k]), a:order.indexOf(q.a)});
  });
  if(!qs.length) return renderAdega();
  S = {nivel:P.nivel, qs, i:0, erros:0, certas:0, seguidas:0, melhor:0, rapidas:0, kg:0, ans:null, refazer:true};
  sfx("tap"); renderQ(); scrollTo(0,0);
}
function fimRefazer(){
  colher(S.kg); save();
  const n = S.certas + S.erros, ficam = ATIVAS.filter(q=>P.falhadas.includes(q.id)).length, limpo = S.erros===0;
  $app.innerHTML = `<section class="end">
    <div class="end-head">${mas(limpo?"happy":"idle")}
      <div class="eyebrow">Para refazer · ${UVA_F?"A Uva":"A Vinha"}</div>
      <h1 class="verdict ${limpo?"v-up":"v-stay"}">${limpo?"Desforra completa!":`${S.certas} de ${n} acertadas`}</h1>
      <p class="lead">${ficam?`Ficam ${ficam} na lista. As que erraste agora continuam lá, à tua espera.`:"A lista está vazia. Quando errares uma pergunta, ela volta para aqui."}</p>
    </div>
    <div class="end-actions">
      ${ficam?`<button class="cta" id="again">Refazer outra vez</button>`:""}
      <button class="${ficam?"ghost":"cta"}" id="adega">Voltar à adega</button>
      <button class="ghost" id="home">Voltar à vinha</button>
    </div></section>`;
  if(ficam) document.getElementById("again").onclick = startRefazer;
  document.getElementById("adega").onclick = renderAdega;
  document.getElementById("home").onclick = renderStart;
  document.getElementById(ficam?"again":"adega").focus({preventScroll:true});
  sfx(limpo?"sobe":"certo"); scrollTo(0,0);
}
function startRound(){
  S = {nivel:P.nivel, qs:buildRound(P.nivel), i:0, erros:0, certas:0, seguidas:0, melhor:0, rapidas:0, kg:0, ans:null};
  sfx("tap");
  renderQ(); scrollTo(0,0);
}

/* ---------- desenho ---------- */
function mas(mood){ return `<div class="mascot m-${mood}">${mascot(state.char,mood)}</div>`; }
function ladder(cur, extra=""){
  return `<div class="ladder" role="list" aria-label="Níveis da fase">${LV.map(l=>`<div role="listitem" class="rung l${l.n}${l.n===cur?" on":""}${(l.n<P.max||(l.n===3&&P.dominada))?" done":""}" ${l.n===cur?'aria-current="step"':""}>
    <span class="dot" aria-hidden="true">${levelIcon(l.n)}</span><b>${l.alcunha}</b>${l.n===3&&P.dominada?'<i class="vvo-mini">VVO</i>':""}<span>${l.nome}</span></div>`).join("")}</div>${extra}`;
}
/* ---------- ecrã inicial ---------- */
function meter(n){
  const ids = ATIVAS.filter(q=>q.nivel===n).map(q=>q.id), got = ids.filter(id=>P.acertadas.includes(id)).length;
  return `<div><div class="stats"><span>Já acertaste neste nível</span><b>${got}/${ids.length}</b></div>
    <div class="bar" style="height:10px;margin-top:4px" aria-hidden="true"><span style="width:${got/ids.length*100}%;background:var(--good)"></span></div></div>`;

/* ---------- pergunta ---------- */
function hud(){
  const L = LV[S.nivel-1], pct = (S.i/S.qs.length)*100;
  return `<div class="hud"><button class="close" id="quit" aria-label="Sair da ronda">×</button>${soundBtn()}

    <div class="stats">${S.refazer?`<span class="lvl">Para refazer</span>`:`<span class="lvl"><i>${levelIcon(L.n)}</i>${L.alcunha} · ${L.nome}</span>`}
    <span>${S.seguidas>=3?`<b class="combo">🍾 x${mult(S.seguidas)}</b> · `:S.seguidas>1?`<b style="color:var(--wine)">${S.seguidas} seguidas</b> · `:""}<b class="kg">${S.kg}</b> kg</span></div>`;
}
function renderQ(){

  let body = "";
  if(Q.tipo==="tocar"){
    const marks = done ? [{p:Q.a,c:"ok"}].concat(ok?[]:[{p:S.ans.v,c:"bad"}]) : [];

      <div class="opts partes" role="group" aria-label="Ou escolhe pelo nome">${Object.keys(PARTS).map((k,j)=>{ let c="opt"; if(done){ if(k===Q.a) c+=" right"; else if(k===S.ans.v) c+=" wrong"; }
        return `<button class="${c}" id="opt-${j}" data-part="${k}" ${done?"disabled":""}>${PARTS[k]}</button>`; }).join("")}</div>`;
  } else {
    const opts = Q.tipo==="vf" ? [["Verdadeiro",true],["Falso",false]] : Q.o.map((t,k)=>[t,k]);
    body = `<div class="opts${Q.tipo==="vf"?" vf":""}">${opts.map(([t,v],k)=>{
      let c="opt"; if(done){ if(v===Q.a) c+=" right"; else if(v===S.ans.v) c+=" wrong"; }
      return `<button class="${c}" id="opt-${k}" data-k="${k}" ${done?"disabled":""}>${esc(t)}</button>`; }).join("")}</div>`;
    if(!done) setTimeout(()=>$app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>answer(opts[+b.dataset.k][1])));
  }
  const last = S.i+1>=S.qs.length || (!LIVRE && S.erros>=R.bagos);

  const A = S.ans||{};
  $app.innerHTML = `${hud()}${testeBar(done || S.i>0)}

    ${body}
    ${done&&ok?`<div class="gain">+${A.pts} kg${A.rapida?" · ⏱ rápida":""}${A.x>1?` · combo x${A.x}`:""}${gold?" · ouro x2":""}</div>`:""}
    ${done&&S.ans.pop?`<div class="toast">🍾 Combo x${mult(S.seguidas)}: cada uva vale ${mult(S.seguidas)===3?"a triplicar":"a dobrar"}</div>`:""}
    ${done&&S.erros===2&&!ok?`<div class="toast">Rolha partida! Mais um erro e vira vinagre.</div>`:""}
    ${done&&LIVRE&&S.erros>=R.bagos&&!ok?`<div class="toast">Modo de teste: a ronda continua.</div>`:""}
    ${done&&S.erros===1&&!ok&&!dicaVista("bago")?`<div class="toast">Perdeste um bago. Tens 3 por ronda: ao terceiro erro, vira vinagre.</div>`:""}
    ${done?`<div class="fb ${ok?"good":"bad"}" role="status"><h2>${ok?pick(CHEERS):pick(CORKS)}</h2>${explica(Q)}
      <button class="cta" id="next">${last?"Ver o resultado":"Continuar"}</button></div>`:""}`;
  document.getElementById("quit").onclick = ()=> (S.i===0 && S.ans===null) ? renderStart() : confirmaSair(renderStart);
  ligarTeste(()=>{ const i = done ? S.i : S.i-1, h = (S.hist||[])[i];
      if(h) Object.assign(S, h, {falhas:h.falhas.slice()}); S.i = i; S.ans = null; renderQ(); },
    ()=>{ S.ans = null; if(S.i+1>=S.qs.length) return finish(); S.i++; renderQ(); });
  if(Q.tipo==="tocar" && !done) $app.querySelectorAll("[data-part]").forEach(g=>g.onclick=()=>answer(g.dataset.part));
  if(done){ marcarDica("copo"); if(!ok && S.erros===1) marcarDica("bago");

    const b = Q.tipo==="vf" ? (k==="v"?"#opt-0":k==="f"?"#opt-1":null) : (/^[1-4]$/.test(k)?"#opt-"+(+k-1):null);

// Texto da resposta certa, para a revisão no fim da ronda.
// Itens da revisão (rever): o "tocar" passa a escolher pelo nome, verdadeiro/falso fica pela ordem de sempre.
function revItens(qs){ return qs.map(Q=>{
  const eb = Q.sit ? "Situação de sala" : (DATA.temas[Q.tema]||"");
  if(Q.tipo==="vf") return {eb, q:Q.q, o:["Verdadeiro","Falso"], a:Q.a?0:1, fixa:true, expl:explica(Q), somm:!!Q.sit};
  if(Q.tipo==="tocar"){ const ks = Object.keys(PARTS); return {eb, q:Q.q, o:ks.map(k=>PARTS[k]), a:ks.indexOf(Q.a), expl:explica(Q)}; }
  return {eb, q:Q.q, o:Q.o.slice(), a:Q.a, expl:explica(Q), somm:!!Q.sit};
}); }
function certa(q){ return q.tipo==="vf" ? (q.a?"Verdadeiro":"Falso") : q.tipo==="tocar" ? PARTS[q.a] : q.o[q.a]; }
// Situação de sala: O que se passa / Porquê / Na sala. Teoria: a explicação e, quando existe, a linha "Na sala".
// Explicação curta (18 out 2026, pedido da autora): a ideia a guardar fica à vista;
// o porquê e a sala abrem com um toque em "Saber mais" (a escolha fica lembrada neste dispositivo).
function explica(Q){
  const tag = `<span class="ns-tag"><img src="${MASCOT_SOMM[state.char]}" alt="">Na sala</span>`;
  const sala = t=>t ? `<div class="na-sala">${tag}<p>${esc(t)}</p></div>` : "";
  if(Array.isArray(Q.e)){
    const resto = (Q.k ? maisBloco("O que se passa", Q.e[0]) : "") + maisBloco("Porquê", Q.e[1]) + sala(Q.e[2]);
    return chave(Q.k ? "Em poucas palavras" : "O que se passa", Q.k || Q.e[0]) + mais("Saber mais", resto);
  }
  if(Q.k) return chave("Em poucas palavras", Q.k) + mais("Saber mais", `<p>${esc(Q.e)}</p>` + sala(Q.sala));
  const [a, b] = partir(Q.e);
  return chave("", a) + (b ? mais("Saber mais", `<p>${esc(b)}</p>` + sala(Q.sala)) : Q.sala ? mais("Na sala", `<p>${esc(Q.sala)}</p>`) : "");
}
function answer(v){
  const Q = S.qs[S.i], ok = v===Q.a; let pop=false, pts=0, x=1, rapida=false;
  const gold = S.i===S.qs.length-1;
  (S.hist = S.hist||[])[S.i] = {erros:S.erros, certas:S.certas, seguidas:S.seguidas, melhor:S.melhor, rapidas:S.rapidas, kg:S.kg, falhas:(S.falhas||[]).slice()};
  if(ok){ S.certas++; S.seguidas++; S.melhor=Math.max(S.melhor,S.seguidas);
    x = mult(S.seguidas); rapida = (performance.now()-S.t0)/1000 <= timeFor(Q); if(rapida) S.rapidas++;
    pts = (10*x + (rapida?5:0)) * (gold?2:1); S.kg += pts; pop = S.seguidas===3 || S.seguidas===6;
    if(pop){ buzz([30,40,30,40,60]); } else { sfx("certo"); buzz(25); }
    P.falhadas = P.falhadas.filter(id=>id!==Q.id); if(!P.acertadas.includes(Q.id)) P.acertadas.push(Q.id); }
  else { S.erros++; S.seguidas=0; S.falhas=(S.falhas||[]).concat(Q); if(!P.falhadas.includes(Q.id)) P.falhadas.push(Q.id); sfx("errado"); buzz([60,40,120]); }
  if(!P.vistas.includes(Q.id)) P.vistas.push(Q.id);
  S.ans = {v, ok, pop, pts, x, rapida, fresh:true}; save(); renderQ();
}

  P.nivel = d.nivel; P.max = Math.max(P.max, d.nivel); P.rondas++; if(d.v==="dominada") P.dominada=true; save(); colher(S.kg);

  document.getElementById("again").onclick = startRound;
  document.getElementById("home").onclick = renderStart;
  const rb = document.getElementById("rev"); if(rb) rb.onclick = ()=>{ sfx("tap"); rever(itensRev, r=>{ desenhar(r); scrollTo(0,0); }); };
  document.getElementById(revCta?"rev":novaMesa?"mesa1":"again").focus({preventScroll:true});
  };
  desenhar(null);
  countUp(document.getElementById("kg-total"), S.kg);
  if(d.v==="sobe"||d.v==="dominada"){ sfx("sobe"); buzz([40,60,40,60,120]); bubbles(46); }
  else if(d.v==="fica"){ sfx(recorde?"sobe":"certo"); if(recorde) bubbles(24); }
  else { sfx("desce"); buzz([120,80,200]); }
}
return {home: renderHome, play: startRound, sfx, nivel: ()=>LV[P.nivel-1], recorde: ()=>P.recorde[P.nivel]||0,
  estado: ()=>({nivel:P.nivel, max:P.max, dominada:P.dominada, rondas:P.rondas}),
  prog: n=>{ const ids=ATIVAS.filter(q=>q.nivel===n).map(q=>q.id); return {got:ids.filter(id=>P.acertadas.includes(id)).length, total:ids.length}; },
  jogar: n=>{ if(n<=P.max || LIVRE){ P.nivel=n; save(); } startRound(); },
  melhor: n=>(P.melhor||{})[n]||0, meta: ()=>({ronda:R.perguntas_por_ronda, passa:R.perguntas_por_ronda-R.sobe_com_erros_ate}), repertorio,
  refazer: startRefazer, falhadas: ()=>ATIVAS.filter(q=>P.falhadas.includes(q.id)), sabidas: ()=>ATIVAS.filter(q=>P.acertadas.includes(q.id)), temas: DATA.temas||{}};
}
const UVA = criarFase(window.FASE_UVA), VINHA = criarFase(window.FASE_VINHA);


renderStart();
</script>
