<!doctype html><html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Grape to Know</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,500..800,0..100,0..1;1,9..144,500..800,0..100,0..1&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Uma só identidade: os tokens dos ecrãs de jogo apontam para a paleta da vinha (vinha.css) */
:root{
  --bg:var(--h-bg); --surface:var(--h-surface); --fg:var(--h-ink); --muted:var(--h-muted); --line:var(--h-line);
  --azul:var(--h-plum); --azul-soft:var(--h-plum-soft); --cork:#C68F55; --cork-dark:#8A5A2B; --cork-spot:#A9733F;
  --wine:var(--h-bad); --wine-soft:var(--h-bad-soft); --grape:#5B2A86; --grape-hi:#A77BD0; --raisin:#7A5233;
  --good:var(--h-good); --good-soft:var(--h-good-soft);
  --display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --cork:#D7A56B; --cork-spot:#B47E46; --grape:#9A63D1; --grape-hi:#D7B8F2; --raisin:#B8875A; color-scheme:dark}}
:root[data-theme="dark"]{
  --cork:#D7A56B; --cork-spot:#B47E46; --grape:#9A63D1; --grape-hi:#D7B8F2; --raisin:#B8875A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:20px 32px;
  background-image:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);background-size:22px 22px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--azul);outline-offset:3px}

/* start */
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:8px}
.brand h1{font-size:clamp(30px,9vw,42px);font-weight:800;letter-spacing:-.02em;color:var(--azul)}
.slogan{font-weight:600;color:var(--wine);font-size:17px}
.lede{color:var(--muted);max-width:36ch;margin:4px 0 0}
.hook{font-family:var(--display);font-weight:700;font-size:clamp(19px,5.4vw,23px);line-height:1.2;color:var(--fg);margin:10px 0 0;text-wrap:balance}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 8px 12px;
  display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);transition:border-color .15s, transform .15s}
.pick button[aria-pressed="true"]{border-color:var(--azul);background:var(--azul-soft)}
.pick button:hover{transform:translateY(-2px)}
.pick .nm{font-family:var(--display);font-weight:700;font-size:15px}
.pick .tg{font-size:13px;color:var(--muted)}
.cta{background:var(--azul);color:var(--bg);border:0;border-radius:999px;padding:16px 22px;font-family:var(--display);
  font-weight:700;font-size:16px;letter-spacing:.01em;box-shadow:0 4px 0 color-mix(in srgb,var(--azul) 60%, #000)}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--azul) 60%, #000)}
.snd{background:var(--surface);border:2px solid var(--line);border-radius:12px;width:40px;height:40px;padding:0;
  display:grid;place-items:center;color:var(--fg);flex:none}
.snd[aria-pressed="false"]{color:var(--muted)}
.snd svg{width:20px;height:20px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:-8px}
.fine{font-size:12.5px;color:var(--muted);text-align:center;margin:0}

/* hud */
.hud{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--azul);border-radius:99px;transition:width .4s ease}
.lives{display:flex;gap:3px}
.lives svg{width:22px;height:22px}
.stats{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg)}
.streak{color:var(--wine);font-weight:700}

/* question */
.stage{display:flex;align-items:flex-end;gap:12px}
.mascot{width:86px;flex:none}
.mascot .mk{position:relative;transform-origin:50% 100%}
.mascot img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.mascot .ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ov .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1s ease-in-out infinite}
.ov .spark:nth-child(2){animation-delay:.25s}.ov .spark:nth-child(3){animation-delay:.5s}
@keyframes twinkle{0%,100%{transform:scale(.7);opacity:.7}50%{transform:scale(1.15);opacity:1}}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0;flex:1}
.bubble:before{content:"";position:absolute;left:-9px;bottom:22px;width:14px;height:14px;background:var(--surface);
  border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.qlabel{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(17px,4.8vw,20px);line-height:1.25;margin:4px 0 0}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:14px;
  padding:14px 16px;font-weight:600;font-size:16px;box-shadow:0 3px 0 var(--line);transition:transform .1s}
.opt:hover:not(:disabled){border-color:var(--azul)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--wine);background:var(--wine-soft);box-shadow:0 3px 0 var(--wine)}
.opt:disabled{cursor:default}

/* feedback */
.fb{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:rise .25s ease}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--wine-soft)}
.fb h2{font-size:20px}
.fb.good h2{color:var(--good)}
.fb.bad h2{color:var(--wine)}
.fb p{margin:0}
.fb .cta{align-self:stretch}
.fb.bad .cta{background:var(--wine);box-shadow:0 4px 0 color-mix(in srgb,var(--wine) 60%, #000)}
.fb.good .cta{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%, #000)}

/* end */
.end{display:flex;flex-direction:column;align-items:stretch;text-align:center;gap:24px;padding-block:8px 4px}
.end-head{display:flex;flex-direction:column;align-items:center;gap:8px}
.end .mascot{width:112px;margin-bottom:4px}
.end h1{font-size:clamp(26px,7.4vw,34px);letter-spacing:-.01em}
.end .lead{color:var(--fg);font-size:17px;line-height:1.45;max-width:32ch;margin:2px 0 0}
.end-score{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 12px}
.end-actions{display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--display);font-weight:800;font-size:48px;color:var(--azul);font-variant-numeric:tabular-nums;line-height:1}
.badge{display:inline-block;background:var(--wine);color:var(--bg);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}


/* streak celebration: sparkling bottle pops */
.pop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding-inline:16px;
  background:color-mix(in srgb,var(--bg) 72%, transparent);backdrop-filter:blur(3px);animation:fadein .2s ease;cursor:pointer}
.pop-inner{display:flex;flex-direction:column;align-items:center;gap:8px}
.pop-scene{position:relative;width:200px;height:300px}
.pop-bottle{position:absolute;left:40px;bottom:0;width:120px;height:260px;transform-origin:50% 90%;animation:shake 1.2s ease-in-out}
.pop-cork{position:absolute;left:84px;top:28px;width:32px;animation:corkfly 2.4s cubic-bezier(.2,.8,.3,1) 1.1s both}
.bub{position:absolute;left:96px;top:58px;width:var(--s);height:var(--s);border-radius:50%;
  background:var(--b);opacity:0;animation:bubble var(--d) ease-out var(--w) forwards}
.pop-title{font-family:var(--display);font-weight:800;font-size:34px;color:var(--wine);letter-spacing:-.01em;animation:rise .5s ease 1.3s both}
.pop-sub{font-weight:600;color:var(--fg);animation:rise .5s ease 1.5s both;text-align:center}
.pop-title.sad{color:var(--fg)}
.scene{width:200px;height:300px;display:block;overflow:visible}
/* broken cork */
.brk .cs{animation:csdown 1s ease-out both}
.brk .lift{transform-box:view-box;transform-origin:100px 60px;animation:lift 3s ease both}
.brk .bottle{transform-box:view-box;transform-origin:100px 290px;animation:tremor .35s ease 1.3s 3}
.brk .crumb{transform-box:fill-box;opacity:0;animation:crumb 2s ease-in var(--w) forwards}
@keyframes csdown{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
@keyframes lift{0%,40%{transform:none}46%{transform:translate(-2px,2px)}52%{transform:translate(2px,0)}76%,100%{transform:translateY(-52px) rotate(-9deg)}}
@keyframes tremor{0%,100%{transform:none}50%{transform:rotate(2deg)}}
@keyframes crumb{0%{opacity:0;transform:none}12%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y))}}
/* vinegar */
.vin .wine{animation:sour 2.2s ease .6s both}
.vin .la{animation:fadeout .6s ease 1.6s both}
.vin .lb{animation:fadein .6s ease 2s both}
.vin .bottle{transform-box:view-box;transform-origin:100px 290px;animation:droop 2.6s ease .5s both}
.vin .waft{transform-box:fill-box;opacity:0;animation:waft 1.8s ease-out var(--w) infinite}
@keyframes sour{from{fill:#6E1630}to{fill:#A38532}}
@keyframes fadeout{to{opacity:0}}
@keyframes droop{0%{transform:none}100%{transform:rotate(-6deg) translateX(-4px)}}
@keyframes waft{0%{opacity:0;transform:none}30%{opacity:.85}100%{opacity:0;transform:translate(6px,-40px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg)}30%{transform:rotate(7deg)}45%{transform:rotate(-6deg)}60%{transform:rotate(5deg)}80%{transform:rotate(-2deg)}}
@keyframes corkfly{0%{transform:none}35%{transform:translate(18px,-150px) rotate(360deg)}60%{transform:translate(34px,-175px) rotate(560deg)}100%{transform:translate(60px,-60px) rotate(760deg);opacity:0}}
@keyframes bubble{0%{opacity:0;transform:none}15%{opacity:.95}100%{opacity:0;transform:translate(var(--x),var(--y))}}

/* trail */
.trail{display:flex;flex-direction:column;gap:10px}
.trail h2{font-size:15px;letter-spacing:.02em}
.unit{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.unit .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;background:var(--azul-soft);color:var(--azul);flex:none}
.unit .t{flex:1;min-width:0}
.unit .t b{display:block;font-family:var(--display);font-size:14px;font-weight:700}
.unit .t span{font-size:13px;color:var(--muted)}
.unit.locked{opacity:.55}
.unit.pt .n{background:var(--wine-soft);color:var(--wine)}
.go{background:var(--azul);color:var(--bg);border:0;border-radius:999px;padding:9px 16px;font-weight:700;flex:none}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--wine);margin-left:6px}
.cta:disabled{opacity:.45;cursor:default;box-shadow:none}
/* grape diagram */
.grape-fig{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px;display:flex;justify-content:center}
.grape-fig svg{width:min(100%,300px);height:auto;display:block}
.gtk-drip{transform-box:fill-box;transform-origin:50% 0;animation:drip 2.8s ease-in infinite}
@keyframes drip{0%,55%{transform:translateY(-6px) scale(.4);opacity:0}70%{opacity:1;transform:none}100%{transform:translateY(10px);opacity:0}}
.part:hover{filter:brightness(1.08)}
.lives svg{width:24px;height:24px}
.part{cursor:pointer}
.locked-fig .part{cursor:default}
.marker{fill:none;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:pulse 1.1s ease-in-out infinite}
.marker.sel{stroke:var(--azul)} .marker.ok{stroke:var(--good)} .marker.bad{stroke:var(--wine)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.chip.seen{border-color:var(--good)}
.chip.on{border-color:var(--azul);background:var(--azul-soft)}
.info{background:var(--azul-soft);border-radius:16px;padding:14px 16px;animation:rise .25s ease}
.info b{font-family:var(--display);color:var(--azul)}
.info p{margin:4px 0 0}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mi{background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:12px 10px;font-weight:600;font-size:14.5px;
  box-shadow:0 3px 0 var(--line);min-height:58px;line-height:1.25}
.mi.l{font-family:var(--display);font-size:14px}
.mi.sel{border-color:var(--azul);background:var(--azul-soft)}
.mi.done{border-color:var(--good);background:var(--good-soft);color:var(--good);box-shadow:none;cursor:default}
.mi.err{border-color:var(--wine);background:var(--wine-soft);animation:wobble .4s ease}
/* crossword */
.xw-wrap{display:flex;justify-content:safe center;overflow-x:auto;container-type:inline-size}
.xw{--c:min(32px, calc((100cqw - 27px) / 10));display:grid;grid-template-columns:repeat(10,var(--c));grid-auto-rows:var(--c);gap:3px}
.xw .cell{position:relative}
.xw input{width:100%;height:100%;border:2px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);text-align:center;
  font-family:var(--display);font-weight:700;font-size:calc(var(--c) * .48);text-transform:uppercase;padding:0;caret-color:transparent}
.xw input.cur{background:var(--azul-soft);border-color:color-mix(in srgb,var(--azul) 40%, var(--line))}
.xw input:focus{outline:none;border-color:var(--azul)}
.xw input.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.xw input.bad{border-color:var(--wine);background:var(--wine-soft)}
.xw .num{position:absolute;top:1px;left:3px;font-size:9px;font-weight:700;color:var(--muted);pointer-events:none}
.clues{display:grid;gap:4px;font-size:14.5px}
.clue{padding:7px 10px;border-radius:10px;cursor:pointer}
.clue.on{background:var(--azul-soft)}
.clue b{font-family:var(--display);color:var(--azul);margin-right:6px;font-size:13px}
.clue small{color:var(--muted)}
.xw-actions{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.ghost{background:transparent;border:2px solid var(--line);border-radius:999px;color:var(--muted);font-weight:700;padding:12px}
.note{font-size:14px;color:var(--muted);text-align:center;margin:0}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(6deg)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.m-idle .mk{animation:idle 2.6s ease-in-out infinite}
.m-happy .mk{animation:hop .6s ease}
.m-corked .mk{animation:wobble .5s ease}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rung{border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);color:var(--fg)}
.rung .dot{width:40px;height:40px;display:grid;place-items:center}.rung .dot svg{width:100%;height:100%}
.rung b{font-family:var(--display);font-size:13px}
.rung span{font-size:12px;color:var(--muted)}
.rung.on{border-color:var(--azul);background:var(--azul-soft);transform:translateY(-2px)}
.rung.done b::after{content:" ✓";color:var(--good)}
.rung.on .dot svg{animation:hop 1.6s ease-in-out infinite}
.rules{display:grid;gap:8px;font-size:15px}
.rule{display:flex;gap:10px;align-items:center}
.rule .pill{flex:none;min-width:76px;text-align:center;border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.p-up{background:var(--good-soft);color:var(--good)} .p-stay{background:var(--azul-soft);color:var(--azul)} .p-down{background:var(--wine-soft);color:var(--wine)}
.test{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--azul);background:var(--azul-soft)}
.lvl{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--fg)}
.lvl i{width:22px;height:22px;display:inline-block}.lvl i svg{width:100%;height:100%;display:block}
.toast{align-self:center;background:var(--wine);color:var(--bg);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;animation:rise .3s ease}
.verdict{font-size:clamp(26px,7.4vw,34px);letter-spacing:-.01em}
.v-up{color:var(--good)}.v-stay{color:var(--azul)}.v-down{color:var(--wine)}
.lead{color:var(--fg);font-size:17px;line-height:1.45;max-width:32ch;margin-top:2px}
.tally{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 4px;font-variant-numeric:tabular-nums}
.tally div{display:flex;flex-direction:column;align-items:center;gap:2px}
.tally div+div{border-left:2px solid var(--line)}
.tally b{font-family:var(--display);font-size:26px;line-height:1.1}
.tally small{font-size:15px;color:var(--muted);font-weight:700}
.tally span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.p-gold{background:#F7E7B4;color:#7A5300}
.combo{color:var(--wine);display:inline-block;animation:pop .4s ease}
.glass{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.glass span{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--wine),var(--grape-hi));transform-origin:left;animation:drain linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0);opacity:.35}}
.bubble.is-gold{border-color:#D4A72C;box-shadow:0 0 0 4px #F7E7B4}
.toast.gold{background:#D4A72C;color:#2B1D00}
.gain{align-self:center;font-weight:800;color:var(--good);font-variant-numeric:tabular-nums;animation:pop .45s ease}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.fx i{position:absolute;bottom:-20px;border-radius:50%;opacity:.85;animation:fizzup ease-out forwards}
@keyframes fizzup{to{transform:translateY(-105vh) translateX(20px);opacity:0}}
.fly{position:absolute;z-index:21;transform:translate(-50%,0);font-family:var(--display);font-weight:800;color:var(--good);pointer-events:none;animation:flyup 1.2s ease-out forwards}
@keyframes flyup{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px) scale(1.2)}}
.medals{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.medal{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.medal.b-gold{background:#F7E7B4;border-color:#D4A72C;color:#5A3D00}
.phase-head{display:flex;align-items:center;gap:14px}
.phase-head .mascot{width:84px}
.phase-head h1{font-size:clamp(24px,7vw,30px);color:var(--azul)}
.phase-head .sub{color:var(--wine);font-weight:600}
.topbar.spread{justify-content:space-between;align-items:center;margin-bottom:0}
.back{padding:8px 14px;font-size:14px}
.stats{align-items:center;gap:8px}
.card .fine{text-align:left}
.card h3{font-family:var(--display);margin:0}
.card p{margin:0}
.unit.sub{margin-left:22px;border-style:dashed}
.unit .lvlmini{width:34px;height:34px;flex:none}.unit .lvlmini svg{width:100%;height:100%}
.close{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:4px 6px}
.opts.vf{grid-template-columns:1fr 1fr}
.vf .opt{text-align:center;font-family:var(--display);font-size:15px}
.hud .snd{width:34px;height:34px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.glass span{animation:drain linear forwards!important}}
/* ===== Ecrã inicial "Um pequeno mundo de vinho": vinha em talhões, fim de tarde ===== */

  --h-good:#3E7027; --h-good-soft:#E6EED6; --h-bad:#A63A2B; --h-bad-soft:#F7E2DA;

  --h-bg:#211A23; --h-surface:#2D2530; --h-ink:#F4EBDF; --h-muted:#C2B2B7; --h-line:#47394B;

body:has(.gtk-home){background-color:var(--h-bg);background-image:radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--h-line) 70%,transparent) 1px, transparent 0);background-size:24px 24px}
.gtk-home{display:flex;flex-direction:column;gap:20px;color:var(--h-ink);font-family:var(--h-body)}
.gtk-home h1,.gtk-home h2,.gtk-home h3{font-family:var(--h-display);font-variation-settings:"SOFT" 30, "WONK" 0;letter-spacing:-.01em;text-wrap:balance;margin:0}
.eyebrow-h{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--h-muted)}

/* controlos */
.h-btn{font:inherit;font-weight:700;cursor:pointer;border-radius:14px;border:1.5px solid transparent;min-height:44px;padding:10px 16px;
  transition:transform .12s ease, background-color .15s ease, box-shadow .15s ease;-webkit-tap-highlight-color:transparent}
.h-btn:active{transform:translateY(1px) scale(.985)}
.gtk-home button:focus-visible{outline:3px solid var(--h-plum);outline-offset:3px}
.cta-h{width:100%;min-height:56px;background:var(--h-plum);color:var(--h-on-plum);border-color:color-mix(in srgb,var(--h-plum) 70%,#000);
  font-family:var(--h-display);font-size:19px;font-weight:700;letter-spacing:.005em;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 1px 0 color-mix(in srgb,var(--h-plum) 40%,transparent), 0 10px 22px -14px var(--h-plum)}
.cta-h svg{width:18px;height:18px}
.cta-h:hover{background:var(--h-plum-hi)}
.ghost-h{background:var(--h-surface);color:var(--h-plum);border-color:var(--h-line);font-size:14px;min-height:40px;padding:8px 12px}
.ghost-h:hover{border-color:var(--h-plum)}
.sec-h{background:transparent;color:var(--h-plum);border-color:var(--h-plum);min-width:84px}
.sec-h:hover{background:var(--h-plum-soft)}

/* contadores */
.h-stats{display:flex;align-items:center;gap:8px}
.h-stat{display:inline-flex;align-items:baseline;gap:5px;background:var(--h-surface);border:1px solid var(--h-line);border-radius:999px;padding:6px 12px 6px 8px;font-variant-numeric:tabular-nums}
.h-stat i{width:20px;height:20px;align-self:center;display:inline-block}.h-stat i svg{width:100%;height:100%;display:block}
.h-stat b{font-family:var(--h-display);font-size:17px;line-height:1}
.h-stat small{font-size:12.5px;color:var(--h-muted);font-weight:600}
.ic-glass{color:var(--h-terra)}.ic-grape{color:var(--h-plum)}
.h-stats .snd{margin-left:auto;background:var(--h-surface);border:1px solid var(--h-line);border-radius:12px;color:var(--h-ink);box-shadow:none}

/* entrada */
.entrada{display:flex;flex-direction:column;gap:10px;padding:2px 0 4px}
.logo{font-size:clamp(38px,11.5vw,50px);line-height:.95;font-weight:800;color:var(--h-plum);font-variation-settings:"SOFT" 50,"WONK" 1,"opsz" 144}
.logo i{font-weight:500;font-style:italic;color:var(--h-terra)}
.slogan-h{font-family:var(--h-display);font-style:italic;font-size:18px;color:var(--h-olive);margin:-2px 0 4px}
.hook-h{font-family:var(--h-display);font-size:clamp(21px,6vw,25px);font-weight:700;line-height:1.15;margin:4px 0 0}
.lede-h{color:var(--h-muted);font-size:15.5px;line-height:1.5;max-width:40ch;margin:0}
.next-line{margin:0;font-size:14px;color:var(--h-muted);text-align:center}
.next-line b{color:var(--h-ink)}

/* fase e cena */
.fase{display:flex;flex-direction:column;gap:10px}
.fase-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.fase-head h2{font-size:32px;line-height:1;color:var(--h-ink)}
.fase-meta{margin:0;color:var(--h-muted);font-size:14.5px}
.fase-meta b{color:var(--h-ink)}
.cena{position:relative;width:100%;max-width:100%;aspect-ratio:360/620;border-radius:22px;overflow:hidden;
  border:1px solid var(--h-line);box-shadow:0 18px 36px -26px rgba(60,30,40,.55);container-type:inline-size}
.cena-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cena-svg .sun{fill:var(--sun)}.cena-svg .sun-halo{fill:var(--halo);opacity:.55}
.cena-svg .hill-far{fill:var(--hill-far)}.cena-svg .hill-near{fill:var(--hill-near)}.cena-svg .grass{fill:var(--grass)}
.cena-svg .tuft{stroke:var(--tuft);stroke-width:1.2;fill:none;stroke-linecap:round;opacity:.8}
.cena-svg .cypress{fill:var(--cypress)}
.cena-svg .wall{fill:var(--wall);stroke:var(--soil-edge);stroke-width:1}
.cena-svg .roof{fill:var(--roof)}.cena-svg .roof-edge{stroke:color-mix(in srgb,var(--roof) 70%,#000);stroke-width:2}
.cena-svg .door{fill:var(--door)}.cena-svg .window{fill:var(--window);opacity:.85}
.cena-svg .lane{fill:var(--lane)}.cena-svg .lane-edge{stroke:var(--lane-edge);stroke-width:1.2;fill:none;stroke-dasharray:1 5;stroke-linecap:round}
.cena-svg .plot-shade{fill:var(--shade);opacity:.75}
.cena-svg .plot-soil{fill:var(--soil);stroke:var(--soil-edge);stroke-width:1.2}
.cena-svg .furrow{stroke:var(--soil-edge);stroke-width:1;fill:none;opacity:.55}
.cena-svg .trunk{stroke:var(--trunk);fill:none;stroke-linecap:round}
.cena-svg .lf1{fill:var(--lf1)}.cena-svg .lf2{fill:var(--lf2)}.cena-svg .lf3{fill:var(--lf3)}
.cena-svg .bc1{fill:var(--bc1)}.cena-svg .bc2{fill:var(--bc2)}
.cena-svg .stake{stroke:var(--stake);stroke-linecap:round}.cena-svg .sprout{fill:var(--sprout)}
.cena-svg .t-bloqueada .plot-soil{fill:color-mix(in srgb,var(--soil) 75%,var(--grass))}
.cena-svg .barrel{fill:var(--barrel)}.cena-svg .hoop{stroke:color-mix(in srgb,var(--barrel) 55%,#000);stroke-width:1.4}
.cena-svg .trunk-o{stroke:var(--trunk);stroke-width:4;fill:none;stroke-linecap:round}
.cena-svg .olive1{fill:var(--olive1)}.cena-svg .olive2{fill:var(--olive2)}
.cena-svg .cart{fill:var(--h-cork);stroke:var(--trunk);stroke-width:1.5}.cena-svg .wheel{fill:var(--trunk)}
.cena-svg .handle{stroke:var(--trunk);stroke-width:2.4;stroke-linecap:round}
.cena-svg .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}

/* placas dos talhões */
.placa{position:absolute;width:42.5%;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;
  background:var(--h-surface);color:var(--h-ink);border:1.5px solid var(--h-cork);border-radius:12px;padding:7px 9px 8px;
  box-shadow:0 2px 0 color-mix(in srgb,var(--h-cork) 45%,transparent), 0 8px 16px -12px rgba(40,20,20,.6);font:inherit;
  transition:transform .12s ease}
.placa:before{content:"";position:absolute;left:16px;bottom:-11px;width:5px;height:11px;border-radius:0 0 2px 2px;background:var(--h-cork)}
.placa:after{content:"";position:absolute;right:16px;bottom:-11px;width:5px;height:11px;border-radius:0 0 2px 2px;background:var(--h-cork)}
.placa:active{transform:translateY(1px) scale(.985)}
.pl-head{display:flex;align-items:center;gap:8px;min-width:0}
.pl-num-badge{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--h-display);font-weight:800;font-size:14px;
  border:1.5px solid var(--h-plum);color:var(--h-plum);background:var(--h-surface)}
.pl-num-badge svg{width:14px;height:14px}
.pl-t{min-width:0;display:flex;flex-direction:column}
.pl-t small{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--h-muted);line-height:1.2}
.pl-t b{font-family:var(--h-display);font-size:15px;line-height:1.12;font-weight:700}
.pl-estado{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--h-muted)}
.pl-estado svg{width:13px;height:13px;flex:none}
.pl-prog{display:flex;align-items:center;gap:6px}
.pl-bar{flex:1;height:5px;border-radius:99px;background:color-mix(in srgb,var(--h-line) 80%,transparent);overflow:hidden}
.pl-bar i{display:block;height:100%;background:var(--h-leaf);border-radius:99px}
.pl-num{font-size:11.5px;font-weight:700;color:var(--h-muted);font-variant-numeric:tabular-nums}
.e-concluida{border-color:var(--h-gold)}
.e-concluida .pl-num-badge{background:var(--h-gold);border-color:var(--h-gold);color:var(--h-surface)}
.e-concluida .pl-estado{color:var(--h-gold)}
.e-curso .pl-estado{color:var(--h-plum)}
.e-disponivel .pl-estado{color:var(--h-olive)}
.e-bloqueada{background:color-mix(in srgb,var(--h-surface) 82%,var(--h-line));border-style:dashed;border-color:color-mix(in srgb,var(--h-cork) 60%,var(--h-line));box-shadow:none}
.e-bloqueada .pl-num-badge{border-color:var(--h-muted);color:var(--h-muted)}
.e-bloqueada .pl-t b{color:var(--h-muted)}
.placa.proxima{border:2px solid var(--h-plum);box-shadow:0 0 0 4px color-mix(in srgb,var(--h-plum) 18%,transparent), 0 10px 18px -12px rgba(40,20,20,.7);animation:chegar .7s ease-out 1}
.placa.proxima .pl-num-badge{background:var(--h-plum);color:var(--h-on-plum)}
.pl-fita{position:absolute;top:-12px;right:10px;background:var(--h-plum);color:var(--h-on-plum);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 8px}
.placa.nope{animation:nope .35s ease}
@keyframes chegar{0%{transform:translateY(-6px)}60%{transform:translateY(1px)}100%{transform:none}}
@keyframes nope{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(3px)}}
.brilho{position:absolute;width:9px;height:9px;background:var(--h-gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:brilho 2.6s ease-in-out 4;opacity:0}
.brilho.b1{top:-4px;right:-3px}.brilho.b2{bottom:6px;right:8px;animation-delay:1.1s;width:7px;height:7px}
@keyframes brilho{0%,100%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(1)}}

/* caixotes, troféu, mascote */
.caixote{position:absolute;transform:translateX(-50%);background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit}
.caixote svg{width:42px;height:34px;display:block;filter:drop-shadow(0 3px 2px rgba(60,40,20,.25))}
.cx-lbl{position:relative;margin-top:-5px;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--h-surface);color:var(--h-muted);border:1px solid var(--h-line);white-space:nowrap}
.cx-lbl svg{width:10px;height:10px}
.c-pronto .cx-lbl{background:var(--h-gold-soft);color:var(--h-ink);border-color:var(--h-gold)}
.c-pronto svg{animation:abanar 2.4s ease-in-out 3}
.c-fechado svg{filter:grayscale(.85) opacity(.7)}
.c-colhido svg{opacity:.8}
@keyframes abanar{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-5deg)}88%{transform:rotate(4deg)}}
.trofeu{position:absolute;transform:translateX(-50%);display:flex;align-items:center;gap:8px;cursor:pointer;font:inherit;text-align:left;
  background:var(--h-surface);color:var(--h-ink);border:1.5px solid var(--h-line);border-radius:12px;padding:6px 12px 6px 8px;box-shadow:0 8px 16px -12px rgba(40,20,20,.6)}
.trofeu b{display:block;font-family:var(--h-display);font-size:14px;line-height:1.1}
.trofeu small{display:block;font-size:11.5px;color:var(--h-muted);font-weight:600}
.tr-ic{width:30px;height:30px;color:var(--h-muted)}.tr-ic svg{width:100%;height:100%}
.t-ganho{border-color:var(--h-gold);background:var(--h-gold-soft)}.t-ganho .tr-ic{color:var(--h-gold)}
.masc-cena{position:absolute;width:16%;transform:translateX(-50%);background:none;border:0;padding:0;cursor:pointer}
.masc-cena .mascot{display:block;width:100%;filter:drop-shadow(0 6px 4px rgba(60,40,20,.28))}
.masc-cena .mascot img{width:100%;height:auto;display:block}
.masc-cena .m-happy .mk{animation:hop .6s ease}
.masc-fala{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;white-space:nowrap;background:var(--h-surface);color:var(--h-ink);
  border:1.5px solid var(--h-plum);border-radius:10px;padding:4px 9px;font-size:12.5px;font-weight:700}
.mesa-cena{position:absolute;transform:translateX(-50%);background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit}
.mesa-cena svg{width:46px;height:34px;display:block;filter:drop-shadow(0 3px 2px rgba(60,40,20,.25));overflow:visible}
.mesa-cena .mt-top{fill:var(--h-cork);stroke:var(--trunk);stroke-width:1.2}
.mesa-cena .mt-leg{stroke:var(--trunk);stroke-width:2.2;stroke-linecap:round;fill:none}
.mesa-cena .mt-glass{fill:var(--bc2);stroke:var(--trunk);stroke-width:1}
.mesa-cena .mt-plate{fill:var(--h-surface);stroke:var(--soil-edge);stroke-width:1}
.mesa-cena .mt-food{fill:var(--h-olive)}
.mesa-cena .cx-lbl{margin-top:-2px}
.pt-selo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--h-display);font-weight:800;font-size:13px;
  color:var(--h-terra);border:1.5px dashed var(--h-terra);background:var(--h-surface);box-shadow:0 3px 6px -3px rgba(60,40,20,.45);margin-bottom:3px}
.pt-cena.e-bloqueada .pt-selo{filter:grayscale(.9);opacity:.75}
.pt-cena.proxima .pt-selo{animation:abanar 2.4s ease-in-out 3}
@media (prefers-reduced-motion: reduce){ .pt-cena.proxima .pt-selo{animation:none} }
.mesa-cena.e-bloqueada svg{filter:grayscale(.85) opacity(.7)}
.mesa-cena.e-concluida .cx-lbl{border-color:var(--h-gold);color:var(--h-ink);background:var(--h-gold-soft)}
.mesa-cena.proxima .cx-lbl{background:var(--h-plum);color:var(--h-on-plum);border-color:var(--h-plum)}
.mesa-cena .pl-fita{top:-16px;right:auto;left:-2px;white-space:nowrap}
.mesa-cena.proxima svg{animation:abanar 2.4s ease-in-out 3}
@media (prefers-reduced-motion: reduce){ .mesa-cena.proxima svg{animation:none} }

/* marco = disco + etiqueta; o ponto (left/top) é o centro do disco */
.marco{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;margin:0;font:inherit;cursor:pointer;color:var(--h-ink);
  display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent;min-width:44px;min-height:44px;justify-content:center}

.marco.e-bloqueada .mk-disco{background:color-mix(in srgb,var(--h-surface) 85%,var(--h-line));border:1.5px solid color-mix(in srgb,var(--h-muted) 55%,transparent);color:var(--h-muted);width:30px;height:30px;font-size:14px;box-shadow:none}
.marco.e-bloqueada .mk-lbl{color:var(--h-muted);background:color-mix(in srgb,var(--h-surface) 80%,transparent);box-shadow:none;font-weight:600}
.mk-lock{position:absolute;right:-5px;bottom:-4px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--h-surface);color:var(--h-muted);border:1px solid var(--h-line)}

.mk-et.proxima{transform:translate(-50%,-27px)}
/* marco escolhido: anel fino, sem depender só da cor (a etiqueta fica sublinhada) */

/* +N kg: sobe do marco e desaparece (uma vez); com movimento reduzido fica parado */

/* ===== Revisão de UX (13 out 2026): lição, rondas, resultados e regras com a mesma identidade da vinha ===== */
body{background-color:var(--bg);background-image:radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--line) 70%,transparent) 1px, transparent 0);background-size:24px 24px}
h1,h2,.qtext,.score,.tally b,.pop-title{font-variation-settings:"SOFT" 30,"WONK" 0;letter-spacing:-.01em}
button:focus-visible{outline-color:var(--azul)}

/* botões: raio suave, contorno discreto, sem base grossa */
.cta{border-radius:14px;border:1.5px solid color-mix(in srgb,var(--azul) 70%,#000);min-height:54px;padding:13px 20px;
  font-size:18px;font-weight:700;color:var(--h-on-plum);box-shadow:0 10px 22px -16px var(--azul);transition:transform .12s ease}
.cta:active{transform:translateY(1px) scale(.985);box-shadow:none}
.cta:disabled{background:color-mix(in srgb,var(--azul) 35%,var(--surface));border-color:transparent;color:var(--h-on-plum);opacity:1}
.fb.good .cta{background:var(--good);border-color:color-mix(in srgb,var(--good) 70%,#000);color:var(--bg);box-shadow:none}
.fb.bad .cta{background:var(--wine);border-color:color-mix(in srgb,var(--wine) 70%,#000);color:var(--bg);box-shadow:none}
.ghost{border:1.5px solid var(--line);border-radius:14px;color:var(--azul);background:var(--surface);min-height:48px}
.opt{border:1.5px solid var(--line);border-radius:14px;min-height:54px;padding:13px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 1px 0 color-mix(in srgb,var(--line) 70%,transparent);line-height:1.3}
.opt:hover:not(:disabled){border-color:color-mix(in srgb,var(--azul) 55%,var(--line))}
.opt:active:not(:disabled){transform:scale(.985);box-shadow:none}
.opt.right,.opt.wrong{box-shadow:none;border-width:2px}
/* depois de responder, as outras opções saem: fica a certa (e a tua, se erraste), e a explicação já não tapa a pergunta */
.opts:has(.opt.right) .opt:not(.right):not(.wrong){display:none}
.opts:has(.opt.right):not(.vf) .opt.right{order:-1}
/* a explicação ocupa no máximo ~60% do ecrã: a pergunta continua à vista; o botão fica sempre visível */
.fb{max-height:min(60vh,560px);overflow-y:auto;overscroll-behavior:contain}
.fb .cta{position:sticky;bottom:0;flex:none}
.opt.right::after,.opt.wrong::after{margin-left:auto;flex:none;font-size:13px;font-weight:800;letter-spacing:.02em}
.opt.right::after{content:"✓ Certa";color:var(--good)}
.opt.wrong::after{content:"✗ A tua";color:var(--wine)}
.vf .opt{justify-content:center;font-size:17px}
.vf .opt.right::after,.vf .opt.wrong::after{margin-left:6px}
.mi{border:1.5px solid var(--line);border-radius:14px;box-shadow:0 1px 0 color-mix(in srgb,var(--line) 70%,transparent)}
.mi.l{font-size:16px}
.chip{border:1.5px solid var(--line)}
.snd{border:1px solid var(--line)}
.close{border-radius:10px;min-width:36px;min-height:36px;color:var(--muted);font-size:24px}
.close:hover{color:var(--fg)}

/* barra e contadores */
.bar{height:10px;background:color-mix(in srgb,var(--line) 85%,transparent)}
.bar span{background:var(--azul)}
.streak,.combo{color:var(--h-terra)}
.toast{background:var(--azul);color:var(--h-on-plum)}

/* pergunta: o enunciado ocupa a largura toda; a rolha espreita por cima do cartão */
.stage{position:relative;display:block;margin-top:30px}
.stage .mascot{position:absolute;right:10px;top:-40px;width:58px;z-index:1;pointer-events:none}
.bubble{border:1.5px solid var(--line);border-radius:18px;padding:14px 16px 16px;box-shadow:0 12px 26px -22px rgba(60,30,40,.55)}
.stage .bubble:before{display:none}
.stage .qlabel,.stage .bubble>.eyebrow{padding-right:62px;min-height:30px;line-height:1.35}
.qtext{font-weight:650;font-size:clamp(20px,5.6vw,23px);line-height:1.22;margin-top:2px}
.bubble.is-gold{border-color:var(--h-gold);box-shadow:0 0 0 4px var(--h-gold-soft)}
.grape-fig{border:1.5px solid var(--line)}
.info{background:var(--azul-soft)}

/* explicação: fica presa ao fundo do ecrã, com o botão sempre à mão */
.fb{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:5;border:1.5px solid transparent;
  box-shadow:0 -6px 28px -18px rgba(40,20,30,.55)}
.fb.good{border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.fb.bad{border-color:color-mix(in srgb,var(--wine) 35%,transparent)}
.fb h2{font-size:22px}
.fb p{line-height:1.5}

/* resultados e regras */
.card,.tally,.end-score,.rung,.medal,.unit{border-width:1.5px}
.rung.on{border-color:var(--azul)}
.score{color:var(--azul)}
.badge{background:var(--azul);color:var(--h-on-plum)}
.medal.b-gold{background:var(--h-gold-soft);border-color:var(--h-gold);color:var(--fg)}
.p-gold{background:var(--h-gold-soft);color:var(--fg)}
.phase-head h1{color:var(--fg)}
.phase-head .sub{color:var(--h-olive)}
.pop-title{color:var(--azul)}

/* início: quem volta vê a vinha logo no primeiro ecrã */
.entrada.volta{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding:0}
.entrada.volta .logo{font-size:30px}
.entrada.volta .slogan-h{font-size:16px;margin:0}
.cta-bloco{display:flex;flex-direction:column;gap:8px}
.gtk-home:not(.novo) .fase{gap:12px}
.fase-meta{font-size:13.5px;line-height:1.45}
.pl-bar{position:relative;overflow:visible}
.pl-bar i{max-width:100%}
.pl-bar em{position:absolute;top:-3px;width:2px;height:11px;border-radius:1px;background:var(--h-plum);transform:translateX(-1px)}

/* folha: escolher a rolha antes da primeira lição */
.folha{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;
  background:color-mix(in srgb,var(--h-ink) 38%,transparent);animation:fadein .2s ease}
.folha-in{width:100%;max-width:480px;background:var(--h-surface);color:var(--h-ink);border-radius:22px 22px 0 0;
  padding:22px 16px calc(18px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:10px;animation:rise .28s ease;font-family:var(--h-body)}
.folha-in h2{font-family:var(--h-display);font-size:26px;margin:0}
.folha-in p{margin:0;color:var(--h-muted)}
.folha-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.folha-pick button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px 12px;background:var(--h-bg);color:var(--h-ink);border-color:var(--h-line);border-radius:16px}
.folha-pick button:hover{border-color:var(--h-plum)}
.folha-pick .mascot{width:70px;margin-bottom:4px}.folha-pick .mascot img{width:100%;height:auto;display:block}
.folha-pick b{font-family:var(--h-display);font-size:18px}
.folha-pick small{font-size:13px;color:var(--h-muted);font-weight:500}
.folha-pick .vamos{margin-top:8px;display:inline-flex;align-items:center;gap:6px;background:var(--h-plum);color:var(--h-on-plum);border-radius:10px;padding:6px 12px;font-size:14px}
.folha-pick .vamos svg{width:14px;height:14px}
.folha-x{align-self:center;background:none;border:0;color:var(--h-muted);font:inherit;font-weight:600;padding:10px;cursor:pointer}
@media (prefers-reduced-motion: reduce){ .folha,.folha-in{animation:none} }
.xw-actions{grid-template-columns:1.5fr 1fr}
.xw-actions .ghost{white-space:nowrap;font-size:15px;padding-inline:10px}
.ghost-h{white-space:nowrap}
@media (max-width:360px){ .fase-head .ghost-h{font-size:13px;padding-inline:10px} .fase-head h2{font-size:28px} }

/* rondas à mesa: compreender e prever, uma característica de cada vez */
.rever{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.rever summary{cursor:pointer;font-weight:700;color:var(--azul);min-height:28px}
.rever ol{margin:10px 0 6px;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.rever li span{display:block;font-size:14.5px;line-height:1.4}
.rever li b{display:block;font-size:14.5px;color:var(--good);margin-top:2px}
.rever li b::before{content:"✓ "}
.mesa-nova{display:flex;flex-direction:column;gap:2px;text-align:left;background:color-mix(in srgb,var(--h-terra) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--h-terra) 40%,var(--line));border-radius:16px;padding:12px 14px}
.mesa-nova .eyebrow{color:var(--h-terra)}
.mesa-nova b{font-family:var(--display);font-size:19px}
.mesa-nova span{color:var(--muted);font-size:14.5px;line-height:1.4}
.mesas{display:flex;flex-direction:column;gap:8px;background:var(--h-surface);border:1px solid var(--h-line);border-radius:18px;padding:14px 14px 6px}
.mesas-head h3{font-family:var(--h-display);font-size:22px;margin:2px 0 4px;color:var(--h-ink)}
.mesas-head p{margin:0;font-size:14px;line-height:1.45;color:var(--h-muted)}
.mesas ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mesas li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--h-line)}
.ms-n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--h-display);font-weight:700;font-size:15px;
  color:var(--h-terra);border:1.5px solid color-mix(in srgb,var(--h-terra) 60%,transparent);background:color-mix(in srgb,var(--h-terra) 8%,var(--h-surface))}
.ms-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ms-t b{font-size:15px;line-height:1.25;color:var(--h-ink)}
.ms-t small{font-size:12.5px;line-height:1.35;color:var(--h-muted)}
.mesas .sec-h{min-width:0;padding-inline:14px;flex:none}
.micro-txt{margin:10px 0 0;font-size:17px;line-height:1.55}
.mesa-micro + .cta{margin-top:18px}
.prever{grid-template-columns:1fr 1fr}
.prever .opt{flex-direction:column;justify-content:center;text-align:center;gap:4px;font-size:16px;font-weight:700;min-height:64px}
.prever .opt.right::after,.prever .opt.wrong::after{margin:0}
dl.tres{margin:6px 0 12px;display:flex;flex-direction:column;gap:8px}
dl.tres div{display:flex;flex-direction:column;gap:1px}
dl.tres dt{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
dl.tres dd{margin:0;line-height:1.45;font-size:15px}
.fb-txt{margin:6px 0 12px;line-height:1.5;font-size:15.5px}
/* aula: a rolha de sommelier e professora, ao lado da lousa */
.aula{display:flex;align-items:center;gap:12px;margin:18px 0 12px;padding:0 4px}
.aula-ms{flex-direction:row-reverse}
.aula .m-aula{flex:none;width:clamp(124px,38vw,156px)}
.aula .m-aula img{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 6px rgba(50,25,15,.25))}
.aula .m-aula .mk{animation:aula-ensina 2.6s ease-in-out infinite;transform-origin:50% 100%}
.lousa{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  margin:22px 0;padding:10px 10px 12px;border-radius:10px;color:#F4EFE3;
  background:radial-gradient(circle at 30% 25%, #3F5A48, #27392E 70%);border:6px solid #8A5A2E;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), 0 10px 22px -16px rgba(40,20,10,.8)}
.lousa svg{width:min(64px,46%);height:auto;opacity:.92}
.lousa b{font-family:var(--h-display);font-style:italic;font-weight:600;font-size:clamp(22px,6.4vw,28px);line-height:1.05;text-align:center;letter-spacing:.01em}
.lousa-giz{margin-top:4px;padding-top:6px;border-top:1.5px dashed rgba(244,239,227,.45);font-size:clamp(13.5px,3.9vw,15.5px);font-weight:700;line-height:1.25;text-align:center;letter-spacing:.01em}
.bubble.mesa-micro{margin-top:4px}
.mesa-micro + .cta{margin-top:18px}
@keyframes aula-ensina{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg) translateY(-2px)}}
@media (prefers-reduced-motion: reduce){ .aula .m-aula .mk{animation:none} }
.bubble.mesa-micro .qlabel{min-height:0;padding-right:0}
.bubble.mesa-micro .micro-txt{margin-top:4px}
.mascot.somm .mk{position:relative}
.stage .mascot.somm{width:62px;top:-48px}
.end .mascot.somm{width:120px}
.bubble.mesa-micro:before{display:none}
/* Uva ligada à sala (15 out 2026): situações com a rolha sommelier e linha "Na sala" nas explicações */
.uva-q.sit .bubble{border-color:color-mix(in srgb,var(--h-terra) 45%,var(--line))}
.uva-q.sit .eyebrow{color:var(--h-terra)}
.na-sala{display:flex;flex-direction:column;gap:2px;padding-top:8px;border-top:1px dashed color-mix(in srgb,currentColor 25%,transparent)}
.na-sala p,.na-sala dd{margin:0;line-height:1.45;font-size:15px}
.ns-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--h-terra)}
.ns-tag img{width:22px;height:22px;border-radius:50%;object-fit:cover;object-position:50% 8%;background:var(--surface);border:1px solid var(--line)}
dl.tres .na-sala dt{opacity:1}
/* ideia-chave por cima da explicação (17 out 2026) */
.chave{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--h-terra) 10%,transparent);
  font-weight:700;font-size:17px;line-height:1.35}
.chave span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--h-terra);margin-bottom:2px}

/* ===== Cabeçalho de wine bar (13 out 2026): ameixa muito escuro, logo rosa, "to" sobre pincelada azul ===== */
.topo{--t-bg:#1D131B;--t-pink:#EBA6CF;--t-blue:#D9283C;--t-cream:#FBF3E6;--t-mauve:#D9B9D9;--t-line:rgba(251,243,230,.17);
  position:relative;display:flex;flex-direction:column;gap:clamp(22px,6vw,34px);
  margin:-20px calc(50% - 50vw) 0;padding:20px max(16px, calc(50vw - 50% + 0px)) 30px;background:var(--t-bg);color:var(--t-cream);border-radius:0 0 28px 28px}
@media (min-width:513px){ .topo{margin:0;border-radius:28px;padding:22px 24px 32px} }
.topo.volta{padding-top:14px;padding-bottom:16px;gap:12px;border-radius:0}
.topo.volta .entrada{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:2px 12px}
.topo.volta .logo{font-size:clamp(28px,8.4vw,36px)}
.topo.volta .slogan-h{margin:0;font-size:15px;color:var(--t-mauve);font-weight:600}
@media (min-width:513px){ .topo.volta{border-radius:22px;padding:16px 22px 18px} }
.topo .h-stats{gap:10px}
.topo .h-stat{background:rgba(251,243,230,.04);border:1.5px solid var(--t-line);color:var(--t-cream);padding:7px 15px 7px 11px}
@media (max-width:400px){ .topo .h-stats{gap:6px} .topo .h-stat{padding:6px 10px 6px 8px} .topo .lang-h{padding:0 6px} .topo .lang-h .lang-ic{display:none} }
@media (max-width:340px){ .topo .h-stat small{display:none} }
.topo .h-stat b{font-family:var(--h-body);font-weight:800;font-size:19px}
.topo .h-stat small{color:color-mix(in srgb,var(--t-cream) 72%,transparent)}
.topo .ic-glass{color:#E2606F}.topo .ic-grape{color:var(--t-pink)}
.topo .h-stats .snd{background:rgba(251,243,230,.04);border:1.5px solid var(--t-line);color:var(--t-cream);border-radius:14px;min-width:46px;min-height:44px}
.topo button:focus-visible,.topo .snd:focus-visible{outline:3px solid var(--t-pink);outline-offset:3px}
.topo .entrada{display:flex;flex-direction:column;gap:0;padding:0}
.topo .logo{display:inline-flex;align-items:baseline;flex-wrap:nowrap;white-space:nowrap;gap:.16em;margin:0;
  font-family:var(--h-display);font-weight:800;font-size:clamp(34px,12.8vw,62px);line-height:1;letter-spacing:-.025em;color:var(--t-pink);
  font-variation-settings:"SOFT" 100,"WONK" 0,"opsz" 144}
.topo .logo span{display:inline-block}
.topo .logo-to{position:relative;display:inline-block;font-style:italic;font-weight:700;color:var(--t-pink);padding:0 .14em;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144;isolation:isolate}
.logo-to span{position:relative;z-index:1}
.logo-pincel{position:absolute;z-index:0;left:-.06em;right:-.08em;top:.22em;bottom:-.06em;width:calc(100% + .14em);height:.86em;transform:rotate(-5deg);fill:var(--t-blue)}
.logo-brilho{width:.36em;height:.36em;align-self:flex-start;margin:.02em 0 0 -.02em;fill:var(--t-blue);flex:none}
.topo .slogan-h{margin:.3em 0 0;font-family:var(--h-body);font-style:normal;font-weight:700;font-size:clamp(17px,4.8vw,22px);line-height:1.2;color:var(--t-cream)}
.topo .hook-h{margin:clamp(20px,5.4vw,30px) 0 0;font-family:var(--h-body);font-weight:800;font-size:clamp(24px,7vw,34px);line-height:1.12;letter-spacing:-.01em;color:var(--t-cream);text-wrap:balance}
.topo .lede-h{margin:10px 0 0;max-width:42ch;font-family:var(--h-body);font-size:clamp(16px,4.3vw,18px);line-height:1.5;color:var(--t-mauve)}
.gtk-home.novo > .cta-bloco{margin-top:2px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .topo{box-shadow:0 0 0 1px rgba(251,243,230,.08)} }
:root[data-theme="dark"] .topo{box-shadow:0 0 0 1px rgba(251,243,230,.08)}

/* capa: página de entrada inteira, sem pontinhos e sem cortes */
.capa{position:fixed;inset:0;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#1D131B;font-family:var(--h-body)}
.capa .topo.capa-in{margin:0 auto;max-width:520px;min-height:100%;border-radius:0;box-shadow:none;
  padding:calc(18px + env(safe-area-inset-top, 0px)) 20px calc(18px + env(safe-area-inset-bottom, 0px));gap:0}
.capa .entrada{flex:1;justify-content:center;padding:clamp(28px,7vh,64px) 0}
.capa .logo{font-size:clamp(34px,12.6vw,66px)}
.capa-acoes{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.capa-cta{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:16px;border:0;cursor:pointer;
  background:var(--t-pink);color:#2A1222;font-family:var(--h-body);font-weight:800;font-size:19px;box-shadow:0 14px 30px -18px var(--t-pink)}
.capa-cta svg{width:20px;height:20px}
.capa-cta:active{transform:translateY(1px) scale(.99)}
.capa-link{background:none;border:0;color:var(--t-cream);font:inherit;font-weight:700;font-size:15.5px;padding:12px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(251,243,230,.35)}
.capa-fine{margin:4px 0 0;text-align:center;font-size:12.5px;color:rgba(251,243,230,.55)}
.capa button:focus-visible{outline:3px solid var(--t-pink);outline-offset:3px}

/* Repertório (13 out 2026): separado da progressão, conta perguntas diferentes */
.repert{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.repert>div:first-child{grid-column:1/-1;flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.repert>div{background:var(--h-surface);border:1.5px solid var(--h-line);border-radius:14px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:3px;min-width:0}
.repert b{font-family:var(--display);font-size:clamp(17px,5vw,21px);font-weight:800;color:var(--h-plum);line-height:1.1;font-variant-numeric:tabular-nums}
.repert b span{font-size:.62em;font-weight:600;color:var(--h-muted)}
.repert small{font-size:12px;line-height:1.3;color:var(--h-muted)}
.card .repert{margin-top:6px}
/* Pistas no fim da mesa */
.pistas{background:var(--h-surface);border:1.5px solid var(--h-line);border-radius:16px;padding:12px 14px;text-align:left}
.pistas h3{font-family:var(--display);font-size:15px;margin:0 0 6px}
.pistas ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pistas li{display:flex;gap:8px;flex-wrap:wrap;font-size:14.5px;line-height:1.35}
.pistas li b{color:var(--h-plum)}
.pistas li span{color:var(--h-muted)}
/* Telemóvel (13 out 2026): alvos de toque de 44 px e letra mínima de 12 px nas placas */
.hud .close{min-width:44px;min-height:44px}
.hud .snd{width:44px;height:44px}
.pl-t small,.pl-num,.pl-fita,.cx-lbl,.trofeu small,dl.tres dt{font-size:12px}
@container (max-width: 330px){ .cx-lbl{font-size:11px} .trofeu small{font-size:11px} }



/* ---------- Fase 2 · A Vinha (17 out 2026): separador de fases, encosta em socalcos, lição do ano da videira ---------- */
:root{--rio:#9DBDBE;--rio-luz:#E9F1EA;--muro:#A7957A;--muro-hi:#D8CAB0;--terr:#BCC983;--terr2:#B1C07A;--barco:#5A3A22;--vela:#F6EEDF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--rio:#566F78;--rio-luz:#8EA6A8;--muro:#6C604F;--muro-hi:#8C7F69;--terr:#8B9763;--terr2:#808C5A;--barco:#3E2A1A;--vela:#DCCFBC}}
:root[data-theme="dark"]{--rio:#566F78;--rio-luz:#8EA6A8;--muro:#6C604F;--muro-hi:#8C7F69;--terr:#8B9763;--terr2:#808C5A;--barco:#3E2A1A;--vela:#DCCFBC}
.cena-svg .terr{fill:var(--terr)}.cena-svg .terr2{fill:var(--terr2)}
.cena-svg .muro{fill:none;stroke:var(--muro);stroke-width:3.2;stroke-linejoin:round}

cruzado dá brancos com estrutura e capacidade de guarda.":"The Dão. Encruzado makes structured whites with ageing potential.","A Baga, tinta de taninos firmes e muita acidez, é típica de…":"Baga, a black grape with firm tannins and high acidity, is typical of…","Madeira":"Madeira","A Bairrada. A Baga também dá bons espumantes à região.":"Bairrada. Baga also gives the region fine sparkling wines.","O vinho de talha, fermentado em grandes jarras de barro, é tradição de…":"Talha wine, fermented in large clay jars, is a tradition of…","Açores":"Açores","O Alentejo, onde a técnica vem desde os romanos e continua viva.":"The Alentejo, where the technique dates back to the Romans and is still alive.","Que vinho fortificado português vem de uma ilha do Atlântico?":"Which Portuguese fortified wine comes from an Atlantic island?","Moscatel de Setúbal":"Moscatel de Setúbal","Carcavelos":"Carcavelos","O Madeira. Aguenta calor e oxigénio como poucos vinhos e, depois de aberto, dura muito mais do que a maioria.":"Madeira. It withstands heat and oxygen like few other wines and, once opened, lasts far longer than most.","Bucelas, perto de Lisboa, é famosa pelos brancos de qual casta?":"Bucelas, near Lisbon, is famous for whites made from which grape?","Loureiro":"Loureiro","Antão Vaz":"Antão Vaz","O Arinto, uma casta de acidez alta que mantém o vinho fresco mesmo em anos quentes.":"Arinto, a high-acid grape that keeps the wine fresh even in hot years.","Um vinho \"corked\" (com defeito de rolha) costuma cheirar a…":"A \"corked\" wine (with cork taint) usually smells of…","Frutos vermelhos":"Red fruit","Cartão molhado ou cave húmida":"Wet cardboard or a damp cellar","Baunilha":"Vanilla","Flores brancas":"White flowers","Cartão molhado ou cave húmida. É o defeito que dá nome ao nosso \"Corked!\". Nesse caso, pede-se outra garrafa.":"Wet cardboard or a damp cellar. It's the fault behind our very own \"Corked!\". If it happens, ask for another bottle.","Oh yeah! That was GRAPE TO KNOW!":"Oh yeah! That was GRAPE TO KNOW!","Grape job!":"Grape job!","Spot on!":"Spot on!","Cheers to that!":"Cheers to that!","Look at you, sommelier!":"Look at you, sommelier!","Corked! Lê a explicação e segue.":"Corked! Read the explanation and move on.","Corked! A próxima é tua.":"Corked! The next one's yours.","Corked! Next one is yours.":"Corked! Next one is yours.","Rolha em estágio":"Cork in training","Provador curioso":"Curious taster","Sommelier de bancada":"Armchair sommelier","Mestre das castas":"Master of varieties","Grape to Know total":"Totally Grape to Know","style=\"pointer-events:none\"":"style=\"pointer-events:none\"","Um bago inteiro com pruína e um bago cortado ao meio, presos ao engaço":"A whole berry with bloom and a berry cut in half, attached to the stem","GRAPE TO KNOW":"GRAPE TO KNOW","Ms. Cork":"Ms. Cork","Mr. Cork":"Mr. Cork","Desligar o som":"Turn sound off","Ligar o som":"Turn sound on","Som ligado":"Sound on","Som desligado":"Sound off","Novo":"New","Em breve":"Coming soon","Jogar":"Play","{1} bagos de vida":"{1} grapes left","Película":"Skin","A pele do bago. Guarda a cor (nas uvas tintas), os taninos e muitos aromas. O vinho tinto é tinto porque fermenta com as películas.":"The berry's skin. It holds the colour (in black grapes), the tannins and many aromas. Red wine is red because it ferments with the skins.","Polpa":"Pulp","A parte suculenta: água, açúcar e ácidos. Na maioria das castas é clara, mesmo nas tintas. Na fermentação, o açúcar vira álcool.":"The juicy part: water, sugar and acids. In most varieties it's pale, even in black grapes. During fermentation, the sugar turns into alcohol.","Grainhas":"Pips","As sementes. Têm taninos mais amargos e óleos, por isso a uva é prensada com cuidado para não as partir.":"The seeds. They hold harsher, more bitter tannins and oils, so grapes are pressed gently to avoid crushing them.","Engaço":"Stem","O \"esqueleto\" do cacho, que segura os bagos. Tem taninos verdes, por isso muitas vezes é retirado antes de fermentar: o desengace.":"The bunch's \"skeleton\", holding the berries. It has green tannins, so it is often removed before fermentation: destemming.","Pruína":"Bloom","A camada cerosa e esbranquiçada sobre a película. Ajuda a proteger o bago e pode transportar leveduras.":"The waxy, whitish layer on the skin. It helps protect the berry and can carry yeasts.","Toca na parte que dá a cor ao vinho tinto.":"Tap the part that gives red wine its colour.","Onde estão a água, o açúcar e os ácidos?":"Where are the water, sugar and acids?","Que parte tem os taninos mais amargos?":"Which part has the most bitter tannins?","Toca na camada cerosa e esbranquiçada.":"Tap the waxy, whitish layer.","E agora: o esqueleto que segura o cacho?":"And now: the skeleton that holds the bunch?","Cor, taninos e aromas":"Colour, tannins and aromas","Água, açúcar e ácidos":"Water, sugar and acids","Taninos amargos e óleos":"Bitter tannins and oils","O esqueleto do cacho":"The bunch's skeleton","Camada cerosa e esbranquiçada que cobre o bago":"Waxy, whitish layer covering the berry","A pele do bago: cor, taninos e aromas":"The berry's skin: colour, tannins and aromas","Parte suculenta: água, açúcar e ácidos":"Juicy part: water, sugar and acids","O esqueleto do cacho (o Ç escreve-se C)":"The bunch's skeleton (write Ç as C)","A semente do bago, de taninos amargos":"The berry's seed, with bitter tannins","Talhão 1 ·":"Plot 1 ·","O bago por dentro":"Inside the berry","kg de uva":"kg of grapes","Voltar à vinha":"Back to the vineyard","Progresso":"Progress","Toca em cada parte do bago e descobre o que faz. Depois, vem o teste.":"Tap each part of the berry and find out what it does. Then comes the test.","Descobre as 5 partes ({1}/5)":"Discover all 5 parts ({1}/5)","Já sei, testa-me!":"Got it, test me!","Toca no desenho · {1} de {2}":"Tap the drawing · {1} of {2}","Ver resultado":"See result","Continuar":"Continue","Liga as peças":"Match them up","Toca numa parte e depois na sua funçã re close to the top: {2} more for a perfect round.","{1} kg colhidos. Revê onde falhaste e volta: cada ronda afina o palato.":"{1} kg harvested. Check where you slipped and come back: every round sharpens the palate.","That was GRAPE TO KNOW!":"That was GRAPE TO KNOW!","Boa ronda!":"Good round!","Defender o título":"Defend the title","Bater o meu recorde":"Beat my record","Desafio Portugal{3}":"Portugal Challenge{3}","Lição":"Lesson","Ruby":"Ruby","Nível 1":"Level 1","Tawny":"Tawny","Nível 2":"Level 2","Vintage":"Vintage","Nível 3":"Level 3","Sal e Acidez":"Salt and Acidity","3 · Tawny":"3 · Tawny","Concluída":"Completed","Em curso":"In progress","Disponível":"Available","Por abrir":"Locked","Troféu da fase":"Phase trophy","já colhido":"already harvested","pronto a colher":"ready to harvest","abre depois de":"opens after","Caixote da vindima, {6} kg: {7}":"Harvest crate, {6} kg: {7}","ganha-se ao superar o Vintage":"won by clearing Vintage","Troféu da fase: {4}":"Phase trophy: {4}",", próximo passo":", next step","{3}, a tua guia":"{3}, your guide","Etapa 1 de 4 · Lição":"Stage 1 of 4 · Lesson","Toca em cada parte do bago e descobre o que faz: película, polpa, grainhas e mais. Depois, testa o que aprendeste.":"Tap each part of the berry and find out what it does: skin, pulp, pips and more. Then test what you've learnt.","Etapa {1} de 4 · Ronda do nível {2}":"Stage {1} of 4 · Level {2} round","abrir o {1}":"unlock {1}","superar o desafio avançado":"clear the advanced challenge","Rondas de {1} perguntas no nível {2}, com 2 situações de sala. Acerta {3} para {4}.":"Rounds of {1} questions at {2} level, with 2 on-the-floor scenarios. Get {3} right to {4}.","Melhor ronda:":"Best round:","Serviço de harmonização":"Food pairing service","Prova como o sal e a acidez do prato mudam o vinho. Não tranca o Tawny: podes jogá-la quando quiseres.":"See how salt and acidity in a dish change the wine. It doesn't lock Tawny: play it whenever you like.","Melhor resultado:":"Best score
