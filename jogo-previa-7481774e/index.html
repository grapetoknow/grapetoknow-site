 el color está solo en el hollejo y el mosto sale claro. La Alicante Bouschet es tintorera: tiene pulpa tinta.","Prepara al cliente: estos tintos tienden a ser intensos en color y en boca."],"fonte":"https://en.wikipedia.org/wiki/Alicante_Bouschet"}],"temas":{"bago":"La baya por dentro","composicao":"Qué hay dentro de la uva","especies":"Especies, variedades y clones","castas":"Variedades portuguesas","aromas":"Aromas de la uva","sala":"En sala"},"mesa":1,"num":1}};window.FASE_VINHA_I18N={"en":{"fase":"vinha","num":2,"titulo":"The Vineyard","mesa":2,"versao":"2026-10-17 v1: 31 perguntas de planta vindas da Uva + 55 novas (teoria e situações de sala). Revistas a 17 out 2026 contra os slides WSET 3 (sessão 2): sem erros; 4 explicações afinadas; as que têm fonte foram confirmadas. Factos de regiões portuguesas que os slides não cobrem ficam por confirmar pela autora.","niveis":[{"n":1,"id":"iniciante","nome":"Beginner","alcunha":"Ruby"},{"n":2,"id":"intermedio","nome":"Intermediate","alcunha":"Tawny"},{"n":3,"id":"avancado","nome":"Advanced","alcunha":"Vintage"}],"regra":{"perguntas_por_ronda":8,"bagos":3,"sobe_com_erros_ate":1,"fica_com_erros":2,"desce_com_erros":3,"erradas_por_ronda_max":3,"nota_rever":"Perguntas com \"rever\": true ficam guardadas mas fora das rondas até serem confirmadas.","situacoes_por_ronda":2},"temas":{"videira":"The vine","ciclo":"The vine's year","clima":"Climate and weather","solo":"Soil and landscape","viticultura":"Work in the vineyard","filoxera":"Phylloxera and grafting","vinhas-velhas":"Old vines","doencas":"Diseases and hazards","sala":"On the floor"},"licao":{"titulo":"The vine's year","fases":[{"id":"abrolhamento","t":"Budburst","m":"March and April","d":"The vine wakes up: buds swell, open and push out the first shoots. So tender that a frost can burn them."},{"id":"floracao","t":"Flowering","m":"May and June","d":"Tiny green flowers appear on the future bunches. The vine pollinates itself, but rain or cold can spoil fruit set."},{"id":"vingamento","t":"Fruit set","m":"June","d":"Fertilised flowers become hard green berries. The ones that don't set drop off."},{"id":"pintor","t":"Véraison","m":"July and August","d":"Berries soften and change outfit: black grapes colour up, white grapes turn translucent."},{"id":"maturacao","t":"Ripening","m":"August to October","d":"Berries fill up with sugar and lose acidity. Tannins and aromas ripen along the way."},{"id":"vindima","t":"Harvest","m":"August to October","d":"Picking time! Grapes come in when they reach the point the wine style calls for."},{"id":"queda","t":"Leaf fall","m":"October and November","d":"Before its leaves drop, the vine stores reserves in its wood and roots. Its pantry for the winter."},{"id":"repouso","t":"Dormancy","m":"December to February","d":"The vine sleeps, bare of leaves, saving energy. Time for the main pruning."}],"quando":[{"q":"The berries soften and change colour.","a":"pintor"},{"q":"The main pruning is done, with the vine bare of leaves.","a":"repouso"},{"q":"The buds open and the first shoots appear.","a":"abrolhamento"},{"q":"Fertilised flowers become hard green berries.","a":"vingamento"},{"q":"Brand-new shoots are at risk from frost.","a":"abrolhamento"},{"q":"The berries have already changed colour and keep gaining sugar.","a":"maturacao"}]},"perguntas":[{"id":"vinha-1-01","nivel":1,"tipo":"escolha","q":"What do we call the process in which leaves make sugar from sunlight?","o":["Photosynthesis","Respiration","Transpiration","Cane ripening"],"a":0,"e":"Leaves are the vine's kitchen: with light, water and carbon dioxide from the air, they make sugar. Some of it travels to the berries.","tema":"videira","origem":"uva-1-06","k":"Photosynthesis: leaves cook up sugar with sunlight."},{"id":"vinha-1-02","nivel":1,"tipo":"vf","q":"The vine flower is large and showy, like an apple blossom.","a":false,"e":"False: the flowers are small and greenish, grouped in little clusters. They're easy to miss, but they're where the berries come from.","tema":"videira","origem":"uva-1-13","k":"Vine flowers: tiny, green and discreet."},{"id":"vinha-1-03","nivel":1,"tipo":"escolha","q":"Tendrils and bunches grow from the same kind of organ. So a tendril can sometimes…","o":["Bear a few berries","Turn into a root","Drop in winter and regrow in the same spot","Turn into a cane"],"a":0,"e":"Tendrils and bunches grow from the same place on the shoot. Sometimes a tendril stops halfway and bears a few berries.","tema":"videira","sala":"More sugar in the grape tends to mean more alcohol in the wine, if fermentation runs all the way.","origem":"uva-1-14","k":"Tendril and bunch: cousins with the same origin."},{"id":"vinha-1-04","nivel":1,"tema":"videira","tipo":"escolha","q":"The vine's trunk has another name too. Which one?","o":["Stock","Stem","Berry","Bud"],"a":0,"e":"In Portuguese, cepa also means the vine itself: 'uma cepa velha' is an old vine. Don't mix it up with rootstock, the grafted root part. One word, two jobs.","sala":"You'll hear 'cepas velhas' and 'vinhas velhas' (old vines) on labels and in conversation with guests.","origem":"uva-1-16","k":"Stock (cepa): the trunk, and often the whole vine."},{"id":"vinha-1-05","nivel":1,"tema":"videira","tipo":"escolha","q":"Which part carries water from the roots to the leaves and bunches?","o":["The trunk","The tendrils","The pips","The bloom"],"a":0,"e":"Sap travels up the trunk, through the arms and out to the shoots and leaves, like water through pipes. Except these pipes are alive, and they grow.","origem":"uva-1-22","k":"The trunk: the vine's living plumbing.","rever":true},{"id":"vinha-1-06","nivel":1,"tema":"videira","tipo":"vf","q":"A vine can live for more than 100 years.","a":true,"e":"With age, they tend to give less fruit. But age alone doesn't guarantee a better wine: variety, soil, climate and vineyard care all count too.","sala":"'Vinhas Velhas' (old vines) on a label tells you the age of the vines. On its own, it doesn't guarantee a better wine.","origem":"uva-1-23","k":"Some vines pass 100 and still bear grapes."},{"id":"vinha-1-07","nivel":1,"tema":"videira","tipo":"escolha","q":"What are tendrils for?","o":["Attaching the vine to a support","Storing water for summer","Shielding the bunches from the sun","Holding the leaves on the shoot"],"a":0,"e":"They form as the shoot grows and curl around a wire, stake or tree as soon as they touch it. That's how the vine climbs towards the light.","origem":"uva-1-30","k":"Tendrils: the little hands the vine climbs with."},{"id":"vinha-1-08","nivel":1,"tipo":"escolha","tema":"ciclo","q":"In which season is the main pruning done?","o":["In winter","In spring","In summer","During harvest"],"a":0,"e":"With no leaves, you can see the plant clearly. Pruning decides how many buds stay and so how much fruit the vine will try to ripen. Summer brings lighter pruning of the green parts.","sala":"A vineyard pruned in winter looks dead. It isn't: it's resting.","fonte":"WSET Nível 3, sessão 2 (slides): poda de inverno e de verão","k":"Main pruning: in winter, while the vine sleeps."},{"id":"vinha-1-09","nivel":1,"tipo":"escolha","tema":"ciclo","q":"The buds open and the first shoots appear. What's this moment called?","o":["Budburst","Véraison","Cane ripening","Harvest"],"a":0,"e":"In Portugal (where it's called abrolhamento) it usually happens between March and April. The shoots are still very tender, and a frost now can burn them.","k":"Budburst: the vine wakes up and opens its buds."},{"id":"vinha-1-10","nivel":1,"tipo":"escolha","tema":"ciclo","q":"The berries soften and change colour. What stage is the grape at?","o":["Véraison","Flowering","Dormancy","Budburst"],"a":0,"e":"In Portuguese it's called pintor, 'the painter'. Black grapes gain colour and white grapes turn more translucent. From here on, sugar starts climbing fast.","sala":"Visitors to a vineyard in August sometimes see bunches half green, half purple: véraison caught halfway.","k":"Véraison: the grapes soften and change outfit."},{"id":"vinha-1-11","nivel":1,"tipo":"vf","tema":"ciclo","q":"The vine flowers before it bears grapes.","a":true,"e":"The flowers are small and green, easy to miss. In Portugal, flowering usually falls between May and June.","k":"First flowers, then berries: each set flower, one berry.","rever":true},{"id":"vinha-1-12","nivel":1,"tipo":"escolha","tema":"ciclo","q":"In Portugal, when does the harvest mostly happen?","o":["Between August and October","Between June and July","Between October and December","Only in September"],"a":0,"e":"It kicks off in August in the warmest areas and for sparkling-wine grapes. In cooler areas, or with late-ripening varieties, it can run into October.","k":"Harvest in Portugal: August to October."},{"id":"vinha-1-13","nivel":1,"tipo":"escolha","tema":"clima","q":"What does the vine need to ripen its grapes?","o":["Warmth and sunlight","Very fertile, rich soil","Lots of water in summer","Lots of shade from the leaves"],"a":0,"e":"Light powers photosynthesis and warmth gets the plant working. Below about 10 °C, the vine barely grows.","sala":"More sun and warmth tend to give riper grapes: more sugar, more alcohol in the wine and riper fruit.","fonte":"WSET Nível 3, sessão 2 (slides): o que a videira precisa (calor, luz, água)","k":"Light and warmth: the fuel for ripening."},{"id":"vinha-1-14","nivel":1,"tipo":"vf","tema":"solo","q":"In the Douro, \"patamares\" are modern terraces made of earth, with no stone walls.","a":true,"e":"True: patamares, built by machine since the 1970s, hold the soil with earth banks instead of schist walls. The old stone terraces have been a UNESCO World Heritage Site since 2001.","sala":"Socalcos on a label or in conversation means stepped vineyards, worked mostly by hand.","k":"Patamares: modern terraces with earth banks."},{"id":"vinha-1-15","nivel":1,"tipo":"escolha","tema":"solo","q":"Which rock rules the soils of the Douro?","o":["Schist","Sand","Limestone","Basalt"],"a":0,"e":"Roots go down through the cracks between the layers looking for water. There are also patches of granite in the region.","k":"Douro: schist, a rock that splits into sheets."},{"id":"vinha-1-16","nivel":1,"tipo":"escolha","tema":"clima","q":"Why is the Minho, home of Vinho Verde, so green?","o":["It rains a lot, thanks to the Atlantic","Its limestone soils hold water","The vines are watered all summer","Its winters bring lots of snow"],"a":0,"e":"Rain falls mostly in autumn and winter, making it one of Portugal's wettest regions. Great for the green, more work in the vineyard: extra humidity favours fungi.","sala":"A cool, damp climate helps explain the lively acidity of Minho whites.","k":"Minho: the Atlantic next door, rain never far."},{"id":"vinha-1-17","nivel":1,"tipo":"escolha","tema":"viticultura","q":"What do we call picking the grapes?","o":["Harvest","Pruning","Grafting","Layering"],"a":0,"e":"On the Douro terraces, many vineyards can only be picked by hand: machines can't reach where people can.","fonte":"WSET Nível 3, sessão 2 (slides): vindima manual e mecânica","k":"Harvest (vindima): the party, and the hard work, of picking.","rever":true},{"id":"vinha-1-18","nivel":1,"tipo":"escolha","tema":"clima","q":"A spring frost, just after budburst, can…","o":["Burn the new shoots and cut the crop","Delay the harvest a few weeks without losing fruit","Give smaller, sweeter, more concentrated berries","Affect only the grapes already ripe on the bunch"],"a":0,"e":"The vine can push out back-up shoots, but they usually carry less fruit. Low spots suffer most, because cold air sinks and sits there.","fonte":"WSET Nível 3, sessão 2 (slides): riscos de temperatura (geadas de primavera)","k":"Spring frost: tender shoots, crop at risk."},{"id":"vinha-1-19","nivel":1,"tipo":"escolha","tema":"viticultura","q":"What is pruning for?","o":["Choosing how many buds stay and controlling how much the vine produces","Remove the leaves that shade the bunches before harvest","Treat the vine against downy mildew and other fungal diseases","Always increase the number of bunches each vine produces"],"a":0,"e":"Each bud left can grow a shoot with bunches. Fewer buds tend to mean less fruit per vine. The secateurs also give the plant its shape.","fonte":"WSET Nível 3, sessão 2 (slides): poda e condução","k":"Pruning: deciding today how much fruit comes tomorrow."},{"id":"vinha-1-s01","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest reads \"vinhas em socalcos\" on a Douro red's label and asks what it means. What do you say?","o":["Vines planted on stepped terraces with stone walls","Vineyards by the river, naturally watered by winter floods","Vines planted among olive and almond trees","Grapes laid out to dry in the sun after harvest"],"a":0,"e":["It's a landscape word, not a cellar technique.","The Douro slopes are very steep: the steps make planting possible and hold the soil in place.","Tell them: \"It's the Douro's staircase vineyard, worked almost entirely by hand. The landscape is World Heritage.\""],"k":"Socalcos: stone-walled steps on the hillside."},{"id":"vinha-1-s02","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest sees \"Colheita 2024\" on a Dão white and asks what it means. What do you answer?","o":["It's the year the grapes were harvested","It's the year the vineyard was planted","It's the drink-by date","It's the year the wine was bottled"],"a":0,"e":["On a still wine, colheita is the vintage: at least 85% of the grapes come from that year.","Every year has its own weather, with more or less rain and heat, and that changes the grapes.","Tell them: \"The same wine from different years can taste different. That's part of the fun.\""],"k":"Colheita on the label: the harvest year."},{"id":"vinha-1-s03","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks why a Vinho Verde tends to be fresher and more acidic than an Alentejo white. What's the best explanation?","o":["The Minho is cooler and rainier; with less heat, the grapes keep more acidity","Vinho Verde is made from green grapes, picked before they ripen","In the Minho, acid is added to every wine by regional rule","The Minho's limestone soils give the grapes lots of acidity"],"a":0,"e":["The difference starts with each region's climate.","With more heat, grapes lose acidity faster as they ripen; in the cool, Atlantic Minho, they hold on to it.","Use the contrast to help them choose: more freshness, the Minho; a rounder white, the Alentejo."],"k":"Less heat, more acidity kept in the grape."},{"id":"vinha-1-s04","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A tourist wants to see the harvest in the Douro and asks which month to go. What do you suggest?","o":["September","July","November","June"],"a":0,"e":["In the Douro, the harvest is concentrated in September.","It can start in late August and run into October: it depends on the year's heat and the variety.","Tell them: \"Go in September, but check the dates close to your trip: they shift every year.\""],"k":"Douro harvest: bet on September."},{"id":"vinha-1-s05","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest reads \"Vinhas Velhas\" on a Douro red and asks: \"So the wine is old?\" What do you answer?","o":["No: it's the vines that are old, not the wine","Yes, the wine is over 30 years old","It's a wine made from raisins","It means the wine aged in an old cellar"],"a":0,"e":["\"Vinhas Velhas\" is about the age of the vines, not the wine.","Old vines tend to give less fruit and have deeper roots; the wine itself can be quite young.","Tell them it's a style clue, not a quality guarantee, and point to the vintage on the label."],"k":"Vinhas Velhas: old vines, not old wine."},{"id":"vinha-1-s06","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest says that in March she saw drops running from the pruning cuts in a vineyard. She asks if the plants were sick. What do you say?","o":["No: it's bleeding, sap rising as the vine wakes up","Yes, it's a sign of downy mildew, which strikes at this time","It's night dew that got in through the cuts","It's leftover winter spray dripping off"],"a":0,"e":["It's the vine \"bleeding\" (choro, \"crying\", in Portuguese): sap runs from the cuts at the end of winter.","As the soil warms, the roots start pushing sap up again; budburst is close.","Tell her: \"Don't worry, it means the vineyard is alive and about to burst into leaf.\""],"k":"Bleeding: the vine waking up, not falling ill."},{"id":"vinha-1-s07","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A tourist just back from Pico, in the Azores, asks why the vines there are surrounded by low walls of black stone. What do you explain?","o":["The currais shelter the vines from wind and sea salt and hold heat","They mark which grape variety is planted in each plot","They're ruins of old houses, abandoned after a volcanic eruption","They hold rainwater to irrigate the vines in summer"],"a":0,"e":["The walls are the currais, built from the island's volcanic stone.","They shelter the vines from Atlantic wind and sea spray, and the dark stone holds the day's heat.","Mention the landscape has been UNESCO World Heritage since 2004. A perfect cue for an Azores white."],"k":"Pico's currais: stone shelters against wind and sea."},{"id":"vinha-1-s08","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks for a red \"from a hot year\". What does that kind of year tend to change in the wine?","o":["Riper grapes: it tends to mean more alcohol and riper fruit, with less acidity","Less ripe grapes: it tends to give more acidity, less alcohol and greener fruit","Paler, lighter wine, because the sun burns off the grape's colour","Nothing much: the vintage barely changes the wine"],"a":0,"e":["Each year's weather changes how the grapes ripen.","With more heat, grapes tend to build more sugar and lose acidity faster; in fermentation, sugar becomes alcohol.","It's a tendency, not a promise: producer, site, how the year went and winemaking all count. Check that specific wine before recommending it."],"k":"Hot year: tends to mean more alcohol, less acidity."},{"id":"vinha-2-01","nivel":2,"tipo":"escolha","q":"The vine climbs by hanging on with little coiled threads. What are they called?","o":["Tendrils","Canes","Buds","Stems"],"a":0,"e":"They form as the shoot grows and coil round a support as soon as they touch one. Simple plan: grow, and grab hold along the way.","tema":"videira","origem":"uva-2-10","k":"Tendrils: the little hands the vine climbs with."},{"id":"vinha-2-02","nivel":2,"tipo":"escolha","q":"Between late summer and autumn, the season's shoots turn hard as wood. Now they're called…","o":["Canes","Roots","Arms","Tendrils"],"a":0,"e":"While they're green and tender, they're shoots. At winter pruning, many canes are cut back to steer the crop.","tema":"videira","origem":"uva-2-11","k":"Green shoot, brown cane: same branch, different age."},{"id":"vinha-2-03","nivel":2,"tipo":"escolha","q":"The little swellings that new shoots grow from are called…","o":["Buds","Pips","Berries","Tendrils"],"a":0,"e":"In spring they swell and open: that's budburst, the vine's yearly alarm clock.","tema":"videira","origem":"uva-2-12","k":"Buds: where next year's shoots are napping."},{"id":"vinha-2-04","nivel":2,"tipo":"escolha","q":"Besides drinking water, what are roots for?","o":["Anchoring the plant and storing reserves for winter","Carry out photosynthesis before the leaves appear","Produce the tannins that later travel up to the berries","Colour the grapes through minerals from the soil"],"a":0,"e":"They hold the plant in place and take up water and minerals. They store reserves too, but not alone: the vine's wood helps. The pantry is shared.","tema":"videira","origem":"uva-2-13","k":"Roots: anchor, straw and part of the pantry."},{"id":"vinha-2-05","nivel":2,"tipo":"escolha","q":"What is phylloxera?","o":["An insect that attacks the roots","A fungus that attacks the leaves","A wine fault in the bottle","An American grape variety"],"a":0,"e":"It's a cousin of aphids, and its root-dwelling form does serious damage to European vines (Vitis vinifera). That's why grafting onto resistant rootstocks changed viticulture.","tema":"filoxera","origem":"uva-2-14","k":"Phylloxera: a tiny insect that goes for the roots."},{"id":"vinha-2-06","nivel":2,"tipo":"escolha","q":"Where did phylloxera come from?","o":["North America","Asia","North Africa","Australia"],"a":0,"e":"It reached Europe in the 19th century, hidden in plant material. A stowaway nobody asked for.","tema":"filoxera","origem":"uva-2-15","k":"Phylloxera: from North America, uninvited."},{"id":"vinha-2-07","nivel":2,"tema":"videira","tipo":"escolha","q":"On a vine leaf, what's the broad, flat part called?","o":["Blade","Petiole","Vein","Tendril"],"a":0,"e":"The petiole is the little stalk that joins the blade to the shoot. Together, they make the leaf.","origem":"uva-2-25","k":"Blade: the broad part. Petiole: the little stalk."},{"id":"vinha-2-08","nivel":2,"tema":"videira","tipo":"escolha","q":"Why does leaf shape matter to people who study grape varieties?","o":["It helps identify the variety","It shows how much sugar the grape has","It shows whether the vineyard is irrigated","It shows how old the vine is"],"a":0,"e":"That's called ampelography. Today, looking at the leaf can be backed up by DNA analysis: magnifying glass and lab, a detective double act.","origem":"uva-2-26","k":"The leaf is the variety's ID card."},{"id":"vinha-2-09","nivel":2,"tema":"videira","tipo":"escolha","q":"The shoots that grow out beside the main shoot are called…","o":["Laterals","Tendrils","Arms","Roots"],"a":0,"e":"In Portuguese they're netas or feminelas. They can be removed to tidy the canopy and let air through, but that depends on the vigour and climate of each vineyard.","origem":"uva-2-27","k":"Laterals: the side shoots off the main shoot."},{"id":"vinha-2-10","nivel":2,"tema":"videira","tipo":"escolha","q":"New growth that's still green and tender is called a…","o":["Shoot","Stem","Pedicel","Scion"],"a":0,"e":"Once it ripens and turns woody, it becomes a cane: summer clothes swapped for a winter coat.","origem":"uva-2-28","k":"Shoot (pâmpano): green and tender. Like this level!"},{"id":"vinha-2-11","nivel":2,"tema":"videira","tipo":"vf","q":"Most cultivated vines can pollinate their own flowers.","a":true,"e":"In most varieties, each flower has both male and female parts. Insects may drop by, but they generally aren't needed.","origem":"uva-2-30","k":"As a rule, the vine handles pollination on its own."},{"id":"vinha-2-12","nivel":2,"tipo":"escolha","tema":"ciclo","q":"What's the right order of the vine's year?","o":["Budburst, flowering, fruit set, véraison, harvest","Flowering, budburst, véraison, fruit set, harvest","Budburst, véraison, flowering, harvest, fruit set","Fruit set, flowering, budburst, harvest, véraison"],"a":0,"e":"Buds open, fertilised flowers become berries, berries change colour at véraison and ripen until harvest. Then the leaves drop and the vine rests.","k":"Wake up, bloom, set, change colour, get picked."},{"id":"vinha-2-13","nivel":2,"tipo":"escolha","tema":"ciclo","q":"What do we call the stage when fertilised flowers turn into small green berries?","o":["Fruit set","Véraison","Budburst","Cane ripening"],"a":0,"e":"It's normal for some flowers to drop. With rain, cold or wind at flowering, many more fall: that's poor fruit set (desavinho).","k":"Fruit set (vingamento): the fertilised flower becomes a berry."},{"id":"vinha-2-14","nivel":2,"tipo":"escolha","tema":"ciclo","q":"What is cane ripening (atempamento)?","o":["Green shoots turn woody and become canes","The grapes change colour and start to ripen","Winter pruning, which cuts back the old canes","The flowers are fertilised and become small berries"],"a":0,"e":"It runs from véraison into autumn: green shoots harden, turn wood-coloured and get through the winter.","fonte":"WSET Nível 3, sessão 2 (slides): partes lenhosas da videira (pâmpanos, vara)","k":"Cane ripening: the green shoot puts on a wooden coat."},{"id":"vinha-2-15","nivel":2,"tipo":"escolha","tema":"clima","q":"In the high vineyards of Beira Interior, warm days and cool nights help the grapes…","o":["Keep acidity and aromas as they ripen","Ripen faster and with more alcohol","Lose acidity during the night","Gain sugar mostly at night"],"a":0,"e":"That gap is called the diurnal range. By day, heat ripens the grapes; at night, the cool slows the loss of acidity and helps keep aromas.","sala":"\"High-altitude vineyard\" on a label is a freshness clue.","fonte":"WSET Nível 3, sessão 2 (slides): fatores do clima: altitude, amplitude térmica diária","k":"Warm days, cool nights: the grapes hang on to acidity."},{"id":"vinha-2-16","nivel":2,"tipo":"escolha","tema":"clima","q":"In the vineyard, what's the difference between climate and weather?","o":["Climate is the pattern over many years; weather is what happens each year","They're the same thing","Climate is winter; weather is summer","Weather is the pattern over many years; climate is what happens each day"],"a":0,"e":"Climate tells you what usually happens in a region; weather, what happened in a given year. A year's weather is one of the main reasons vintages of the same wine taste different.","k":"Climate is what you expect; weather is what you get."},{"id":"vinha-2-17","nivel":2,"tipo":"escolha","tema":"solo","q":"Why can Douro schist help the vine through a dry summer?","o":["Roots go down through cracks in the rock to water stored deep below","Schist heats up little in the sun and keeps the vineyard cool in summer","Schist is very fertile and feeds the vine plenty of nutrients","Schist holds rainwater at the surface, close to the roots"],"a":0,"e":"Schist splits into near-vertical plates. Roots work down the cracks, sometimes several metres, to water the summer hasn't dried up. Surface stones also hold heat.","k":"In schist, roots follow the cracks down to water."},{"id":"vinha-2-18","nivel":2,"tipo":"escolha","tema":"solo","q":"Which soil type dominates in Bairrada, home of Baga?","o":["Clay-limestone","Schist","Volcanic sand","Granite"],"a":0,"e":"There are some sandy patches too. Clay holds water: handy in dry summers, a burden in wet years.","sala":"In Bairrada, many growers talk about barro: the clay in these soils.","k":"Bairrada: clay and limestone, home sweet home for Baga."},{"id":"vinha-2-19","nivel":2,"tipo":"escolha","tema":"clima","q":"The Dão is ringed by mountains such as the Estrela and the Caramulo. What protection do they give?","o":["They shelter the vines from the full Atlantic and from dry inland winds","They shade every vineyard during the hottest hours","They bring more Atlantic rain and humidity to the vines","They warm the vines at night with warm air flowing down the hills"],"a":0,"e":"The ranges to the west hold back some Atlantic rain and wind; the Serra da Estrela shelters the inland side. The result: a more balanced region, with mostly granite soils.","fonte":"CCDR Centro, 'Conheça os vinhos DOP da região Centro: Dão' (serras e solos de granito)","k":"Dão: vineyards wrapped in a mountain hug."},{"id":"vinha-2-20","nivel":2,"tipo":"escolha","tema":"viticultura","q":"Many Alentejo vineyards use drip irrigation. Why is it useful there?","o":["Summers are hot and dry, and without water ripening can stall","To lower the grapes' acidity, which tends to be too high there","To raise the soil's acidity, which helps the vine grow","To protect the vines from frost, which is common in summer"],"a":0,"e":"When it's very thirsty, the vine closes the pores on its leaves and ripening can stop. Controlled watering prevents that; too much water means diluted grapes and too much leaf.","fonte":"WSET Nível 3, sessão 2 (slides): água: rega gota a gota, seca","k":"Drip irrigation: just enough water, no more, no less."},{"id":"vinha-2-21","nivel":2,"tipo":"escolha","tema":"viticultura","q":"In the Minho, traditional ramada (pergola) vineyards lift the vines well off the ground. What's the advantage in a damp region?","o":["More air around the bunches, which helps against fungi","More warmth from the soil reaching the bunches directly","Less pruning work, because the vine grows on its own","Sweeter grapes, even with little summer sun"],"a":0,"e":"Away from the damp ground and in more wind, bunches dry faster after rain. There was room for other crops underneath; today many vineyards use lower systems, such as cordon.","k":"Ramada: bunches up high, drying in the breeze."},{"id":"vinha-2-s01","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest tasted the same Alvarinho from two years in a row. They taste different, and he thinks one is faulty. What do you say?","o":["Listen, then taste: it may be the vintage, but first you rule out a fault","Assure him there's no fault, as different vintages always taste different","Agree that one of the two is spoiled and swap both bottles straight away","Explain that the producer changed variety, which is common between vintages"],"a":0,"e":["Wines from different years can taste different without any fault, but a fault is also possible.","Each year's weather changes the grapes. Tasting tells you whether it's the vintage talking or a fault, such as cork taint.","Tell him: \"Let me taste this one. If it's the vintage, I'll explain the difference; if there's a fault, I'll replace the bottle.\""],"k":"Different vintages can taste different. Taste before you decide."},{"id":"vinha-2-s02","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest has noticed that Douro Superior reds tend to be fuller and more alcoholic than those from Baixo Corgo. Why?","o":["The Douro Superior is hotter and drier, so the grapes build more sugar","Baixo Corgo is further from the river, so the grapes get less water","In the Douro Superior, grape spirit is added to DOC Douro reds","Baixo Corgo has granite soils, which give lighter wines"],"a":0,"e":["There are different climates within the Douro.","Baixo Corgo, to the west: cooler and wetter. Douro Superior, to the east: hotter and drier. More sugar tends to mean more alcohol.","Use it to fine-tune the pick. Tell them: \"For freshness, go Baixo Corgo; for power, Douro Superior.\""],"fonte":"WSET, blog 'Three Douro subregions that define Port' (2025): Baixo Corgo mais fresco e chuvoso, Douro Superior mais quente e seco","k":"Douro: cooler in the west, hotter in the east."},{"id":"vinha-2-s03","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks why the back label of this Dão red mentions vineyards at 500 metres. What do you say?","o":["Higher vineyards are cooler: grapes ripen more slowly and keep acidity","Altitude gives more sun and heat, so the wine has more alcohol","It's just to impress on the label: altitude doesn't change the wine","High vineyards need no treatments, so the wine is purer"],"a":0,"e":["Altitude is a freshness clue.","The higher you go, the cooler it gets, especially at night. Grapes ripen more slowly and keep more acidity.","Tell them: \"Expect a fresher, more tense red.\" Great for anyone who finds Dão reds heavy."],"k":"Higher means cooler: altitude helps keep acidity."},{"id":"vinha-2-s04","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks for a red \"with Atlantic influence\". Between a Lisboa red from vineyards near the sea and one from inland Alentejo, which tends to fit better?","o":["The Lisboa one, from vineyards exposed to cool sea air","The inland Alentejo one","They're the same","Neither: only whites can show Atlantic influence in the glass"],"a":0,"e":["The guest is after freshness from the sea.","Near the coast, Atlantic wind and cloud take the edge off the heat. Inland Alentejo has hotter, drier summers.","Pour the Lisboa red. Tell them: \"It's fresher and less ripe than an inland red.\""],"k":"Atlantic influence: the sea as air conditioning."},{"id":"vinha-2-s05","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest says April frost hit the family vineyard, but only at the bottom of the valley. The vines on the slope escaped. Why?","o":["Cold air is heavier and collects in low spots","The slope was planted with more cold-resistant varieties","It rains more in the valley","The valley vines were younger"],"a":0,"e":["Low-lying spots are the most exposed to frost.","On calm, clear nights, cold air flows down the slope like water and pools at the bottom of the valley.","Tell them: \"In a vineyard, the spot matters a lot.\" It's one reason planting sites are chosen carefully."],"k":"Cold air slides downhill and settles at the bottom."},{"id":"vinha-2-s06","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks whether an \"organic vineyard\" means no treatments at all. What do you answer?","o":["Yes: the vineyard gets no treatments at all, only pruning, thinning and hand-picking","No: it's treated, but copper and sulphur are banned for being chemicals","No: it's treated, but usually without synthetics; copper and sulphur are allowed","No: the vineyard is treated, but the wine can't contain any sulphites at all"],"a":2,"e":["Organic doesn't mean untreated, or sulphite-free.","As a rule, synthetic products are out. But copper, in limited doses, is allowed against downy mildew, and sulphur against powdery mildew.","Explain without overselling. Tell her: \"It's a way of farming, not a promise about flavour.\""],"fonte":"WSET Nível 3, sessão 2 (slides): práticas de viticultura (biológica)","k":"Organic: treatments yes, but as a rule nothing synthetic."},{"id":"vinha-2-s07","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest finds a Douro red from terraced vineyards expensive and asks why. What's the best argument?","o":["On narrow, steep terraces, almost all the work is done by hand","By law the wine must age longer just because it comes from terraces","Douro grapes are rare and the vines cost more to buy","Terraces get less sun, so the grapes take much longer to ripen"],"a":0,"e":["The cost starts in the vineyard.","On terraces, machines can barely get in. Pruning, spraying and harvest take many hours of hand work.","Tell the story of the landscape. The guest will see the price as effort, not whim."],"k":"Terraces: giant steps where machines can barely go."},{"id":"vinha-2-s08","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"At a tasting, a guest asks what \"south-facing vineyard\" means on a Douro red. What do you explain?","o":["It gets more sun and heat, and the grapes tend to ripen more","It gets less sun and gives greener, more acidic grapes","It's sheltered from the afternoon sun, the hottest of the day","It's more humid and less hot, like north-facing slopes"],"a":0,"e":["The slope's direction changes how much light the vineyard gets.","In the northern hemisphere, a south-facing slope catches more sun and warms up more. North-facing is cooler.","Use the clue to predict style: south tends to give riper reds; north, fresher wines."],"fonte":"WSET Nível 3, sessão 2 (slides): orientação e luz solar","k":"South-facing: more sun, grapes that tend to ripen more."},{"id":"vinha-3-01","nivel":3,"tipo":"escolha","q":"Why are American vine roots used?","o":["They stand up to phylloxera","They give the grapes more sugar","They give the wine a foxy aroma","They grow faster"],"a":0,"e":"Many American species evolved alongside phylloxera and learnt to cope with it. But there's no magic root: the right rootstock is chosen for each soil and variety.","tema":"filoxera","sala":"Almost all Portuguese vineyards are grafted, so 'pé-franco' (ungrafted) on a label is rare and worth telling the guest about.","origem":"uva-3-01","k":"American roots: the vine's shield against phylloxera."},{"id":"vinha-3-02","nivel":3,"tipo":"escolha","q":"On a grafted vine, what is the bottom part, with the American roots, called?","o":["Rootstock","Scion","Cane","Own-rooted vine"],"a":0,"e":"The rootstock supplies the roots; the scion, grafted on top, gives the variety we want. Two plants working together as one vine.","tema":"filoxera","origem":"uva-3-02","k":"Rootstock below, scion on top: a winning double act."},{"id":"vinha-3-03","nivel":3,"tipo":"escolha","q":"A vine that hasn't been grafted is called…","o":["Own-rooted (pé-franco)","Crowbar vine","Mother vine","Hybrid"],"a":0,"e":"With no grafting, roots and top are the same plant. All in the family, but without the American roots' protection against phylloxera.","tema":"filoxera","sala":"'Pé-franco' on a label means own-rooted vines, growing on their own roots without grafting.","origem":"uva-3-03","k":"Pé-franco: a vine on its very own roots."},{"id":"vinha-3-04","nivel":3,"tipo":"escolha","q":"Which Portuguese region escaped phylloxera thanks to its sandy soils?","o":["Colares","Douro","Dão","Alentejo"],"a":0,"e":"Phylloxera struggles to survive and spread in sand. That's why Colares still has vines that never needed grafting.","tema":"filoxera","sala":"Colares is one of the few places with old ungrafted (pé-franco) vines. It's a great story to share with guests.","origem":"uva-3-04","k":"Colares: the sand that shut phylloxera out."},{"id":"vinha-3-05","nivel":3,"tipo":"escolha","q":"When did phylloxera reach the Douro?","o":["Around 1868","Around 1700","Around 1950","Around 1756, under the Marquis of Pombal"],"a":0,"e":"It was identified around then and went on to wipe out many vineyards. Exact dates vary from place to place, but the 19th century was a real earthquake for vines.","tema":"filoxera","fonte":"Revista Povos e Culturas (UCP): filoxera notada pela primeira vez no Douro de 1868 para 1869","origem":"uva-3-15","k":"Phylloxera in the Douro: around 1868."},{"id":"vinha-3-06","nivel":3,"tema":"vinhas-velhas","tipo":"escolha","q":"As a vine gets older, what happens to its yield?","o":["It tends to give less fruit, often in smaller bunches and berries","It gives more and more fruit, as the roots reach deeper","It stops bearing fruit at 20 and has to be pulled up","It gives bigger, more diluted berries that make less flavourful wine"],"a":0,"e":"Many link this to more concentrated wines. But age alone doesn't guarantee quality: variety, soil, climate and care all count too.","origem":"uva-3-31","k":"Old vine: less fruit, smaller bunches and berries."},{"id":"vinha-3-07","nivel":3,"tema":"vinhas-velhas","tipo":"escolha","q":"What can help an old vine cope with drought better than a newly planted one?","o":["Well-established roots that explore more soil","Bigger, thicker leaves that use less water","Berries that store water for the roots","Age, all by itself"],"a":0,"e":"Over the years the roots explore more soil and, where it allows, reach deeper water. But with no water in reach, old vines suffer too.","origem":"uva-3-32","k":"An old vine's trump card lies underground."},{"id":"vinha-3-08","nivel":3,"tema":"vinhas-velhas","tipo":"escolha","q":"Many old vineyards in the Douro and Dão have mixed varieties. What does that mean?","o":["Several varieties planted in the same plot","A single variety, all from one clone","Vines planted among olive trees","Grapes bought from several growers in the region"],"a":0,"e":"Sometimes dozens of varieties grow side by side, traditionally picked and fermented together: a field blend. Mind you, \"old vines\" is about age, not mixing.","sala":"On an old-vine Douro red, 'castas misturadas' (mixed varieties) means several varieties planted and harvested together.","origem":"uva-3-33","k":"Mixed varieties: the blend starts in the vineyard."},{"id":"vinha-3-09","nivel":3,"tema":"vinhas-velhas","tipo":"escolha","q":"To fill a gap in the vineyard, part of a cane from the next vine is buried, still attached, until it roots. What's this called?","o":["Layering (mergulhia)","Grafting","Suckering","Tying down"],"a":0,"e":"The tip stays above ground and the link to the mother vine is kept. Once it roots, it can be cut free as a new vine of the same variety.","origem":"uva-3-34","k":"Layering: first it grows roots, then independence."},{"id":"vinha-3-10","nivel":3,"tema":"doencas","tipo":"escolha","q":"Which wood disease can make a mature vine suddenly collapse in high summer?","o":["Esca","Downy mildew","Powdery mildew","Phylloxera"],"a":0,"e":"Several fungi break down the vine's wood. It can creep slowly or strike fast: in apoplexy the leaves wilt and dry within days, and the vine may die.","origem":"uva-3-35","k":"Esca: fungi eating the vine from the inside."},{"id":"vinha-3-11","nivel":3,"tema":"doencas","tipo":"escolha","q":"Downy and powdery mildew, the two big leaf-and-bunch diseases, reached Europe…","o":["From North America, in the 19th century","From Asia, in the Middle Ages","From North Africa, in the early 20th century","They were always in Europe"],"a":0,"e":"Just like phylloxera: powdery mildew first, then downy. The European vine had few defences against them, which is why it still needs spraying today.","origem":"uva-3-36","k":"Mildews: unwelcome American visitors of the 1800s."},{"id":"vinha-3-12","nivel":3,"tema":"doencas","tipo":"escolha","q":"What is the active element in Bordeaux mixture, used against downy mildew for over a century?","o":["Copper","Sulphur","Iron","Calcium"],"a":0,"e":"It mixes copper sulphate, lime and water and protects the leaf from the outside. Sulphur is another story: the classic ally against powdery mildew.","origem":"uva-3-37","k":"Bordeaux mixture: copper. The blue on the leaves gives it away."},{"id":"vinha-3-13","nivel":3,"tema":"doencas","tipo":"escolha","q":"Baga, the Bairrada star, has tight bunches and can rot in some years. Which disease loves rain near harvest?","o":["Grey rot","Powdery mildew","Coulure","Esca"],"a":0,"e":"With lingering damp, it rots the berries, and tight bunches dry slowly. But on ripe grapes, with damp and dry spells taking turns, it can become noble rot, concentrating sugar.","fonte":"INIAV, ficha da casta Baga (cacho compacto; película de espessura média; sensível ao míldio e à podridão em certos anos)","sala":"A rainy spell close to harvest helps explain the differences between vintages of the same Baga red.","origem":"uva-3-38","k":"Botrytis: one fungus, either spoiler or sweet-wine maker."},{"id":"vinha-3-14","nivel":3,"tipo":"escolha","tema":"doencas","q":"Bad weather at flowering makes many flowers drop and the bunch ends up sparse. What's this called?","o":["Coulure (desavinho)","Millerandage","Downy mildew","Sunburn"],"a":0,"e":"Rain, cold or wind at flowering encourage it, and some varieties are more prone than others. Portuguese calls it desavinho. The upshot: fewer grapes.","k":"Coulure: flowers fail to set, the bunch goes bald."},{"id":"vinha-3-15","nivel":3,"tipo":"escolha","tema":"doencas","q":"What do you see in a bunch with millerandage?","o":["Normal berries mixed with small, seedless ones","Berries covered in a white powder, as if it were flour","Bunches with no berries, just the dry stem","Berries split open by the rain and starting to rot"],"a":0,"e":"Poorly fertilised flowers give small, seedless berries next to normal ones. Portuguese calls it bagoinha. Yield drops, but the little ones can concentrate flavour.","k":"Millerandage: a bunch of big and tiny berries."},{"id":"vinha-3-16","nivel":3,"tipo":"escolha","tema":"viticultura","q":"In green harvesting (cluster thinning), the grower…","o":["Cuts some bunches while still green so the vine ripens the rest better","Picks every bunch before véraison to make a fresher, lighter wine","Strips all the leaves so the bunches get more sun","Cuts the deepest roots so the vine gives less fruit"],"a":0,"e":"It's done between fruit set and véraison, so the energy goes to the bunches left. Handy in vigorous vineyards or tricky years, but it costs fruit and labour.","k":"Green harvest: fewer mouths to feed."},{"id":"vinha-3-17","nivel":3,"tipo":"escolha","tema":"viticultura","q":"In a damp region like the Minho, removing leaves around the bunches is mainly done to…","o":["Air and expose the bunches, lowering the risk of fungi","Speed up flowering and fruit set","Protect the bunches from the strong afternoon sun","Increase berry size and weight before harvest"],"a":0,"e":"With fewer leaves, bunches dry faster and sprays reach them better. But in hot areas, overdoing it can scorch the berries: sunburn.","fonte":"WSET Nível 3, sessão 2 (slides): gestão da canópia contra doenças","k":"Leaf removal: opening the window so bunches can breathe."},{"id":"vinha-3-18","nivel":3,"tipo":"escolha","tema":"clima","q":"Why is summer hail so feared in the vineyard?","o":["It wounds leaves and berries, and the wounds let fungi in","It suddenly cools the soil and delays ripening","It makes the vine bud again, out of season","It causes coulure in bunches that are almost ripe"],"a":0,"e":"It shreds leaves, snaps shoots and bruises berries, which then rot easily. A single storm can ruin a plot's crop.","fonte":"WSET Nível 3, sessão 2 (slides): riscos da água: granizo","k":"Hail: minutes of ice, months of work lost."},{"id":"vinha-3-19","nivel":3,"tipo":"escolha","tema":"clima","q":"Large bodies of water, like the Tagus estuary or the sea near Setúbal, affect vineyards because they…","o":["Soften temperatures nearby, but can bring humidity and fog","They water the vines underground, through the groundwater table","They raise the grapes' sugar at night with moister air","They prevent frost and hail in nearby vineyards for good"],"a":0,"e":"Water warms and cools slowly, so summers tend to be milder and winters less cold. The flip side: humidity and fog can help fungi.","fonte":"WSET Nível 3, sessão 2 (slides): grandes corpos de água moderam a temperatura","k":"Water nearby: nature's air conditioning."},{"id":"vinha-3-20","nivel":3,"tipo":"escolha","tema":"solo","q":"Granite soils, common in the Dão and Minho, tend to be…","o":["Sandy, free-draining and low in nutrients","Heavy, clay-rich and often waterlogged","Rich in limestone, which gives the grapes acidity","Made of volcanic ash, dark and fertile"],"a":0,"e":"As it breaks down, granite gives a coarse sand that lets water run through. With few nutrients, the vine tends to grow less vigorously.","k":"Granite: coarse sand, water drains, slim pickings."},{"id":"vinha-3-21","nivel":3,"tipo":"escolha","tema":"viticultura","q":"In the Douro's \"ao alto\" vineyards, the rows of vines are planted…","o":["Straight up and down the slope, with no terraces","On narrow steps held up by stone walls","On wide earth terraces without walls, following the curve of the slope","On pergolas, with the vines well above the ground"],"a":0,"e":"It's the alternative to stone-walled terraces and patamares (wide earth terraces), used on gentler slopes. More vines fit per hectare.","k":"Ao alto: rows running down the slope, no steps."},{"id":"vinha-3-22","nivel":3,"tipo":"escolha","tema":"viticultura","q":"Limiting the amount of fruit per vine tends to…","o":["Help the vine ripen the remaining bunches well","Always guarantee a better wine, whatever the year","Raise the grapes' acidity and lower the sugar","Protect the vineyard from frost and hail"],"a":0,"e":"It helps most in vigorous vineyards or cool years. It's no fixed rule: with good light, water and nutrients, a vine can ripen a bigger crop well; with few resources, only a small one.","fonte":"WSET Nível 3, sessão 2 (slides): rendimentos e qualidade","k":"Fewer bunches, more attention for each one."},{"id":"vinha-3-s01","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest spots a Colares red on the list and asks why it's so rare. What do you tell them?","o":["Phylloxera destroyed almost all the vines, and hardly any were replanted","It's only made in exceptional years, as happens with a Vintage Port","The vines grow on schist terraces where machines can't get in","It's a tiny region, with vines in sand by the sea, many ungrafted"],"a":3,"e":["Colares makes very little wine, and its vineyard area keeps shrinking.","Vines are planted deep, down through the sand to the clay; the sand stopped phylloxera, so many still grow on their own roots.","Tell them: \"These are sand vineyards by the Atlantic, where phylloxera barely got in. A rarity with a story.\""],"k":"Colares: little vineyard, lots of sand, lots of history."},{"id":"vinha-3-s02","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks what changes when a Douro red says \"Vinhas Velhas\" (old vines) on the label. What is most accurate to say?","o":["They tend to yield more fruit per vine, because their roots are deep","They tend to yield less, more concentrated fruit; site and work count too","They tend to give lighter wines, because old vines lose vigour and colour","They tend to give more mineral wine, as roots draw flavour from rock"],"a":1,"e":["The label gives the vines' age; it's a clue, not a guarantee.","Old vines tend to yield less and cope better with drought; variety, soil and producer count too.","Tell them: \"It often means more concentrated grapes, but it's no miracle on its own. Well worth a try!\""],"k":"\"Old vines\": a clue, not a promise."},{"id":"vinha-3-s03","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest from Madeira says that on the island vines grow on pergolas (latada) over poios. What are poios?","o":["Narrow stone-walled terraces on the island's slopes","Buried oak casks where the wine ages","Stone wells that store rainwater to irrigate the vines","Old island grape varieties, planted before phylloxera"],"a":0,"e":["Poios are Madeira's terraces: small earth ledges held up by stone walls.","The slopes are very steep; the pergola lifts the vines off the ground so bunches get air in the humid climate.","Tell them: \"Much of Madeira's vineyard land is worked by hand, on steps above the Atlantic.\""],"k":"Poios: the stone steps of Madeira's vineyards."},{"id":"vinha-3-s04","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks why some Douro producers plant white varieties on north-facing, high-altitude slopes. What do you explain?","o":["To get fresher grapes that ripen slowly and keep their acidity","Because white varieties need more heat to ripen","So the grapes get sweeter and give wines with more alcohol","Because north-facing slopes never get frost or hail"],"a":0,"e":["In the hot Douro, whites go looking for the coolest corners.","North-facing slopes get less sun, and altitude brings cooler nights. The grapes ripen slowly and keep acidity and aroma.","Tell them: \"The Douro can be fresh too!\" and suggest a white to prove it."],"k":"Douro whites: they seek shade and height."},{"id":"vinha-3-s05","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"Serving a Bairrada sparkling wine, a guest asks why sparkling-wine grapes are picked earlier. What do you say?","o":["For more acidity and less sugar, as the base wine needs","So the base wine gains more colour and a pinker tone","Because sparkling grapes rot if left until September","To use the spare labour in July, before the holidays"],"a":0,"e":["Picking early is a style choice.","Earlier on, grapes have high acidity and moderate sugar: a fresh, light base wine that will ferment a second time to get its bubbles.","Tell them: \"The freshness you're tasting started in the vineyard, on the day it was picked.\""],"k":"Sparkling: freshness starts with the picking date."},{"id":"vinha-3-s06","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest with a vineyard in the Minho says downy mildew ruined part of his crop and asks why it's so common there. What's the explanation?","o":["Rain and mild warmth, with wet leaves, are the ideal setting for downy mildew","Acidic granite soils weaken the vine and open the door to downy mildew","Hot, dry weather favours downy mildew, just as it favours powdery mildew","High-trained vines, on pergolas, sit far from the ground and catch more disease"],"a":0,"e":["Downy mildew is caused by a fungus-like organism that loves humidity.","Wet leaves and mild warmth are the perfect setting for infection. High vines actually get more air; the issue is the Atlantic climate.","Show some empathy and link it to the glass: heavy mildew years can mean less wine, sometimes pricier."],"fonte":"WSET Nível 3, sessão 2 (slides): míldio (condições quentes, chuvosas e húmidas)","k":"Downy mildew: loves wet leaves and mild warmth."},{"id":"vinha-3-s07","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest heard there was \"desavinho\" (coulure) in the last Dão vintage and asks if it spoils the wine. What do you reply?","o":["There's less fruit; the wine isn't necessarily worse, but yields drop","Yes, the wine always turns vinegary and has to be distilled","Nothing changes: it's just an old name for good flowering","It means the harvest was done at night to escape the daytime heat"],"a":0,"e":["Coulure is mainly a quantity problem.","Bad weather at flowering makes flowers drop; bunches end up sparse and there's less fruit to pick.","Tell them: \"There may be fewer bottles; quality depends on the rest of the year.\""],"k":"Coulure: fewer grapes, not necessarily worse wine."},{"id":"vinha-3-s08","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks why a rainy harvest can lower the quality of a Dão red. What's the best explanation?","o":["Rain makes the grapes gain too much sugar, so the wine ends up very alcoholic","Rain cools the vineyard, and ripe grapes turn green and sharp again","Rain swells the berries and encourages rot; sometimes picking comes early","Rain washes colour out of the skins, so that year's reds come out almost pink"],"a":2,"e":["The weather near harvest weighs heavily on the result.","With rain, berries swell with water and fungi spread; the grower must choose between waiting and risking it or picking early.","Tell them: \"In a tough year, careful grape selection in the vineyard makes all the difference.\""],"fonte":"WSET Nível 3, sessão 2 (slides): podridão cinzenta (Botrytis cinerea)","k":"Harvest rain: watery grapes and fungi lying in wait."}]},"es":{"fase":"vinha","num":2,"titulo":"El Viñedo","mesa":2,"versao":"2026-10-17 v1: 31 perguntas de planta vindas da Uva + 55 novas (teoria e situações de sala). Revistas a 17 out 2026 contra os slides WSET 3 (sessão 2): sem erros; 4 explicações afinadas; as que têm fonte foram confirmadas. Factos de regiões portuguesas que os slides não cobrem ficam por confirmar pela autora.","niveis":[{"n":1,"id":"iniciante","nome":"Principiante","alcunha":"Ruby"},{"n":2,"id":"intermedio","nome":"Intermedio","alcunha":"Tawny"},{"n":3,"id":"avancado","nome":"Avanzado","alcunha":"Vintage"}],"regra":{"perguntas_por_ronda":8,"bagos":3,"sobe_com_erros_ate":1,"fica_com_erros":2,"desce_com_erros":3,"erradas_por_ronda_max":3,"nota_rever":"Perguntas com \"rever\": true ficam guardadas mas fora das rondas até serem confirmadas.","situacoes_por_ronda":2},"temas":{"videira":"La vid","ciclo":"El año de la vid","clima":"Clima y tiempo","solo":"Suelo y paisaje","viticultura":"Trabajo en la viña","filoxera":"Filoxera e injerto","vinhas-velhas":"Viñas viejas","doencas":"Enfermedades y peligros","sala":"En sala"},"licao":{"titulo":"El año de la vid","fases":[{"id":"abrolhamento","t":"Brotación","m":"Marzo y abril","d":"La vid despierta: las yemas se hinchan, se abren y salen los primeros brotes. Tan tiernos que una helada puede quemarlos."},{"id":"floracao","t":"Floración","m":"Mayo y junio","d":"Nacen florecillas verdes en los futuros racimos. La vid se poliniza sola, pero la lluvia o el frío pueden estropear el cuajado."},{"id":"vingamento","t":"Cuajado","m":"Junio","d":"Las flores fecundadas se convierten en bayas verdes y duras. Las que no cuajan caen."},{"id":"pintor","t":"Envero","m":"Julio y agosto","d":"Las bayas se ablandan y cambian de ropa: las tintas toman color, las blancas se vuelven translúcidas."},{"id":"maturacao","t":"Maduración","m":"Agosto a octubre","d":"Las bayas se llenan de azúcar y pierden acidez. Los taninos y los aromas también van madurando."},{"id":"vindima","t":"Vendimia","m":"Agosto a octubre","d":"¡A recoger la uva! Se vendimia cuando llega al punto que pide el estilo de vino."},{"id":"queda","t":"Caída de la hoja","m":"Octubre y noviembre","d":"Antes de que caigan las hojas, la vid guarda reservas en la madera y las raíces. Es su despensa para el invierno."},{"id":"repouso","t":"Reposo","m":"Diciembre a febrero","d":"La vid duerme, sin hojas, y ahorra energía. Es el momento de la poda principal."}],"quando":[{"q":"Las bayas se ablandan y cambian de color.","a":"pintor"},{"q":"Se hace la poda principal, con la vid sin hojas.","a":"repouso"},{"q":"Las yemas se abren y salen los primeros brotes.","a":"abrolhamento"},{"q":"Las flores fecundadas se convierten en bayas verdes y duras.","a":"vingamento"},{"q":"Los brotes recién nacidos temen una helada.","a":"abrolhamento"},{"q":"Las bayas ya han cambiado de color y siguen ganando azúcar.","a":"maturacao"}]},"perguntas":[{"id":"vinha-1-01","nivel":1,"tipo":"escolha","q":"¿Cómo se llama el proceso en que las hojas fabrican azúcar con la luz del sol?","o":["Fotosíntesis","Respiración","Transpiración","Agostamiento"],"a":0,"e":"Las hojas son la cocina de la vid: con luz, agua y el dióxido de carbono del aire, fabrican azúcar. Parte de él viaja hasta las bayas.","tema":"videira","origem":"uva-1-06","k":"Fotosíntesis: las hojas cocinan azúcar con la luz del sol."},{"id":"vinha-1-02","nivel":1,"tipo":"vf","q":"La flor de la vid es grande y vistosa, como la del manzano.","a":false,"e":"Falso: las flores son pequeñas y verdosas, agrupadas en racimitos. Pasan casi desapercibidas, pero de ellas nacen las bayas.","tema":"videira","origem":"uva-1-13","k":"Flor de la vid: pequeñita, verde y discreta."},{"id":"vinha-1-03","nivel":1,"tipo":"escolha","q":"Los zarcillos y los racimos nacen del mismo tipo de órgano. Por eso, un zarcillo puede, a veces…","o":["Dar algunas bayas","Convertirse en raíz","Caer en invierno y volver a nacer en el mismo sitio","Convertirse en un sarmiento"],"a":0,"e":"Zarcillos y racimos nacen en el mismo sitio del pámpano. A veces, un zarcillo se queda a medio camino y da unas bayas.","tema":"videira","sala":"Más azúcar en la uva tiende a dar más alcohol en el vino, si la fermentación llega hasta el final.","origem":"uva-1-14","k":"Zarcillo y racimo: primos con el mismo origen."},{"id":"vinha-1-04","nivel":1,"tema":"videira","tipo":"escolha","q":"El tronco de la vid también tiene otro nombre. ¿Cuál?","o":["Cepa","Raspón","Baya","Yema"],"a":0,"e":"En el día a día, «cepa» también quiere decir la propia vid: «una cepa vieja». Una palabra, dos oficios. La lengua también echa brotes.","sala":"Oirás hablar de «cepas viejas» y «viñas viejas» en las etiquetas y en la conversación con los clientes.","origem":"uva-1-16","k":"Cepa: el tronco y, muchas veces, la vid entera."},{"id":"vinha-1-05","nivel":1,"tema":"videira","tipo":"escolha","q":"¿Qué parte lleva el agua desde las raíces hasta las hojas y los racimos?","o":["El tronco","Los zarcillos","Las pepitas","La pruina"],"a":0,"e":"La savia sube por el tronco, pasa por los brazos y llega a los brotes y a las hojas, como agua por una tubería. Solo que estas tuberías están vivas y crecen.","origem":"uva-1-22","k":"El tronco: la fontanería viva de la vid.","rever":true},{"id":"vinha-1-06","nivel":1,"tema":"videira","tipo":"vf","q":"Una vid puede vivir más de 100 años.","a":true,"e":"Con la edad, tienden a dar menos uva. Pero la edad, por sí sola, no garantiza mejor vino: también cuentan la variedad, el suelo, el clima y los cuidados del viñedo.","sala":"«Viñas viejas» en la etiqueta indica la edad de las vides. Por sí solo, no garantiza un vino mejor.","origem":"uva-1-23","k":"Hay vides centenarias, y siguen dando uvas."},{"id":"vinha-1-07","nivel":1,"tema":"videira","tipo":"escolha","q":"¿Para qué sirven los zarcillos?","o":["Agarrar la vid a un soporte","Guardar agua para el verano","Proteger los racimos del sol","Sujetar las hojas a la rama"],"a":0,"e":"Se forman mientras el brote crece y se enroscan en cuanto tocan un alambre, una estaca o un árbol. Así la vid sube hacia la luz.","origem":"uva-1-30","k":"Zarcillos: las manitas con las que la vid trepa."},{"id":"vinha-1-08","nivel":1,"tipo":"escolha","tema":"ciclo","q":"¿En qué estación se hace la poda principal?","o":["En invierno","En primavera","En verano","Durante la vendimia"],"a":0,"e":"Sin hojas, la planta se ve bien. La poda decide cuántas yemas se quedan y, con ello, cuánta uva intentará madurar la vid. En verano hay una poda más ligera, en las partes verdes.","sala":"Un viñedo podado en invierno parece muerto. No lo está: está descansando.","fonte":"WSET Nível 3, sessão 2 (slides): poda de inverno e de verão","k":"Poda principal: en invierno, con la vid dormida."},{"id":"vinha-1-09","nivel":1,"tipo":"escolha","tema":"ciclo","q":"Las yemas se abren y nacen los primeros brotes. ¿Cómo se llama este momento?","o":["Brotación","Envero","Agostamiento","Vendimia"],"a":0,"e":"En Portugal (donde se llama abrolhamento) suele ocurrir entre marzo y abril. Los brotes aún son muy tiernos, y una helada en este momento puede quemarlos.","k":"Brotación: la vid despierta y abre las yemas."},{"id":"vinha-1-10","nivel":1,"tipo":"escolha","tema":"ciclo","q":"Las bayas se ablandan y cambian de color. ¿En qué fase está la uva?","o":["Envero","Floración","Reposo","Brotación"],"a":0,"e":"En portugués se llama pintor, «el pintor». Las uvas tintas toman color y las blancas se vuelven más translúcidas. A partir de aquí, el azúcar empieza a subir deprisa.","sala":"Quien visita un viñedo en agosto ve a veces racimos medio verdes, medio tintos: es el envero a mitad de camino.","k":"Envero: la uva se ablanda y cambia de ropa."},{"id":"vinha-1-11","nivel":1,"tipo":"vf","tema":"ciclo","q":"La vid da flores antes de dar uvas.","a":true,"e":"Son flores pequeñas y verdes, casi pasan desapercibidas. En Portugal, la floración suele ser entre mayo y junio.","k":"Primero flores, luego bayas: cada flor que cuaja, una baya.","rever":true},{"id":"vinha-1-12","nivel":1,"tipo":"escolha","tema":"ciclo","q":"En Portugal, ¿cuándo se hace sobre todo la vendimia?","o":["Entre agosto y octubre","Entre junio y julio","Entre octubre y diciembre","Solo en septiembre"],"a":0,"e":"Arranca en agosto en las zonas más cálidas y en las uvas para espumoso. En las zonas más frescas, o con variedades tardías, puede llegar a octubre.","k":"Vendimia en Portugal: de agosto a octubre."},{"id":"vinha-1-13","nivel":1,"tipo":"escolha","tema":"clima","q":"¿Qué necesita la vid para madurar las uvas?","o":["Calor y luz del sol","Suelo muy fértil y rico","Mucha agua en verano","Mucha sombra de las hojas"],"a":0,"e":"La luz alimenta la fotosíntesis y el calor pone a la planta a trabajar. Por debajo de unos 10 °C, la vid casi no crece.","sala":"Más sol y calor tienden a dar uvas más maduras: más azúcar, más alcohol en el vino y fruta más madura.","fonte":"WSET Nível 3, sessão 2 (slides): o que a videira precisa (calor, luz, água)","k":"Luz y calor: el combustible de la maduración."},{"id":"vinha-1-14","nivel":1,"tipo":"vf","tema":"solo","q":"En el Douro, los \"patamares\" son terrazas modernas, de tierra, sin muros de piedra.","a":true,"e":"Verdadero: los patamares, hechos a máquina desde los años 70, sujetan la tierra con taludes en lugar de muros de esquisto. Las terrazas antiguas, de piedra, son Patrimonio Mundial de la UNESCO desde 2001.","sala":"Socalcos en la etiqueta o en la conversación quiere decir viñedo en escalera, trabajado sobre todo a mano.","k":"Patamares: terrazas modernas, con taludes de tierra."},{"id":"vinha-1-15","nivel":1,"tipo":"escolha","tema":"solo","q":"¿Qué roca manda en los suelos del Douro?","o":["Esquisto","Arena","Caliza","Basalto"],"a":0,"e":"Las raíces bajan por las grietas entre las láminas en busca de agua. También hay manchas de granito en la región.","k":"Douro: esquisto, una roca que se parte en hojas."},{"id":"vinha-1-16","nivel":1,"tipo":"escolha","tema":"clima","q":"¿Por qué el Minho, tierra del Vinho Verde, es tan verde?","o":["Llueve mucho, por culpa del Atlántico","Sus suelos calizos guardan el agua","Las viñas se riegan todo el verano","Tiene inviernos con mucha nieve"],"a":0,"e":"Llueve sobre todo en otoño e invierno, y es de las regiones más lluviosas del país. Bien para el verde, más trabajo en la viña: tanta humedad favorece a los hongos.","sala":"Un clima fresco y húmedo ayuda a explicar la acidez viva de los blancos del Minho.","k":"Minho: el Atlántico al lado, la lluvia cerca."},{"id":"vinha-1-17","nivel":1,"tipo":"escolha","tema":"viticultura","q":"¿Cómo se llama la recogida de la uva?","o":["Vendimia","Poda","Injerto","Acodo"],"a":0,"e":"En las terrazas del Douro, muchas viñas solo se vendimian a mano: las máquinas no llegan adonde llegan las personas.","fonte":"WSET Nível 3, sessão 2 (slides): vindima manual e mecânica","k":"Vendimia: la fiesta (y el trabajo) de la recogida.","rever":true},{"id":"vinha-1-18","nivel":1,"tipo":"escolha","tema":"clima","q":"Una helada de primavera, justo después de la brotación, puede…","o":["Quemar los brotes nuevos y reducir la cosecha","Retrasar la vendimia unas semanas sin perder uva","Dar bayas más pequeñas, dulces y concentradas","Afectar solo a las uvas que ya están maduras"],"a":0,"e":"La vid puede sacar brotes de reserva, pero suelen dar menos uva. Las zonas bajas sufren más, porque el aire frío baja y se queda allí.","fonte":"WSET Nível 3, sessão 2 (slides): riscos de temperatura (geadas de primavera)","k":"Helada de primavera: brotes tiernos, cosecha en peligro."},{"id":"vinha-1-19","nivel":1,"tipo":"escolha","tema":"viticultura","q":"¿Para qué sirve la poda?","o":["Elegir cuántas yemas se quedan y controlar cuánto produce la vid","Quitar las hojas que dan sombra a los racimos antes de vendimiar","Tratar la vid contra el mildiu y otras enfermedades de hongos","Aumentar siempre el número de racimos que da cada cepa"],"a":0,"e":"Cada yema que se queda puede dar un brote con racimos. Menos yemas tienden a dar menos uva por cepa. Y las tijeras también dan forma a la planta.","fonte":"WSET Nível 3, sessão 2 (slides): poda e condução","k":"Poda: decidir hoy cuánta uva llega mañana."},{"id":"vinha-1-s01","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente lee \"vinhas em socalcos\" en la etiqueta de un tinto del Douro y pregunta qué es. ¿Qué le dices?","o":["Viñas plantadas en terrazas en la ladera, con muros de piedra","Viñas junto al río, regadas de forma natural por las crecidas de invierno","Viñas plantadas entre olivos y almendros","Uvas puestas a secar al sol después de la vendimia"],"a":0,"e":["Es una palabra de paisaje, no de técnica de bodega.","Las laderas del Douro son muy empinadas: los escalones permiten plantar y sujetan la tierra.","Dile: \"Es el viñedo en escalera del Douro, trabajado casi todo a mano. El paisaje es Patrimonio Mundial.\""],"k":"Socalcos: escalones de piedra en la ladera."},{"id":"vinha-1-s02","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Una clienta ve \"Colheita 2024\" en un blanco del Dão y pregunta qué significa. ¿Qué le respondes?","o":["Es el año en que se vendimiaron las uvas","Es el año en que se plantó la viña","Es la fecha límite para beber el vino","Es el año en que se embotelló el vino"],"a":0,"e":["En un vino tranquilo, colheita es la añada: al menos el 85 % de las uvas son de ese año.","Cada año tiene su tiempo, con más o menos lluvia y calor, y eso cambia la uva.","Dile: \"El mismo vino, de años distintos, puede saber diferente. Eso es parte de la gracia.\""],"k":"Colheita en la etiqueta: el año de la vendimia."},{"id":"vinha-1-s03","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente pregunta por qué un Vinho Verde tiende a ser más fresco y ácido que un blanco del Alentejo. ¿Cuál es la mejor explicación?","o":["El Minho es más fresco y lluvioso; con menos calor, la uva conserva más acidez","El Vinho Verde se hace con uvas verdes, cogidas antes de madurar","En el Minho se añade ácido a todos los vinos, por norma de la región","Los suelos calizos del Minho dan mucha acidez a las uvas"],"a":0,"e":["La diferencia empieza en el clima de cada región.","Con más calor, la uva pierde acidez más deprisa al madurar; en el Minho, fresco y atlántico, la conserva.","Usa el contraste para ayudarle a elegir: más frescura, el Minho; un blanco más redondo, el Alentejo."],"k":"Menos calor, más acidez guardada en la uva."},{"id":"vinha-1-s04","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Un turista quiere ver la vendimia en el Douro y pregunta en qué mes ir. ¿Qué le sugieres?","o":["Septiembre","Julio","Noviembre","Junio"],"a":0,"e":["En el Douro, la vendimia se concentra en septiembre.","Puede empezar a finales de agosto y llegar a octubre: depende del calor del año y de la variedad.","Dile: \"Vaya en septiembre, pero confirme las fechas cerca del viaje: cambian cada año.\""],"k":"Vendimia en el Douro: apuesta por septiembre."},{"id":"vinha-1-s05","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente lee \"Vinhas Velhas\" en un tinto del Douro y pregunta: \"¿Entonces el vino es viejo?\" ¿Qué le respondes?","o":["No: las viejas son las cepas, no el vino","Sí, el vino tiene más de 30 años","Es un vino hecho con pasas","Quiere decir que el vino envejeció en una bodega antigua"],"a":0,"e":["\"Vinhas Velhas\" habla de la edad de las cepas, no de la del vino.","Las cepas viejas tienden a dar menos uva y tienen raíces más profundas; el vino puede ser bien joven.","Dile que es una pista de estilo, no una garantía de calidad, y señala la añada en la etiqueta."],"k":"Vinhas Velhas: viejas son las cepas, no el vino."},{"id":"vinha-1-s06","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Una clienta cuenta que en marzo vio gotas cayendo de los cortes de poda en un viñedo. Pregunta si las plantas estaban enfermas. ¿Qué le dices?","o":["No: es el lloro, la savia que sube cuando la vid despierta","Sí, es una señal de mildiu, que ataca en esta época","Es rocío de la noche que entró por los cortes","Son restos de los tratamientos de invierno que gotean"],"a":0,"e":["Es el lloro de la vid: la savia sale por los cortes al final del invierno.","Con el suelo calentándose, las raíces vuelven a empujar savia hacia arriba; la brotación está cerca.","Dile: \"Tranquila: es señal de que la viña está viva y a punto de brotar.\""],"k":"Lloro: la vid despertando, no enfermando."},{"id":"vinha-1-s07","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Un turista acaba de volver de Pico, en las Azores, y pregunta por qué allí las viñas están rodeadas de muros bajos de piedra negra. ¿Qué le explicas?","o":["Los currais protegen las vides del viento y de la sal del mar y guardan calor","Sirven para marcar la variedad plantada en cada parcela","Son restos de casas antiguas, abandonadas tras una erupción volcánica","Guardan el agua de lluvia para regar las viñas en verano"],"a":0,"e":["Los muros son los currais, hechos con la piedra volcánica de la isla.","Protegen del viento atlántico y de las salpicaduras del mar, y la piedra oscura guarda el calor del día.","Cuenta que el paisaje es Patrimonio Mundial de la UNESCO desde 2004. Buen pie para un blanco de las Azores."],"k":"Currais de Pico: refugio de piedra contra viento y mar."},{"id":"vinha-1-s08","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente pide un tinto \"de un año caluroso\". ¿Qué tiende a cambiar ese año en el vino?","o":["Uvas más maduras: tiende a dar más alcohol y fruta más madura, con menos acidez","Uvas menos maduras: tiende a dar más acidez, menos alcohol y fruta más verde","Vino más claro y ligero, porque el sol quema el color de la uva","Nada especial: la añada apenas cambia el vino"],"a":0,"e":["El tiempo de cada año cambia la maduración de la uva.","Con más calor, la uva tiende a acumular más azúcar y a perder acidez más deprisa; en la fermentación, el azúcar se convierte en alcohol.","Es una tendencia, no una promesa: cuentan el productor, la viña, cómo fue el año y la elaboración. Confirma ese vino antes de recomendarlo."],"k":"Año caluroso: tiende a dar más alcohol y menos acidez."},{"id":"vinha-2-01","nivel":2,"tipo":"escolha","q":"La vid trepa agarrándose con unos hilillos en espiral. ¿Cómo se llaman?","o":["Zarcillos","Sarmientos","Yemas","Raspones"],"a":0,"e":"Se forman mientras crece el pámpano y se enroscan en cuanto tocan un soporte. La estrategia es sencilla: crecer y agarrarse por el camino.","tema":"videira","origem":"uva-2-10","k":"Zarcillos: las manitas con las que trepa la vid."},{"id":"vinha-2-02","nivel":2,"tipo":"escolha","q":"Entre el verano y el otoño, las ramas del año se ponen duras como la madera. Pasan a llamarse…","o":["Sarmientos","Raíces","Brazos","Zarcillos"],"a":0,"e":"Mientras son verdes y tiernas, se llaman pámpanos. En la poda de invierno se cortan muchos sarmientos para orientar la producción.","tema":"videira","origem":"uva-2-11","k":"Pámpano verde, sarmiento marrón: la misma rama, otra edad."},{"id":"vinha-2-03","nivel":2,"tipo":"escolha","q":"Los pequeños botones de los que nacen las ramas nuevas se llaman…","o":["Yemas","Pepitas","Bayas","Zarcillos"],"a":0,"e":"En primavera se hinchan y se abren: es la brotación, el despertador anual de la vid.","tema":"videira","origem":"uva-2-12","k":"Yemas: donde duermen las ramas nuevas."},{"id":"vinha-2-04","nivel":2,"tipo":"escolha","q":"Además de beber agua, ¿para qué sirven las raíces?","o":["Sujetar la planta y guardar reservas para el invierno","Hacer la fotosíntesis antes de que salgan las hojas","Producir los taninos que luego suben hasta las uvas","Dar color a las uvas con los minerales del suelo"],"a":0,"e":"Sujetan la planta y absorben agua y minerales. También guardan reservas, pero no solas: la madera de la vid ayuda. La despensa es compartida.","tema":"videira","origem":"uva-2-13","k":"Raíces: ancla, pajita y parte de la despensa."},{"id":"vinha-2-05","nivel":2,"tipo":"escolha","q":"¿Qué es la filoxera?","o":["Un insecto que ataca las raíces","Un hongo que ataca las hojas","Una enfermedad del vino en botella","Una variedad americana"],"a":0,"e":"Es pariente de los pulgones, y su forma que vive en las raíces causa daños graves a la vid europea (Vitis vinifera). Por eso el injerto sobre portainjertos resistentes cambió la viticultura.","tema":"filoxera","origem":"uva-2-14","k":"Filoxera: un insecto diminuto que ataca las raíces."},{"id":"vinha-2-06","nivel":2,"tipo":"escolha","q":"¿De dónde vino la filoxera?","o":["América del Norte","Asia","Norte de África","Australia"],"a":0,"e":"Llegó a Europa en el siglo XIX, escondida en material vegetal. Una polizona que nadie había invitado.","tema":"filoxera","origem":"uva-2-15","k":"Filoxera: vino de América del Norte, sin invitación."},{"id":"vinha-2-07","nivel":2,"tema":"videira","tipo":"escolha","q":"En la hoja de la vid, ¿cómo se llama la parte ancha y plana?","o":["Limbo","Pecíolo","Nervio","Zarcillo"],"a":0,"e":"El pecíolo es el «rabito» que une el limbo a la rama. Juntos forman la hoja.","origem":"uva-2-25","k":"Limbo: la parte ancha. Pecíolo: el rabito."},{"id":"vinha-2-08","nivel":2,"tema":"videira","tipo":"escolha","q":"¿Por qué le interesa la forma de la hoja a quien estudia variedades?","o":["Ayuda a identificar la variedad","Indica cuánto azúcar tiene la uva","Indica si la viña se riega","Indica la edad de la vid"],"a":0,"e":"Eso se llama ampelografía. Hoy, mirar la hoja puede completarse con análisis de ADN: lupa y laboratorio, pareja de detectives.","origem":"uva-2-26","k":"La hoja es el DNI de la variedad."},{"id":"vinha-2-09","nivel":2,"tema":"videira","tipo":"escolha","q":"Los brotes que nacen al lado de la rama principal se llaman…","o":["Nietos","Zarcillos","Brazos","Raíces"],"a":0,"e":"También se llaman feminelas. Pueden quitarse para ordenar la vegetación y airear la viña, pero depende del vigor y del clima de cada viñedo.","origem":"uva-2-27","k":"Nietos: los brotes que salen de lado."},{"id":"vinha-2-10","nivel":2,"tema":"videira","tipo":"escolha","q":"La rama nueva, todavía verde y tierna, se llama…","o":["Pámpano","Raspón","Pedicelo","Púa"],"a":0,"e":"Cuando madura y se lignifica, pasa a ser sarmiento: cambia la ropa de verano por el abrigo de invierno.","origem":"uva-2-28","k":"Pámpano: la rama verde y tierna. ¡Como este nivel!"},{"id":"vinha-2-11","nivel":2,"tema":"videira","tipo":"vf","q":"La mayoría de las vides cultivadas pueden polinizar sus propias flores.","a":true,"e":"En la mayoría de las variedades, cada flor tiene partes masculinas y femeninas. Los insectos pueden pasar de visita, pero en general no hacen falta.","origem":"uva-2-30","k":"Por norma, la vid se encarga sola de la polinización."},{"id":"vinha-2-12","nivel":2,"tipo":"escolha","tema":"ciclo","q":"¿Cuál es el orden correcto del año de la vid?","o":["Brotación, floración, cuajado, envero, vendimia","Floración, brotación, envero, cuajado, vendimia","Brotación, envero, floración, vendimia, cuajado","Cuajado, floración, brotación, vendimia, envero"],"a":0,"e":"Las yemas se abren, las flores fecundadas se convierten en bayas, las bayas cambian de color en el envero y maduran hasta la vendimia. Después cae la hoja y la vid descansa.","k":"Despierta, florece, cuaja, cambia de color y a vendimiar."},{"id":"vinha-2-13","nivel":2,"tipo":"escolha","tema":"ciclo","q":"¿Cómo se llama la fase en que las flores fecundadas se convierten en pequeñas bayas verdes?","o":["Cuajado","Envero","Brotación","Agostamiento"],"a":0,"e":"Es normal que caiga una parte de las flores. Con lluvia, frío o viento en la floración, caen muchas más: es el corrimiento.","k":"Cuajado: la flor fecundada se convierte en baya."},{"id":"vinha-2-14","nivel":2,"tipo":"escolha","tema":"ciclo","q":"¿Qué es el agostamiento?","o":["Los pámpanos verdes se lignifican y pasan a sarmientos","Las uvas cambian de color y empiezan a madurar","La poda de invierno, que corta los sarmientos viejos","Las flores se fecundan y pasan a ser pequeñas uvas"],"a":0,"e":"Va desde el envero hasta el otoño: los brotes verdes se endurecen, toman color de madera y aguantan el invierno.","fonte":"WSET Nível 3, sessão 2 (slides): partes lenhosas da videira (pâmpanos, vara)","k":"Agostamiento: la rama verde se pone el abrigo de madera."},{"id":"vinha-2-15","nivel":2,"tipo":"escolha","tema":"clima","q":"En los viñedos altos de la Beira Interior, los días cálidos y las noches frescas ayudan a la uva a…","o":["Conservar acidez y aromas mientras madura","Madurar más deprisa y con más alcohol","Perder acidez durante la noche","Ganar azúcar sobre todo de noche"],"a":0,"e":"Esa diferencia se llama amplitud térmica. De día, el calor madura la uva; de noche, el fresco frena la pérdida de acidez y ayuda a conservar aromas.","sala":"\"Viña de altitud\" en una etiqueta es una pista de frescura.","fonte":"WSET Nível 3, sessão 2 (slides): fatores do clima: altitude, amplitude térmica diária","k":"Día cálido, noche fresca: la uva conserva la acidez."},{"id":"vinha-2-16","nivel":2,"tipo":"escolha","tema":"clima","q":"En la viña, ¿qué diferencia hay entre clima y tiempo?","o":["El clima es el patrón de muchos años; el tiempo es lo que pasa cada año","Son lo mismo","El clima es el invierno; el tiempo es el verano","El tiempo es el patrón de muchos años; el clima es lo que pasa cada día"],"a":0,"e":"El clima dice lo que suele pasar en una región; el tiempo, lo que pasó en un año concreto. El tiempo de cada año es una de las principales razones por las que las añadas de un mismo vino saben distintas.","k":"Clima: lo que esperas. Tiempo: lo que te toca."},{"id":"vinha-2-17","nivel":2,"tipo":"escolha","tema":"solo","q":"¿Por qué el esquisto del Douro puede ayudar a la vid en un verano seco?","o":["Las raíces bajan por las grietas de la roca hasta el agua guard
