/* ---------- Rondas à mesa: como o prato muda a perceção do vinho (rascunho no Notion, 13 out 2026) ---------- */
// t: "c" compreender (4 opções, baralhadas) · "p" prever (2 botões, ordem fixa). e: [o que muda, porquê, como usar], frases curtas, linguagem de tendência. l: rótulo próprio (opcional)
const MAIS = ["↑ Mais evidente","↓ Menos evidente"], VF = ["Verdadeiro","Falso"];
const MESAS = [
 {n:1, t:"Sal e Acidez", depois:"o Ruby", cars:[
  {id:"sal", nome:"Sal", giz:"O sal acalma o amargo", micro:"Regra de ouro: o prato não muda o vinho no copo, muda o que sentes. Depois de algo salgado, o vinho tende a parecer menos amargo, menos áspero e menos ácido, seja branco, rosé, tinto ou espumante.", qs:[
   {t:"c", l:"Escolha · Princípios da harmonização", q:"Provaste um tinto da Bairrada, comeste uns tremoços salgados e voltaste a provar o mesmo vinho. Parece-te diferente. O que mudou?", o:["A tua perceção do vinho","A composição do vinho no copo","A cor do vinho","A quantidade de álcool no vinho"], a:0,
    e:["O vinho no copo continua igual; a forma como o sentes pode mudar depois de comeres.","O sal, por exemplo, pode fazer o vinho parecer menos amargo e mais macio.","Harmonizar começa aqui: perceber como a comida influencia o próximo gole."]},
   {t:"c", q:"Um tinto de Baga, jovem e tânico, depois de uns tremoços bem salgados. O que tende a acontecer ao amargor e à aspereza do vinho?", o:["Tendem a diminuir","Tendem a aumentar","Ficam sempre iguais","O vinho passa a parecer doce"], a:0,
    e:["O tinto parece mais macio.","O sal tende a atenuar o amargor na boca, e a aspereza dos taninos também tende a parecer menor.","Petiscos salgados tendem a aceitar tintos de taninos firmes; um Baga jovem é um exemplo."]},
   {t:"p", q:"Sardinhas assadas com sal grosso e um Alvarinho de acidez viva, de Monção e Melgaço. Pensa só no sal: a acidez do vinho vai parecer…", o:MAIS, a:1,
    e:["A acidez parece mais suave e a fruta sobressai.","O sal tende a baixar a perceção da acidez; o vinho continua com a mesma acidez. A gordura da sardinha também conta, mas aqui isolamos o sal.","Um branco que sozinho parece cortante pode ficar mais redondo à mesa com um prato salgado."]},
   {t:"p", q:"Amêndoas torradas com sal e um tinto jovem e firme do Douro (Touriga Nacional). Pensa só no sal: a fruta do vinho vai parecer…", o:MAIS, a:0,
    e:["A fruta vem mais à frente.","Com o amargor e a aspereza a parecerem menores, a fruta tende a destacar-se mais.","Um tinto jovem e firme tende a mostrar-se mais simpático com um petisco salgado."]},
   {t:"p", q:"Verdadeiro ou falso? O sal só funciona com vinhos brancos.", o:VF, a:1,
    e:["Nos brancos, a acidez tende a parecer mais baixa; nos tintos, o amargor e os taninos tendem a parecer mais suaves.","O sal muda a perceção, seja qual for a cor do vinho; a intensidade varia de pessoa para pessoa.","Com salgados, podes servir branco, rosé, tinto ou espumante; decide pelo resto do prato."]}]},
  {id:"acidez", nome:"Acidez", giz:"Ácido pede ácido", micro:"Depois de limão, tomate ou vinagre, o vinho tende a parecer menos ácido e mais frutado. Se tiver menos acidez do que o prato, tende a parecer chato. Pista: acidez do vinho pelo menos igual à do prato.", qs:[
   {t:"c", q:"Salada de tomate com vinagre e, a seguir, um Arinto de Bucelas, de acidez alta. O que tende a acontecer à acidez do vinho?", o:["Parece mais baixa","Parece mais alta","Desaparece","Passa a parecer amarga"], a:0,
    e:["O Arinto tende a parecer mais suave e frutado.","O paladar adapta-se ao ácido do prato e, a seguir, a mesma acidez do vinho sobressai menos. O vinho não perdeu acidez.","Vinhos de acidez alta tendem a aguentar pratos ácidos sem ficar apagados; um Arinto é um exemplo."]},
   {t:"c", q:"Porque é que um vinho de acidez baixa pode parecer \"chato\" ao lado de seitan grelhado com molho de limão?", o:["Ao lado do ácido do prato, a pouca acidez do vinho quase não se nota","O limão estraga o vinho e deixa-o com sabor metálico","O limão aumenta o álcool do vinho e esconde toda a fruta que ele tem","Os brancos não combinam com limão, só os tintos"], a:0,
    e:["O vinho tende a parecer mole, sem frescura.","O paladar já se adaptou ao ácido do limão; uma acidez pequena tende a passar despercebida.","Com pratos ácidos, procura acidez pelo menos igual à do prato; um Vinho Verde ou um espumante são exemplos."]},
   {t:"p", q:"Salada de polvo com vinagre e coentros e um Vinho Verde Loureiro, de acidez viva. A fruta do vinho vai parecer…", o:MAIS, a:0,
    e:["O vinho tende a parecer mais frutado e redondo.","Depois do vinagre, o paladar adapta-se ao ácido: a acidez do vinho nota-se menos e a fruta nota-se mais.","Um vinho de acidez viva tende a acompanhar bem pratos temperados com vinagre ou limão."]},
   {t:"p", q:"Arroz de tomate e um tinto maduro, de acidez baixa. Pensa na acidez do tomate: a frescura do vinho vai parecer…", o:MAIS, a:1,
    e:["Falta frescura; o vinho pode parecer pesado.","Ao lado da acidez do tomate, a pouca acidez do vinho tende a deixar de se notar.","Para arroz de tomate, procura acidez alta, num rosé fresco ou num tinto; um Baga da Bairrada é um exemplo de tinto ácido."]},
   {t:"p", q:"Verdadeiro ou falso? Um prato ácido faz o vinho perder acidez.", o:VF, a:1,
    e:["Só a perceção muda; a acidez do vinho é a mesma.","É adaptação do paladar, não uma reação química no copo.","Quando um vinho \"muda\" à mesa, a pergunta certa é o que o prato fez à tua boca."]}]}
 ]},
 {n:2, t:"Doçura, Amargo e Umami", depois:"a Fase 2 · A Vinha", cars:[
  {id:"docura", nome:"Doçura", giz:"Doce seca o vinho", micro:"O doce do prato tende a secar o vinho: menos fruta, e mais acidez, amargor e álcool à vista. Pista: o vinho pelo menos tão doce como o prato.", qs:[
   {t:"c", q:"Marmelada e um tinto seco do Douro. O que tende a acontecer?", o:["O vinho parece mais seco, ácido e amargo","O vinho parece mais doce e mais frutado","O vinho parece mais leve e com menos álcool","Nada muda"], a:0,
    e:["A fruta apaga-se e sobressaem acidez, amargor e álcool.","O paladar habitua-se ao doce e deixa de sentir a pouca doçura do vinho; e o doce, que costuma disfarçar o ácido e o amargo, deixa de fazer esse papel.","Com marmelada, procura um vinho pelo menos tão doce como ela; um Porto Tawny é um exemplo."]},
   {t:"c", q:"Para arroz doce, que pista ajuda mais a escolher o vinho?", o:["Vinho pelo menos tão doce como a sobremesa","Vinho o mais seco possível, para cortar o doce","Vinho com muito tanino, para equilibrar o prato","Vinho com muito álcool, para aquecer a boca"], a:0,
    e:["Com um vinho mais seco do que a sobremesa, o vinho parece magro e ácido.","É a mesma adaptação ao doce; só um vinho com doçura suficiente mantém a fruta à mesa.","Para sobremesas, procura doçura igual ou maior; um Moscatel de Setúbal ou um Porto são exemplos."]},
   {t:"p", q:"Pão de ló e um espumante Bruto Natural (quase sem açúcar). A acidez do espumante vai parecer…", o:MAIS, a:0,
    e:["O espumante tende a parecer mais agressivo e magro.","O doce do pão de ló tira protagonismo à pouca doçura do vinho e deixa a acidez à vista.","Para sobremesas, procura bolha com alguma doçura, como um espumante meio-seco ou doce, em vez de um Bruto Natural."]},
   {t:"p", q:"Tofu salteado com cebola caramelizada (um doce ligeiro) e um branco seco e muito leve. A fruta do vinho vai parecer…", o:MAIS, a:1,
    e:["O branco pode parecer diluído.","Mesmo um doce ligeiro pode reduzir a sensação de doçura e fruta do vinho.","Para pratos com algum doce, procura um branco de fruta madura e mais corpo; um Encruzado do Dão pode ser um exemplo."]},
   {t:"p", q:"Bolo de mel da Madeira e um Madeira Malvasia, doce. O vinho vai parecer mais seco do que é?", o:["Sim, muito","Pouco ou nada"], a:1,
    e:["O vinho mantém a fruta e o equilíbrio.","Com doçura igual ou maior do que a do prato, a adaptação ao doce não chega a apagar o vinho.","Este é o raciocínio para qualquer sobremesa: compara a doçura do prato com a do vinho."]}]},
  {id:"amargo", nome:"Amargo", giz:"Amargo soma amargo", micro:"Grelos, rúcula, chocolate negro ou café tendem a somar-se ao amargor do vinho, e um tinto tânico fica mais áspero. Fruta, pouco tanino ou um toque de doçura tendem a suavizar.", qs:[
   {t:"c", q:"Grelos salteados com alho, quase sem sal, e um tinto jovem e tânico do Douro. O que tende a acontecer?", o:["O vinho parece mais amargo","O vinho parece mais doce","O amargor dos grelos desaparece","Nada muda"], a:0,
    e:["O vinho parece mais amargo e os taninos mais ásperos.","O amargor dos grelos junta-se ao do vinho: dois amargos seguidos tendem a reforçar-se.","Com grelos, escolhe um tinto com fruta e pouco tanino, ou um branco com corpo."]},
   {t:"c", q:"Em qual destes pratos o amargo é a característica principal?", o:["Salada de rúcula e endívia","Arroz doce","Sardinhas assadas","Tremoços"], a:0,
    e:["Com rúcula e endívia, o amargor do vinho tende a notar-se mais.","São folhas naturalmente amargas; o arroz doce é doce, as sardinhas são gordas e salgadas, os tremoços são salgados.","Identificar a característica dominante do prato é o primeiro passo de qualquer escolha."]},
   {t:"p", q:"Chocolate negro e um tinto seco e tânico. O amargor do vinho vai parecer…", o:MAIS, a:0,
    e:["O vinho pode parecer amargo e seco.","Aqui há dois fatores no mesmo sentido: o amargo do chocolate soma-se ao do vinho, e o doce tende a secar o vinho.","Com chocolate negro, procura um vinho doce, de fruta intensa; um Porto Ruby ou LBV é um exemplo."]},
   {t:"p", q:"Os mesmos grelos, agora bem temperados com flor de sal, e o mesmo tinto. Em comparação com antes, o amargor do vinho vai parecer…", o:MAIS, a:1,
    e:["O vinho tende a parecer mais macio.","Os grelos são os mesmos; só mudou o sal, que tende a atenuar a perceção do amargor.","Corrigir o tempero também é harmonizar."]},
   {t:"p", q:"Verdadeiro ou falso? Um prato amargo tende a tornar mais macio um tinto tânico.", o:VF, a:1,
    e:["O contrário: o tinto tende a parecer mais amargo e áspero.","O amargor do prato e o do vinho tendem a somar-se.","Para pratos amargos, guarda os tintos mais tânicos para outra ocasião."]}]},
  {id:"umami", nome:"Umami", giz:"Umami endurece o tinto", micro:"Umami é o gosto \"saboroso\" dos cogumelos, do queijo curado, do presunto e do molho de soja. Com ele, o vinho tende a parecer mais amargo e áspero, e o álcool mais quente. Sal ou acidez no prato atenuam.", qs:[
   {t:"c", q:"Qual destes ingredientes é rico em umami?", o:["Molho de soja","Limão","Açúcar","Malagueta"], a:0,
    e:["Ganhas uma pista: onde há umami, um tinto tânico tende a parecer mais amargo e áspero.","O molho de soja, tal como os cogumelos, o queijo curado ou o presunto, tem glutamato natural, associado ao gosto umami. Mas também tem muito sal, que pode compensar parte do efeito.","Antes de escolher, vê se o prato tem umami e se tem sal ou acidez para o equilibrar."]},
   {t:"c", q:"Cogumelos salteados, sem sal, e um tinto jovem e muito tânico. O que tende a acontecer?", o:["O vinho parece mais amargo e áspero","O vinho parece mais doce","O vinho parece mais frutado e macio","Nada muda"], a:0,
    e:["Amargor e taninos ficam mais duros; a fruta recua.","É o efeito que se observa em prova com o umami. Sem sal nem acidez no prato, nada o compensa.","Tempera os cogumelos com sal e um toque de limão, ou escolhe um tinto com menos tanino e mais fruta."]},
   {t:"p", q:"Seitan estufado com molho de cogumelos, quase sem sal, e um branco seco e leve. O amargor do vinho vai parecer…", o:MAIS, a:0,
    e:["O branco pode ficar com um final amargo.","Cogumelos e seitan trazem umami; sem sal no prato a compensar, o amargor do vinho tende a notar-se mais.","Com pratos ricos em umami, um branco com mais fruta e textura, ou um rosé, tende a resistir melhor; um pouco de sal no prato também ajuda."]},
   {t:"p", q:"Os mesmos cogumelos, agora com flor de sal e limão, e o mesmo tinto tânico. Os taninos vão parecer…", o:["↑ Mais ásperos do que antes","↓ Mais macios do que antes"], a:1,
    e:["O vinho fica mais macio do que com os cogumelos sem tempero.","Os cogumelos e o vinho são os mesmos; o sal tende a reduzir o amargor, e sal e acidez tendem a contrariar os efeitos do umami.","Às vezes a melhor harmonização faz-se no tempero do prato, não na troca de vinho."]},
   {t:"p", q:"Arroz de cogumelos, rico em umami e pouco salgado, e um tinto com 15% de álcool. O calor do álcool vai parecer…", o:MAIS, a:0,
    e:["O vinho pode parecer quente e pesado.","O umami tende a fazer o álcool parecer mais quente na boca.","Com pratos muito ricos em umami, vinhos de álcool moderado e pouco tânicos tendem a resultar melhor."]}]}
 ]},
 {n:3, t:"Gordura e Picante", depois:"a Fase 3 · A Adega", cars:[
  {id:"gordura", nome:"Gordura", giz:"Gordura amacia o tanino", micro:"Azeite, queijo, enchidos e fritos tendem a amaciar os taninos. Acidez viva ou bolha deixam a boca limpa entre garfadas. \"Cortar a gordura\" é uma imagem: muda a sensação, não o prato.", qs:[
   {t:"c", q:"Leitão da Bairrada e um tinto de Baga, de taninos firmes. O que tende a acontecer aos taninos?", o:["Parecem mais macios","Parecem mais ásperos","Desaparecem do vinho","Ficam iguais"], a:0,
    e:["O tinto parece mais suave.","Adstringência e sensação de gordura puxam em sentidos opostos; estudos de perceção mostram que alternar as duas tende a equilibrá-las. O sal do leitão também ajuda.","Pratos gordos, como o leitão, tendem a aceitar tintos de taninos firmes, como um Baga. Na Bairrada, o espumante é o outro par clássico."]},
   {t:"c", q:"Peixinhos da horta (feijão-verde em polme, frito) e um espumante da Bairrada. Porque é que esta dupla costuma agradar?", o:["A acidez e a bolha deixam sensação de limpeza depois do frito","O espumante dissolve a gordura do frito no estômago","A bolha tira as calorias e torna o frito mais leve","O espumante tem gordura própria, que combina com a do polme"], a:0,
    e:["A boca fica mais fresca entre garfadas.","A acidez faz salivar e a bolha dá frescura. Não há prova de que o vinho dissolva a gordura.","Com fritos, procura acidez alta ou bolha; um espumante ou um Vinho Verde são exemplos."]},
   {t:"p", q:"Seitan panado e frito e um branco de acidez baixa, sem bolha. A sensação na boca vai ficar…", o:["↑ Mais fresca","↓ Mais pesada"], a:1,
    e:["O conjunto pode parecer pesado.","Sem acidez a fazer salivar, nada dá a sensação de limpeza entre garfadas.","Com fritos e pratos de muito azeite, procura brancos de acidez viva; um Arinto ou um Alvarinho podem ser exemplos."]},
   {t:"p", q:"Queijo da Serra e um tinto do Dão de taninos firmes (Touriga Nacional). A aspereza dos taninos vai parecer…", o:MAIS, a:1,
    e:["Os taninos tendem a parecer mais polidos.","Aqui há dois fatores no mesmo sentido: a gordura tende a suavizar a adstringência e o sal do queijo também ajuda.","Queijos gordos e curados tendem a ir bem com tintos firmes, como um do Dão."]},
   {t:"p", q:"Verdadeiro ou falso? Quando se diz que o vinho \"corta a gordura\", o que muda é a sensação na boca, não a gordura do prato.", o:VF, a:0,
    e:["A sensação de peso e de gordura na boca.","Acidez e bolha refrescam; nenhuma reação no copo tira gordura ao prato.","Explica a escolha ao cliente pelo efeito (\"refresca entre garfadas\"), não por química inventada."]}]},
  {id:"picante", nome:"Picante", giz:"Malagueta + álcool = ardor", micro:"Picante é a malagueta (piri-piri); cominhos ou canela dão sobretudo aroma. Com malagueta, o álcool tende a arder mais e os taninos notam-se mais. Álcool moderado e um toque de doçura tendem a acalmar. Varia de pessoa para pessoa.", qs:[
   {t:"c", q:"Qual destes ingredientes traz ardor, e não apenas aroma?", o:["Piri-piri","Cominhos","Canela","Coentros"], a:0,
    e:["Com piri-piri, o vinho pode parecer mais quente.","A capsaicina provoca uma sensação de ardor; cominhos, canela e coentros perfumam sem esse efeito.","Antes de escolher, pergunta: isto arde ou só perfuma?"]},
   {t:"c", q:"Porque é que um tinto com muito álcool pode arder mais com piri-piri?", o:["A capsaicina e o álcool ativam o mesmo sensor de ardor na boca","O piri-piri aumenta o teor de álcool do vinho que fica na boca","O álcool apaga o picante, mas deixa o vinho mais amargo","É só impressão: o álcool e o picante não se influenciam"], a:0,
    e:["O ardor soma-se.","A capsaicina ativa um recetor de calor e dor (TRPV1); o álcool torna esse recetor mais sensível. O vinho tem o mesmo álcool; tu tendes a senti-lo mais. A sensibilidade varia de pessoa para pessoa.","Com pratos picantes, prefere álcool moderado; um Vinho Verde leve é um exemplo."]},
   {t:"p", q:"Frango de churrasco bem picante, com piri-piri, e um tinto do Alentejo com 15% de álcool. O ardor vai parecer…", o:MAIS, a:0,
    e:["O vinho parece quente, e o prato também.","Álcool alto e capsaicina tendem a somar-se no mesmo sensor.","Guarda os tintos de álcool alto e muito tanino para pratos sem malagueta."]},
   {t:"p", q:"Tofu salteado com piri-piri (picante médio) e um Vinho Verde leve, de álcool baixo e meio-seco. O ardor vai parecer…", o:MAIS, a:1,
    e:["O conjunto fica mais confortável.","Aqui há dois fatores no mesmo sentido: menos álcool soma menos ardor, e o açúcar tende a atenuar a sensação da capsaicina.","Com picante, procura álcool baixo e um toque de doçura; um Vinho Verde meio-seco ou um rosé frutado são exemplos."]},
   {t:"p", q:"Carne de porco à alentejana, temperada com massa de pimentão e cominhos, sem malagueta, e um tinto do Alentejo. O ardor do álcool vai parecer…", o:["↑ Muito mais evidente","Praticamente igual"], a:1,
    e:["Pouco; as especiarias dão aroma, não ardor.","A massa de pimentão (de pimento doce) e os cominhos não trazem o ardor da malagueta.","Não é preciso fugir do tinto só porque o prato tem especiarias. O que pede cuidado é o picante."]}]}
 ]},
 // Mesa 4 (19 out 2026): texto editorial da autora; fonte em fases/vinho-seco/mesa4.py
 {"n":4,"t":"Seco… em que sentido?","depois":"o Tawny","eb":"Serviço de sala","desc":"Distingue doçura, aromas frutados e adstringência, e esclarece o pedido do cliente antes de recomendar.","intro":[{"t":"Preferes seco ou doce?","x":["Brancos, tintos, rosés e espumantes podem ter diferentes níveis de doçura. Gostar de um destes estilos é só o começo: ainda há muito por escolher."],"tr":"Comecemos pelo “seco”: o que significa, afinal?"},{"t":"O que significa “seco”?","x":["Num vinho seco, a doçura é geralmente pouco ou nada percetível. Isso não significa necessariamente zero açúcar.","Durante a fermentação, as leveduras transformam os açúcares da uva em álcool. O açúcar que não é consumido contribui para o açúcar residual do vinho."],"tr":"Mas um vinho seco também pode lembrar fruta madura."},{"t":"Frutado também pode ser seco","x":["Pêssego, morango, ameixa… São aromas que podemos reconhecer ao cheirar o vinho e durante o gole.","Um vinho muito frutado pode continuar a ser seco. Esses aromas podem sugerir doçura, mas não revelam quanto açúcar tem."],"tr":"E aquela sensação de boca seca? É outra característica."},{"t":"Quando o vinho seca a boca","x":["A sensação de secura ou aspereza nas gengivas e no interior das bochechas chama-se adstringência. Nos vinhos, está muito associada aos taninos.","Um vinho pode ser seco, frutado e macio ao mesmo tempo."],"fala":"“Agora vamos à sala. Quando alguém pede um vinho ‘seco’ ou ‘docinho’, como descobres o que procura?”"}],"cars":[{"id":"diferencas","nome":"Perceber as diferenças","giz":"Doçura, fruta e adstringência são diferentes","qs":[{"t":"c","l":"Parte 1 · Perceber as diferenças","q":"Um tinto seco tem aromas intensos de ameixa madura. Estas características são compatíveis?","o":["Sim: um vinho seco pode ser muito frutado","Não: fruta madura significa sempre açúcar elevado","Apenas se o vinho tiver estagiado em barrica","Apenas se o vinho tiver pouco álcool"],"a":0,"e":"“Frutado” descreve o perfil aromático. Um vinho pode lembrar ameixa madura e ter pouco açúcar residual."},{"t":"c","l":"Parte 1 · Perceber as diferenças","q":"Provas um tinto e sentes as gengivas ásperas, como se houvesse mais atrito. Como se chama essa sensação?","o":["Acidez","Doçura","Adstringência","Corpo"],"a":2,"e":"A adstringência é uma sensação de secura e atrito. Os taninos podem provocá-la ao interagir com componentes da saliva. Não indica quanto açúcar tem o vinho.","fonte":"Watrelot, Heymann e Waterhouse, J. Agric. Food Chem. (UC Davis)"},{"t":"c","l":"Parte 1 · Perceber as diferenças","q":"Um branco cheira a pêssego. O que podes concluir apenas pelo aroma?","o":["É um vinho doce, porque o pêssego é uma fruta doce","É um vinho meio seco, entre o seco e o doce","Tem pouco álcool, como a maioria dos vinhos frutados","Tem uma nota frutada, mas ainda não sabes se é doce"],"a":3,"e":"Reconhecer uma fruta no aroma não permite determinar a doçura. O mesmo tipo de aroma pode aparecer em vinhos secos e doces."},{"t":"c","l":"Parte 1 · Perceber as diferenças","q":"Dois tintos são secos. Um é macio; o outro deixa a boca áspera. Como se explica?","o":["O vinho macio tem necessariamente mais açúcar residual","Podem ter pouca doçura e diferentes níveis de adstringência","O vinho áspero tem necessariamente mais álcool e menos fruta","Um deles foi classificado de forma errada no rótulo"],"a":1,"e":"Doçura e adstringência são características diferentes. Um vinho seco pode ter taninos suaves ou provocar uma sensação de aspereza mais marcada."}]},{"id":"pedido","nome":"Entender o pedido","giz":"Pergunta pela sensação antes de escolher","micro":"“Já distingues as sensações. Agora falta perceber quais delas o cliente procura.”","qs":[{"t":"c","l":"Parte 2 · Entender o pedido","q":"Um cliente pede “um tinto docinho, mas não Porto”. Qual é o melhor primeiro passo?","o":["Escolher logo o tinto mais frutado e maduro que houver na carta","Recomendar o tinto com mais álcool da carta","Perguntar se procura alguma doçura ou um vinho macio e frutado","Escolher um tinto com bastante madeira e baunilha"],"a":2,"e":"“Docinho” pode referir-se a açúcar, fruta ou maciez. Ainda não tens informação suficiente para escolher.","s":"“Procura alguma doçura na boca ou um vinho sem doçura, mas macio e frutado?”"},{"t":"c","l":"Parte 2 · Entender o pedido","q":"Uma cliente confirma que quer um branco com doçura percetível. Os brancos tranquilos da carta são todos secos. O que fazes?","o":["Apresento o branco mais floral como se fosse doce","Escolho o branco com mais álcool e digo que é mais doce","Sirvo um Porto Branco sem voltar a perguntar o que ela prefere","Explico o que temos e vejo com ela se alguma alternativa lhe agrada"],"a":3,"e":"Um branco aromático não substitui automaticamente um branco doce. Explica a oferta com clareza e deixa a cliente decidir se quer experimentar outro estilo.","s":"“Os nossos brancos tranquilos são secos. Posso mostrar-lhe as outras opções da carta, se quiser.”"},{"t":"c","l":"Parte 2 · Entender o pedido","q":"Um cliente pede um vinho “suave”. Que pergunta esclarece melhor o pedido?","o":["“Prefere um vinho jovem e fresco ou um vinho mais velho e evoluído?”","“Procura alguma doçura ou quer sobretudo evitar a sensação de aspereza?”","“Prefere um vinho de uma região quente, como o Alentejo?”","“Gosta de vinhos que estagiaram em barrica de carvalho?”"],"a":1,"e":"“Suave” pode descrever maciez na conversa e também pode estar associado à doçura, conforme as referências do cliente. Perguntar sobre a sensação evita assumir o significado."},{"t":"c","l":"Parte 2 · Entender o pedido","q":"O cliente esclarece: “Não quero doçura. Gosto de fruta madura, mas não gosto que o vinho agarre nas gengivas.” Qual perfil corresponde melhor?","o":["Doce e com taninos firmes","Seco e muito adstringente","Seco, frutado e com taninos suaves","Meio doce, leve e pouco aromático"],"a":2,"e":"O pedido já está claro: pouca ou nenhuma doçura percetível, fruta madura e pouca adstringência. Procura esse conjunto no vinho, em vez de escolher apenas pela casta."}]},{"id":"contexto","nome":"Interpretar o contexto","giz":"“Seco” depende da categoria","micro":"“No rótulo, a palavra ‘seco’ também precisa de contexto. A categoria do vinho faz diferença.”","qs":[{"t":"c","l":"Parte 3 · Interpretar o contexto","q":"Comparas dois espumantes portugueses: um “Bruto” e outro “Extra Seco”. Qual destas categorias corresponde a menos açúcar?","o":["Extra Seco","Bruto","São equivalentes","A categoria não dá informação sobre açúcar"],"a":1,"e":"Na escala dos espumantes, Bruto corresponde a menos açúcar do que Extra Seco. Não basta comparar o sentido habitual das palavras: é preciso conhecer a categoria.","fonte":"Regulamento Delegado (UE) 2019/33, Anexo III, parte A"},{"t":"c","l":"Parte 3 · Interpretar o contexto","q":"Um cliente espera que um Porto Branco Seco tenha tão pouco açúcar como um branco tranquilo seco. O que deves explicar?","o":["“Seco” significa sempre a mesma quantidade de açúcar, em qualquer vinho","O Porto Branco Seco não tem açúcar nenhum, tal como o branco seco","O Porto só se torna seco depois de muitos anos de envelhecimento","As duas categorias usam critérios diferentes para a indicação “seco”"],"a":3,"e":"Um Porto classificado como seco pode ter bastante mais açúcar do que um branco tranquilo seco. A mesma palavra não corresponde aos mesmos limites nestas categorias.","s":"“Este Porto é seco dentro da classificação dos Portos, mas pode sentir mais doçura do que num branco tranquilo seco.”","fonte":"Caderno de especificações DOP Porto (IVDP); Reg. Delegado (UE) 2019/33, Anexo III, parte B"},{"t":"c","l":"Parte 3 · Interpretar o contexto","q":"Um branco tem algum açúcar residual, mas a doçura parece discreta. Que característica pode contribuir para isso?","o":["Uma acidez que torna a doçura menos evidente","Uma cor muito clara, que faz o vinho parecer leve","A ausência de qualquer estágio em madeira","Uma garrafa mais antiga, já com alguns anos"],"a":0,"e":"A acidez pode atenuar a doçura percebida. O açúcar continua presente: o que muda é a forma como sentimos o equilíbrio do vinho.","fonte":"Zamora, Goldner e Galmarini, Journal of Sensory Studies 21 (2006)"},{"t":"c","l":"Parte 3 · Interpretar o contexto","q":"Um cliente prova um vinho seco e diz: “Para mim, parece doce.” Qual é a melhor resposta?","o":["“É seco, por isso não pode sentir doçura nenhuma neste vinho.”","“Então a ficha técnica deve estar errada; vou confirmar com o produtor.”","“O que lhe dá essa impressão: a doçura na boca ou os aromas de fruta madura?”","“Deve ser o álcool; num vinho seco é sempre isso que parece doce.”"],"a":2,"e":"A classificação e a experiência de quem prova não são a mesma coisa. Os aromas podem contribuir para uma impressão de doçura. Esclarece a sensação e usa essa informação para ajustar a recomendação.","fonte":"Sáenz-Navajas et al., Food Chemistry 121 (2010)"}]}],"fecho":"Seco, frutado e macio podem descrever o mesmo vinho. Na próxima recomendação, começa por perceber que sensação o cliente procura."}
];

function aulaHTML(car){
  return `<div class="aula aula-${state.char}">
    ${somm("idle").replace('class="mascot somm','class="mascot somm m-aula')}
    <div class="lousa">
      <svg viewBox="0 0 100 86" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${GIZ[car.id]||""}</g></svg>
      <b>${esc(car.nome)}</b><span class="lousa-giz">${esc(car.giz)}</span></div></div>`;
}

function startMesa(n){
  const m = MESAS[n-1], passos = [];
  (m.intro||[]).forEach((c,k)=>passos.push({intro:c, k, n:m.intro.length}));
  m.cars.forEach(c=>{ if(c.micro) passos.push({micro:c}); c.qs.forEach(q=>{
    if(q.t!=="c") return passos.push({car:c, q});
    const ord = baralha(q.o.map((_,k)=>k));
    passos.push({car:c, q:Object.assign({}, q, {o:ord.map(k=>q.o[k]), a:ord.indexOf(q.a)})});
  }); });
  MS = {m, passos, i:0, certas:0, total:passos.filter(p=>p.q).length, kg:0, seguidas:0, ans:null};
  if(LIVRE) try{ const r = JSON.parse(localStorage.getItem("gtk-mesa-"+n)||"null");
    if(r && r.i>0 && r.i<passos.length) Object.assign(MS, {i:r.i, certas:r.certas||0, kg:r.kg||0, seguidas:r.seguidas||0}); }catch(e){}
  renderMesa(); scrollTo(0,0);
}
function mesaHud(){
  const pct = MS.i/MS.passos.length*100, p = MS.passos[MS.i], c = p.micro||p.car||{nome:MS.m.t};
  return `<div class="hud"><button class="close" data-sair aria-label="Voltar à vinha">×</button>${soundBtn()}
    <div class="bar" aria-label="Passo ${MS.i+1} de ${MS.passos.length}"><span style="width:${pct}%"></span></div></div>
    <div class="stats"><span>À mesa ${MS.m.n} · <b>${c.nome}</b></span><span>${MS.seguidas>1?`<span class="streak">${MS.seguidas} seguidas</span> · `:""}<b>${MS.kg}</b> kg</span></div>`;
}
function mesaExpl(Q){ return (typeof Q.e==="string" ? chave("", Q.e) : chave("O que muda", Q.e[0]) + mais("Saber mais", maisBloco("Porquê", Q.e[1]) + maisBloco("Como usar", Q.e[2])))
  + (Q.s ? `<div class="mesa-sala">${maisBloco("Na sala", Q.s)}</div>` : ""); }
function mesaItens(ps, n){ return ps.map(p=>({eb:`Serviço ${SERV[n]} · ${p.car.nome}`, q:p.q.q, o:p.q.o.slice(), a:p.q.a, fixa:p.q.o.length===2, expl:mesaExpl(p.q), somm:true})); }
function mesaVoltar(){ const i = MS.ans!==null ? MS.i : MS.i-1, h = (MS.hist||[])[i];
  if(h) Object.assign(MS, h); MS.i = i; MS.ans = null; renderMesa(); }
function mesaAvancar(){ MS.ans = null; MS.i++; if(MS.i>=MS.passos.length) return mesaFim(); renderMesa(); }
function renderMesa(){
  const p = MS.passos[MS.i];
  // modo de autora: guarda o passo para a mesa retomar aqui
  if(LIVRE) try{ localStorage.setItem("gtk-mesa-"+MS.m.n, JSON.stringify({i:MS.i, certas:MS.certas, kg:MS.kg, seguidas:MS.seguidas})); }catch(e){}
  if(p.intro){
    const c = p.intro, ult = p.k===p.n-1;
    $app.innerHTML = `${mesaHud()}${testeBar(MS.i>0)}
      <section class="mi-card" aria-live="polite">
        <div class="mi-top">${somm("idle")}<span class="mi-n">${p.k+1} de ${p.n}</span>
          <span class="mi-dots" aria-hidden="true">${Array.from({length:p.n},(_,j)=>`<i${j<=p.k?' class="on"':""}></i>`).join("")}</span></div>
        <h2 class="mi-t">${esc(c.t)}</h2>
        ${c.x.map(t=>`<p class="micro-txt">${esc(t)}</p>`).join("")}
        ${c.tr?`<p class="mi-tr">${esc(c.tr)}</p>`:""}
        ${c.fala?`<div class="bubble mesa-micro mi-fala"><div class="qlabel">${who()} explica</div><p class="micro-txt">${esc(c.fala)}</p></div>`:""}
      </section>
      <div class="mi-nav">${p.k>0?`<button class="ghost" id="back">Voltar</button>`:""}<button class="cta" id="next">${ult?"Vamos experimentar":"Continuar"}</button></div>`;
    document.getElementById("next").onclick = ()=>{ UVA.sfx("tap"); MS.i++; renderMesa(); scrollTo(0,0); };
    const bk = document.getElementById("back"); if(bk) bk.onclick = ()=>{ UVA.sfx("tap"); MS.i--; renderMesa(); scrollTo(0,0); };
    document.getElementById("next").focus({preventScroll:true});
    ligarTeste(mesaVoltar, mesaAvancar);
    return;
  }
  if(p.micro){
    $app.innerHTML = `${mesaHud()}${testeBar(MS.i>0)}
      ${aulaHTML(p.micro)}
      <div class="bubble mesa-micro"><div class="qlabel">${who()} explica</div><p class="micro-txt">${esc(p.micro.micro)}</p></div>
      <button class="cta" id="next">Percebi. Testa-me</button>`;
    document.getElementById("next").onclick = ()=>{ UVA.sfx("tap"); MS.i++; renderMesa(); };
    ligarTeste(mesaVoltar, mesaAvancar);
    return;
  }
  const Q = p.q, done = MS.ans!==null, ok = done && MS.ans===Q.a, dois = Q.o.length===2;
  const label = Q.l || (Q.t==="c" ? "Compreender" : "Prever") + " · " + p.car.nome;
  $app.innerHTML = `${mesaHud()}${testeBar(done || MS.i>0)}
    <div class="stage uva-q mesa-q${done?" feito":""}">${somm(done?(ok?"happy":"corked"):"idle")}
      <div class="bubble"><div class="qlabel">${label}</div><p class="qtext">${esc(Q.q)}</p></div></div>
    <div class="opts${dois?" vf prever":""}">${Q.o.map((t,k)=>{ let c="opt"; if(done){ if(k===Q.a) c+=" right"; else if(k===MS.ans) c+=" wrong"; }
      return `<button class="${c}" id="opt-${k}" data-k="${k}" ${done?"disabled":""}>${esc(t)}</button>`; }).join("")}</div>
    ${done?`<div class="fb ${ok?"good":"bad"}" role="status"><h2>${ok?pick(CHEERS):pick(CORKS)}</h2>
      ${mesaExpl(Q)}
      <button class="cta" id="next">${MS.i+1>=MS.passos.length?"Ver o resultado":"Continuar"}</button></div>`:""}`;
  // teclado: 1-4 escolhem a opção (como na Uva)
  document.onkeydown = e=>{ if(MS.ans!==null || !$app.querySelector(".mesa-q") || e.metaKey||e.ctrlKey||e.altKey) return;
    const el = /^[1-4]$/.test(e.key) && $app.querySelector("#opt-"+(+e.key-1)); if(el){ e.preventDefault(); el.click(); } };
  ligarTeste(mesaVoltar, mesaAvancar);
  if(!done){
    $app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
      (MS.hist = MS.hist||[])[MS.i] = {certas:MS.certas, seguidas:MS.seguidas, kg:MS.kg, falhas:(MS.falhas||[]).slice()};
      MS.ans = +b.dataset.k;
      if(MS.ans===Q.a){ MS.certas++; MS.seguidas++; MS.kg += 10 + Math.min(MS.seguidas-1,4)*2; UVA.sfx("certo"); }
      else { MS.seguidas = 0; MS.falhas = (MS.falhas||[]).concat(p); UVA.sfx("errado"); }
      renderMesa();
    });
  } else {
    const n = document.getElementById("next"); n.focus({preventScroll:true}); verFb();
    n.onclick = ()=>{ UVA.sfx("tap"); MS.ans = null; MS.i++; if(MS.i>=MS.passos.length) return mesaFim(); renderMesa(); };
  }
}
function mesaFim(){
  const {m, certas, total, kg} = MS, perfeita = certas===total, ant = T.mesas[m.n];
  try{ localStorage.removeItem("gtk-mesa-"+m.n); }catch(e){}
  if(!ant || certas>ant.certas) T.mesas[m.n] = {certas, total};
  colher(kg); tsave();
  const errosM = mesaItens(MS.falhas||[], m.n);
  if(typeof PERC!=="undefined" && PERC && PERC.passo==="mesa") return percursoMesa({certas, n:total, kg, erros:errosM, temas:m.cars.map(c=>c.nome)});
  const nomes = m.cars.map(c=>I18N.tr(c.nome).toLowerCase()), lista = nomes.length>1 ? nomes.slice(0,-1).join(", ")+({en:" and ",es:" y "}[LANG]||" e ")+nomes.at(-1) : nomes[0];
  // Feedback proporcional: <50% rever, 50-79% consolidar, 80-99% bom resultado, 100% mesa perfeita.
  const pct = certas/total;
  let [tit, cls, mood, lead, bt] =
      perfeita ? ["Serviço perfeito!","v-up","happy",`${certas} em ${total}: previste todos os efeitos de ${lista}. Leva estas pistas para a próxima refeição e confirma-as no copo.`,"Jogar outra vez"]
    : pct>=.8  ? ["Bem servido!","v-up","happy",`${certas} em ${total}. Boa leitura de ${lista}. Revê as pistas abaixo e vai à mesa perfeita.`,"Quero a mesa perfeita"]
    : pct>=.5  ? ["A mesa está a compor-se","v-stay","idle",`${certas} em ${total}. Já reconheces parte dos efeitos de ${lista}. Mais uma ronda ajuda a consolidar.`,"Jogar outra vez"]
    :            ["Vamos rever a mesa","v-stay","idle",`${certas} em ${total}. Estes efeitos pedem prática. Relê as pistas abaixo e volta a provar: cada ronda afina o palato.`,"Rever e jogar outra vez"];
  if(m.fecho) lead = `${certas} em ${total}. ${m.fecho}`;
  const desenhar = rev=>{
  $app.innerHTML = `<section class="end">
    <div class="end-head">${somm(mood)}
      <div class="eyebrow">À mesa ${m.n} · ${m.t}</div>
      <h1 class="verdict ${cls}">${tit}</h1>
      <p class="lead">${lead}</p></div>
    <div class="tally" role="list">
      <div role="listitem"><b>${certas}<small>/${total}</small></b><span>certas</span></div>
      <div role="listitem"><b>${total-certas}</b><span>${total-certas===1?"erro":"erros"}</span></div>
      <div role="listitem"><b>${kg}</b><span>kg colhidos</span></div>
    </div>
    <div class="pistas"><h3>As pistas desta mesa</h3><ul>${m.cars.map(c=>`<li><b>${esc(c.nome)}</b><span>${esc(c.giz)}</span></li>`).join("")}</ul></div>
    ${errosM.length?`<details class="rever"><summary>Para rever</summary>${listaErros(errosM)}${notaRev(rev)}</details>`:""}
    <div class="end-actions">${m.fecho?`
      <button class="cta" id="home">Continuar</button>
      ${errosM.length?`<button class="ghost" id="rev">${rev?"Rever outra vez":"Rever os erros desta mesa"}</button>`:""}
      <button class="ghost" id="again">Jogar outra vez</button>`:`
      ${errosM.length&&!rev?`<button class="cta" id="rev">Rever os erros desta mesa</button>`:""}
      <button class="${errosM.length&&!rev?"ghost":"cta"}" id="again">${bt}</button>
      ${errosM.length&&rev?`<button class="ghost" id="rev">Rever outra vez</button>`:""}
      <button class="ghost" id="home">Voltar à vinha</button>`}
    </div></section>`;
  document.getElementById("again").onclick = ()=>startMesa(m.n);
  document.getElementById("home").onclick = renderStart;
  const rb = document.getElementById("rev"); if(rb) rb.onclick = ()=>{ UVA.sfx("tap"); rever(errosM, r=>{ desenhar(r); scrollTo(0,0); }); };
  document.getElementById(m.fecho?"home":errosM.length&&!rev?"rev":"again").focus({preventScroll:true});
  scrollTo(0,0);
  };
  desenhar(null);
}

vinho tinto ganha cor porque fermenta com…", "o": ["As películas", "As grainhas", "O engaço", "A pruína"], "a": 0, "k": "O tinto ganha cor a fermentar com as películas.", "e": "Películas: os pigmentos passam da película para o mosto durante a maceração. Na maioria das castas, o sumo é claro — há exceções tintureiras.", "tema": "bago", "sala": "Num rosé, as películas costumam estar pouco tempo com o mosto; num tinto, mais. A casta e o método também contam para a cor."}, {"id": "uva-1-11", "nivel": 1, "tipo": "vf", "q": "As uvas tintas têm quase sempre a polpa tinta.", "a": false, "k": "Polpa quase sempre clara; a cor está na película.", "e": "Falso! Na maioria das castas tintas, a polpa é clara e a cor vem da película. As tintureiras são a exceção que confirma a regra — e que pinta também a polpa.", "tema": "bago", "sala": "Exemplo clássico de tintureira: a Alicante Bouschet, muito plantada no Alentejo, tem polpa tinta e dá tintos muito escuros."}, {"id": "uva-1-12", "nivel": 1, "tipo": "escolha", "q": "Os taninos deixam a boca…", "o": ["Seca e áspera, como chá forte", "Mais quente, como depois de um gole de aguardente", "Com ardor, como depois de um prato picante", "Fresca e a salivar, como depois de um limão"], "a": 0, "k": "Taninos: a boca seca, como chá forte.", "e": "Os taninos dão adstringência: a boca fica seca e ligeiramente áspera, como depois de um chá preto bem carregado. Não é falta de água no copo; são os taninos a interagir com proteínas da saliva.", "tema": "composicao", "sala": "Quando um cliente diz que o tinto \"seca a boca\", está a falar de taninos, e não de acidez nem de álcool."}, {"id": "uva-1-15", "nivel": 1, "tipo": "vf", "q": "A pruína é sujidade e deve ser lavada antes de fazer vinho.", "a": false, "k": "A pruína é cera natural: fica onde está.", "e": "Falso: a pruína é uma cera natural, não sujidade. As leveduras podem estar na superfície da uva, mas a pruína não é uma “casa de leveduras” garantida — a fermentação espontânea depende de uma comunidade de microrganismos.", "tema": "bago"}, {"id": "uva-1-17", "nivel": 1, "tema": "bago", "tipo": "vf", "q": "As uvas brancas não têm taninos nenhuns.", "a": false, "k": "Uva branca tem alguns taninos; o vinho branco, poucos.", "e": "Falso: têm alguns, na película e nas grainhas. O vinho branco fica com poucos porque normalmente fermenta sem as películas.", "sala": "Muitos brancos de talha do Alentejo fermentam com as películas, por isso podem ter mais cor e alguma textura de tanino."}, {"id": "uva-1-18", "nivel": 1, "tema": "especies", "tipo": "vf", "q": "As uvas de mesa costumam ter bagos maiores e película mais fina do que as uvas de vinho.", "a": true, "k": "Mesa: bago grande, pele fina. Vinho: mais pequeno, pele grossa.", "e": "Verdadeiro, em regra: as de mesa são escolhidas para comer. As de vinho tendem a ter bagos mais pequenos e mais película, onde estão cor, taninos e aromas. Há exceções em cada casta.", "sala": "Se um cliente perguntar por que não se faz vinho com uvas de mesa: as castas de vinho são escolhidas pela película, pela acidez e pelo açúcar."}, {"id": "uva-1-19", "nivel": 1, "tema": "bago", "tipo": "escolha", "q": "Na vindima, o que se colhe?", "o": ["As uvas", "As folhas", "Os sarmentos", "Os gomos"], "a": 0, "k": "Na vindima colhe-se a uva madura.", "e": "As uvas. À mão, corta-se o cacho inteiro; à máquina, abana-se a videira e soltam-se sobretudo os bagos. Em qualquer caso, quer-se a uva madura, não as folhas nem os sarmentos.", "rever": true}, {"id": "uva-1-20", "nivel": 1, "tema": "composicao", "tipo": "escolha", "q": "O sumo de uva, antes de fermentar, chama-se…", "o": ["Mosto", "Vinho", "Xarope", "Bagaço"], "a": 0, "k": "Mosto: sumo de uva que ainda não é vinho.", "e": "Mosto: o sumo de uva recém-esmagada, por vezes ainda com películas e grainhas. Depois da fermentação alcoólica, passa a vinho — mudança de carreira oficial.", "sala": "No Vinho do Porto, junta-se aguardente vínica ao mosto a meio da fermentação. Esta para, e por isso o vinho fica doce e mais alcoólico."}, {"id": "uva-1-21", "nivel": 1, "tema": "bago", "tipo": "escolha", "q": "Depois de prensar, o que sobra (películas, grainhas e engaço) chama-se…", "o": ["Bagaço", "Mosto", "Borras", "Cortiça"], "a": 0, "k": "Bagaço: o que sobra na prensa.", "e": "Bagaço: o conjunto de partes sólidas que sobra da prensagem, sobretudo películas e grainhas (e engaço, se não tiver sido retirado). Pode ser destilado para fazer aguardente bagaceira.", "sala": "A aguardente bagaceira, que se oferece como digestivo, é destilada a partir do bagaço."}, {"id": "uva-1-24", "nivel": 1, "tema": "composicao", "tipo": "escolha", "q": "Que sabores vêm da polpa?", "o": ["Doce e ácido", "Amargo e áspero", "Doce e amargo", "Ácido e adstringente"], "a": 0, "k": "Da polpa vêm o doce e o ácido.", "e": "Doce, pelos açúcares; ácido, sobretudo pelos ácidos tartárico e málico. A adstringência vem muito dos taninos da película e das grainhas — o bago tem várias “vozes” no paladar.", "sala": "Doce e ácido vêm da polpa; o amargo e a secura na boca vêm sobretudo da película e das grainhas."}, {"id": "uva-1-25", "nivel": 1, "tema": "bago", "tipo": "tocar", "q": "Toca na parte que se tira no desengace.", "a": "engaco", "k": "Desengace: tirar o engaço antes de fermentar.", "e": "O engaço. Retirá-lo chama-se desengace; pode reduzir taninos e notas vegetais, embora alguns estilos de vinho mantenham parte dos engaços de propósito.", "sala": "Um tinto feito com parte dos engaços pode ter mais tanino e notas mais vegetais."}, {"id": "uva-1-26", "nivel": 1, "tema": "bago", "tipo": "tocar", "q": "Toca na parte que guarda aromas a fruta e a flores.", "a": "pelicula", "k": "Aromas: na película e logo por baixo dela.", "e": "A película e a polpa logo por baixo: aí se concentra boa parte do potencial aromático, embora isso varie com a casta e o composto.", "sala": "Um branco aromático de Loureiro ou Alvarinho deve muito do aroma à película e à polpa junto dela."}, {"id": "uva-1-27", "nivel": 1, "tema": "bago", "tipo": "tocar", "q": "Toca na parte que é quase toda água.", "a": "polpa", "k": "Polpa: quase toda água, com açúcar e ácidos.", "e": "A polpa é maioritariamente água, com açúcares e ácidos dissolvidos. É o sumo antes de alguém lhe chamar mosto — e antes da fermentação mudar o guião."}, {"id": "uva-1-28", "nivel": 1, "tema": "composicao", "tipo": "escolha", "q": "Um bago de uva madura é, sobretudo…", "o": ["Água", "Açúcar", "Álcool", "Ácido"], "a": 0, "k": "Um bago maduro é, sobretudo, água.", "e": "Sobretudo água — muitas vezes cerca de 70–80% do peso — e depois açúcares, cuja proporção depende da casta e da maturação. Os números são aproximados; cada bago tem o seu pequeno boletim meteorológico."}, {"id": "uva-1-29", "nivel": 1, "tema": "composicao", "tipo": "vf", "q": "Os taninos do vinho vêm só da madeira das barricas.", "a": false, "k": "Taninos: primeiro da uva, às vezes da barrica.", "e": "Falso. As películas e as grainhas fornecem taninos da uva; a madeira pode acrescentar outros, como os taninos elágicos do carvalho. Dois contributos, origens diferentes.", "sala": "Um tinto pode ser tânico sem ter estado em barrica: os taninos vêm sobretudo da uva."}, {"id": "uva-2-01", "nivel": 2, "tipo": "escolha", "q": "Quais são os dois açúcares principais da polpa?", "o": ["Glucose e frutose", "Sacarose e lactose", "Só sacarose", "Maltose e amido"], "a": 0, "k": "Glucose e frutose: o doce da uva.", "e": "Glucose e frutose são os açúcares principais da uva madura. A proporção entre as duas pode variar; juntas, representam quase todo o açúcar do bago.", "tema": "composicao", "sala": "Num Moscatel de Setúbal, a doçura vem sobretudo da glucose e da frutose da uva que ficaram por fermentar: a adição de aguardente interrompe a fermentação."}, {"id": "uva-2-02", "nivel": 2, "tipo": "escolha", "q": "Qual é o ácido mais característico da uva?", "o": ["Tartárico", "Cítrico", "Acético", "Láctico"], "a": 0, "k": "Tartárico: o ácido de assinatura da uva.", "e": "O tartárico é um dos ácidos mais característicos da uva, ao lado do málico. O acético é conhecido do vinagre — no vinho, em excesso, já não é convidado.", "tema": "composicao", "sala": "Os cristais de tartaratos que podem aparecer no fundo da garrafa ou na rolha são inofensivos. Por si só, não indicam um vinho estragado."}, {"id": "uva-2-03", "nivel": 2, "tipo": "escolha", "q": "Onde está a maior parte dos aromas da uva?", "o": ["Na película e logo por baixo dela", "No engaço, que liga os bagos ao cacho", "Nas grainhas, que se partem ao esmagar", "No centro da polpa, junto às grainhas"], "a": 0, "k": "Aromas à flor da pele: na película e logo abaixo.", "e": "Na película e na polpa imediatamente abaixo, embora a distribuição dependa da casta e do composto aromático. O bago não guarda todos os aromas na mesma gaveta.", "tema": "composicao", "sala": "Em alguns brancos, o mosto fica em contacto com as películas antes da fermentação para extrair compostos aromáticos e os seus precursores."}, {"id": "uva-2-04", "nivel": 2, "tipo": "escolha", "q": "Porque é que a uva se prensa com cuidado?", "o": ["Para não partir as grainhas e soltar taninos amargos", "Para não perder a cor", "Para não aquecer o sumo", "Para o mosto não começar a fermentar antes do tempo"], "a": 0, "k": "Prensa suave: grainhas inteiras, menos amargor.", "e": "Para evitar esmagar as grainhas: os seus compostos fenólicos podem trazer amargor e adstringência. Prensagem cuidadosa é delicadeza com fundamento científico.", "tema": "bago", "sala": "Uma prensagem mais intensa pode extrair compostos que dão amargor e adstringência. Mas um final amargo, sozinho, não permite concluir como o vinho foi prensado."}, {"id": "uva-2-05", "nivel": 2, "tipo": "escolha", "q": "Tirar o engaço antes de fermentar chama-se…", "o": ["Desengace", "Esmagamento", "Prensagem", "Remontagem"], "a": 0, "k": "Desengace: separar os bagos do engaço.", "e": "Desengace: separar os bagos do engaço. Pode limitar taninos e aromas vegetais, mas a decisão depende do estilo pretendido — e, às vezes, alguns enólogos preferem manter os engaços no \"palco\": isso pode trazer mais estrutura e notas vegetais, dependendo do estilo.", "tema": "bago"}, {"id": "uva-2-06", "nivel": 2, "tipo": "escolha", "q": "É possível fazer vinho branco com uvas tintas porque…", "o": ["A polpa é quase sempre clara", "A cor sai na filtração", "As uvas perdem a cor ao amadurecer", "As uvas tintas são lavadas antes"], "a": 0, "k": "Polpa clara e sumo separado depressa: branco de uvas tintas.", "e": "Como a polpa da maioria das castas tintas é clara, separar depressa o sumo das películas permite obter um vinho claro. Em certos estilos, como alguns espumantes, chama-se blanc de noirs.", "tema": "bago", "sala": "Num espumante português, \"Blanc de Noirs\" no rótulo quer dizer branco feito de uvas tintas."}, {"id": "uva-2-07", "nivel": 2, "tipo": "escolha", "q": "O vinho rosé tem pouca cor porque…", "o": ["O sumo fica pouco tempo com as películas", "É feito com uvas cor-de-rosa", "Fermenta a uma temperatura mais baixa do que o tinto", "Envelhece em garrafa transparente"], "a": 0, "k": "Rosé: pouco tempo de sumo com as películas.", "e": "O vinho rosé pode ganhar cor com contacto breve entre sumo e películas; também há rosés feitos por prensagem direta ou por sangria. A cor depende do método e do tempo — não de um cronómetro mágico.", "tema": "bago", "sala": "A cor de um rosé não revela a sua doçura. Um rosé mais claro não é necessariamente mais seco do que um mais escuro."}, {"id": "uva-2-08", "nivel": 2, "tipo": "escolha", "q": "Quase todo o vinho do mundo é feito com uvas de que espécie?", "o": ["Vitis vinifera", "Vitis labrusca", "Vitis riparia", "Vitis rupestris"], "a": 0, "k": "Vitis vinifera: a espécie de quase todo o vinho.", "e": "Vitis vinifera é a espécie por trás da maioria dos vinhos. Outras espécies de Vitis, muitas de origem americana, também são usadas em porta-enxertos, híbridos e alguns vinhos.", "tema": "especies"}, {"id": "uva-2-09", "nivel": 2, "tipo": "escolha", "q": "Touriga Nacional, Alvarinho e Chardonnay são…", "o": ["Castas da mesma espécie", "Espécies diferentes de videira", "Híbridos americanos", "Porta-enxertos"], "a": 0, "k": "Castas diferentes, uma só espécie: Vitis vinifera.", "e": "São castas — variedades cultivadas da mesma espécie, Vitis vinifera. Diferentes nomes, diferentes perfis; nenhuma delas é uma espécie de videira à parte.", "tema": "especies", "sala": "A casta pode dar pistas para apresentar o vinho, mas não conta a história toda: a região e a vinificação também influenciam o estilo."}, {"id": "uva-2-16", "nivel": 2, "tema": "bago", "tipo": "escolha", "q": "Quantas grainhas pode ter um bago, no máximo?", "o": ["4", "2", "6", "10"], "a": 0, "k": "Até quatro grainhas por bago; muitos têm menos.", "e": "Até quatro: o ovário pode formar quatro óvulos, embora muitos bagos acabem com menos grainhas."}, {"id": "uva-2-17", "nivel": 2, "tema": "bago", "tipo": "escolha", "q": "As uvas sem grainhas, como muitas uvas de mesa, chamam-se…", "o": ["Apirenas", "Tintureiras", "Híbridas", "Passas"], "a": 0, "k": "Apirenas: uvas sem grainhas, estrelas da fruteira.", "e": "Apirenas: uvas sem grainhas desenvolvidas, muito comuns como uvas de mesa e passas. Para vinho são menos habituais, mas “quase nunca” é mais seguro do que “nunca”."}, {"id": "uva-2-18", "nivel": 2, "tema": "composicao", "tipo": "escolha", "q": "Os pigmentos que dão cor à película das uvas tintas chamam-se…", "o": ["Antocianinas", "Taninos", "Clorofilas", "Leveduras"], "a": 0, "k": "Antocianinas: os pigmentos que pintam a película.", "e": "Antocianinas: pigmentos da película das uvas tintas. Os taninos também são fenólicos, mas contribuem sobretudo para adstringência e estrutura — primos químicos, funções diferentes.", "sala": "A tonalidade dá pistas sobre a evolução: muitos tintos passam de tons violáceos ou rubi para granada e tijolo. Mas a cor, sozinha, não permite determinar a idade."}, {"id": "uva-2-19", "nivel": 2, "tema": "composicao", "tipo": "escolha", "q": "Os dois ácidos principais da uva são…", "o": ["Tartárico e málico", "Cítrico e acético", "Láctico e cítrico", "Acético e tartárico"], "a": 0, "k": "Tartárico e málico: a dupla ácida da uva.", "e": "Tartárico e málico são os dois principais ácidos da uva. A proporção varia; o málico lembra a acidez da maçã verde e tende a diminuir durante a maturação.", "sala": "Na fermentação malolática, o ácido málico transforma-se em ácido láctico, reduzindo a acidez. Na prova, o vinho pode parecer mais macio."}, {"id": "uva-2-20", "nivel": 2, "tema": "composicao", "tipo": "escolha", "q": "Enquanto a uva amadurece, o que acontece ao açúcar e à acidez?", "o": ["O açúcar sobe e a acidez desce", "Os dois sobem", "Os dois descem", "O açúcar desce e a acidez sobe"], "a": 0, "k": "A amadurecer, o açúcar sobe e a acidez desce.", "e": "Em geral, durante a maturação acumulam-se açúcares e diminui a acidez — sobretudo porque o ácido málico é consumido. O viticultor procura o equilíbrio certo para o vinho desejado, não um número mágico.", "sala": "Em condições semelhantes, uvas de climas mais quentes tendem a acumular mais açúcar e a perder mais acidez. No vinho, isso pode traduzir-se em mais álcool e menos frescura — mas a vindima e a vinificação também contam."}, {"id": "uva-2-21", "nivel": 2, "tema": "especies", "tipo": "escolha", "q": "O que é uma casta?", "o": ["Uma variedade de videira, com características próprias", "Uma região de vinho, com regras de produção próprias", "Um tipo de solo onde a videira cresce melhor", "Uma marca de vinho registada por um produtor"], "a": 0, "k": "Casta: uma variedade de videira com personalidade própria.", "e": "Uma casta é uma variedade cultivada com características próprias; Touriga Nacional, Arinto e Baga são exemplos de Vitis vinifera. Cada uma traz o seu “cartão de cidadão” genético."}, {"id": "uva-2-22", "nivel": 2, "tema": "castas", "tipo": "escolha", "q": "Tinta Roriz e Aragonez são…", "o": ["A mesma casta com nomes diferentes", "Duas castas diferentes do Douro", "Castas brancas", "Um cruzamento e um híbrido"], "a": 0, "k": "Tinta Roriz e Aragonez: uma casta, dois nomes.", "e": "É a mesma casta, Tempranillo: Tinta Roriz e Aragonez são nomes portugueses usados em regiões diferentes. A videira atravessa fronteiras melhor do que os nomes.", "sala": "Tinta Roriz e Aragonez são a mesma casta. Se um cliente gosta de Aragonez do Alentejo, podes explorar um vinho do Douro com Tinta Roriz — sem prometer o mesmo perfil."}, {"id": "uva-2-23", "nivel": 2, "tema": "castas", "tipo": "escolha", "q": "No Tejo, a casta tinta Castelão também é conhecida como…", "o": ["João de Santarém", "Baga", "Trincadeira", "Touriga Franca"], "a": 0, "k": "João de Santarém: o nome da Castelão no Tejo.", "e": "João de Santarém é um dos nomes da Castelão, usado no Tejo. A mesma casta, nome diferente conforme a região. O nome oficial é Castelão, muito plantada na Península de Setúbal.", "fonte": "DN, 'Das margens do Tejo para a mesa' (Castelão conhecida como João de Santarém no Tejo); vinorandum (sinónimos)", "sala": "Na carta, Castelão e João de Santarém são a mesma casta. Diz isso ao cliente para não o confundir."}, {"id": "uva-2-24", "nivel": 2, "tema": "castas", "tipo": "escolha", "q": "Na Bairrada, a casta branca Fernão Pires também é conhecida como…", "o": ["Maria Gomes", "Bical", "Cerceal", "Malvasia Fina"], "a": 0, "k": "Maria Gomes: a Fernão Pires com sotaque da Bairrada.", "e": "Maria Gomes é o nome que a Fernão Pires recebe na Bairrada. A mesma casta, com nome de batismo diferente consoante a região. Lá fora acontece o mesmo: o Alvarinho, na Galiza, chama-se Albariño.", "sala": "Num branco da Bairrada, \"Maria Gomes\" no rótulo é a Fernão Pires."}, {"id": "uva-2-29", "nivel": 2, "tema": "bago", "tipo": "escolha", "q": "Como se chama o pequeno cabinho que prende cada bago ao eixo do cacho?", "o": ["Pedicelo", "Pecíolo", "Gavinha", "Garfo"], "a": 0, "k": "Pedicelo: o cabinho que prende cada bago.", "e": "Pedicelo é o cabinho de cada bago: liga-o ao eixo do cacho. Já o pecíolo liga a folha ao ramo."}, {"id": "uva-3-05", "nivel": 3, "tipo": "escolha", "q": "Qual é a casta tinta de Colares, plantada em pé-franco na areia?", "o": ["Ramisco", "Baga", "Castelão", "Touriga Franca"], "a": 0, "k": "Ramisco: a casta de Colares, em pé-franco na areia.", "e": "A Ramisco é a casta tinta emblemática de Colares. Nos solos arenosos, que dificultam a sobrevivência da filoxera, as videiras podem crescer em pé-franco — sobre as próprias raízes, sem enxertia. Origina tintos de acidez elevada e taninos firmes, que pedem tempo para revelar toda a sua complexidade.", "tema": "castas", "sala": "Um tinto jovem de Ramisco tende a parecer duro e ácido: avisa o cliente e serve-o com comida."}, {"id": "uva-3-06", "nivel": 3, "tipo": "escolha", "q": "A Sercialinho, uma casta portuguesa criada por cruzamento, tem como pais a Vital e a Uva Cão. É fruto de…", "o": ["Cruzamento entre duas castas de Vitis vinifera", "Híbrido entre Vitis vinifera e uma espécie americana", "Porta-enxerto escolhido para resistir à filoxera", "Clone selecionado a partir de uma só videira"], "a": 0, "k": "Sercialinho: cruzamento de duas castas da mesma espécie.", "e": "Vital e Uva Cão são duas castas de Vitis vinifera, por isso a Sercialinho é um cruzamento dentro da mesma espécie, não um híbrido interespecífico. Durante anos pensou-se que um dos pais era o Alvarinho; análises de ADN corrigiram a árvore genealógica. Tal como a Pinotage (Pinot Noir × Cinsault), é um cruzamento entre castas.", "tema": "especies", "fonte": "Glossário wein.plus (Cercealinho/Sercialinho: Vital × Uva Cão, ADN 2020); artigo 'Sercialinho mystery' (Vital e Uva Cão, pais oficiais)"}, {"id": "uva-3-07", "nivel": 3, "tipo": "escolha", "q": "Como se chama uma variedade de uva resultante do cruzamento entre Vitis vinifera e uma espécie americana de Vitis?", "o": ["Híbrido", "Cruzamento", "Clone", "Pé-franco"], "a": 0, "k": "Híbrido: vinifera cruzada com uma espécie americana.", "e": "Espécies diferentes, híbrido interespecífico. Já o cruzamento entre duas castas de Vitis vinifera é intraespecífico: combina variedades da mesma espécie. Um exemplo de híbrido é a Vidal, utilizada no Canadá para produzir icewine, com uvas que congelam naturalmente na videira.", "tema": "especies", "sala": "O vinho com DOC é feito com castas de Vitis vinifera, não com híbridos."}, {"id": "uva-3-08", "nivel": 3, "tipo": "escolha", "q": "Que aroma é típico da Vitis labrusca?", "o": ["Foxy (morango, rebuçado)", "Pimenta preta", "Petróleo", "Manteiga"], "a": 0, "k": "Foxy: o aroma a morango e rebuçado da labrusca.", "e": "“Foxy” é uma descrição sensorial típica de algumas uvas americanas: pode lembrar uva, rebuçado ou fruta silvestre. É uma analogia de aroma, não uma raposa escondida no copo.", "tema": "especies", "sala": "O aroma \"foxy\" lembra o vinho morangueiro caseiro, feito com uvas americanas como a Isabel."}, {"id": "uva-3-09", "nivel": 3, "tipo": "escolha", "q": "A Isabel é uma variedade de uva de origem americana. Quanto à sua classificação, é…", "o": ["Um híbrido interespecífico", "Uma casta de Vitis vinifera", "Um porta-enxerto", "Um clone de Touriga Nacional"], "a": 0, "k": "Isabel: um híbrido, duas espécies numa só videira.", "e": "A Isabel reúne duas espécies na mesma videira: Vitis labrusca, americana, e Vitis vinifera, à qual pertencem castas como a Touriga Nacional e a Arinto. Por isso, é um híbrido interespecífico — “inter” significa entre, neste caso, entre espécies.", "tema": "especies"}, {"id": "uva-3-10", "nivel": 3, "tipo": "escolha", "q": "As castas com polpa tinta chamam-se…", "o": ["Tintureiras", "Tintas-finas", "Rosadas", "Bastardas"], "a": 0, "k": "Tintureiras: castas que pintam até a polpa.", "e": "Tintureiras: castas cuja polpa também é colorida, como a Alicante Bouschet; a maioria das castas tintas tem polpa clara. O Vinhão é muitas vezes chamado tintureiro pela cor intensa, mas as descrições da sua polpa variam.", "tema": "castas", "sala": "A Alicante Bouschet, muito plantada no Alentejo, é tintureira e dá tintos muito escuros."}, {"id": "uva-3-11", "nivel": 3, "tipo": "escolha", "q": "Que casta do Vinho Verde é conhecida por dar tintos de cor muito intensa?", "o": ["Vinhão", "Espadeiro", "Borraçal", "Loureiro"], "a": 0, "k": "Vinhão: a casta que enche o copo de cor.", "e": "Vinhão: tem muitos pigmentos e dá tintos muito escuros, por isso também se usa para dar cor a lotes. O Espadeiro tende a dar tintos leves ou rosés, e o Loureiro é branco.", "tema": "castas"}, {"id": "uva-3-12", "nivel": 3, "tipo": "escolha", "q": "Numa fermentação espontânea não se juntam leveduras compradas. De onde vêm as que fazem o trabalho?", "o": ["Da superfície das uvas e do ambiente da adega", "Do açúcar da polpa, que se transforma em leveduras", "Das grainhas esmagadas, que libertam leveduras", "Só da madeira das barricas onde o vinho fermenta"], "a": 0, "k": "Fermentação espontânea: leveduras da uva e da adega.", "e": "Vêm da película, onde a pruína as pode transportar, mas também dos equipamentos e do ar da adega. Muitas leveduras das uvas não aguentam muito álcool; a Saccharomyces cerevisiae, que costuma terminar a fermentação, é pouco comum em uvas intactas e frequente na adega. Espontânea não quer dizer garantida.", "tema": "bago", "sala": "\"Leveduras indígenas\" ou \"fermentação espontânea\" no rótulo querem dizer isto: não se juntaram leveduras compradas."}, {"id": "uva-3-13", "nivel": 3, "tipo": "escolha", "q": "Que três partes do cacho podem dar taninos ao vinho?", "o": ["Película, grainhas e engaço", "Polpa, película e pruína", "Polpa, grainhas e sumo", "Só a película"], "a": 0, "k": "Película, grainhas e engaço: as fontes de tanino.", "e": "Película, grainhas e, quando usado, engaço podem fornecer taninos; a polpa tem muito menos taninos condensados. Cada parte do cacho traz uma contribuição diferente.", "tema": "composicao"}, {"id": "uva-3-14", "nivel": 3, "tipo": "escolha", "q": "Além de lhe dar aquele ar esbranquiçado, a pruína ajuda o bago a…", "o": ["Perder menos água e defender-se de fungos", "Ganhar cor mais depressa na película", "Ficar mais doce sem precisar de tanto sol", "Amadurecer mais depressa nos anos frios"], "a": 0, "k": "Pruína: um casaco de cera que poupa água.", "e": "A pruína é uma camada cerosa que ajuda a reduzir a perda de água e funciona como barreira física. Não é um escudo infalível contra fungos, mas dá uma ajuda ao bago.", "tema": "bago"}, {"id": "uva-3-16", "nivel": 3, "tema": "especies", "tipo": "escolha", "q": "Como se chama a forma selvagem europeia da videira, ancestral das videiras cultivadas?", "o": ["Vitis vinifera subsp. sylvestris", "Vitis vinifera subsp. sativa", "Vitis labrusca", "Vitis riparia × Vitis rupestris"], "a": 0, "k": "Sylvestris: a avó selvagem da videira cultivada.", "e": "Antes das vinhas, havia videiras selvagens. A Vitis vinifera subsp. sylvestris é a forma ancestral da videira cultivada — pertence à mesma espécie, mas não é uma casta. “Subsp.” significa subespécie: uma divisão dentro da espécie."}, {"id": "uva-3-17", "nivel": 3, "tema": "especies", "tipo": "escolha", "q": "Ao contrário da maioria das castas cultivadas, a videira selvagem europeia tem…", "o": ["Plantas masculinas e plantas femininas separadas", "Flores que nunca chegam a produzir uvas maduras", "Exemplares só no continente americano", "Ramos compridos sem nenhuma gavinha"], "a": 0, "k": "Videira selvagem: plantas macho e fêmea separadas.", "e": "Na videira selvagem europeia, os sexos estão separados: há plantas masculinas e plantas femininas. Diz-se, por isso, que é dioica. Durante a domesticação, foram favorecidas videiras com flores hermafroditas, com órgãos masculinos e femininos funcionais na mesma flor, permitindo a autopolinização. Uma pequena mudança na flor, uma grande vantagem na vinha!"}, {"id": "uva-3-20", "nivel": 3, "tema": "especies", "tipo": "escolha", "q": "Em viticultura, o que é um clone?", "o": ["Videiras multiplicadas por estaca ou enxertia a partir de uma só planta", "Um cruzamento entre duas castas, feito por polinização controlada", "Um híbrido entre duas espécies de videira diferentes", "Uma nova casta obtida em laboratório por modificação genética"], "a": 0, "k": "Clone: cópias de uma só videira, sem sementes.", "e": "Uma videira, muitas descendentes — sem recorrer a sementes. Um clone resulta da multiplicação de uma única planta através de material vegetativo, como estacas ou gomos. As descendentes conservam o seu perfil genético, embora possam surgir pequenas mutações. Uma mesma casta pode ter vários clones com diferenças de produtividade ou de época de maturação."}, {"id": "uva-3-21", "nivel": 3, "tema": "especies", "tipo": "escolha", "q": "Na Península de Setúbal chamam-lhe Moscatel de Setúbal, ou Graúdo: é a casta tradicional do Moscatel de Setúbal branco. Que casta é esta?", "o": ["Moscatel de Alexandria", "Moscatel Galego Branco", "Moscatel Roxo", "Malvasia Fina"], "a": 0, "k": "Em Setúbal, Graúdo é Moscatel de Alexandria.", "e": "É a Moscatel de Alexandria: Graúdo e Moscatel de Setúbal são os nomes que tem na península. O Moscatel Galego Branco é o Moscatel do Douro; o Moscatel Roxo, que se pensa ser uma mutação dele, é a estrela rara de Setúbal. Três Moscatéis, três identidades: não os troques!", "fonte": "CVR Península de Setúbal (castas: 'Moscatel de Setúbal ou Graúdo', reconhecida internacionalmente como Moscatel de Alexandria); Wines of Portugal (estilos: vinho Moscatel)", "sala": "Na carta, distingue o Moscatel de Setúbal (Moscatel de Alexandria) do Moscatel Roxo: são castas e vinhos diferentes."}, {"id": "uva-3-23", "nivel": 3, "tema": "aromas", "tipo": "escolha", "q": "As notas florais de um Alvarinho podem estar ligadas a que compostos da uva?", "o": ["Terpenos", "Pirazinas", "Taninos", "Ácido málico"], "a": 0, "k": "Terpenos: parte do perfume floral do Alvarinho.", "e": "Terpenos como o linalol e o geraniol contribuem para aromas florais. Estão presentes no Alvarinho e ajudam a explicar parte do seu perfume — o geraniol, por exemplo, pode lembrar rosas.", "sala": "Servido demasiado frio, um Alvarinho pode parecer fechado: o frio esconde parte do aroma floral."}, {"id": "uva-3-26", "nivel": 3, "tema": "composicao", "tipo": "escolha", "q": "O açúcar fabricado nas folhas viaja até ao bago sob a forma de…", "o": ["Sacarose", "Frutose", "Amido", "Álcool"], "a": 0, "k": "Da folha ao bago, o açúcar viaja como sacarose.", "e": "A sacarose é o principal açúcar transportado das folhas para o bago; no fruto, enzimas podem convertê-la em glucose e frutose. Uma entrega que chega e é logo repartida."}, {"id": "uva-3-29", "nivel": 3, "tema": "castas", "tipo": "escolha", "q": "Quantas castas autóctones tem Portugal, aproximadamente?", "o": ["Cerca de 250", "Cerca de 20", "Cerca de 50", "Mais de 2000"], "a": 0, "k": "País pequeno, cerca de 250 castas autóctones.", "e": "Contam-se cerca de 250 castas autóctones; o número exato varia conforme a fonte e o critério. Uma diversidade impressionante para a dimensão do país: um mapa pequeno, uma vinha de nomes enorme.", "fonte": "Público/Agroportal, 'Em matéria de castas autóctones ninguém nos apanha' (cerca de 250)", "sala": "Tanta diversidade de castas é um bom argumento para levar turistas a provar vinho português."}, {"id": "uva-1-s01", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente estranha: \"Este espumante branco da Bairrada é de Baga? Mas a Baga não é tinta?\" O que lhe respondes?", "o": ["A cor está na película; prensada com cuidado, a uva tinta dá um mosto claro.", "Foi descorado com produtos, como se faz a quase todos os espumantes.", "A Baga também tem uma versão branca, usada só no espumante.", "Misturaram-lhe vinho branco para clarear a cor antes da segunda fermentação."], "a": 0, "k": "Uva tinta, prensada com cuidado, dá mosto claro.", "e": ["O mosto da Baga é claro.", "A cor está na película, e nesta prensagem quase não passa para o mosto.", "Diz ao cliente que é um \"branco de tintas\" e que o estilo leva o nome francês blanc de noirs."], "fonte": "Fichas técnicas de espumantes Bairrada brancos de Baga (blanc de noirs); falta fonte oficial (CVB)."}, {"id": "uva-1-s02", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente prova um tinto do Douro e diz: \"Seca-me a boca.\" O que está a sentir?", "o": ["Taninos", "Acidez", "Álcool", "Açúcar"], "a": 0, "k": "Boca seca? São os taninos.", "e": ["A boca fica seca e áspera, como depois de um chá forte.", "Os taninos vêm da película e das grainhas e ligam-se às proteínas da saliva.", "Se o cliente não gosta da sensação, sugere um tinto menos tânico; se for comer, a gordura do prato tende a amaciar os taninos (Serviço 4)."]}, {"id": "uva-1-s03", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Depois de um copo de Vinhão, um cliente repara que tem os dentes roxos. Porquê?", "o": ["O Vinhão tem muitos pigmentos e dá vinhos muito escuros.", "O vinho leva corante para ficar com uma cor mais intensa.", "É um vinho muito velho, que ganhou cor com os anos.", "Foi servido demasiado frio e a cor agarrou-se aos dentes."], "a": 0, "k": "Vinhão: muita cor no copo, e nos dentes.", "e": ["O vinho tem uma cor muito intensa.", "O Vinhão é uma casta com muitos pigmentos (antocianinas): dá tintos muito escuros, que podem tingir o copo e os dentes.", "É uma curiosidade boa para contar à mesa e prepara o cliente para a cor do copo."], "fonte": "https://www.vinetowinecircle.com/en/castas_post/vinhao-3/"}, {"id": "uva-1-s04", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "\"O rosé é uma mistura de branco com tinto?\", pergunta um cliente. O que respondes?", "o": ["Normalmente faz-se com uvas tintas e pouco tempo de contacto com as películas.", "Sim, mistura-se sempre branco com tinto, em partes iguais, antes de engarrafar.", "Faz-se com uvas cor-de-rosa, colhidas antes de ficarem tintas.", "Faz-se com vinho branco a que se junta um corante natural."], "a": 0, "k": "Rosé: uvas tintas, pouco tempo com as películas.", "e": ["A cor rosada vem das próprias uvas tintas.", "A cor depende sobretudo do contacto com as películas, mas a casta e o método também contam.", "Explicar o processo valoriza o rosé aos olhos de quem o acha \"vinho menor\"."]}, {"id": "uva-1-s05", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente pergunta porque é que o Vinho do Porto é doce e tem mais álcool do que um tinto de mesa. Qual é a explicação?", "o": ["Junta-se aguardente vínica a meio da fermentação; esta para e sobra açúcar da uva.", "Junta-se açúcar e álcool no fim, depois de a fermentação acabar sozinha.", "As uvas do Douro são vindimadas já passas, por isso dão mais açúcar e álcool.", "Envelhece em barricas que antes tiveram vinho doce e lhe passam açúcar."], "a": 0, "k": "Porto: aguardente a meio da fermentação, e o açúcar fica.", "e": ["O vinho fica doce e mais alcoólico.", "Com a aguardente, as leveduras param e o açúcar que ainda não virou álcool fica no vinho.", "O Moscatel de Setúbal também é um vinho fortificado. Uma frase basta para o cliente perceber o estilo."]}, {"id": "uva-1-s06", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente pede \"um tinto seco, sem açúcar nenhum\". O que precisa de saber?", "o": ["A maioria dos tintos de mesa já é seca: quase todo o açúcar virou álcool.", "Os tintos guardam quase sempre algum açúcar; só os de gama alta são secos.", "\"Seco\" quer dizer com muito tanino, o que deixa a boca áspera.", "\"Seco\" quer dizer com pouco álcool, por isso convém um tinto leve."], "a": 0, "k": "A maioria dos tintos de mesa já é seca.", "e": ["\"Seco\" quer dizer quase sem açúcar.", "Na fermentação, o açúcar vira sobretudo álcool.", "Muitas vezes, quem pede \"seco\" está a pensar em taninos ou em pouca fruta. Pergunta o que procura antes de sugerir."]}, {"id": "uva-1-s07", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente diz que o branco do Alentejo \"não aperta a boca como o tinto\". Porquê?", "o": ["Normalmente o branco fermenta sem as películas, por isso tem poucos taninos.", "As uvas brancas não têm taninos nenhuns, nem na película nem nas grainhas.", "O branco é servido mais frio, e o frio esconde todos os taninos.", "O branco tem mais álcool, e o álcool disfarça a secura dos taninos."], "a": 0, "k": "Branco fermentado sem películas: quase sem taninos.", "e": ["O branco quase não tem adstringência.", "Os taninos estão na película e nas grainhas, e a maioria dos brancos fermenta só com o mosto.", "Exceção para contar: muitos brancos de talha e de curtimenta fermentam com as películas e podem ter alguma textura de tanino."], "fonte": "https://elle.com.br/lifestyle/saiba-o-que-e-vinho-de-talha (talha); falta fonte oficial (CVRA)."}, {"id": "uva-1-s08", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "No fim do jantar, um cliente pede \"um digestivo feito da uva, do que sobra do vinho\". O que lhe sugeres?", "o": ["Aguardente bagaceira", "Licor de amêndoa", "Ginjinha", "Vinho do Porto Tawny"], "a": 0, "k": "Bagaceira: a aguardente do que sobra da prensa.", "e": ["A bagaceira é destilada a partir do bagaço.", "Bagaço é o que sobra da prensa: películas, grainhas e, às vezes, engaço.", "Bom momento para lembrar que o vinho e a aguardente vêm do mesmo cacho."]}, {"id": "uva-1-s09", "nivel": 1, "tipo": "escolha", "sit": true, "tema": "sala", "q": "\"Este tinto tem taninos porque esteve em barrica?\", pergunta um cliente. O que é mais rigoroso?", "o": ["Os taninos vêm sobretudo da uva; a barrica pode acrescentar alguns.", "Sim, só a barrica dá taninos; um tinto de inox não tem nenhuns.", "Não, a barrica tira os taninos todos e deixa o vinho mais macio.", "A barrica dá só cor e aroma ao vinho, nunca taninos."], "a": 0, "k": "O tanino vem sobretudo da uva; a barrica pode somar.", "e": ["Um tinto que nunca viu madeira pode ser tânico.", "Película e grainhas dão os taninos da uva; o carvalho junta os seus.", "Evita prometer \"madeira\" quando o cliente só sente tanino."]}, {"id": "uva-2-s01", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente devolve o copo de um branco seco e jovem, que estava bem frio: \"Tem vidro no fundo!\" São pequenos cristais transparentes. O que são?", "o": ["Açúcar do vinho que ficou por fermentar e cristalizou com o frio.", "Pedaços de cortiça da rolha, que se soltaram ao abrir a garrafa.", "Sais do ácido tartárico da uva, que podem cristalizar com o frio.", "Depósito de taninos e de cor, que costuma aparecer com a idade."], "a": 2, "k": "Cristais transparentes no copo: tartaratos, naturais e inofensivos.", "e": ["Os cristais vêm do próprio vinho: são tartaratos.", "O ácido tartárico forma sais que cristalizam com o frio. A cortiça daria pedaços castanhos; num branco seco não sobra açúcar.", "Mostra que não é vidro e oferece outro copo. Diz-lhe: \"São cristais naturais do vinho, inofensivos.\""]}, {"id": "uva-2-s02", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um branco do Dão estagiou só em inox, sem madeira. Um cliente sente-lhe notas de manteiga e acha a acidez suave. De onde vêm, mais provavelmente?", "o": ["Da barrica de carvalho, que tende a dar notas de baunilha e tosta.", "Da malolática, que pode dar notas de manteiga e amaciar a acidez.", "Das borras finas, que tendem a dar notas de pão e textura cremosa.", "Do contacto com as películas, que tende a dar aroma e algum tanino."], "a": 1, "k": "Manteiga sem madeira? Pista da malolática.", "e": ["A manteiga vem de uma segunda fermentação, não da madeira.", "Na malolática, o ácido málico passa a láctico, mais suave, e pode formar-se diacetilo, de aroma amanteigado. As borras lembram mais pão.", "Diz-lhe: \"É a malolática: amacia a acidez e lembra manteiga.\" Se não gostar, sugere um branco fresco sem malolática."]}, {"id": "uva-2-s03", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "\"Quero o rosé mais seco, por isso dê-me o mais claro\", pede um cliente. O que lhe dizes?", "o": ["A cor não indica a doçura; o melhor é ver o rótulo ou perguntar ao produtor.", "Tem razão: quanto mais claro o rosé, mais seco ele é, sem nenhuma exceção.", "Os rosés mais escuros são sempre doces, por isso evite esses.", "Os rosés são quase todos doces; o mais seco será um branco."], "a": 0, "k": "A cor do rosé não diz se é doce.", "e": ["Cor e doçura não andam juntas.", "A cor depende da casta, do método e do tempo com as películas; a doçura depende do açúcar que ficou por fermentar.", "Pergunta o que o cliente procura (seco, fresco, frutado) e escolhe por aí."]}, {"id": "uva-2-s04", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente estranha a orla acastanhada de um tinto do Douro com 15 anos. O vinho cheira bem e está limpo na boca. O que lhe explicas?", "o": ["Entrou ar pela rolha e o vinho oxidou, por isso já passou do ponto.", "As uvas foram vindimadas pouco maduras e deram uma cor mais fraca.", "O estágio em barrica nova passou ao vinho a cor castanha da madeira.", "Com o tempo, a cor perde o violeta e tende para granada e tijolo."], "a": 3, "k": "Tinto com idade: a orla tende para tijolo.", "e": ["A cor mudou com a idade, não por defeito.", "Os pigmentos ligam-se a outros compostos e parte deposita-se; o violeta some e a orla fica granada ou tijolo.", "Aroma limpo afasta a oxidação. Diz-lhe: \"É a cor de um tinto que teve tempo para evoluir.\""]}, {"id": "uva-2-s05", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente adora Aragonez do Alentejo, mas na carta só há tintos do Douro com Tinta Roriz. O que lhe podes dizer?", "o": ["É a mesma casta, com outro nome; o estilo muda com a região.", "São castas sem relação nenhuma, apesar de darem vinhos parecidos.", "A Tinta Roriz é uma casta branca, por isso o vinho será outro.", "O Aragonez só existe em Espanha; no Douro planta-se outra casta."], "a": 0, "k": "Aragonez no Alentejo, Tinta Roriz no Douro: a mesma casta.", "e": ["O cliente reconhece a casta, mesmo com outro nome.", "Tinta Roriz (Douro) e Aragonez (Alentejo) são a mesma casta, conhecida lá fora como Tempranillo.", "Uma boa ponte para levar o cliente a provar outra região."]}, {"id": "uva-2-s07", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente pede \"um Fernão Pires\", mas na carta só vê um branco da Bairrada de Maria Gomes. O que fazes?", "o": ["Explicas que Maria Gomes é o nome da Fernão Pires na Bairrada.", "Dizes que não há nenhum na carta e sugeres outra casta branca.", "Sugeres um tinto leve, já que não há o branco pedido.", "Dizes que são castas parecidas, da mesma família, mas diferentes."], "a": 0, "k": "Maria Gomes na carta? É a Fernão Pires.", "e": ["O cliente tem o que pediu.", "A mesma casta tem nomes diferentes conforme a região.", "Conhecer os sinónimos evita perder uma venda e dá confiança ao cliente."]}, {"id": "uva-2-s08", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente vê \"Blanc de Noirs\" num espumante português e pergunta o que quer dizer. O que respondes?", "o": ["É um espumante branco feito com uvas tintas.", "É um espumante tinto.", "É feito com uvas brancas e pretas misturadas.", "Quer dizer que é doce."], "a": 0, "k": "Blanc de Noirs: espumante branco de uvas tintas.", "e": ["O nome é francês, mas o estilo também existe em Portugal.", "A polpa da maioria das castas tintas é clara; prensando com cuidado, o mosto sai branco.", "Na Bairrada há espumantes brancos de Baga feitos assim."]}, {"id": "uva-2-s09", "nivel": 2, "tipo": "escolha", "sit": true, "tema": "sala", "q": "Um cliente pergunta porque é que o Moscatel de Setúbal cheira tanto a uva, a flores e a laranja. Qual é a melhor explicação?", "o": ["A casta é muito aromática, e as películas ficam meses no vinho.", "A aguardente que trava a fermentação é que lh
