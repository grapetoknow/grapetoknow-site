ada en profundidad","El esquisto se calienta poco al sol y mantiene la viña fresca en verano","El esquisto es muy fértil y alimenta la vid con muchos nutrientes","El esquisto guarda el agua de lluvia en la superficie, cerca de las raíces"],"a":0,"e":"El esquisto se parte en placas casi verticales. Las raíces bajan por las grietas, a veces varios metros, hasta el agua que el verano no ha secado. Las piedras de la superficie también guardan calor.","k":"En el esquisto, las raíces bajan por las grietas buscando agua."},{"id":"vinha-2-18","nivel":2,"tipo":"escolha","tema":"solo","q":"¿Qué tipo de suelo domina en la Bairrada, tierra de la Baga?","o":["Arcillo-calcáreo","Esquisto","Arena volcánica","Granito"],"a":0,"e":"También hay zonas de arena. La arcilla retiene agua: ayuda en los veranos secos y pesa en los años lluviosos.","sala":"En la Bairrada, muchos productores hablan del barro: es la arcilla de estos suelos.","k":"Bairrada: arcilla y caliza, la casa de la Baga."},{"id":"vinha-2-19","nivel":2,"tipo":"escolha","tema":"clima","q":"El Dão está rodeado de sierras, como la Estrela y el Caramulo. ¿Qué protección le dan?","o":["Resguardan la viña del Atlántico directo y de los vientos secos del interior","Dan sombra a todas las viñas en las horas de más calor","Traen más lluvia del Atlántico y más humedad a las viñas","Calientan las viñas de noche con el aire cálido que baja de las sierras"],"a":0,"e":"Las sierras del oeste frenan parte de la lluvia y del viento atlánticos; la Serra da Estrela protege por el lado del interior. Resultado: una región más equilibrada, con suelos sobre todo de granito.","fonte":"CCDR Centro, 'Conheça os vinhos DOP da região Centro: Dão' (serras e solos de granito)","k":"Dão: viñas resguardadas por las sierras, como en un abrazo."},{"id":"vinha-2-20","nivel":2,"tipo":"escolha","tema":"viticultura","q":"Muchos viñedos del Alentejo tienen riego por goteo. ¿Por qué es útil allí?","o":["Los veranos son cálidos y secos, y sin agua la maduración puede bloquearse","Para bajar la acidez de las uvas, que allí suele ser demasiado alta","Para aumentar la acidez del suelo, que ayuda a crecer a la vid","Para proteger las viñas de la helada, frecuente en verano"],"a":0,"e":"Con mucha sed, la vid cierra los poros de las hojas y la maduración puede pararse. Un riego controlado lo evita; demasiada agua da uvas diluidas y demasiada hoja.","fonte":"WSET Nível 3, sessão 2 (slides): água: rega gota a gota, seca","k":"Goteo: el agua justa, ni más ni menos."},{"id":"vinha-2-21","nivel":2,"tipo":"escolha","tema":"viticultura","q":"En el Minho, las viñas tradicionales en ramada (parral) levantan las vides muy por encima del suelo. ¿Qué ventaja tiene eso en una región húmeda?","o":["Más aire alrededor de los racimos, lo que ayuda contra los hongos","Más calor del suelo llegando directamente a los racimos","Menos trabajo de poda, porque la cepa crece sola","Uvas más dulces, incluso con poco sol en verano"],"a":0,"e":"Lejos del suelo húmedo y con más viento, los racimos se secan antes después de la lluvia. Debajo quedaba sitio para otros cultivos; hoy, muchas viñas usan sistemas más bajos, como el cordón.","k":"Ramada: racimos en lo alto, secándose al viento."},{"id":"vinha-2-s01","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente probó el mismo Alvarinho de dos años seguidos. Saben distinto y cree que uno tiene un defecto. ¿Qué le dices?","o":["Escuchas y pruebas: puede ser la añada, pero antes descartas un defecto","Le aseguras que no hay defecto: las añadas distintas siempre saben distinto","Le das la razón: uno de los dos está estropeado y cambias ambas botellas","Le explicas que el productor cambió de variedad, algo común entre añadas"],"a":0,"e":["Vinos de años distintos pueden saber distinto sin defecto, pero un defecto también es posible.","El tiempo de cada año cambia la uva. Probar te dice si es la huella de la añada o un defecto, como el olor a corcho.","Dile: «Déjeme probar este. Si es de la añada, le explico la diferencia; si hay un defecto, le cambio la botella»."],"k":"Añadas distintas pueden saber distinto. Prueba antes de concluir."},{"id":"vinha-2-s02","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente ha notado que los tintos del Douro Superior tienden a ser más corpulentos y alcohólicos que los del Baixo Corgo. ¿Por qué?","o":["El Douro Superior es más cálido y seco, y las uvas acumulan más azúcar","El Baixo Corgo está más lejos del río, así que las uvas tienen menos agua","En el Douro Superior se añade aguardiente a los tintos DOC Douro","El Baixo Corgo tiene suelos de granito, que dan vinos más ligeros"],"a":0,"e":["Dentro del Douro hay climas distintos.","Baixo Corgo, al oeste: más fresco y lluvioso. Douro Superior, al este: más cálido y seco. Más azúcar tiende a dar más alcohol.","Úsalo para afinar la elección. Dile: «Si busca frescura, Baixo Corgo; si quiere potencia, Douro Superior»."],"fonte":"WSET, blog 'Three Douro subregions that define Port' (2025): Baixo Corgo mais fresco e chuvoso, Douro Superior mais quente e seco","k":"Douro: más fresco al oeste, más cálido al este."},{"id":"vinha-2-s03","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente pregunta por qué la contraetiqueta de este tinto del Dão habla de viñas a 500 metros de altitud. ¿Qué le dices?","o":["Las viñas más altas son más frescas: la uva madura más despacio y conserva acidez","La altitud da más sol y calor, así que el vino tiene más alcohol","Es solo para impresionar en la etiqueta: la altitud no cambia el vino","Las viñas altas no necesitan tratamientos, así que el vino es más puro"],"a":0,"e":["La altitud es una pista de frescura.","Cuanto más alto, más fresco, sobre todo de noche. La uva madura más despacio y conserva más acidez.","Dile: «Espere un tinto más fresco y tenso». Ideal para quien encuentra pesados los tintos del Dão."],"k":"Más alto, más fresco: la altitud ayuda a conservar acidez."},{"id":"vinha-2-s04","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente pide un tinto \"de influencia atlántica\". Entre un tinto de Lisboa, de viñas cerca del mar, y uno del interior del Alentejo, ¿cuál tiende a encajar mejor?","o":["El de Lisboa, de viñas expuestas al aire fresco del mar","El del interior del Alentejo","Son iguales","Ninguno: solo los blancos pueden mostrar influencia atlántica en la copa"],"a":0,"e":["El cliente busca frescura venida del mar.","Cerca de la costa, el viento y las nubes del Atlántico suavizan el calor. En el interior del Alentejo, el verano es más cálido y seco.","Sirve el de Lisboa. Dile: «Es más fresco y menos maduro que un tinto del interior»."],"k":"Influencia atlántica: el mar hace de aire acondicionado."},{"id":"vinha-2-s05","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente cuenta que la helada de abril afectó a la viña de la familia, pero solo en el fondo del valle. Las cepas de la ladera se salvaron. ¿Por qué?","o":["El aire frío pesa más y se acumula en las zonas bajas","En la ladera había variedades más resistentes al frío","En el valle llueve más","Las cepas del valle eran más jóvenes"],"a":0,"e":["Las zonas bajas son las más expuestas a la helada.","En noches tranquilas y despejadas, el aire frío baja por la ladera, como el agua, y se junta en el fondo del valle.","Dile: «En la viña, el sitio cuenta mucho». Es una de las razones por las que se elige bien dónde plantar."],"k":"El aire frío baja por la ladera y se queda abajo."},{"id":"vinha-2-s06","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"Una clienta pregunta si \"viña ecológica\" quiere decir que no lleva ningún tratamiento. ¿Qué le respondes?","o":["Sí: la viña no lleva ningún tratamiento, solo poda, aclareo y vendimia hecha a mano","No: lleva tratamientos, pero el cobre y el azufre se prohíben por ser químicos","No: lleva tratamientos, pero por norma sin síntesis; cobre y azufre se permiten","No: la viña sí lleva tratamientos, pero el vino ya no puede llevar sulfitos"],"a":2,"e":["Ecológico no quiere decir sin tratamientos, ni sin sulfitos.","Por norma, se excluyen los productos de síntesis. Pero se permiten el cobre, en dosis limitada, contra el mildiu, y el azufre contra el oídio.","Explícalo sin exagerar. Dile: «Es una forma de cultivar, no una promesa de sabor»."],"fonte":"WSET Nível 3, sessão 2 (slides): práticas de viticultura (biológica)","k":"Ecológico: hay tratamientos, pero por norma nada de síntesis."},{"id":"vinha-2-s07","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente encuentra caro un tinto del Douro de viñas en terrazas y pregunta por qué. ¿Cuál es el mejor argumento?","o":["En las terrazas, estrechas y empinadas, casi todo el trabajo se hace a mano","Por ley el vino debe criarse más tiempo solo por venir de terrazas","Las variedades del Duero son raras y las plantas cuestan más","Las terrazas reciben menos sol y las uvas tardan mucho más en madurar"],"a":0,"e":["El coste empieza en la viña.","En las terrazas, las máquinas apenas entran. Poda, tratamientos y vendimia exigen muchas horas de trabajo a mano.","Cuenta la historia del paisaje. El cliente verá en el precio esfuerzo, no capricho."],"k":"Terrazas: escalones donde las máquinas apenas entran."},{"id":"vinha-2-s08","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"En una cata, un cliente pregunta qué significa \"viña orientada al sur\" en un tinto del Douro. ¿Qué le explicas?","o":["Recibe más sol y calor, y las uvas tienden a madurar más","Recibe menos sol y da uvas más verdes, con más acidez","Queda protegida del sol de la tarde, el más caluroso del día","Tiene más humedad y menos calor, como las laderas al norte"],"a":0,"e":["La orientación de la ladera cambia la luz que recibe la viña.","En el hemisferio norte, una ladera orientada al sur recibe más sol y se calienta más. Orientada al norte, es más fresca.","Usa la pista para prever el estilo: el sur tiende a dar tintos más maduros; el norte, vinos más frescos."],"fonte":"WSET Nível 3, sessão 2 (slides): orientação e luz solar","k":"Orientada al sur: más sol, uvas que tienden a madurar más."},{"id":"vinha-3-01","nivel":3,"tipo":"escolha","q":"¿Por qué se usan raíces de vid americana?","o":["Aguantan la filoxera","Dan más azúcar a la uva","Dan aroma foxy al vino","Crecen más deprisa"],"a":0,"e":"Muchas especies americanas crecieron junto a la filoxera y aprendieron a aguantarla. Pero no hay raíz mágica: se elige el portainjerto adecuado para cada suelo y variedad.","tema":"filoxera","sala":"Casi todos los viñedos portugueses están injertados, así que «pé-franco» (pie franco) en una etiqueta es raro y merece contarse.","origem":"uva-3-01","k":"Raíz americana: el escudo de la vid contra la filoxera."},{"id":"vinha-3-02","nivel":3,"tipo":"escolha","q":"En una vid injertada, ¿cómo se llama la parte de abajo, con la raíz americana?","o":["Portainjerto","Púa","Sarmiento","Pie franco"],"a":0,"e":"El portainjerto pone las raíces; la púa, injertada encima, aporta la variedad que queremos. Dos plantas trabajando como una sola vid.","tema":"filoxera","origem":"uva-3-02","k":"Portainjerto abajo, púa arriba: un dúo de éxito."},{"id":"vinha-3-03","nivel":3,"tipo":"escolha","q":"Una vid que no ha sido injertada se llama…","o":["Pie franco","Pata de cabra","Vid madre","Híbrido"],"a":0,"e":"Sin injerto, raíz y parte aérea son la misma planta. Todo queda en familia, pero sin la protección de la raíz americana contra la filoxera.","tema":"filoxera","sala":"«Pé-franco» (pie franco) en la etiqueta quiere decir vides sobre sus propias raíces, sin injerto.","origem":"uva-3-03","k":"Pie franco: una vid sobre sus propias raíces."},{"id":"vinha-3-04","nivel":3,"tipo":"escolha","q":"¿Qué región portuguesa se libró de la filoxera gracias a sus suelos de arena?","o":["Colares","Douro","Dão","Alentejo"],"a":0,"e":"En la arena, a la filoxera le cuesta sobrevivir y propagarse. Por eso Colares aún conserva vides que nunca necesitaron injerto.","tema":"filoxera","sala":"Colares es una de las pocas zonas con viñedos antiguos en pie franco. Es una buena historia para contar al cliente.","origem":"uva-3-04","k":"Colares: la arena que le cerró la puerta a la filoxera."},{"id":"vinha-3-05","nivel":3,"tipo":"escolha","q":"¿Cuándo llegó la filoxera al Douro?","o":["Hacia 1868","Hacia 1700","Hacia 1950","Hacia 1756, con el Marqués de Pombal"],"a":0,"e":"Se identificó por entonces y luego se extendió, arrasando muchas viñas. Las fechas exactas varían según el lugar, pero el siglo XIX fue un auténtico terremoto para el viñedo.","tema":"filoxera","fonte":"Revista Povos e Culturas (UCP): filoxera notada pela primeira vez no Douro de 1868 para 1869","origem":"uva-3-15","k":"Filoxera en el Douro: hacia 1868."},{"id":"vinha-3-06","nivel":3,"tema":"vinhas-velhas","tipo":"escolha","q":"Con la edad, ¿qué le pasa a la producción de una vid?","o":["Tiende a dar menos uva, a menudo en racimos y bayas más pequeños","Da cada vez más uva, porque las raíces llegan más hondo","Deja de dar uva a los 20 años y hay que arrancarla","Da bayas más grandes y diluidas, que dan vinos con menos sabor"],"a":0,"e":"Muchos lo asocian a vinos más concentrados. Pero la edad por sí sola no garantiza calidad: también cuentan la variedad, el suelo, el clima y los cuidados.","origem":"uva-3-31","k":"Vid vieja: menos uva, racimos y bayas más pequeños."},{"id":"vinha-3-07","nivel":3,"tema":"vinhas-velhas","tipo":"escolha","q":"¿Qué puede ayudar a una vid vieja a aguantar mejor la sequía que una recién plantada?","o":["Raíces bien asentadas, que exploran más suelo","Hojas más grandes y gruesas, que gastan menos agua","Bayas que guardan agua para las raíces","La edad, por sí sola"],"a":0,"e":"Con los años, las raíces exploran más suelo y, si este lo permite, llegan a agua más profunda. Pero sin agua a su alcance, las viñas viejas también sufren.","origem":"uva-3-32","k":"La baza de la vid vieja está bajo tierra."},{"id":"vinha-3-08","nivel":3,"tema":"vinhas-velhas","tipo":"escolha","q":"Muchas viñas viejas del Douro y del Dão tienen variedades mezcladas. ¿Qué significa?","o":["Varias variedades plantadas en la misma parcela","Una sola variedad, toda del mismo clon","Vides plantadas entre olivos","Uvas compradas a varios productores de la región"],"a":0,"e":"A veces son decenas de variedades juntas, vendimiadas y vinificadas tradicionalmente a la vez: es el field blend. Ojo: \"viñas viejas\" habla de edad, no de mezcla.","sala":"En un tinto de viña vieja del Douro, «castas misturadas» (variedades mezcladas) quiere decir que distintas variedades se plantaron y se vendimian juntas.","origem":"uva-3-33","k":"Variedades mezcladas: el coupage empieza en la viña."},{"id":"vinha-3-09","nivel":3,"tema":"vinhas-velhas","tipo":"escolha","q":"Para tapar un hueco en la viña, se entierra parte de un sarmiento de la cepa vecina, aún unido a ella, hasta que echa raíces. ¿Cómo se llama?","o":["Acodo (mergulhia)","Injerto","Desnietado","Atado"],"a":0,"e":"La punta queda fuera de la tierra y se mantiene unida a la cepa madre. Cuando enraíza, se puede separar y es una nueva vid de la misma variedad.","origem":"uva-3-34","k":"Acodo: primero echa raíces, luego se independiza."},{"id":"vinha-3-10","nivel":3,"tema":"doencas","tipo":"escolha","q":"¿Qué enfermedad de la madera puede hacer que una cepa adulta colapse de golpe, en pleno verano?","o":["Yesca","Mildiu","Oídio","Filoxera"],"a":0,"e":"Varios hongos degradan la madera de la vid. Puede avanzar despacio o de golpe: en la apoplejía, las hojas se marchitan y secan en pocos días y la cepa puede morir.","origem":"uva-3-35","k":"Yesca: hongos que se comen la vid por dentro."},{"id":"vinha-3-11","nivel":3,"tema":"doencas","tipo":"escolha","q":"El mildiu y el oídio, las dos grandes enfermedades de hojas y racimos, llegaron a Europa…","o":["Desde Norteamérica, en el siglo XIX","Desde Asia, en la Edad Media","Del norte de África, ya a principios del siglo XX","Siempre existieron en Europa"],"a":0,"e":"Igual que la filoxera: primero el oídio, después el mildiu. La vid europea tenía pocas defensas contra ellos, y por eso aún hoy necesita tratamientos.","origem":"uva-3-36","k":"Mildiu y oídio: \"turistas\" americanos del siglo XIX."},{"id":"vinha-3-12","nivel":3,"tema":"doencas","tipo":"escolha","q":"¿Cuál es el elemento activo del caldo bordelés, usado desde hace más de un siglo contra el mildiu?","o":["Cobre","Azufre","Hierro","Calcio"],"a":0,"e":"Mezcla sulfato de cobre, cal y agua y protege la hoja por fuera. El azufre es otra historia: es el aliado clásico contra el oídio.","origem":"uva-3-37","k":"Caldo bordelés: cobre. El azul en las hojas lo delata."},{"id":"vinha-3-13","nivel":3,"tema":"doencas","tipo":"escolha","q":"La Baga, estrella de la Bairrada, tiene racimos apretados y puede pudrirse algunos años. ¿Qué enfermedad adora la lluvia cerca de la vendimia?","o":["Podredumbre gris","Oídio","Corrimiento","Yesca"],"a":0,"e":"Con humedad persistente pudre las bayas, y los racimos apretados se secan despacio. Pero en uvas maduras, alternando humedad y sequedad, puede dar podredumbre noble, que concentra azúcar.","fonte":"INIAV, ficha da casta Baga (cacho compacto; película de espessura média; sensível ao míldio e à podridão em certos anos)","sala":"Un año lluvioso cerca de la vendimia ayuda a explicar diferencias entre añadas del mismo tinto de Baga.","origem":"uva-3-38","k":"Botrytis: el mismo hongo arruina o hace vino dulce."},{"id":"vinha-3-14","nivel":3,"tipo":"escolha","tema":"doencas","q":"El mal tiempo en la floración hace caer muchas flores y el racimo queda ralo. ¿Cómo se llama?","o":["Corrimiento (desavinho)","Millerandage","Mildiu","Quemadura de sol"],"a":0,"e":"Lluvia, frío o viento en la floración lo favorecen, y hay variedades más sensibles que otras. En francés, coulure. Resultado: menos uva.","k":"Corrimiento: las flores no cuajan y el racimo se queda calvo."},{"id":"vinha-3-15","nivel":3,"tipo":"escolha","tema":"doencas","q":"En un racimo con millerandage, ¿qué se ve?","o":["Bayas normales mezcladas con bayas pequeñas y sin pepitas","Bayas cubiertas de un polvo blanco, como si fuera harina","Racimos sin ninguna uva, solo con el raspón seco","Bayas rajadas por la lluvia, abiertas y empezando a pudrirse"],"a":0,"e":"Flores mal fecundadas dan bayas pequeñas y sin pepitas junto a las normales. En portugués, bagoinha. Hay menos uva, pero las pequeñas pueden concentrar sabor.","k":"Millerandage: racimo de bayas grandes y chiquitinas."},{"id":"vinha-3-16","nivel":3,"tipo":"escolha","tema":"viticultura","q":"En el aclareo de racimos (o vendimia en verde), el viticultor…","o":["Corta algunos racimos aún verdes para que la vid madure mejor los demás","Vendimia todos los racimos antes del envero para hacer un vino más fresco y ligero","Arranca todas las hojas para que los racimos reciban más sol","Corta las raíces más profundas para que la cepa dé menos uva"],"a":0,"e":"Se hace entre el cuajado y el envero, y la energía va a los racimos que quedan. Ayuda en viñas vigorosas o años difíciles, pero cuesta uva y trabajo.","k":"Aclareo: menos bocas que alimentar."},{"id":"vinha-3-17","nivel":3,"tipo":"escolha","tema":"viticultura","q":"En una región húmeda como el Minho, quitar hojas alrededor de los racimos sirve sobre todo para…","o":["Airear y exponer los racimos, reduciendo el riesgo de hongos","Acelerar la floración y el cuajado de los racimos","Proteger los racimos del sol fuerte de la tarde","Aumentar el tamaño y el peso de las bayas antes de la vendimia"],"a":0,"e":"Con menos hojas, los racimos se secan antes y los tratamientos llegan mejor. Pero en zonas cálidas, pasarse puede quemar las bayas: es el golpe de sol.","fonte":"WSET Nível 3, sessão 2 (slides): gestão da canópia contra doenças","k":"Deshojado: abrir la ventana para que los racimos respiren."},{"id":"vinha-3-18","nivel":3,"tipo":"escolha","tema":"clima","q":"¿Por qué se teme tanto el granizo de verano en la viña?","o":["Hiere hojas y bayas, y las heridas abren la puerta a los hongos","Enfría el suelo de golpe y retrasa la maduración","Hace que la cepa brote otra vez, fuera de temporada","Provoca corrimiento en racimos que ya están casi maduros"],"a":0,"e":"Rasga hojas, rompe brotes y hiere bayas, que luego se pudren con facilidad. Una sola tormenta puede arruinar la cosecha de una parcela.","fonte":"WSET Nível 3, sessão 2 (slides): riscos da água: granizo","k":"Granizo: minutos de piedra, meses de trabajo perdidos."},{"id":"vinha-3-19","nivel":3,"tipo":"escolha","tema":"clima","q":"Las grandes masas de agua, como el estuario del Tajo o el mar junto a Setúbal, influyen en la viña porque…","o":["Suavizan las temperaturas cercanas, pero pueden traer humedad y niebla","Riegan las viñas por debajo de la tierra, a través de las aguas subterráneas","Aumentan el azúcar de las uvas de noche, con el aire más húmedo","Impiden para siempre la helada y el granizo en las viñas cercanas"],"a":0,"e":"El agua se calienta y se enfría despacio, así que los veranos tienden a ser más suaves y los inviernos menos fríos. A cambio, la humedad y la niebla pueden favorecer a los hongos.","fonte":"WSET Nível 3, sessão 2 (slides): grandes corpos de água moderam a temperatura","k":"Agua cerca: un aire acondicionado natural."},{"id":"vinha-3-20","nivel":3,"tipo":"escolha","tema":"solo","q":"Los suelos de granito, comunes en el Dão y el Minho, tienden a ser…","o":["Arenosos, bien drenados y pobres en nutrientes","Pesados, arcillosos y a menudo encharcados","Ricos en caliza, que da acidez a las uvas","Hechos de ceniza volcánica, oscuros y fértiles"],"a":0,"e":"Al deshacerse, el granito da una arena gruesa que deja correr el agua. Con pocos nutrientes, la vid tiende a crecer con menos vigor.","k":"Granito: arena gruesa, agua que pasa, poca comida."},{"id":"vinha-3-21","nivel":3,"tipo":"escolha","tema":"viticultura","q":"En la viña \"ao alto\" del Douro, las hileras de vides se plantan…","o":["En línea recta por la ladera, de arriba abajo, sin bancales","En escalones estrechos, sostenidos por muros de piedra","En terrazas anchas de tierra, sin muros, que siguen la curva de la ladera","En emparrado, con las cepas bien por encima del suelo"],"a":0,"e":"Es la alternativa a los bancales de piedra y a los patamares (terrazas anchas de tierra), usada en laderas menos empinadas. Caben más vides por hectárea.","k":"Ao alto: hileras bajando la ladera, sin escalones."},{"id":"vinha-3-22","nivel":3,"tipo":"escolha","tema":"viticultura","q":"Limitar la cantidad de uva por vid tiende a…","o":["Ayudar a la vid a madurar bien los racimos que quedan","Garantizar siempre un vino mejor, sea cual sea el año","Aumentar la acidez de la uva y bajar el azúcar","Proteger la viña de la helada y el granizo"],"a":0,"e":"Ayuda sobre todo en viñas vigorosas o años frescos. No es una regla fija: con buena luz, agua y nutrientes, la vid madura bien más uva; con pocos recursos, solo poca.","fonte":"WSET Nível 3, sessão 2 (slides): rendimentos e qualidade","k":"Menos racimos, más atención para cada uno."},{"id":"vinha-3-s01","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente ve un tinto de Colares en la carta y pregunta por qué es tan raro. ¿Qué le cuentas?","o":["La filoxera destruyó casi todas las viñas, y casi ninguna se volvió a plantar","Solo se hace en años excepcionales, como pasa con un Oporto Vintage","Las viñas están en terrazas de pizarra, donde las máquinas no entran","Región minúscula, con viñas en arena junto al mar, muchas en pie franco"],"a":3,"e":["Colares produce muy poco vino, y su superficie de viña no deja de menguar.","Las cepas se plantan hondo, atravesando la arena hasta el barro; la arena frenó la filoxera y muchas siguen en pie franco.","Dile: \"Es viña de arena junto al Atlántico, donde la filoxera apenas entró. Una rareza con memoria.\""],"k":"Colares: poca viña, mucha arena, mucha historia."},{"id":"vinha-3-s02","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente pregunta qué cambia cuando un tinto del Douro dice \"Vinhas Velhas\" (viñas viejas) en la etiqueta. ¿Qué es más riguroso decir?","o":["Tienden a dar más uva por cepa, porque la vid vieja ya tiene raíces hondas","Tienden a dar menos uva, más concentrada, pero el lugar y el trabajo cuentan","Tienden a dar vinos más ligeros, porque las cepas viejas pierden vigor y color","Tienden a dar un vino más mineral, porque las raíces sacan sabor de la roca"],"a":1,"e":["La etiqueta indica la edad de las cepas; es una pista, no una garantía.","Las cepas viejas tienden a dar menos uva y a aguantar mejor la sequía; la variedad, el suelo y el productor también cuentan.","Dile: \"Suele dar uvas más concentradas, pero no hace milagros por sí solo. ¡Merece la pena probarlo!\""],"k":"\"Viñas viejas\": una pista, no una promesa."},{"id":"vinha-3-s03","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente de Madeira cuenta que en la isla las viñas crecen en emparrado (latada) sobre poios. ¿Qué son los poios?","o":["Bancales estrechos, con muros de piedra, en las laderas de la isla","Barriles de roble enterrados donde se cría el vino","Pozos de piedra que guardan el agua de lluvia para regar las viñas","Variedades antiguas de la isla, plantadas antes de la filoxera"],"a":0,"e":["Los poios son los bancales de Madeira: pequeñas terrazas de tierra sujetas por muros de piedra.","Las laderas son muy empinadas; el emparrado levanta las vides del suelo para que los racimos se aireen en el clima húmedo.","Dile: \"Buena parte de la viña de Madeira se trabaja a mano, en escalones sobre el Atlántico.\""],"k":"Poios: los escalones de piedra de las viñas de Madeira."},{"id":"vinha-3-s04","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente pregunta por qué algunos productores del Douro plantan variedades blancas en laderas orientadas al norte y en altura. ¿Qué le explicas?","o":["Para tener uvas más frescas, que maduran despacio y conservan la acidez","Porque las variedades blancas necesitan más calor para madurar","Para que las uvas sean más dulces y den vinos con más alcohol","Porque en las laderas al norte nunca hay helada ni granizo"],"a":0,"e":["En el cálido Douro, los blancos buscan los rincones más frescos.","Orientada al norte, la ladera recibe menos sol; con altura, las noches refrescan. La uva madura despacio y conserva acidez y aroma.","Dile: \"¡El Douro también sabe ser fresco!\" y sugiérele un blanco para comprobarlo."],"k":"Blancos del Douro: buscan sombra y altura."},{"id":"vinha-3-s05","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"Al servir un espumoso de la Bairrada, un cliente pregunta por qué las uvas para espumoso se vendimian antes. ¿Qué le dices?","o":["Para tener más acidez y menos azúcar, como pide el vino base","Para que el vino base gane más color y un tono más rosado","Porque las uvas de espumoso se pudren si se quedan hasta septiembre","Para aprovechar la mano de obra que sobra en julio, antes de las vacaciones"],"a":0,"e":["Vendimiar antes es una decisión de estilo.","Antes, la uva tiene mucha acidez y azúcar moderado: da un vino base fresco y ligero, que aún fermentará otra vez para ganar burbuja.","Dile: \"La frescura que nota empezó en la viña, el día en que se vendimió.\""],"k":"Espumoso: la frescura empieza en la fecha de vendimia."},{"id":"vinha-3-s06","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente con viña en el Minho cuenta que el mildiu le estropeó parte de la cosecha y pregunta por qué es tan común allí. ¿Cuál es la explicación?","o":["Lluvia y calor suave, con hojas mojadas, son el ambiente ideal del mildiu","Los suelos de granito, ácidos, debilitan la vid y abren la puerta al mildiu","El tiempo cálido y seco favorece el mildiu, igual que favorece el oídio","Las vides altas, en parral, quedan lejos del suelo y cogen más enfermedad"],"a":0,"e":["El mildiu lo causa un organismo parecido a un hongo, que adora la humedad.","Hojas mojadas y calor suave son el escenario ideal para las infecciones. Las vides altas hasta se airean mejor; el problema es el clima atlántico.","Muestra empatía y llévalo a la copa: los años de mucho mildiu pueden dar menos vino, a veces más caro."],"fonte":"WSET Nível 3, sessão 2 (slides): míldio (condições quentes, chuvosas e húmidas)","k":"Mildiu: adora las hojas mojadas y el calor suave."},{"id":"vinha-3-s07","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente ha oído que \"hubo desavinho\" (corrimiento) en la última cosecha del Dão y pregunta si eso estropea el vino. ¿Qué le respondes?","o":["Hay menos uva; el vino no es necesariamente peor, pero la producción cae","Sí, el vino siempre se avinagra y hay que destilarlo","No cambia nada: es solo un nombre antiguo para una buena floración","Quiere decir que la vendimia se hizo de noche, para huir del calor del día"],"a":0,"e":["El corrimiento es sobre todo un problema de cantidad.","El mal tiempo en la floración hace caer flores; los racimos quedan ralos y hay menos uva que vendimiar.","Dile: \"Puede haber menos botellas; la calidad depende del resto del año.\""],"k":"Corrimiento: menos uva, no necesariamente peor vino."},{"id":"vinha-3-s08","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente pregunta por qué un año de lluvia en la vendimia puede bajar la calidad de un tinto del Dão. ¿Cuál es la mejor explicación?","o":["La lluvia hace que la uva gane demasiado azúcar, y el vino sale muy alcohólico","La lluvia enfría la viña, y la uva madura vuelve a ponerse verde y ácida","La lluvia hincha las bayas y favorece la podredumbre; a veces se vendimia antes","La lluvia lava el color del hollejo, y los tintos de ese año salen casi rosados"],"a":2,"e":["El tiempo cerca de la vendimia pesa mucho en el resultado.","Con lluvia, las bayas se hinchan de agua y los hongos avanzan; el productor elige entre esperar y arriesgar o vendimiar antes.","Dile: \"En un año difícil, escoger bien las uvas en la viña marca la diferencia.\""],"fonte":"WSET Nível 3, sessão 2 (slides): podridão cinzenta (Botrytis cinerea)","k":"Lluvia en vendimia: uva aguada y hongos al acecho."}]}};/* /GTK-I18N-DATA */

const GTK_MK = {pelicula:[262,162], polpa:[160,150], grainhas:[176,196], engaco:[150,46], pruina:[66,150]};

// Folha de videira: 5 lóbulos com recortes, gerada por coordenadas polares.
function gtkLeaf(cx, cy, s, rot, fill, vein){
  let d = "";
  for(let i=0;i<=72;i++){
    const t = (i/72)*Math.PI*2;
    const lobes = 1 + .22*Math.cos(5*t) + .06*Math.cos(10*t+.4);
    const notch = 1 - .6*Math.exp(-Math.pow((t-Math.PI*.5)/.3,2));
    const r = s*lobes*Math.max(notch,.25);
    const x = cx + r*Math.cos(t), y = cy + r*Math.sin(t);
    d += (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
  }
  const veins = [0,1,2,3,4].map(k=>{ const a = -Math.PI/2 + Math.PI + (k-2)*1.05 + Math.PI;
    return `M${cx} ${cy+s*.35}L${(cx+s*.82*Math.cos(a)).toFixed(1)} ${(cy+s*.82*Math.sin(a)).toFixed(1)}`; }).join("");
  return `<g transform="rotate(${rot} ${cx} ${cy})"><path d="${d}Z" fill="${fill}" stroke="${vein}" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="${veins}" stroke="${vein}" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".8"/></g>`;
}
// Gavinha em espiral
function gtkTendril(x, y, turns, r0, dir){
  let d = `M${x} ${y}`;
  for(let i=1;i<=turns*24;i++){ const t=i/24*Math.PI*2, r=r0*(1-i/(turns*24+6));
    d += `L${(x+dir*(r0-r*Math.cos(t))).toFixed(1)} ${(y-r*Math.sin(t)-i*.25).toFixed(1)}`; }
  return `<path d="${d}" stroke="#7FA346" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
}

// O bago por dentro: cacho com um bago inteiro (pruína) e um bago cortado (película, polpa, grainhas).
function grapeSVG(markers, clickable){
  const pe = clickable ? "" : ' style="pointer-events:none"';
  const pa = k => clickable ? ` role="button" tabindex="0" aria-label="${(typeof PARTS!=="undefined" && PARTS[k]) ? PARTS[k].nm : k}"` : "";
  const cx=190, cy=192, rx=88, ry=96;
  // células da polpa
  let cells="";
  for(let i=0;i<70;i++){
    const a=i*2.399, rr=Math.sqrt((i+.5)/70);
    const x=cx+Math.cos(a)*rr*(rx-24), y=cy+Math.sin(a)*rr*(ry-24);
    cells+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(3.2+((i*7)%4)*.7).toFixed(1)}" fill="#FFFFFF" opacity="${(.18+((i*3)%5)*.05).toFixed(2)}"/>`;
  }
  // pruína: pó esbranquiçado sobre o bago inteiro
  let bloom="";
  for(let i=0;i<90;i++){
    const a=i*2.399, rr=Math.sqrt((i+.5)/90);
    const x=92+Math.cos(a)*rr*50, y=168+Math.sin(a)*rr*56;
    bloom+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(.9+((i*5)%3)*.45).toFixed(2)}" fill="#F2ECFA" opacity="${(.45+((i*7)%4)*.12).toFixed(2)}"/>`;
  }
  const seed=(x,y,rot,s)=>`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
      <path d="M0 -17q15 13 9 26q-4 8-9 8q-5 0-9-8q-6-13 9-26z" fill="url(#gtkSeed)" stroke="#4A2A10" stroke-width="1.6"/>
      <path d="M-3 -6q-2 7 1 13" stroke="#E9C08A" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/></g>`;
  const mk = markers.map(m=>`<circle class="marker ${m.c}" cx="${GTK_MK[m.p][0]}" cy="${GTK_MK[m.p][1]}" r="22"/>`).join("");
  return `<svg viewBox="0 0 300 310" role="${clickable?"group":"img"}" aria-label="Um bago inteiro com pruína e um bago cortado ao meio, presos ao engaço">
  <defs>
    <radialGradient id="gtkSun" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#FFE7A3" stop-opacity=".35"/><stop offset="1" stop-color="#FFE7A3" stop-opacity="0"/></radialGradient>
    <radialGradient id="gtkWhole" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#9C5CC8"/><stop offset=".55" stop-color="#5A2582"/><stop offset="1" stop-color="#2E0F45"/></radialGradient>
    <radialGradient id="gtkHaze" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#E6DAF3" stop-opacity=".12"/></radialGradient>
    <radialGradient id="gtkSkin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#8E46BE"/><stop offset=".7" stop-color="#4E1C74"/><stop offset="1" stop-color="#2B0C40"/></radialGradient>
    <radialGradient id="gtkPulp" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#FBFCE3"/><stop offset=".6" stop-color="#E7EEB2"/><stop offset="1" stop-color="#CBDB84"/></radialGradient>
    <radialGradient id="gtkBlush" cx="50%" cy="50%" r="50%"><stop offset=".82" stop-color="#C2508A" stop-opacity="0"/><stop offset="1" stop-color="#C2508A" stop-opacity=".55"/></radialGradient>
    <linearGradient id="gtkSeed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B57A3E"/><stop offset="1" stop-color="#6A3E17"/></linearGradient>
    <linearGradient id="gtkWood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A6238"/><stop offset=".5" stop-color="#6B4724"/><stop offset="1" stop-color="#4E3216"/></linearGradient>
  </defs>
  <circle cx="160" cy="150" r="150" fill="url(#gtkSun)"/>
  <g aria-hidden="true" style="pointer-events:none">
    ${gtkLeaf(238,52,40,18,"#7DB04A","#4F7E2A")}
    ${gtkLeaf(70,58,28,-24,"#9CC560","#5F8E33")}
    ${gtkTendril(196,40,1.6,11,1)}
  </g>
  <ellipse cx="196" cy="296" rx="92" ry="9" fill="#2B0C40" opacity=".18"/>
  <ellipse cx="96" cy="234" rx="46" ry="7" fill="#2B0C40" opacity=".14"/>
  <g class="part" data-part="engaco"${pe}${pa("engaco")}>
    <path d="M150 6q4 22 0 40q-3 20-34 54" stroke="url(#gtkWood)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M150 46q10 22 34 46" stroke="url(#gtkWood)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M147 12q2 10 1 20M152 58q6 12 16 22" stroke="#B48A58" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
    <circle cx="116" cy="102" r="7" fill="#6B4724"/><circle cx="185" cy="94" r="7" fill="#6B4724"/>
    <path d="M150 6q4 22 0 40q-3 20-34 54M150 46q10 22 34 46" stroke="transparent" stroke-width="34" fill="none" style="pointer-events:stroke"/>
  </g>
  <g class="part" data-part="pruina"${pe}${pa("pruina")}>
    <ellipse cx="92" cy="168" rx="52" ry="60" fill="url(#gtkWhole)"/>
    <ellipse cx="92" cy="168" rx="52" ry="60" fill="url(#gtkHaze)"/>
    ${bloom}
    <ellipse cx="74" cy="136" rx="12" ry="7" fill="#FFFFFF" opacity=".35" transform="rotate(-30 74 136)"/>
  </g>
  <g class="part" data-part="pelicula"${pe}${pa("pelicula")}>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#gtkSkin)"/>
    <path d="M${cx-62} ${cy-62}q30-30 76-28" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" opacity=".45"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="transparent" stroke-width="30" style="pointer-events:stroke"/>
  </g>
  <g class="part" data-part="polpa"${pe}${pa("polpa")}>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx-14}" ry="${ry-14}" fill="url(#gtkPulp)"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx-14}" ry="${ry-14}" fill="url(#gtkBlush)"/>
    ${cells}
    <path d="M${cx} ${cy-ry+16}v34M${cx} ${cy-ry+50}q-36 30-40 112M${cx} ${cy-ry+50}q38 30 42 108M${cx} ${cy-ry+50}q-8 50 -2 120" stroke="#C3D27A" stroke-width="2" fill="none" opacity=".9"/>
  </g>
  <g class="part" data-part="grainhas"${pe}${pa("grainhas")}>
    ${seed(176,196,-20,1)}${seed(214,186,18,1)}${seed(196,226,175,.85)}
    <circle cx="176" cy="196" r="20" fill="transparent"/><circle cx="214" cy="186" r="20" fill="transparent"/><circle cx="196" cy="226" r="18" fill="transparent"/>
  </g>
  <g aria-hidden="true" style="pointer-events:none">
    <path class="gtk-drip" d="M232 284q8 12 0 18q-8-6 0-18z" fill="#DCE8A0" stroke="#AFC060" stroke-width="1"/>
    <path d="M${cx+50} ${cy+64}q14-10 20-28" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity=".3"/>
  </g>
  ${mk}
</svg>`;
}

const XW_WORDS=[
  {n:1,d:"down",r:0,c:5,ans:"PRUINA",clue:"Camada cerosa e esbranquiçada que cobre o bago"},

let L=null;

function lhud(){
  const steps=L.step==="xw"?["learn","tap","match","xw"]:["learn","tap","match"], idx=steps.indexOf(L.step);
  const frac = L.step==="tap" ? L.ti/TAPS.length : L.step==="match" ? (L.m?L.m.done.size/4:0) : 0;
  const pct = Math.min(100,((idx+frac)/steps.length)*100);
  return `<div class="hud"><button class="close" data-sair aria-label="Voltar à vinha">×</button>${soundBtn()}<div class="bar" aria-label="Progresso"><span style="width:${pct}%"></span></div>${livesHTML()}</div>

    <span>${state.streak>1?`<span class="streak">${state.streak} seguidas</span> · `:""}<b>${state.xp}</b> kg de uva</span></div>`;
}

  return `<div class="stage"><div class="mascot m-${mood}">${mascot(state.char,mood)}</div>

}

function startLesson(){
  Object.assign(state,{lives:3,xp:0,streak:0,right:0,misses:0});
  L={step:"learn",seen:new Set(),sel:null,ti:0,m:null,xw:null};
  renderLearn();
}
function renderLearn(){
  const n=L.seen.size, sel=L.sel;
  $app.innerHTML = `${lhud()}
    ${say("idle", who()+" explica", "Toca em cada parte do bago e descobre o que faz. Depois, vem o teste.")}
    <div class="grape-fig">${grapeSVG(sel?[{p:sel,c:"sel"}]:[], true)}</div>
    <div class="chips">${PART_ORDER.map(k=>`<button class="chip${L.seen.has(k)?" seen":""}${sel===k?" on":""}" id="chip-${k}" data-chip="${k}">${L.seen.has(k)?"✓ ":""}${PARTS[k].nm}</button>`).join("")}</div>
    ${sel?`<div class="info" role="status"><b>${PARTS[sel].nm}</b><p>${esc(PARTS[sel].fn)}</p></div>`:""}
    <button class="cta" id="next" ${n<5?"disabled":""}>${n<5?`Descobre as 5 partes (${n}/5)`:"Já sei, testa-me!"}</button>`;
  const pickPart = k=>{ L.sel=k; L.seen.add(k); renderLearn(); };
  $app.querySelectorAll("[data-part]").forEach(g=>g.onclick=()=>pickPart(g.dataset.part));
  $app.querySelectorAll("[data-chip]").forEach(b=>b.onclick=()=>pickPart(b.dataset.chip));
  document.getElementById("next").onclick=()=>{ L.step="tap"; L.ti=0; renderTap(); };
}
function renderTap(mood="idle", chosen=null){
  const T=TAPS[L.ti], answered=chosen!==null, ok=answered&&chosen===T.a;
  const marks = answered ? [{p:T.a,c:"ok"}].concat(ok?[]:[{p:chosen,c:"bad"}]) : [];
  $app.innerHTML = `${lhud()}
    ${say(mood, `Toca no desenho · ${L.ti+1} de ${TAPS.length}`, esc(T.q))}
    <div class="grape-fig${answered?" locked-fig":""}">${grapeSVG(marks, !answered)}</div>
    ${answered?`<div class="fb ${ok?"good":"bad"}" role="status"><h2>${ok?pick(CHEERS):pick(CORKS)}</h2>
      <p><b>${PARTS[T.a].nm}.</b> ${esc(PARTS[T.a].fn)}</p>
      <button class="cta" id="next">${state.lives<=0?"Ver resultado":"Continuar"}</button></div>`:""}`;
  if(!answered){
    $app.querySelectorAll("[data-part]").forEach(g=>g.onclick=()=>{
      const k=g.dataset.part;
      if(k===T.a){ const p=gain(10); renderTap("happy",k); if(p) showPop(state.streak); }
      else { const r=lose(); renderTap("corked",k); if(r==="vin") showVinagre(); else if(r==="brk") showBroken(); }
    });
  } else {
    const n=document.getElementById("next"); n.focus({preventScroll:true});
    n.onclick=()=>{
      if(state.lives<=0) return renderLessonEnd(true);
      L.ti++; if(L.ti>=TAPS.length){ L.step="match"; renderMatch(); } else renderTap();
    };
  }
}
function renderMatch(errL=null, errR=null){
  if(!L.m){ const keys=Object.keys(MATCH); L.m={l:null,r:null,done:new Set(),errs:0,right:[...keys].sort(()=>Math.random()-.5)}; }
  const m=L.m, all=m.done.size===4;
  $app.innerHTML = `${lhud()}

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z]/g,"");
function renderXW(){
  const cells={};

    const r=w.d==="down"?w.r+i:w.r, c=w.d==="across"?w.c+i:w.c, key=r+","+c;
    (cells[key] ||= {ans:w.ans[i],words:[],r,c}).words.push(wi);
  }});
  const nums={}; XW_WORDS.forEach(w=>nums[w.r+","+w.c]=w.n);
  let grid="";
  for(let r=0;r<XW_ROWS;r++) for(let c=0;c<XW_COLS;c++){
    const k=r+","+c;
    grid += cells[k] ? `<div class="cell">${nums[k]?`<span class="num">${nums[k]}</span>`:""}<input id="x-${r}-${c}" data-k="${k}" maxlength="2" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Linha ${r+1}, coluna ${c+1}"></div>` : `<div></div>`;
  }
  const clueList = d => XW_WORDS.map((w,wi)=>w.d===d?`<div class="clue" data-w="${wi}"><b>${w.n}</b>${w.clue} <small>(${w.ans.length})</small></div>`:"").join("");

    ${say("idle","Palavras cruzadas","Todas as partes do bago estão aqui. Consegues sem espreitar?")}
    <div class="xw-wrap"><div class="xw" id="xw">${grid}</div></div>
    <div class="clues"><div class="qlabel">Horizontais</div>${clueList("across")}<div class="qlabel" style="margin-top:6px">Verticais</div>${clueList("down")}</div>
    <p class="note" id="xw-note" role="status"></p>
    <div class="xw-actions"><button class="cta" id="xw-check">Verificar</button><button class="ghost" id="xw-show">Ver solução</button></div>
    <div id="xw-done"></div>`;
  let cur=0, solved=false;
  const inp = k => document.getElementById("x-"+k.replace(",","-"));
  const wordKeys = wi => { const w=XW_WORDS[wi]; return [...w.ans].map((_,i)=> (w.d==="down"?w.r+i:w.r)+","+(w.d==="across"?w.c+i:w.c)); };

  };
  const focusKey = k => { const el=inp(k); el && el.focus({preventScroll:false}); };
  document.querySelectorAll(".xw input").forEach(el=>{
    const k=el.dataset.k, cell=cells[k];
    el.addEventListener("focus",()=>{ if(!cell.words.includes(cur)) cur=cell.words[0]; paint(); });
    el.addEventListener("click",()=>{ if(document.activeElement===el && cell.words.length>1 && el.dataset.f==="1"){ cur = cell.words.find(w=>w!==cur); paint(); } el.dataset.f="1"; });
    el.addEventListener("blur",()=>{ el.dataset.f=""; });
    el.addEventListener("input",()=>{
      const v=norm(el.value); el.value=v.slice(-1); el.classList.remove("ok","bad");
      if(el.value){ const ks=wordKeys(cur), i=ks.indexOf(k); if(i>-1 && i<ks.length-1) focusKey(ks[i+1]); }
    });
    el.addEventListener("keydown",e=>{
      if(e.key==="Backspace" && !el.value){ const ks=wordKeys(cur), i=ks.indexOf(k); if(i>0){ e.preventDefault(); const p=inp(ks[i-1]); p.value=""; p.classList.remove("ok","bad"); p.focus(); } }
    });
  });
  document.querySelectorAll(".clue").forEach(el=>el.onclick=()=>{ cur=+el.dataset.w; paint(); focusKey(wordKeys(cur)[0]); });
  const finish = (won)=>{
    solved=true;
    document.querySelectorAll(".xw input").forEach(i=>i.readOnly=true);
    document.getElementById("xw-check").disabled=true; document.getElementById("xw-show").disabled=true;
    let p=false; if(won){ p=gain(30); }
    document.getElementById("xw-done").innerHTML = `<div class="fb ${won?"good":"bad"}" role="status">
      <h2>${won?"Oh yeah! That was GRAPE TO KNOW!":"Espreitaste… desta vez."}</h2>
      <p>${won?"Cruzadas completas sem ajuda: +30 kg de uva.":"Viste a solução. Na próxima, tenta sem espreitar."}</p>
      <button class="cta" id="next">Voltar ao fim da lição</button></div>`;
    L.xwFeito=true; const n=document.getElementById("next"); n.onclick=()=>renderLessonEnd(false); n.focus({preventScroll:false});
    if(p) showPop(state.streak);
  };
  document.getElementById("xw-check").onclick=()=>{
    if(solved) return;
    let wrong=0, empty=0;
    Object.keys(cells).forEach(k=>{ const el=inp(k); el.classList.remove("ok","bad");
      if(!el.value) empty++; else if(el.value===cells[k].ans) el.classList.add("ok"); else { el.classList.add("bad"); wrong++; } });
    const note=document.getElementById("xw-note");
    if(!wrong && !empty){ note.textContent=""; finish(true); }
    else note.textContent = wrong ? `Corked! ${wrong} letra${wrong>1?"s":""} errada${wrong>1?"s":""}${empty?`, ${empty} por preencher`:""}.` : `Falta${empty>1?"m":""} ${empty} letra${empty>1?"s":""}.`;
  };
  document.getElementById("xw-show").onclick=()=>{
    if(solved) return;
    Object.keys(cells).forEach(k=>{ const el=inp(k); el.value=cells[k].ans; el.classList.remove("bad"); el.classList.add("ok"); });
    document.getElementById("xw-note").textContent=""; finish(false);
  };
  paint();
}

function rodaSVG(sel, clicavel){
  const F = cicloF().fases, R = 92, c = 120;

    <path d="M${c+R*Math.cos(-Math.PI/2+.32)} ${c+R*Math.sin(-Math.PI/2+.32)} A${R} ${R} 0 0 1 ${c+R*Math.cos(-Math.PI/2+.62)} ${c+R*Math.sin(-Math.PI/2+.62)}" class="roda-seta"/>
    ${pts.map(([x,y],k)=>{ const f = F[k], on = f.id===sel, vis = CL && CL.seen && CL.seen.has(f.id);
      return `<g class="rn rn-${CICLO_COR[f.id]}${on?" on":""}${vis?" vis":""}"${clicavel?` data-ciclo="${f.id}" role="button" tabindex="0" aria-label="${esc(f.t)}"`:""}>
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${on?17:13}"/><text x="${x.toFixed(1)}" y="${(y+4.5).toFixed(1)}" text-anchor="middle">${k+1}</text></g>`; }).join("")}
    <text x="${c}" y="${c-6}" text-anchor="middle" class="roda-t">${fs?esc(fs.t):""}</text>
    <text x="${c}" y="${c+14}" text-anchor="middle" class="roda-m">${fs?esc(fs.m):""}</text>
  </svg>`;
}

    document.getElementById("espreitar").onclick = ()=>{ UVA.sfx("tap"); ESPREITAR = true; renderStart(); scrollTo(0,0); };
    return;
  }
  $app.innerHTML = `<div class="gtk-home${novo?" novo":""}">
    <header class="topo volta">
      ${topStats()}
      <div class="entrada">${logo}<p class="slogan-h">Prova o que sabes.</p></div>
    </header>
    ${faseHTML()}
    <p class="fine">Jogo para maiores de 18. Bebe com moderação.</p>
  </div>`;
  document.getElementById("ver-adega").onclick=()=>{ UVA.sfx("tap"); renderAdega(); };
  document.getElementById("go-uva").onclick=MOTOR().home;
  $app.querySelectorAll("[data-fase]").forEach(b=>b.onclick=()=>{
    const n = +b.dataset.fase;
    if(n===2 && !vinhaAberta()){ UVA.sfx("tique"); return avisar("A Vinha abre quando chegares ao Vintage da Uva."); }
    if(n===FA) return;
    UVA.sfx("tap"); irFase(n); renderStart();
    document.querySelector(`[data-fase="${n}"]`)?.focus({preventScroll:true});
  });
  ENTRAR = entrar;
  ligarTrilha(novo);
}

function startGame(){
  const mix = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const qs = mix(QUESTIONS).map(q=>{ const ord = mix(q.o.map((_,k)=>k)); return Object.assign({}, q, {o:ord.map(k=>q.o[k]), a:ord.indexOf(q.a)}); });
  Object.assign(state,{i:0,lives:3,xp:0,streak:0,right:0,misses:0,order:QUESTIONS.map((_,k)=>k),qs});
  renderQ();
}

function hud(){
  const pct = (state.i/QUESTIONS.length)*100;
  return `<div class="hud"><button class="close" data-sair aria-label="Voltar à vinha">×</button>${soundBtn()}<div class="bar" aria-label="Progresso"><span style="width:${pct}%"></span></div>
    <div class="lives" aria-label="${state.lives} bagos de vida">${[0,1,2].map(k=>grapeIcon(k>=state.lives)).join("")}</div></div>
    <div class="stats"><span>Pergunta <b>${Math.min(state.i+1,QUESTIONS.length)}</b> de ${QUESTIONS.length}</span>
    <span>${state.streak>1?`<span class="streak">${state.streak} seguidas</span> · `:""}<b>${state.xp}</b> kg de uva</span></div>`;
}

function renderQ(mood="idle", chosen=null){
  const Q = state.qs[state.i];
  const answered = chosen!==null, ok = answered && chosen===Q.a;
  $app.innerHTML = `${hud()}
    <div class="stage">
      <div class="mascot m-${mood}">${mascot(state.char,mood)}</div>
      <div class="bubble"><div class="qlabel">${state.char==="ms"?"Ms. Cork pergunta":"Mr. Cork pergunta"}</div>
      <p class="qtext">${esc(Q.q)}</p></div>
    </div>
    <div class="opts">${Q.o.map((t,k)=>{
      let cls="opt"; if(answered){ if(k===Q.a) cls+=" right"; else if(k===chosen) cls+=" wrong"; }
      return `<button class="${cls}" id="opt-${k}" data-k="${k}" ${answered?"disabled":""}>${esc(t)}</button>`}).join("")}</div>
    ${answered?`<div class="fb ${ok?"good":"bad"}" role="status">
      <h2>${ok?pick(CHEERS):pick(CORKS)}</h2><p>${esc(Q.e)}</p>
      <button class="cta" id="next">${state.lives===0?"Ver resultado":state.i+1>=QUESTIONS.length?"Ver resultado":"Continuar"}</button></div>`:""}`;
  if(!answered){
    $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    document.onkeydown = e=>{ if(e.metaKey||e.ctrlKey||!/^[1-4]$/.test(e.key)) return; const el=$app.querySelector("#opt-"+(+e.key-1)); if(el&&!el.disabled&&$app.querySelector(".stage")&&!$app.querySelector(".uva-q")){ e.preventDefault(); el.click(); } };
  } else {
    const n=document.getElementById("next"); n.onclick=next; n.focus({preventScroll:true});
  }
}

function answer(k){
  const Q = state.qs[state.i];
  if(k===Q.a){ state.misses=0; state.right++; state.streak++; state.xp += 10 + Math.min(state.streak-1,4)*2;
    const popNow = state.streak%3===0; if(popNow) state.xp += 15;
    renderQ("happy",k); if(popNow) showPop(state.streak); }
  else { state.streak=0; state.lives--; state.misses=(state.misses||0)+1; renderQ("corked",k);
    if(state.lives<=0) showVinagre(); else if(state.misses===2) showBroken(); }
}

  const el = document.createElement("div");

    <div class="pop-title${sad?" sad":""}">${title}</div><div class="pop-sub">${sub}</div></div>`;
  document.body.appendChild(el);
  const onKey=e=>{ if(e.key==="Escape") close(); };
  const close=()=>{ document.removeEventListener("keydown", onKey); if(el.isConnected){ el.remove(); document.getElementById("next")?.focus({preventScroll:true}); } };
  document.addEventListener("keydown", onKey); el.onclick=close; setTimeout(close, ms);
}
function tone(kind){
  if(!state.sound) return;
  try{
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx = new AC(), t = ctx.currentTime;
    if(kind==="crack"){
      const len=ctx.sampleRate*.12, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)*.5;
      const n=ctx.createBufferSource(), f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1800;
      n.buffer=buf; n.connect(f).connect(ctx.destination); n.start(t+1.3);
    } else {
      [392,370,349,262].forEach((hz,i)=>{
        const o=ctx.createOscillator(), g=ctx.createGain(); o.type="triangle";
        const st=t+1.4+i*.4, du=i===3?.8:.32;
        o.frequency.setValueAtTime(hz,st); if(i===3) o.frequency.linearRampToValueAtTime(240,st+du);
        g.gain.setValueAtTime(.0001,st); g.gain.exponentialRampToValueAtTime(.18,st+.03); g.gain.exponentialRampToValueAtTime(.0001,st+du);
        o.connect(g).connect(ctx.destination); o.start(st); o.stop(st+du+.05);
      });
    }
    setTimeout(()=>ctx.close(),4500);
  }catch(e){}
}

function popSound(){
  if(!state.sound) return;
  try{
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx = new AC(), t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type="sine"; o.frequency.setValueAtTime(900,t+1.1); o.frequency.exponentialRampToValueAtTime(140,t+1.23);
    g.gain.setValueAtTime(0.0001,t); g.gain.setValueAtTime(0.35,t+1.1); g.gain.exponentialRampToValueAtTime(0.0001,t+1.28);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+1.35);
    const len = ctx.sampleRate*.6, buf = ctx.createBuffer(1,len,ctx.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2)*.18;
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter();
    f.type="highpass"; f.frequency.value=3000; n.buffer=buf; n.connect(f).connect(ctx.destination); n.start(t+1.16);
    setTimeout(()=>ctx.close(),1800);
  }catch(e){}
}

function next(){
  state.i++;
  if(state.lives<=0 || state.i>=QUESTIONS.length) return renderEnd();
  renderQ();

function renderEnd(){
  const out = state.lives<=0;
  const title = TITLES.filter(t=>state.right>=t[0]).pop()[1];
  colher(state.xp);
  if(state.right>state.best){ state.best=state.right; try{localStorage.setItem("gtk-best",state.best)}catch(e){} }
  try{ localStorage.setItem("gtk-pt","1"); }catch(e){}
  const mood = state.right>=7 ? "happy" : out ? "corked" : "idle";
  const lead = out ? `Os bagos acabaram, mas cada erro foi uma aula. Colheste ${state.xp} kg: vai buscar o resto.`
    : state.right===10 ? `Dez em dez e ${state.xp} kg colhidos. Quem te tira o título agora?`
    : state.right>=7 ? `${state.xp} kg colhidos. Estás perto do topo: faltam ${10-state.right} para a ronda perfeita.`

  $app.innerHTML = `<section class="end">
    <div class="end-head">
      <div class="mascot m-${mood}">${mascot(state.char,mood)}</div>

const diaLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

  T.kg += Math.max(0, kg|0);

  if(T.ultimo !== h){
    T.dias = T.ultimo === ontem() ? T.dias+1 : 1; T.ultimo = h;

}

/* ---------- as atividades da Fase 1 e o seu estado ---------- */
function atividades(){
  const M = MOTOR(), U = M.estado();
  const lic = FA===2 ? {id:"licao", num:1, t:"O ano da videira", tipo:"Lição", go:startCiclo, feito:!!T.licao2, aberto:true, prog:null}
                     : {id:"licao", num:1, t:"O bago por dentro", tipo:"Lição", go:startLesson, feito:!!T.licao, aberto:true, prog:null};
  const A = [lic,
    {id:"n1", num:2, t:"Ruby", tipo:"Nível 1", n:1, go:()=>M.jogar(1), feito:U.max>=2, aberto:LIVRE || lic.feito || U.rondas>0},
    {id:"n2", num:3, t:"Tawny", tipo:"Nível 2", n:2, go:()=>M.jogar(2), feito:U.max>=3, aberto:LIVRE || U.max>=2},
    {id:"n3", num:4, t:"Vintage", tipo:"Nível 3", n:3, go:()=>M.jogar(3), feito:!!U.dominada, aberto:LIVRE || U.max>=3}
  ];
  A.forEach(a=>{
    if(a.n) a.prog = {melhor:M.melhor(a.n), ...M.meta()};
    a.estado = a.feito ? "concluida" : !a.aberto ? "bloqueada"
      : (a.prog && (a.prog.melhor>0 || (U.nivel===a.n && U.rondas>0))) ? "curso" : "disponivel";
  });
  // Mesa 1 (Sal e Acidez) abre logo depois do Ruby (decisão da autora, 15 out 2026). Não tranca o Tawny,
  // mas é "a seguir" até ser jogada uma vez.
  T.mesas = T.mesas || {};
  // Na Vinha, a Mesa 2 (Doçura, Amargo e Umami) ocupa o mesmo lugar: abre depois do Ruby.
  const mn = FA, m1 = {id:"m"+mn, mesa:mn, num:"Serviço "+SERV[mn], t:mn===1?"Sal e Acidez":"Doçura, Amargo e Umami", tipo:"Serviço "+SERV[mn], go:()=>startMesa(mn), feito:!!T.mesas[mn], aberto:LIVRE || U.max>=2};
  m1.estado = m1.feito ? "concluida" : m1.aberto ? "disponivel" : "bloqueada";
  A.mesa = m1;
  // Mesa 4 "Seco… em que sentido?" (19 out 2026): no mapa da Uva, abre depois do Tawny; não tranca nada.
  if(FA===1){ const m4 = {id:"m4", mesa:4, num:"Serviço 2", t:MESAS[3].t, tipo:"Serviço 2", go:()=>startMesa(4), feito:!!T.mesas[4], aberto:LIVRE || U.max>=3};
    m4.estado = m4.feito ? "concluida" : m4.aberto ? "disponivel" : "bloqueada"; A.mesa4 = m4; }
  // O Desafio Portugal saiu do jogo a 15 out 2026 (pedido da autora); as perguntas estão em fases/desafio-portugal-perguntas.json.
  if(U.max>=2 && !m1.feito) m1.proxima = true;
  else { const prox = A.find(a=>a.aberto && !a.feito); if(prox) prox.proxima = true; }
  return A;
}
function caixotes(){
  const U = MOTOR().estado(), p = FA===2 ? "vbau" : "bau";
  return [
    {id:p+"1", kg:25, pronto:U.max>=2, depois:"2 · Ruby"},
    {id:p+"2", kg:50, pronto:U.max>=3, depois:"3 · Tawny"}
  ].map(c=>Object.assign(c,{colhido:T.baus.includes(c.id)}));
}
// O que o botão principal faz: a próxima atividade, ou repetir o Vintage se tudo estiver feito.
function proximaAtividade(){
  const A = atividades();
  return A.mesa.proxima ? A.mesa : A.find(a=>a.proxima) || A[3];
}
function proximoPasso(){ return proximaAtividade().go; }

/* ---------- a ilustração ---------- */
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const lerp = (a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
function videira(x,y,s,r,est){
  if(est==="bloqueada"){
    // videira em repouso: tronco torcido, varas nuas, um rebento aqui e ali
    const h = (6.5+r()*3)*s, lean = (r()-.5)*2.4*s, arm = (2+r()*2)*s;
    const bud = r()<.4 ? `<ellipse cx="${(x+lean+arm).toFixed(1)}" cy="${(y-h-1.2*s).toFixed(1)}" rx="${(1.4+r())*s}" ry="${s}" class="sprout"/>` : "";
    return `<g><path d="M${x} ${y}q${(-1*s).toFixed(1)} ${(-h/2).toFixed(1)} ${lean.toFixed(1)} ${(-h).toFixed(1)}m0 0l${arm.toFixed(1)} ${(-1.4*s).toFixed(1)}m${(-arm).toFixed(1)} ${(1.4*s).toFixed(1)}l${(-arm*.8).toFixed(1)} ${(-1.1*s).toFixed(1)}" class="stake" stroke-width="${1.3*s}" fill="none" stroke-linecap="round"/>${bud}</g>`;
  }
  const f = [];
  const n = 2 + (r()<.55?1:0);
  for(let i=0;i<n;i++){
    const cx = x+(r()-.5)*7*s, cy = y-10*s+(r()-.5)*4.5*s, rx=(4+r()*2.6)*s, ry=(3.2+r()*1.8)*s, rot=(r()*50-25).toFixed(0);
    f.push(`<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" transform="rotate(${rot} ${cx.toFixed(1)} ${cy.toFixed(1)})" class="lf${1+Math.floor(r()*3)}"/>`);
  }
  const cacho = r() < (est==="concluida"?.55:.3)
    ? `<g class="${r()<.5?"bc1":"bc2"}"><circle cx="${x+2.4*s}" cy="${y-5.4*s}" r="${1.6*s}"/><circle cx="${x+4.6*s}" cy="${y-5.2*s}" r="${1.6*s}"/><circle cx="${x+3.5*s}" cy="${y-3.2*s}" r="${1.6*s}"/></g>` : "";
  const sway = r()<.28 ? ` sway" style="animation-delay:-${(r()*6).toFixed(1)}s` : "";
  return `<g class="vd${sway}"><path d="M${x} ${y}q${-1*s} ${-4*s} ${.6*s} ${-8.5*s}" class="trunk" stroke-width="${1.5*s}"/>${f.join("")}${cacho}</g>`;
}

function talhaoSVG(id, est, seed){

    for(let u = .1; u < .95; u += 15/L){

  return `<g class="talhao t-${est}" data-talhao="${id}"><path d="${poly(4)}" class="plot-shade"/><path d="${poly()}" class="plot-soil"/>${rows}${vines}</g>`;

// Fase 2: encosta em socalcos de xisto sobre o rio, com um barco rabelo e o armazém da quinta à beira-água.

const pc = (id)=>{ const [x,y] = POS()[id]; return `left:${(x/VB[0]*100).toFixed(2)}%;top:${(y/VB[1]*100).toFixed(2)}%`; };

function mascoteCena(A){
  const prox = A.mesa.proxima ? A.mesa : A.find(a=>a.proxima), id = prox ? prox.id : "trofeu";
  // de cada lado do marco, fica no sítio mais longe dos outros marcos (e dentro do desenho)
  const [x,y] = POS()[id], outros = Object.entries(POS()).filter(([k])=>k!==id).map(([,p])=>p);
  const folga = cx => cx<30||cx>330 ? -1 : Math.min(...outros.map(([a,b])=>Math.hypot(a-cx, b-(y-30))));
  const lado = folga(x-52) > folga(x+52) ? -1 : 1;
  // a rolha fica ao lado do próximo marco, do lado com mais espaço, sem tapar o caminho
  return `<button class="masc-cena" id="mascote-cena" data-alvo="${id}" data-lado="${lado}" style="left:${((x+lado*52)/VB[0]*100).toFixed(2)}%;top:${((y-30)/VB[1]*100).toFixed(2)}%" aria-label="${state.char==="ms"?"Ms. Cork":"Mr. Cork"}, a tua guia">

  } else if(it.mesa){
    eb = it.mesa===4 ? MESAS[3].eb : "Serviço de harmonização"; dur = 6;
    desc = it.mesa===4 ? MESAS[3].desc : it.mesa===1 ? "Prova como o sal e a acidez do prato mudam o vinho. Não tranca o Tawny: podes jogá-la quando quiseres."
                       : "Prova como a doçura, o amargo e o umami do prato mudam o vinho. Não tranca o Tawny: podes jogá-la quando quiseres.";

  } else if(it.id==="trofeu"){

    estado = it.feito ? `${IC.check}Ganho` : `${IC.lock}Por ganhar`;

    return casca(eb, V ? "Troféu da Vinha" : "Troféu da Uva", desc, estado, prog, acao, it);
  }
  if(it.estado==="bloqueada"){
    const cond = it.mesa===4 ? "Abre quando concluíres a etapa 3 · Tawny." : it.mesa ? "Abre quando concluíres a etapa 2 · Ruby." : `Abre quando concluíres a etapa ${ant.num} · ${ant.t}.`;
    estado = `${IC.lock}${cond}`;
  } else estado = `${IC[ic]}${txt}${it.proxima?" · é o teu próximo passo":""}`;
  const verbo = it.estado==="bloqueada" ? "" : it.estado==="concluida" ? "Jogar outra vez" : it.estado==="curso" ? "Continuar" : (novo && it.proxima ? "Aceito o desafio" : "Começar");

  if(dur && it.estado!=="bloqueada") prog += `<p class="ec-tempo">Cerca de ${dur} min (estimativa)</p>`;
  return casca(eb, it.t, desc, estado, prog, acao, it);
}

function selecionar(id, novo, foco){
  const itens = itensMapa(), it = itens.find(x=>x.id===id) || itens[0];
  SEL = it.id;
  $app.querySelectorAll(".marco").forEach(b=>b.setAttribute("aria-pressed", b.dataset.sel===SEL ? "true" : "false"));
  const card = document.getElementById("etapa-card");
  card.innerHTML = cartaoHTML(it, novo);
  const go = document.getElementById("ec-go");
  if(go) go.onclick = ()=>{
    if(it.kg) return abrirBau(it);
    if(it.id==="trofeu") return verTrofeu();
    UVA.sfx("tap");
    if(novo && it.proxima && typeof ENTRAR==="function") return ENTRAR();
    it.go();
  };
  if(foco && go) go.focus({preventScroll:true});
  // barra "A seguir" (telemóvel): leva ao próximo passo sem ter de descer até ao cartão
  const sb = document.getElementById("segue-bar");
  if(sb){ const ok = !!(go && it.proxima);
    sb.dataset.ok = ok ? "1" : "";
    sb.innerHTML = ok ? `<small>A seguir</small><b>${document.getElementById("ec-t").textContent}</b>${IC.arrow}` : "";
    sb.onclick = ()=>{ const g = document.getElementById("ec-go"); if(g) g.click(); }; }
}
let SEGUE_OBS = null;
function segueObs(){
  if(SEGUE_OBS) SEGUE_OBS.disconnect();
  const c = document.getElementById("etapa-card"), sb = document.getElementById("segue-bar");
  if(!c || !sb || !("IntersectionObserver" in window)) return;
  SEGUE_OBS = new IntersectionObserver(([e])=>{
    const ver = e.intersectionRatio < 0.85 && e.boundingClientRect.top > 0;
    sb.classList.toggle("ver", ver); sb.tabIndex = ver ? 0 : -1; sb.setAttribute("aria-hidden", ver ? "false" : "true");
  }, {threshold:[0, 0.85, 1]});
  SEGUE_OBS.observe(c);
}
function ligarTrilha(novo){

// A rolha não tapa marcos nem etiquetas (17 out 2026): experimenta lugares à volta do próximo marco e fica no primeiro livre.
function arrumarMascote(){
  const m = document.getElementById("mascote-cena"), cena = m && m.closest(".cena"); if(!cena) return;
  const C = cena.getBoundingClientRect(); if(!C.width) return;
  const [x,y] = POS()[m.dataset.alvo], k = C.width/VB[0], l = +m.dataset.lado || 1, mw = m.offsetWidth, mh = m.offsetHeight || mw*1.3;
  const caixas = [...cena.querySelectorAll(".mk-disco,.mk-lbl,.mk-cx svg,.mk-kg")].map(e=>e.getBoundingClientRect());
  let melhor = null;
  for(const [dx,dy] of [[52*l,-30],[-52*l,-30],[60*l,4],[-60*l,4],[46*l,-64],[-46*l,-64],[0,-76],[74*l,-24],[-74*l,-24]]){
    const cx = C.left+(x+dx)*k, cy = C.top+(y+dy)*k, r = {l:cx-mw/2, r:cx+mw/2, t:cy-mh/2, b:cy+mh/2};
    if(r.l<C.left+2 || r.r>C.right-2 || r.t<C.top+2 || r.b>C.bottom-2) continue;
    const sob = caixas.reduce((s,c)=>s + Math.max(0,Math.min(r.r,c.right)-Math.max(r.l,c.left)) * Math.max(0,Math.min(r.b,c.bottom)-Math.max(r.t,c.top)), 0);
    if(!melhor || sob<melhor.sob) melhor = {sob,dx,dy};
    if(sob===0) break;
  }
  if(melhor){ m.style.left = ((x+melhor.dx)/VB[0]*100).toFixed(2)+"%"; m.style.top = ((y+melhor.dy)/VB[1]*100).toFixed(2)+"%"; }
}
addEventListener("resize", ()=>arrumarMascote());
// Quilos ganhos desde a última vez que a vinha foi mostrada: o total sobe e um "+N kg" sai do marco. Só mostra; não soma nada.
function festejarKg(deId){
  const ganho = T.kg - KG_VISTO;
  KG_VISTO = T.kg;
  if(ganho <= 0) return;
  const b = $app.querySelector(".topo .h-stat:nth-child(2) b"), v = document.getElementById("kg-voa");
  const calmo = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const alvo = KG_SO_TOPO ? null : document.getElementById("st-"+(deId || proximaAtividade().id));
  KG_SO_TOPO = false;
  if(v && alvo){
    v.textContent = `+${ganho} kg`; v.style.left = alvo.style.left; v.style.top = alvo.style.top; v.hidden = false;
    v.classList.toggle("calmo", calmo);
    setTimeout(()=>{ v.hidden = true; }, calmo ? 2200 : 1700);
  }
  if(b && !calmo){
    const de = T.kg - ganho, t0 = performance.now(), dur = 900;
    const passo = t=>{ const k = Math.min(1,(t-t0)/dur); b.textContent = Math.round(de + ganho*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(passo); };
    b.textContent = de; requestAnimationFrame(passo);
    b.closest(".h-stat").classList.add("kg-sobe"); setTimeout(()=>b.closest(".h-stat")?.classList.remove("kg-sobe"), 1000);
  }
}

// Rever os erros (19 out 2026): só as perguntas falhadas, logo a seguir à ronda ou à mesa, mesmo que sejam de níveis diferentes.
// Sem kg, sem bagos e sem mexer no nível nem no progresso guardado; alternativas baralhadas; sai-se quando se quiser.
// itens: [{eb, q, o:[...], a, expl (html), fixa (não baralhar), somm (rolha de sommelier)}]; fim recebe {certas, feitas, total}.
function rever(itens, fim){
  const lista = itens.map(it=>{ if(it.fixa) return it; const ord = baralha(it.o.map((_,k)=>k));
    return Object.assign({}, it, {o:ord.map(k=>it.o[k]), a:ord.indexOf(it.a)}); });
  let i = 0, ans = null, certas = 0, feitas = 0;
  const sair = ()=>{ document.onkeydown = null; fim({certas, feitas, total:lista.length}); };
  function desenha(){
    const it = lista[i], done = ans!==null, ok = done && ans===it.a, ultima = i+1>=lista.length, mood = done?(ok?"happy":"corked"):"idle";
    $app.innerHTML = `<div class="hud rev-hud"><button class="close" id="rev-x" aria-label="Sair da revisão">×</button>${soundBtn()}
      <div class="bar" aria-hidden="true"><span style="width:${i/lista.length*100}%"></span></div></div>
      <div class="stats"><span class="lvl">Revisão · sem pontos nem bagos</span><span>${i+1} de ${lista.length}</span></div>
      <div class="stage uva-q rev-q${it.somm?" mesa-q":""}${done?" feito":""}">${it.somm?somm(mood):`<div class="mascot m-${mood}">${mascot(state.char,mood)}</div>`}
        <div class="bubble"><div class="eyebrow">${esc(it.eb||"")}</div><p class="qtext">${esc(it.q)}</p></div></div>
      <div class="opts${it.o.length===2?" vf":""}">${it.o.map((t,k)=>{ let c="opt"; if(done){ if(k===it.a) c+=" right"; else if(k===ans) c+=" wrong"; }
        return `<button class="${c}" id="opt-${k}" data-k="${k}" ${done?"disabled":""}>${esc(t)}</button>`; }).join("")}</div>
      ${done?`<div class="fb ${ok?"good":"bad"}" role="status"><h2>${ok?"Certa, desta vez.":"Ainda não. Guarda a ideia:"}</h2>${it.expl||""}
        <button class="cta" id="next">${ultima?"Terminar a revisão":"Continuar"}</button></div>`:""}`;
    document.getElementById("rev-x").onclick = sair;
    if(!done){
      $app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ ans = +b.dataset.k; feitas++; if(ans===it.a){ certas++; UVA.sfx("certo"); } else UVA.sfx("errado"); desenha(); });
      document.onkeydown = e=>{ if(ans!==null || e.metaKey||e.ctrlKey||e.altKey) return; const el = /^[1-4]$/.test(e.key) && $app.querySelector("#opt-"+(+e.key-1)); if(el){ e.preventDefault(); el.click(); } };
    } else {
      const n = document.getElementById("next"); n.focus({preventScroll:true}); verFb();
      n.onclick = ()=>{ UVA.sfx("tap"); if(ultima) return sair(); i++; ans = null; desenha(); scrollTo(0,0); };
    }
  }
  if(!lista.length) return sair();
  desenha(); scrollTo(0,0);
}
const certaTxt = it => it.o[it.a];
function listaErros(itens){
  return `<ol>${itens.map(it=>`<li><span>${esc(it.q)}</span><b>${esc(certaTxt(it))}</b></li>`).join("")}</ol>`;
}
