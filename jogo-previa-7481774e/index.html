"a":0,"k":"Isabel: a hybrid, two species in one vine.","e":"Isabel brings two species together in one vine: American Vitis labrusca and Vitis vinifera, the species of varieties such as Touriga Nacional and Arinto. That makes it an interspecific hybrid: 'inter' means between, in this case between species.","tema":"especies"},{"id":"uva-3-10","nivel":3,"tipo":"escolha","q":"Varieties with red pulp are called…","o":["Teinturiers","Fine reds","Pinks","Bastardos"],"a":0,"k":"Teinturiers: grapes coloured right through to the pulp.","e":"Teinturiers: varieties whose pulp is coloured too, such as Alicante Bouschet; most black varieties have pale pulp. Vinhão is often called a teinturier because of its intense colour, but descriptions of its pulp vary.","tema":"castas","sala":"Alicante Bouschet, widely planted in the Alentejo, is a teinturier and gives very dark reds."},{"id":"uva-3-11","nivel":3,"tipo":"escolha","q":"Which Vinho Verde variety is known for reds with very intense colour?","o":["Vinhão","Espadeiro","Borraçal","Loureiro"],"a":0,"k":"Vinhão: the grape that fills the glass with colour.","e":"Vinhão: it's rich in pigments and makes very dark reds, so it's also used to add colour to blends. Espadeiro tends to give light reds or rosés, and Loureiro is a white grape.","tema":"castas"},{"id":"uva-3-12","nivel":3,"tipo":"escolha","q":"In a spontaneous fermentation, no commercial yeast is added. So where do the yeasts doing the work come from?","o":["From the grape surface and the winery environment","From the sugar in the pulp, which turns into yeast","From crushed seeds, which release yeast","Only from the wood of the barrels it ferments in"],"a":0,"k":"Spontaneous ferment: yeasts from the grapes and the winery.","e":"They come from the skin, where the bloom can carry them, but also from the equipment and the air in the winery. Many grape yeasts can't handle much alcohol; Saccharomyces cerevisiae, which usually finishes the fermentation, is uncommon on intact grapes but common in the winery. Spontaneous doesn't mean guaranteed.","tema":"bago","sala":"'Indigenous yeasts' or 'spontaneous fermentation' on a label means exactly this: no commercial yeast was added."},{"id":"uva-3-13","nivel":3,"tipo":"escolha","q":"Which three parts of the bunch can give tannins to wine?","o":["Skin, pips and stems","Pulp, skin and bloom","Pulp, pips and juice","Only the skin"],"a":0,"k":"Skins, pips and stems: the tannin sources.","e":"Skins, pips and, when used, stems can supply tannins; the pulp has far fewer condensed tannins. Each part of the bunch makes a different contribution.","tema":"composicao"},{"id":"uva-3-14","nivel":3,"tipo":"escolha","q":"Besides giving it that whitish look, the bloom helps the berry to…","o":["Lose less water and fend off fungi","Gain colour faster in the skin","Become sweeter without needing as much sun","Ripen faster in cool years"],"a":0,"k":"Bloom: a waxy coat that saves water.","e":"Bloom is a waxy layer that helps reduce water loss and acts as a physical barrier. It's not a foolproof shield against fungi, but it gives the berry a helping hand.","tema":"bago"},{"id":"uva-3-16","nivel":3,"tema":"especies","tipo":"escolha","q":"What is the wild European form of the vine, ancestor of cultivated vines, called?","o":["Vitis vinifera subsp. sylvestris","Vitis vinifera subsp. sativa","Vitis labrusca","Vitis riparia × Vitis rupestris"],"a":0,"k":"Sylvestris: the wild grandmother of cultivated vines.","e":"Before there were vineyards, there were wild vines. Vitis vinifera subsp. sylvestris is the ancestral form of the cultivated vine: it belongs to the same species, but it isn't a grape variety. 'Subsp.' stands for subspecies: a division within the species."},{"id":"uva-3-17","nivel":3,"tema":"especies","tipo":"escolha","q":"Unlike most cultivated varieties, the wild European vine has…","o":["Separate male and female plants","Flowers that never manage to produce ripe grapes","Specimens only on the American continent","Long shoots without a single tendril"],"a":0,"k":"Wild vine: separate male and female plants.","e":"In the wild European vine, the sexes are separate: there are male plants and female plants, which is why it's called dioecious. During domestication, vines with hermaphrodite flowers were favoured, with functional male and female organs in the same flower, allowing self-pollination. A small change in the flower, a big advantage in the vineyard!"},{"id":"uva-3-20","nivel":3,"tema":"especies","tipo":"escolha","q":"In viticulture, what is a clone?","o":["Vines propagated by cuttings or grafting from a single plant","A cross between two varieties, made by controlled pollination","A hybrid between two different vine species","A new variety produced in a lab by genetic modification"],"a":0,"k":"Clone: copies of a single vine, grown without seeds.","e":"One vine, many offspring, no seeds involved. A clone comes from propagating a single plant through vegetative material, such as cuttings or buds. The offspring keep its genetic profile, although small mutations can occur. The same variety can have several clones that differ in yield or ripening time."},{"id":"uva-3-21","nivel":3,"tema":"especies","tipo":"escolha","q":"On the Península de Setúbal it's called Moscatel de Setúbal, or Graúdo: it's the traditional variety of white Moscatel de Setúbal. Which variety is it?","o":["Moscatel de Alexandria","Moscatel Galego Branco","Moscatel Roxo","Malvasia Fina"],"a":0,"k":"In Setúbal, Graúdo is Moscatel de Alexandria.","e":"It's Moscatel de Alexandria (Muscat of Alexandria): Graúdo and Moscatel de Setúbal are its names on the peninsula. Moscatel Galego Branco is the Douro's Moscatel; Moscatel Roxo, thought to be a mutation of it, is Setúbal's rare star. Three Moscatels, three identities: don't mix them up!","fonte":"CVR Península de Setúbal (castas: 'Moscatel de Setúbal ou Graúdo', reconhecida internacionalmente como Moscatel de Alexandria); Wines of Portugal (estilos: vinho Moscatel)","sala":"On the wine list, keep Moscatel de Setúbal (Moscatel de Alexandria) and Moscatel Roxo apart: they're different varieties and different wines."},{"id":"uva-3-23","nivel":3,"tema":"aromas","tipo":"escolha","q":"The floral notes in an Alvarinho may be linked to which grape compounds?","o":["Terpenes","Pyrazines","Tannins","Malic acid"],"a":0,"k":"Terpenes: part of Alvarinho's floral perfume.","e":"Terpenes such as linalool and geraniol contribute floral aromas. They're present in Alvarinho and help explain part of its perfume; geraniol, for example, can recall roses.","sala":"Served too cold, an Alvarinho can seem closed: the cold hides part of its floral aroma."},{"id":"uva-3-26","nivel":3,"tema":"composicao","tipo":"escolha","q":"The sugar made in the leaves travels to the berry in the form of…","o":["Sucrose","Fructose","Starch","Alcohol"],"a":0,"k":"From leaf to berry, sugar travels as sucrose.","e":"Sucrose is the main sugar transported from the leaves to the berry; in the fruit, enzymes can convert it into glucose and fructose. A delivery that gets split up the moment it arrives."},{"id":"uva-3-29","nivel":3,"tema":"castas","tipo":"escolha","q":"Roughly how many native grape varieties does Portugal have?","o":["Around 250","Around 20","Around 50","More than 2,000"],"a":0,"k":"Small country, around 250 native varieties.","e":"Around 250 native varieties are counted; the exact number varies with the source and the criteria. Impressive diversity for the size of the country: a small map, a huge vineyard of names.","fonte":"Público/Agroportal, 'Em matéria de castas autóctones ninguém nos apanha' (cerca de 250)","sala":"Such a diversity of varieties is a great argument for getting tourists to taste Portuguese wine."},{"id":"uva-1-s01","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest is puzzled: \"This white sparkling wine from Bairrada is made from Baga? Isn't Baga a black grape?\" What do you say?","o":["The colour is in the skin; pressed gently, black grapes give a pale must.","It was decoloured with products, as is done with almost all sparkling wines.","Baga also has a white version, used only for sparkling wine.","White wine was blended in to lighten the colour before the second fermentation."],"a":0,"k":"Black grapes, gently pressed, give pale juice.","e":["Baga's must is pale.","The colour is in the skin, and with this kind of pressing hardly any of it passes into the must.","Tell the guest it's a 'white from black grapes' and that the style goes by the French name blanc de noirs."],"fonte":"Fichas técnicas de espumantes Bairrada brancos de Baga (blanc de noirs); falta fonte oficial (CVB)."},{"id":"uva-1-s02","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest tastes a Douro red and says: \"It's drying my mouth out.\" What are they picking up?","o":["Tannins","Acidity","Alcohol","Sugar"],"a":0,"k":"Dry mouth? That's tannin.","e":["The mouth feels dry and rough, as after strong tea.","Tannins come from the skins and pips and bind to proteins in saliva.","If the guest doesn't enjoy the sensation, suggest a less tannic red; if they're eating, fat in the dish tends to soften the tannins (Service 4)."]},{"id":"uva-1-s03","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"After a glass of Vinhão, a guest notices their teeth have turned purple. Why?","o":["Vinhão is rich in pigments and makes very dark wines.","Colouring is added to the wine to make its colour deeper.","It's a very old wine that gained colour over the years.","It was served too cold, so the colour stuck to the teeth."],"a":0,"k":"Vinhão: lots of colour in the glass, and on your teeth.","e":["The wine has a very intense colour.","Vinhão is a variety rich in pigments (anthocyanins): it makes very dark reds that can stain the glass and your teeth.","It's a fun fact to share at the table, and it prepares the guest for the colour in the glass."],"fonte":"https://www.vinetowinecircle.com/en/castas_post/vinhao-3/"},{"id":"uva-1-s04","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"\"Is rosé a blend of white and red?\" a guest asks. What do you say?","o":["It's usually made from black grapes with only brief skin contact.","Yes, white and red are always blended in equal parts before bottling.","It's made from pink grapes, picked before they turn red.","It's made from white wine with a natural colouring added."],"a":0,"k":"Rosé: black grapes, a short time on the skins.","e":["The pink colour comes from the black grapes themselves.","The colour depends mainly on skin contact, but the variety and the method also play a part.","Explaining the process lifts rosé in the eyes of anyone who sees it as a 'lesser wine'."]},{"id":"uva-1-s05","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks why Port is sweet and higher in alcohol than a red table wine. What's the explanation?","o":["Grape spirit is added partway through fermentation; fermentation stops and some grape sugar is left.","Sugar and alcohol are added at the end, after fermentation finishes on its own.","Douro grapes are picked already raisined, so they give more sugar and alcohol.","It ages in barrels that once held sweet wine and pass on their sugar."],"a":0,"k":"Port: spirit added mid-ferment, so the sugar stays.","e":["The wine ends up sweet and higher in alcohol.","Once the spirit goes in, the yeasts stop, and the sugar that hasn't yet become alcohol stays in the wine.","Moscatel de Setúbal is a fortified wine too. One sentence is enough for the guest to understand the style."]},{"id":"uva-1-s06","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks for \"a dry red, no sugar at all\". What do they need to know?","o":["Most red table wines are already dry: almost all the sugar became alcohol.","Reds almost always keep some sugar; only premium ones are truly dry.","\"Dry\" means lots of tannin, the kind that leaves the mouth rough.","\"Dry\" means low alcohol, so a light red is the right choice."],"a":0,"k":"Most red table wines are already dry.","e":["'Dry' means almost no sugar.","During fermentation, sugar turns mainly into alcohol.","Often, someone asking for 'dry' is thinking of tannins or of not much fruit. Ask what they're after before you suggest anything."]},{"id":"uva-1-s07","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest says the Alentejo white \"doesn't grip the mouth like the red\". Why?","o":["Whites usually ferment without the skins, so they have few tannins.","White grapes have no tannins at all, not in the skins or the seeds.","White wine is served colder, and cold hides all the tannins.","White wine has more alcohol, and alcohol masks the drying tannins."],"a":0,"k":"White fermented off the skins: hardly any tannin.","e":["The white has almost no astringency.","Tannins are in the skins and pips, and most whites ferment from the must alone.","An exception worth sharing: many talha (clay-pot) and skin-contact whites ferment on their skins and can have some tannic texture."],"fonte":"https://elle.com.br/lifestyle/saiba-o-que-e-vinho-de-talha (talha); falta fonte oficial (CVRA)."},{"id":"uva-1-s08","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"At the end of dinner, a guest asks for \"a digestif made from the grape, from what's left over after the wine\". What do you suggest?","o":["Aguardente bagaceira (pomace brandy)","Almond liqueur","Ginjinha (sour-cherry liqueur)","Tawny Port"],"a":0,"k":"Bagaceira: the spirit made from what the press leaves.","e":["Bagaceira is distilled from pomace.","Pomace is what's left in the press: skins, pips and sometimes stems.","A good moment to point out that the wine and the brandy come from the same bunch."]},{"id":"uva-1-s09","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"\"Does this red have tannins because it's been in barrel?\" a guest asks. What's the most accurate answer?","o":["The tannins come mainly from the grape; the barrel can add some.","Yes, only oak gives tannin; a steel-aged red has none.","No, the barrel strips out all the tannins and softens the wine.","Oak only gives colour and aroma, never tannin."],"a":0,"k":"Tannin comes mostly from the grape; oak can add some.","e":["A red that has never seen oak can still be tannic.","Skins and pips provide the grape tannins; oak adds its own.","Avoid promising 'oak' when the guest is only picking up tannin."]},{"id":"uva-2-s01","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest sends back a glass of a young, dry white that was well chilled: \"There's glass in it!\" It's tiny clear crystals. What are they?","o":["Unfermented sugar from the wine that crystallised in the cold.","Bits of cork from the stopper that broke off as the bottle was opened.","Salts of tartaric acid from the grape, which can form in the cold.","A deposit of tannin and colour that usually appears with age."],"a":2,"k":"Clear crystals in the glass: tartrates, natural and harmless.","e":["The crystals come from the wine itself: they're tartrates.","Tartaric acid forms salts that crystallise in the cold. Cork would leave brown bits; a dry white has no sugar left to crystallise.","Show it isn't glass and offer a fresh glass. Tell them: \"They're natural wine crystals, completely harmless.\""]},{"id":"uva-2-s02","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A Dão white was aged only in stainless steel, with no oak. A guest picks up buttery notes and finds the acidity soft. Where do they most likely come from?","o":["From oak barrels, which tend to give notes of vanilla and toast.","From malolactic conversion, which can give butter and soften acidity.","From the fine lees, which tend to give bready notes and a creamy feel.","From skin contact, which tends to add aroma and a little tannin."],"a":1,"k":"Butter but no oak? Think malolactic.","e":["The butter comes from a second fermentation, not from wood.","In malolactic conversion, malic acid becomes softer lactic acid, and diacetyl, with its buttery aroma, can form. Lees smell more of bread.","Tell them: \"It's the malolactic: it softens the acidity and smells of butter.\" If they don't like it, suggest a fresh white without it."]},{"id":"uva-2-s03","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"\"I want the driest rosé, so give me the palest one,\" says a guest. What do you tell them?","o":["Colour doesn't indicate sweetness; it's best to check the label or ask the producer.","You're right: the paler the rosé, the drier it is, without any exception.","Darker rosés are always sweet, so it's best to avoid them.","Almost all rosés are sweet; a white will be the driest choice."],"a":0,"k":"A rosé's colour doesn't tell you its sweetness.","e":["Colour and sweetness don't go hand in hand.","Colour depends on the variety, the method and the time on the skins; sweetness depends on how much sugar was left unfermented.","Ask what the guest is after (dry, fresh, fruity) and choose from there."]},{"id":"uva-2-s04","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest is surprised by the brownish rim of a 15-year-old Douro red. The wine smells good and tastes clean. What do you explain?","o":["Air got in through the cork and the wine oxidised, so it's past its best.","The grapes were picked underripe, which gave the wine a weaker colour.","Ageing in new oak passed the brown colour of the wood into the wine.","Over time the colour loses purple and moves towards garnet and brick."],"a":3,"k":"Older red: the rim drifts towards brick.","e":["The colour changed with age, not because of a fault.","The pigments bind with other compounds and some settle out; the purple fades and the rim turns garnet or brick.","A clean aroma rules out oxidation. Tell them: \"That's the colour of a red that has had time to evolve.\""]},{"id":"uva-2-s05","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest loves Aragonez from the Alentejo, but the list only has Douro reds made with Tinta Roriz. What can you tell them?","o":["It's the same variety under another name; the style changes with the region.","They're unrelated varieties, even though their wines are similar.","Tinta Roriz is a white variety, so the wine will be different.","Aragonez only exists in Spain; the Douro grows another variety."],"a":0,"k":"Aragonez in the Alentejo, Tinta Roriz in the Douro: same grape.","e":["The guest recognises the variety, even under another name.","Tinta Roriz (Douro) and Aragonez (Alentejo) are the same variety, known internationally as Tempranillo.","A great bridge for getting the guest to try another region."]},{"id":"uva-2-s07","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks for \"a Fernão Pires\", but all they can see on the list is a Bairrada white made from Maria Gomes. What do you do?","o":["Explain that Maria Gomes is what Fernão Pires is called in Bairrada.","You say there's none on the list and suggest another white grape.","You suggest a light red, since the requested white isn't there.","You say they're similar grapes from the same family, but different."],"a":0,"k":"Maria Gomes on the list? That's Fernão Pires.","e":["The guest gets what they asked for.","The same variety goes by different names depending on the region.","Knowing the synonyms saves a sale and gives the guest confidence."]},{"id":"uva-2-s08","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest sees \"Blanc de Noirs\" on a Portuguese sparkling wine and asks what it means. What do you say?","o":["It's a white sparkling wine made from black grapes.","It's a red sparkling wine.","It's made from a mix of white and black grapes.","It means it's sweet."],"a":0,"k":"Blanc de Noirs: white sparkling from black grapes.","e":["The name is French, but the style exists in Portugal too.","The pulp of most black varieties is pale; with gentle pressing, the must comes out white.","In Bairrada there are white sparkling wines made from Baga this way."]},{"id":"uva-2-s09","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks why Moscatel de Setúbal smells so strongly of grapes, flowers and orange. What's the best explanation?","o":["The variety is very aromatic, and the skins stay in the wine for months.","The grape spirit that stops the fermentation is what brings those aromas.","Long ageing in wood is what gives it the floral and orange notes.","The sugar left unfermented is what gives it that grapey smell."],"a":0,"k":"Moscatel: a perfumed grape and months on the skins.","e":["The aroma comes mainly from the grape.","Moscatel has lots of aroma compounds in its skin, and extended maceration draws them out. The spirit stops fermentation; it isn't the source of these aromas.","Tell them: \"It's the grape talking: a perfumed variety and months on the skins.\""],"fonte":"https://jmf.pt/pdf/pt/ABT_P.pdf (ficha de produtor: maceração pelicular de 5 meses); falta fonte oficial (CVRPS)."},{"id":"uva-2-s10","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest is surprised by the 14.5% abv of a dry Alentejo red. Where does all that alcohol come from?","o":["Grape spirit was added during fermentation, as in a Port wine.","Riper grapes from a warm climate have more sugar to ferment.","Barrel ageing tends to concentrate the wine and raise the alcohol.","It fermented for longer, and each extra week adds more alcohol."],"a":1,"k":"Riper grapes, more sugar, more alcohol.","e":["The alcohol comes from the grape's sugar.","Sugar rises as grapes ripen; fermentation turns it into alcohol. Without more sugar, fermenting for longer doesn't add alcohol.","If the guest wants less alcohol, suggest a cooler region. Tell them: \"Alentejo sun, ripe grapes, a bit more alcohol.\""]},{"id":"uva-3-s03","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"\"What does 'spontaneous fermentation' mean on the label of this red?\" a guest asks. What is accurate to say?","o":["It fermented without temperature control, at the cellar's natural pace.","It fermented with no added sulphites, so it counts as a natural wine.","It fermented with yeasts from the grapes and winery, none bought in.","It fermented a second time in the bottle, without the winemaker's help."],"a":2,"k":"Spontaneous: only yeasts from the grapes and the winery.","e":["The difference lies in the yeasts, not the temperature or the sulphites.","Many grape yeasts can't handle much alcohol; the one that usually finishes the fermentation lives mainly in the winery.","Tell them: \"It fermented with the house yeasts.\" Present it as a style choice, not a guarantee of quality."]},{"id":"uva-3-s05","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest says the red from the Minho doesn't smell like their grandfather's \"vinho morangueiro\" (home-made 'strawberry wine'). Why?","o":["Morangueiro comes from American grapes such as Isabel; the DOC uses only Vitis vinifera.","Morangueiro comes from old Vinhão vines with a strawberry aroma.","Minho reds lost that aroma with new winery and vineyard techniques.","It's the same grape, but grandpa's wine was older and more developed."],"a":0,"k":"Morangueiro comes from American grapes; DOC wine is vinifera.","e":["The grapes belong to different species.","Isabel is a hybrid with Vitis labrusca, which gives that strawberry and boiled-sweet aroma.","Answer with respect for the guest's memories and introduce Vinhão as the Minho's traditional red."],"fonte":"https://stg.portugalresident.com/have-you-heard-of-portugals-forbidden-wine/"},{"id":"uva-3-s06","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest finds a young Colares red, served at the right temperature, \"hard and acidic\". What's the most likely explanation?","o":["Ramisco tends to give high acidity and firm tannins that need time.","It was served too cold, and cold tends to highlight acidity and tannin.","It's at the end of its life: with age, fruit fades and tannin hardens.","Vines in sand tend to give underripe grapes and a watery wine."],"a":0,"k":"Young Ramisco: sharp and firm, it needs time and food.","e":["With the right temperature and a young wine, the variety's profile is the likeliest cause.","Ramisco gives reds with high acidity and firm tannins, which tend to show better with age.","Suggest it with a dish that has some fat, which tends to soften the tannin (Service 4)."]},{"id":"uva-3-s07","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest asks for \"Moscatel Roxo\", but you only have Moscatel de Setúbal. Can you say it's the same thing?","o":["Yes: Roxo is just the name given to an older Moscatel de Setúbal.","Yes: it's the same variety, simply picked later, with much riper grapes.","No: Moscatel Roxo is a dry table red, not a fortified wine.","No: different varieties; Setúbal's is mainly Moscatel de Alexandria."],"a":3,"k":"Moscatel Roxo and Moscatel de Alexandria: different grapes.","e":["The two wines come from different varieties; age and picking date don't change the variety.","Traditional Moscatel de Setúbal is made from Moscatel de Alexandria (Graúdo); Moscatel Roxo is a rare variety from the peninsula.","Be honest and offer Moscatel de Setúbal as a close alternative."]},{"id":"uva-3-s08","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest says the Alvarinho \"doesn't smell of anything\". It's being served ice-cold. What do you do?","o":["Let the glass warm up a little: too much cold hides part of the aroma.","You put the bottle back on ice so the aroma stays fresher and more intense.","You serve it in a smaller glass, which concentrates the aroma.","You say Alvarinho is a neutral grape with almost no aroma."],"a":0,"k":"Alvarinho served too cold hides its aroma.","e":["The aroma is there, just hidden.","Aroma compounds (such as floral terpenes) evaporate less at very low temperatures.","Serving aromatic whites chilled, but not ice-cold, helps the wine show itself."]},{"id":"uva-3-s10","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A guest finds an Alentejo red \"almost black\". The back label says the juice already runs red when the grapes are crushed. Which variety helps explain it?","o":["Touriga Nacional, with small berries and thick, dark skins.","Alicante Bouschet, a teinturier, with colour in skin and pulp.","Aragonez, after long barrel ageing, which darkens the colour.","Trincadeira, after long maceration, which pulls colour from pips."],"a":1,"k":"Red juice at crushing? A teinturier, like Alicante Bouschet.","e":["The colour also comes from the pulp, and Alicante Bouschet is widely planted in the Alentejo.","In most varieties, colour sits only in the skin and the juice runs clear. Alicante Bouschet is a teinturier: its pulp is red.","Prepare the guest: these reds tend to be intense in colour and on the palate."],"fonte":"https://en.wikipedia.org/wiki/Alicante_Bouschet"}],"temas":{"bago":"Inside the berry","composicao":"What's inside the grape","especies":"Species, varieties and clones","castas":"Portuguese grape varieties","aromas":"Grape aromas","sala":"On the floor"},"mesa":1,"num":1},"es":{"fase":"uva","titulo":"La Uva","versao":"2026-10-17 v9, 83 perguntas (59 de teoria + 24 situações de sala). Retiradas 6 situações de sala que repetiam a Vinha (guardadas em fases/uva-retiradas-repetidas.json).","niveis":[{"n":1,"id":"iniciante","nome":"Principiante","alcunha":"Ruby"},{"n":2,"id":"intermedio","nome":"Intermedio","alcunha":"Tawny"},{"n":3,"id":"avancado","nome":"Avanzado","alcunha":"Vintage"}],"regra":{"perguntas_por_ronda":8,"bagos":3,"sobe_com_erros_ate":1,"fica_com_erros":2,"desce_com_erros":3,"erradas_por_ronda_max":3,"nota_rever":"Perguntas com \"rever\": true ficam guardadas mas fora das rondas até serem confirmadas.","situacoes_por_ronda":2},"perguntas":[{"id":"uva-1-01","nivel":1,"tipo":"tocar","q":"Toca la parte que da color al vino tinto.","a":"pelicula","k":"El color del tinto vive en el hollejo.","e":"La mayoría de los pigmentos rojos (antocianos) se concentra en el hollejo, junto con taninos y aromas. La pulpa suele ser clara, con excepciones como las variedades tintoreras.","tema":"bago","sala":"Si a un cliente le extraña un espumoso blanco elaborado con uvas tintas, la explicación empieza aquí: el color está en el hollejo."},{"id":"uva-1-02","nivel":1,"tipo":"tocar","q":"¿Dónde están el agua, el azúcar y los ácidos?","a":"polpa","k":"Pulpa: el depósito de agua, azúcar y ácidos.","e":"En la pulpa: es la parte jugosa de la baya, llena de agua, azúcares y ácidos. El cuartel general de la uva, por así decirlo.","tema":"bago","sala":"El dulzor y la frescura que notas en la copa empiezan en la pulpa."},{"id":"uva-1-03","nivel":1,"tipo":"tocar","q":"Toca las semillas de la baya.","a":"grainhas","k":"Pepitas: semillas con taninos amargos. Nada de romperlas.","e":"Se llaman pepitas, y aportan taninos y aceites. Si se aplastan, pueden dar amargor al vino; por eso la prensa no debe convertirse en una trituradora de semillas.","tema":"bago","sala":"Un amargor «verde» en el final de boca puede venir de pepitas maltratadas, que liberan taninos más duros."},{"id":"uva-1-04","nivel":1,"tipo":"tocar","q":"Toca el esqueleto que sujeta las bayas.","a":"engaco","k":"Raspón: la percha que sujeta las bayas.","e":"Es el raspón: el «esqueleto» ramificado que sujeta las bayas en el racimo. Una especie de percha natural de la vid.","tema":"bago"},{"id":"uva-1-05","nivel":1,"tipo":"tocar","q":"Toca la capa blanquecina que cubre la piel.","a":"pruina","k":"Pruina: cera natural de la baya, no es polvo.","e":"Es la pruina, una capa cerosa natural que recubre la baya: protección de fábrica, no polvo que haya que limpiar.","tema":"bago","sala":"En un plato de uvas de mesa, el cliente puede fijarse en el «polvillo» blanco de las bayas: es la pruina, no suciedad."},{"id":"uva-1-07","nivel":1,"tipo":"escolha","q":"Cada uva, por sí sola, se llama…","o":["Baya","Racimo","Raspón","Yema"],"a":0,"k":"Baya: cada uva, una a una.","e":"Baya: cada uva individual. Junta unas cuantas y tienes un racimo: equipo pequeño, resultado vistoso.","tema":"bago"},{"id":"uva-1-08","nivel":1,"tipo":"escolha","q":"Un conjunto de bayas unidas al raspón se llama…","o":["Racimo","Rama","Sarmiento","Baya"],"a":0,"k":"Racimo: el equipo de bayas sujeto al raspón.","e":"Racimo. En la vendimia a mano se corta el racimo entero. La máquina lo hace distinto: sacude la cepa y suelta sobre todo las bayas.","tema":"bago"},{"id":"uva-1-09","nivel":1,"tipo":"escolha","q":"En la fermentación, el azúcar se transforma en alcohol y…","o":["Dióxido de carbono","Oxígeno","Ácido tartárico","Agua"],"a":0,"k":"Las levaduras comen azúcar y dejan alcohol y gas.","e":"Las levaduras transforman los azúcares fermentables sobre todo en alcohol y dióxido de carbono. Aquí es donde el mosto empieza a ganar personalidad de vino.","tema":"composicao","sala":"En un vino seco, casi todo el azúcar se ha convertido en alcohol. Si queda azúcar, el vino resulta dulce o semidulce."},{"id":"uva-1-10","nivel":1,"tipo":"escolha","q":"El vino tinto coge color porque fermenta con…","o":["Los hollejos","Las pepitas","El raspón","La pruina"],"a":0,"k":"El tinto toma color fermentando con los hollejos.","e":"Los hollejos: los pigmentos pasan del hollejo al mosto durante la maceración. En la mayoría de las variedades, el zumo es claro; hay excepciones tintoreras.","tema":"bago","sala":"En un rosado, los hollejos suelen estar poco tiempo con el mosto; en un tinto, más. La variedad y el método también cuentan para el color."},{"id":"uva-1-11","nivel":1,"tipo":"vf","q":"Las uvas tintas casi siempre tienen la pulpa tinta.","a":false,"k":"Pulpa casi siempre clara; el color está en el hollejo.","e":"¡Falso! En la mayoría de las variedades tintas, la pulpa es clara y el color viene del hollejo. Las tintoreras son la excepción que confirma la regla, y que además tiñe la pulpa.","tema":"bago","sala":"Un ejemplo clásico de tintorera es la Alicante Bouschet, muy plantada en el Alentejo: tiene la pulpa tinta y da tintos muy oscuros."},{"id":"uva-1-12","nivel":1,"tipo":"escolha","q":"Los taninos dejan la boca…","o":["Seca y áspera, como un té fuerte","Más cálida, como tras un trago de aguardiente","Con ardor, como tras un plato picante","Fresca y salivando, como tras un limón"],"a":0,"k":"Taninos: boca seca, como un té cargado.","e":"Los taninos aportan astringencia: la boca queda seca y ligeramente áspera, como después de un té negro bien cargado. No es que falte agua en la copa; son los taninos interactuando con las proteínas de la saliva.","tema":"composicao","sala":"Cuando un cliente dice que el tinto «le seca la boca», está hablando de taninos, no de acidez ni de alcohol."},{"id":"uva-1-15","nivel":1,"tipo":"vf","q":"La pruina es suciedad y hay que lavarla antes de hacer vino.","a":false,"k":"La pruina es cera natural: se queda donde está.","e":"Falso: la pruina es una cera natural, no suciedad. Puede haber levaduras en la superficie de la uva, pero la pruina no es una «casa de levaduras» garantizada: la fermentación espontánea depende de toda una comunidad de microorganismos.","tema":"bago"},{"id":"uva-1-17","nivel":1,"tema":"bago","tipo":"vf","q":"Las uvas blancas no tienen ningún tanino.","a":false,"k":"La uva blanca tiene algunos taninos; el vino blanco, pocos.","e":"Falso: tienen algunos, en el hollejo y las pepitas. El vino blanco se queda con pocos porque normalmente fermenta sin los hollejos.","sala":"Muchos blancos de talha del Alentejo (vinos de tinaja de barro) fermentan con los hollejos, por eso pueden tener más color y cierta textura tánica."},{"id":"uva-1-18","nivel":1,"tema":"especies","tipo":"vf","q":"Las uvas de mesa suelen tener bayas más grandes y hollejo más fino que las uvas de vino.","a":true,"k":"Mesa: baya grande, piel fina. Vino: más pequeña, piel gruesa.","e":"Verdadero, por norma: las de mesa se eligen para comer. Las de vino tienden a tener bayas más pequeñas y más hollejo, donde están el color, los taninos y los aromas. Cada variedad tiene sus excepciones.","sala":"Si un cliente pregunta por qué no se hace vino con uvas de mesa: las variedades de vino se eligen por el hollejo, la acidez y el azúcar."},{"id":"uva-1-19","nivel":1,"tema":"bago","tipo":"escolha","q":"En la vendimia, ¿qué se recoge?","o":["Las uvas","Las hojas","Los sarmientos","Las yemas"],"a":0,"k":"En la vendimia se recoge la uva madura.","e":"Las uvas. A mano se corta el racimo entero; a máquina se sacude la cepa y se sueltan sobre todo las bayas. En cualquier caso, se busca la uva madura, no las hojas ni los sarmientos.","rever":true},{"id":"uva-1-20","nivel":1,"tema":"composicao","tipo":"escolha","q":"El zumo de uva, antes de fermentar, se llama…","o":["Mosto","Vino","Jarabe","Orujo"],"a":0,"k":"Mosto: zumo de uva que aún no es vino.","e":"Mosto: el zumo de uva recién estrujada, a veces todavía con hollejos y pepitas. Tras la fermentación alcohólica, pasa a ser vino: cambio de carrera oficial.","sala":"En el vino de Oporto se añade aguardiente vínico al mosto a mitad de la fermentación. Esta se detiene, y por eso el vino queda dulce y con más alcohol."},{"id":"uva-1-21","nivel":1,"tema":"bago","tipo":"escolha","q":"Tras el prensado, lo que queda (hollejos, pepitas y raspón) se llama…","o":["Orujo","Mosto","Lías","Corcho"],"a":0,"k":"Orujo: lo que queda en la prensa.","e":"Orujo: el conjunto de partes sólidas que queda del prensado, sobre todo hollejos y pepitas (y raspón, si no se ha retirado). Puede destilarse para hacer aguardiente de orujo.","sala":"El aguardiente de orujo (en Portugal, bagaceira), que se ofrece como digestivo, se destila a partir del orujo."},{"id":"uva-1-24","nivel":1,"tema":"composicao","tipo":"escolha","q":"¿Qué sabores vienen de la pulpa?","o":["Dulce y ácido","Amargo y áspero","Dulce y amargo","Ácido y astringente"],"a":0,"k":"De la pulpa vienen el dulzor y la acidez.","e":"Dulce, por los azúcares; ácido, sobre todo por los ácidos tartárico y málico. La astringencia viene en gran parte de los taninos del hollejo y de las pepitas: la baya tiene varias «voces» en el paladar.","sala":"El dulce y el ácido vienen de la pulpa; el amargor y la sequedad en boca, sobre todo del hollejo y de las pepitas."},{"id":"uva-1-25","nivel":1,"tema":"bago","tipo":"tocar","q":"Toca la parte que se quita en el despalillado.","a":"engaco","k":"Despalillado: quitar el raspón antes de fermentar.","e":"El raspón. Quitarlo se llama despalillado; puede reducir taninos y notas vegetales, aunque algunos estilos de vino conservan parte de los raspones a propósito.","sala":"Un tinto elaborado con parte de los raspones puede tener más tanino y notas más vegetales."},{"id":"uva-1-26","nivel":1,"tema":"bago","tipo":"tocar","q":"Toca la parte que guarda los aromas de fruta y de flores.","a":"pelicula","k":"Aromas: en el hollejo y justo debajo.","e":"El hollejo y la pulpa justo debajo: ahí se concentra buena parte del potencial aromático, aunque varía según la variedad y el compuesto.","sala":"Un blanco aromático de Loureiro o de Alvarinho debe buena parte de su aroma al hollejo y a la pulpa pegada a él."},{"id":"uva-1-27","nivel":1,"tema":"bago","tipo":"tocar","q":"Toca la parte que es casi toda agua.","a":"polpa","k":"Pulpa: casi toda agua, con azúcar y ácidos.","e":"La pulpa es mayoritariamente agua, con azúcares y ácidos disueltos. Es el zumo antes de que alguien lo llame mosto, y antes de que la fermentación cambie el guion."},{"id":"uva-1-28","nivel":1,"tema":"composicao","tipo":"escolha","q":"Una baya de uva madura es, sobre todo…","o":["Agua","Azúcar","Alcohol","Ácido"],"a":0,"k":"Una baya madura es, sobre todo, agua.","e":"Sobre todo agua (a menudo alrededor del 70–80 % del peso) y después azúcares, cuya proporción depende de la variedad y de la maduración. Las cifras son aproximadas; cada baya tiene su pequeño parte meteorológico."},{"id":"uva-1-29","nivel":1,"tema":"composicao","tipo":"vf","q":"Los taninos del vino vienen solo de la madera de las barricas.","a":false,"k":"Taninos: primero de la uva, a veces de la barrica.","e":"Falso. Los hollejos y las pepitas aportan taninos de la uva; la madera puede añadir otros, como los taninos elágicos del roble. Dos aportaciones, orígenes distintos.","sala":"Un tinto puede ser tánico sin haber pasado por barrica: los taninos vienen sobre todo de la uva."},{"id":"uva-2-01","nivel":2,"tipo":"escolha","q":"¿Cuáles son los dos azúcares principales de la pulpa?","o":["Glucosa y fructosa","Sacarosa y lactosa","Solo sacarosa","Maltosa y almidón"],"a":0,"k":"Glucosa y fructosa: el dulzor de la uva.","e":"La glucosa y la fructosa son los azúcares principales de la uva madura. La proporción entre ambas puede variar; juntas, suponen casi todo el azúcar de la baya.","tema":"composicao","sala":"En un Moscatel de Setúbal, el dulzor viene sobre todo de la glucosa y la fructosa de la uva que quedaron sin fermentar: la adición de aguardiente interrumpe la fermentación."},{"id":"uva-2-02","nivel":2,"tipo":"escolha","q":"¿Cuál es el ácido más característico de la uva?","o":["Tartárico","Cítrico","Acético","Láctico"],"a":0,"k":"Tartárico: el ácido con firma de la uva.","e":"El tartárico es uno de los ácidos más característicos de la uva, junto con el málico. El acético es conocido por el vinagre: en el vino, en exceso, deja de ser bienvenido.","tema":"composicao","sala":"Los cristales de tartratos que pueden aparecer en el fondo de la botella o en el corcho son inofensivos. Por sí solos, no indican que el vino esté estropeado."},{"id":"uva-2-03","nivel":2,"tipo":"escolha","q":"¿Dónde está la mayor parte de los aromas de la uva?","o":["En el hollejo y justo debajo","En el raspón, que une las uvas al racimo","En las pepitas, que se rompen al estrujar","En el centro de la pulpa, junto a las pepitas"],"a":0,"k":"Aromas a flor de piel: en el hollejo y justo debajo.","e":"En el hollejo y en la pulpa inmediatamente debajo, aunque la distribución depende de la variedad y del compuesto aromático. La baya no guarda todos los aromas en el mismo cajón.","tema":"composicao","sala":"En algunos blancos, el mosto se deja en contacto con los hollejos antes de la fermentación para extraer compuestos aromáticos y sus precursores."},{"id":"uva-2-04","nivel":2,"tipo":"escolha","q":"¿Por qué se prensa la uva con cuidado?","o":["Para no romper las pepitas y soltar taninos amargos","Para no perder el color","Para no calentar el zumo","Para que el mosto no empiece a fermentar antes de tiempo"],"a":0,"k":"Prensa suave: pepitas enteras, menos amargor.","e":"Para no aplastar las pepitas: sus compuestos fenólicos pueden aportar amargor y astringencia. Prensar con cuidado es delicadeza con base científica.","tema":"bago","sala":"Un prensado más intenso puede extraer compuestos que aportan amargor y astringencia. Pero un final amargo, por sí solo, no permite deducir cómo se prensó el vino."},{"id":"uva-2-05","nivel":2,"tipo":"escolha","q":"Quitar el raspón antes de fermentar se llama…","o":["Despalillado","Estrujado","Prensado","Remontado"],"a":0,"k":"Despalillado: separar las bayas del raspón.","e":"Despalillado: separar las bayas del raspón. Puede limitar taninos y aromas vegetales, pero la decisión depende del estilo buscado; a veces, algunos enólogos prefieren mantener los raspones «en escena»: eso puede aportar más estructura y notas vegetales, según el estilo.","tema":"bago"},{"id":"uva-2-06","nivel":2,"tipo":"escolha","q":"Se puede hacer vino blanco con uvas tintas porque…","o":["La pulpa casi siempre es clara","El color se va en la filtración","Las uvas pierden el color al madurar","Las uvas tintas se lavan antes"],"a":0,"k":"Pulpa clara y zumo separado rápido: blanco de uvas tintas.","e":"Como la pulpa de la mayoría de las variedades tintas es clara, separar rápido el zumo de los hollejos permite obtener un vino claro. En ciertos estilos, como algunos espumosos, se llama blanc de noirs.","tema":"bago","sala":"En un espumoso portugués, «Blanc de Noirs» en la etiqueta quiere decir blanco elaborado con uvas tintas."},{"id":"uva-2-07","nivel":2,"tipo":"escolha","q":"El vino rosado tiene poco color porque…","o":["El zumo pasa poco tiempo con los hollejos","Se hace con uvas rosas","Fermenta a una temperatura más baja que el tinto","Envejece en botella transparente"],"a":0,"k":"Rosado: poco tiempo de zumo con los hollejos.","e":"El rosado puede coger color con un contacto breve entre zumo y hollejos; también hay rosados elaborados por prensado directo o por sangrado. El color depende del método y del tiempo, no de un cronómetro mágico.","tema":"bago","sala":"El color de un rosado no revela su dulzor. Un rosado más pálido no es necesariamente más seco que uno más intenso."},{"id":"uva-2-08","nivel":2,"tipo":"escolha","q":"¿Con uvas de qué especie se hace casi todo el vino del mundo?","o":["Vitis vinifera","Vitis labrusca","Vitis riparia","Vitis rupestris"],"a":0,"k":"Vitis vinifera: la especie de casi todo el vino.","e":"Vitis vinifera es la especie que está detrás de la mayoría de los vinos. Otras especies de Vitis, muchas de origen americano, también se usan en portainjertos, híbridos y algunos vinos.","tema":"especies"},{"id":"uva-2-09","nivel":2,"tipo":"escolha","q":"Touriga Nacional, Alvarinho y Chardonnay son…","o":["Variedades de la misma especie","Especies distintas de vid","Híbridos americanos","Portainjertos"],"a":0,"k":"Variedades distintas, una sola especie: Vitis vinifera.","e":"Son variedades: tipos cultivados de una misma especie, Vitis vinifera. Nombres distintos, perfiles distintos; ninguna es una especie de vid aparte.","tema":"especies","sala":"La variedad puede dar pistas para presentar el vino, pero no cuenta toda la historia: la región y la elaboración también influyen en el estilo."},{"id":"uva-2-16","nivel":2,"tema":"bago","tipo":"escolha","q":"¿Cuántas pepitas puede tener una baya, como máximo?","o":["4","2","6","10"],"a":0,"k":"Hasta cuatro pepitas por baya; muchas tienen menos.","e":"Hasta cuatro: el ovario puede formar cuatro óvulos, aunque muchas bayas acaban con menos pepitas."},{"id":"uva-2-17","nivel":2,"tema":"bago","tipo":"escolha","q":"Las uvas sin pepitas, como muchas uvas de mesa, se llaman…","o":["Apirenas","Tintoreras","Híbridas","Pasas"],"a":0,"k":"Apirenas: uvas sin pepitas, estrellas del frutero.","e":"Apirenas: uvas sin pepitas desarrolladas, muy comunes como uvas de mesa y pasas. Para vino son menos habituales, pero «casi nunca» es más prudente que «nunca»."},{"id":"uva-2-18","nivel":2,"tema":"composicao","tipo":"escolha","q":"Los pigmentos que dan color al hollejo de las uvas tintas se llaman…","o":["Antocianos","Taninos","Clorofilas","Levaduras"],"a":0,"k":"Antocianos: los pigmentos que pintan el hollejo.","e":"Antocianos: pigmentos del hollejo de las uvas tintas. Los taninos también son fenólicos, pero contribuyen sobre todo a la astringencia y la estructura: primos químicos, funciones distintas.","sala":"El tono da pistas sobre la evolución: muchos tintos pasan de tonos violáceos o rubí a granate y teja. Pero el color, por sí solo, no permite determinar la edad."},{"id":"uva-2-19","nivel":2,"tema":"composicao","tipo":"escolha","q":"Los dos ácidos principales de la uva son…","o":["Tartárico y málico","Cítrico y acético","Láctico y cítrico","Acético y tartárico"],"a":0,"k":"Tartárico y málico: el dúo ácido de la uva.","e":"El tartárico y el málico son los dos ácidos principales de la uva. La proporción varía; el málico recuerda a la acidez de la manzana verde y tiende a disminuir durante la maduración.","sala":"En la fermentación maloláctica, el ácido málico se transforma en ácido láctico, lo que reduce la acidez. En la cata, el vino puede parecer más suave."},{"id":"uva-2-20","nivel":2,"tema":"composicao","tipo":"escolha","q":"Mientras la uva madura, ¿qué pasa con el azúcar y la acidez?","o":["El azúcar sube y la acidez baja","Los dos suben","Los dos bajan","El azúcar baja y la acidez sube"],"a":0,"k":"Al madurar, el azúcar sube y la acidez baja.","e":"En general, durante la maduración se acumulan azúcares y baja la acidez, sobre todo porque se consume el ácido málico. Quien cultiva la viña busca el equilibrio adecuado para el vino que quiere, no un número mágico.","sala":"En condiciones similares, las uvas de climas más cálidos tienden a acumular más azúcar y a perder más acidez. En el vino, eso puede traducirse en más alcohol y menos frescura, aunque la vendimia y la elaboración también cuentan."},{"id":"uva-2-21","nivel":2,"tema":"especies","tipo":"escolha","q":"¿Qué es una variedad de uva?","o":["Un tipo de vid cultivada, con características propias","Una región de vino, con sus propias normas de producción","Un tipo de suelo donde la vid crece mejor","Una marca de vino registrada por un productor"],"a":0,"k":"Variedad: un tipo de vid con personalidad propia.","e":"Una variedad es un tipo de vid cultivada con características propias; Touriga Nacional, Arinto y Baga son ejemplos de Vitis vinifera. Cada una lleva su propio «DNI» genético."},{"id":"uva-2-22","nivel":2,"tema":"castas","tipo":"escolha","q":"Tinta Roriz y Aragonez son…","o":["La misma variedad con nombres distintos","Dos variedades distintas del Douro","Variedades blancas","Un cruce y un híbrido"],"a":0,"k":"Tinta Roriz y Aragonez: una variedad, dos nombres.","e":"Es la misma variedad, Tempranillo: Tinta Roriz y Aragonez son nombres portugueses que se usan en regiones distintas. La vid cruza fronteras mejor que los nombres.","sala":"Tinta Roriz y Aragonez son la misma variedad. Si a un cliente le gusta el Aragonez del Alentejo, puedes proponerle un vino del Douro con Tinta Roriz, sin prometerle el mismo perfil."},{"id":"uva-2-23","nivel":2,"tema":"castas","tipo":"escolha","q":"En el Tejo, la variedad tinta Castelão también se conoce como…","o":["João de Santarém","Baga","Trincadeira","Touriga Franca"],"a":0,"k":"João de Santarém: el nombre de la Castelão en el Tejo.","e":"João de Santarém es uno de los nombres de la Castelão, usado en el Tejo. La misma variedad, con otro nombre según la región. El nombre oficial es Castelão, muy plantada en la Península de Setúbal.","fonte":"DN, 'Das margens do Tejo para a mesa' (Castelão conhecida como João de Santarém no Tejo); vinorandum (sinónimos)","sala":"En la carta, Castelão y João de Santarém son la misma variedad. Díselo al cliente para que no se confunda."},{"id":"uva-2-24","nivel":2,"tema":"castas","tipo":"escolha","q":"En la Bairrada, la variedad blanca Fernão Pires también se conoce como…","o":["Maria Gomes","Bical","Cerceal","Malvasia Fina"],"a":0,"k":"Maria Gomes: la Fernão Pires con acento de Bairrada.","e":"Maria Gomes es el nombre que recibe la Fernão Pires en la Bairrada. La misma variedad, con otro nombre de pila según la región. Fuera de Portugal pasa lo mismo: el Alvarinho, en Galicia, se llama Albariño.","sala":"En un blanco de la Bairrada, «Maria Gomes» en la etiqueta es la Fernão Pires."},{"id":"uva-2-29","nivel":2,"tema":"bago","tipo":"escolha","q":"¿Cómo se llama el pequeño rabito que une cada baya al eje del racimo?","o":["Pedicelo","Pecíolo","Zarcillo","Púa"],"a":0,"k":"Pedicelo: el rabillo que sujeta cada baya.","e":"El pedicelo es el rabito de cada baya: la une al eje del racimo. El pecíolo, en cambio, une la hoja a la rama."},{"id":"uva-3-05","nivel":3,"tipo":"escolha","q":"¿Cuál es la variedad tinta de Colares, plantada en pie franco sobre la arena?","o":["Ramisco","Baga","Castelão","Touriga Franca"],"a":0,"k":"Ramisco: la variedad de Colares, en pie franco sobre arena.","e":"La Ramisco es la variedad tinta emblemática de Colares. En los suelos arenosos, que dificultan la supervivencia de la filoxera, las vides pueden crecer en pie franco, sobre sus propias raíces y sin injerto. Da tintos de acidez elevada y taninos firmes, que piden tiempo para revelar toda su complejidad.","tema":"castas","sala":"Un tinto joven de Ramisco tiende a parecer duro y ácido: avisa al cliente y sírvelo con comida."},{"id":"uva-3-06","nivel":3,"tipo":"escolha","q":"La Sercialinho, una variedad portuguesa obtenida por cruce, tiene como progenitoras a la Vital y la Uva Cão. Es fruto de…","o":["Un cruce entre dos variedades de Vitis vinifera","Híbrido entre Vitis vinifera y una especie americana","Portainjerto elegido para resistir a la filoxera","Clon seleccionado a partir de una sola cepa"],"a":0,"k":"Sercialinho: cruce de dos variedades de la misma especie.","e":"Vital y Uva Cão son dos variedades de Vitis vinifera, así que la Sercialinho es un cruce dentro de la misma especie, no un híbrido interespecífico. Durante años se pensó que uno de los progenitores era el Alvarinho; los análisis de ADN corrigieron el árbol genealógico. Igual que la Pinotage (Pinot Noir × Cinsault), es un cruce entre variedades.","tema":"especies","fonte":"Glossário wein.plus (Cercealinho/Sercialinho: Vital × Uva Cão, ADN 2020); artigo 'Sercialinho mystery' (Vital e Uva Cão, pais oficiais)"},{"id":"uva-3-07","nivel":3,"tipo":"escolha","q":"¿Cómo se llama una variedad de uva que resulta del cruce entre Vitis vinifera y una especie americana de Vitis?","o":["Híbrido","Cruce","Clon","Pie franco"],"a":0,"k":"Híbrido: vinifera cruzada con una especie americana.","e":"Especies distintas: híbrido interespecífico. En cambio, el cruce entre dos variedades de Vitis vinifera es intraespecífico: combina variedades de la misma especie. Un ejemplo de híbrido es la Vidal, que se usa en Canadá para elaborar icewine con uvas que se congelan de forma natural en la vid.","tema":"especies","sala":"El vino con DOC se elabora con variedades de Vitis vinifera, no con híbridos."},{"id":"uva-3-08","nivel":3,"tipo":"escolha","q":"¿Qué aroma es típico de la Vitis labrusca?","o":["Foxy (fresa, caramelo)","Pimienta negra","Petróleo","Mantequilla"],"a":0,"k":"Foxy: el aroma a fresa y caramelo de la labrusca.","e":"«Foxy» es una descripción sensorial típica de algunas uvas americanas: puede recordar a uva, caramelo o fruta silvestre. Es una analogía aromática, no un zorro escondido en la copa.","tema":"especies","sala":"El aroma «foxy» recuerda al vinho morangueiro (vino casero «de fresa»), elaborado con uvas americanas como la Isabel."},{"id":"uva-3-09","nivel":3,"tipo":"escolha","q":"La Isabel es una variedad de uva de origen americano. En cuanto a su clasificación, es…","o":["Un híbrido interespecífico","Una variedad de Vitis vinifera","Un portainjerto","Un clon de Touriga Nacional"],"a":0,"k":"Isabel: un híbrido, dos especies en una sola vid.","e":"La Isabel reúne dos especies en la misma vid: Vitis labrusca, americana, y Vitis vinifera, a la que pertenecen variedades como la Touriga Nacional y la Arinto. Por eso es un híbrido interespecífico: «inter» significa entre; en este caso, entre especies.","tema":"especies"},{"id":"uva-3-10","nivel":3,"tipo":"escolha","q":"Las variedades de pulpa tinta se llaman…","o":["Tintoreras","Tintas finas","Rosadas","Bastardas"],"a":0,"k":"Tintoreras: variedades que tiñen hasta la pulpa.","e":"Tintoreras: variedades cuya pulpa también tiene color, como la Alicante Bouschet; la mayoría de las variedades tintas tiene la pulpa clara. Al Vinhão se le suele llamar tintorero por su color intenso, pero las descripciones de su pulpa varían.","tema":"castas","sala":"La Alicante Bouschet, muy plantada en el Alentejo, es tintorera y da tintos muy oscuros."},{"id":"uva-3-11","nivel":3,"tipo":"escolha","q":"¿Qué variedad del Vinho Verde es conocida por dar tintos de color muy intenso?","o":["Vinhão","Espadeiro","Borraçal","Loureiro"],"a":0,"k":"Vinhão: la variedad que llena la copa de color.","e":"Vinhão: tiene muchos pigmentos y da tintos muy oscuros, por eso también se usa para dar color a los coupages. El Espadeiro tiende a dar tintos ligeros o rosados, y el Loureiro es blanco.","tema":"castas"},{"id":"uva-3-12","nivel":3,"tipo":"escolha","q":"En una fermentación espontánea no se añaden levaduras comerciales. ¿De dónde vienen las que hacen el trabajo?","o":["De la superficie de las uvas y del ambiente de la bodega","Del azúcar de la pulpa, que se convierte en levaduras","De las pepitas trituradas, que liberan levaduras","Solo de la madera de las barricas donde fermenta"],"a":0,"k":"Fermentación espontánea: levaduras de la uva y de la bodega.","e":"Vienen del hollejo, donde la pruina puede transportarlas, pero también de los equipos y del aire de la bodega. Muchas levaduras de la uva no aguantan mucho alcohol; Saccharomyces cerevisiae, que suele terminar la fermentación, es poco común en uvas intactas y frecuente en la bodega. Espontánea no quiere decir garantizada.","tema":"bago","sala":"«Levaduras indígenas» o «fermentación espontánea» en la etiqueta quieren decir esto: no se añadieron levaduras comerciales."},{"id":"uva-3-13","nivel":3,"tipo":"escolha","q":"¿Qué tres partes del racimo pueden aportar taninos al vino?","o":["Hollejo, pepitas y raspón","Pulpa, hollejo y pruina","Pulpa, pepitas y zumo","Solo el hollejo"],"a":0,"k":"Hollejo, pepitas y raspón: las fuentes de tanino.","e":"El hollejo, las pepitas y, cuando se usa, el raspón pueden aportar taninos; la pulpa tiene muchos menos taninos condensados. Cada parte del racimo hace una aportación distinta.","tema":"composicao"},{"id":"uva-3-14","nivel":3,"tipo":"escolha","q":"Además de darle ese aspecto blanquecino, la pruina ayuda a la baya a…","o":["Perder menos agua y defenderse de los hongos","Ganar color más deprisa en el hollejo","Ser más dulce sin necesitar tanto sol","Madurar más deprisa en los años fríos"],"a":0,"k":"Pruina: un abrigo de cera que ahorra agua.","e":"La pruina es una capa cerosa que ayuda a reducir la pérdida de agua y funciona como barrera física. No es un escudo infalible contra los hongos, pero le echa una mano a la baya.","tema":"bago"},{"id":"uva-3-16","nivel":3,"tema":"especies","tipo":"escolha","q":"¿Cómo se llama la forma silvestre europea de la vid, antepasada de las vides cultivadas?","o":["Vitis vinifera subsp. sylvestris","Vitis vinifera subsp. sativa","Vitis labrusca","Vitis riparia × Vitis rupestris"],"a":0,"k":"Sylvestris: la abuela salvaje de la vid cultivada.","e":"Antes de los viñedos, había vides silvestres. Vitis vinifera subsp. sylvestris es la forma ancestral de la vid cultivada: pertenece a la misma especie, pero no es una variedad de cultivo. «Subsp.» significa subespecie: una división dentro de la especie."},{"id":"uva-3-17","nivel":3,"tema":"especies","tipo":"escolha","q":"A diferencia de la mayoría de las variedades cultivadas, la vid silvestre europea tiene…","o":["Plantas masculinas y plantas femeninas separadas","Flores que nunca llegan a dar uvas maduras","Ejemplares solo en el continente americano","Sarmientos largos sin ningún zarcillo"],"a":0,"k":"Vid silvestre: plantas macho y hembra separadas.","e":"En la vid silvestre europea, los sexos están separados: hay plantas masculinas y plantas femeninas. Por eso se dice que es dioica. Durante la domesticación se favorecieron las vides con flores hermafroditas, con órganos masculinos y femeninos funcionales en la misma flor, lo que permite la autopolinización. ¡Un pequeño cambio en la flor, una gran ventaja en el viñedo!"},{"id":"uva-3-20","nivel":3,"tema":"especies","tipo":"escolha","q":"En viticultura, ¿qué es un clon?","o":["Cepas multiplicadas por estaca o injerto a partir de una sola planta","Un cruce entre dos variedades, hecho por polinización controlada","Un híbrido entre dos especies de vid diferentes","Una nueva variedad obtenida en laboratorio por modificación genética"],"a":0,"k":"Clon: copias de una sola vid, sin semillas.","e":"Una vid, muchas descendientes, sin recurrir a semillas. Un clon resulta de multiplicar una sola planta a partir de material vegetativo, como estacas o yemas. Las descendientes conservan su perfil genético, aunque pueden surgir pequeñas mutaciones. Una misma variedad puede tener varios clones con diferencias de productividad o de época de maduración."},{"id":"uva-3-21","nivel":3,"tema":"especies","tipo":"escolha","q":"En la Península de Setúbal la llaman Moscatel de Setúbal, o Graúdo: es la variedad tradicional del Moscatel de Setúbal blanco. ¿Qué variedad es?","o":["Moscatel de Alejandría","Moscatel Galego Branco","Moscatel Roxo","Malvasia Fina"],"a":0,"k":"En Setúbal, Graúdo es Moscatel de Alejandría.","e":"Es la Moscatel de Alejandría: Graúdo y Moscatel de Setúbal son los nombres que recibe en la península. El Moscatel Galego Branco es el Moscatel del Douro; el Moscatel Roxo, que se cree que es una mutación suya, es la estrella rara de Setúbal. Tres Moscateles, tres identidades: ¡no los confundas!","fonte":"CVR Península de Setúbal (castas: 'Moscatel de Setúbal ou Graúdo', reconhecida internacionalmente como Moscatel de Alexandria); Wines of Portugal (estilos: vinho Moscatel)","sala":"En la carta, distingue el Moscatel de Setúbal (Moscatel de Alejandría) del Moscatel Roxo: son variedades y vinos distintos."},{"id":"uva-3-23","nivel":3,"tema":"aromas","tipo":"escolha","q":"¿Con qué compuestos de la uva pueden estar relacionadas las notas florales de un Alvarinho?","o":["Terpenos","Pirazinas","Taninos","Ácido málico"],"a":0,"k":"Terpenos: parte del perfume floral del Alvarinho.","e":"Terpenos como el linalol y el geraniol contribuyen a los aromas florales. Están presentes en el Alvarinho y ayudan a explicar parte de su perfume; el geraniol, por ejemplo, puede recordar a rosas.","sala":"Servido demasiado frío, un Alvarinho puede parecer cerrado: el frío esconde parte del aroma floral."},{"id":"uva-3-26","nivel":3,"tema":"composicao","tipo":"escolha","q":"El azúcar fabricado en las hojas viaja hasta la baya en forma de…","o":["Sacarosa","Fructosa","Almidón","Alcohol"],"a":0,"k":"De la hoja a la baya, el azúcar viaja como sacarosa.","e":"La sacarosa es el principal azúcar transportado de las hojas a la baya; en el fruto, las enzimas pueden convertirla en glucosa y fructosa. Un envío que llega y se reparte enseguida."},{"id":"uva-3-29","nivel":3,"tema":"castas","tipo":"escolha","q":"¿Cuántas variedades autóctonas tiene Portugal, aproximadamente?","o":["Unas 250","Unas 20","Unas 50","Más de 2000"],"a":0,"k":"País pequeño, unas 250 variedades autóctonas.","e":"Se cuentan unas 250 variedades autóctonas; la cifra exacta varía según la fuente y el criterio. Una diversidad impresionante para el tamaño del país: un mapa pequeño, un viñedo de nombres enorme.","fonte":"Público/Agroportal, 'Em matéria de castas autóctones ninguém nos apanha' (cerca de 250)","sala":"Tanta diversidad de variedades es un buen argumento para animar a los turistas a probar vino portugués."},{"id":"uva-1-s01","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"A un cliente le extraña: «¿Este espumoso blanco de la Bairrada es de Baga? Pero ¿la Baga no es tinta?». ¿Qué le respondes?","o":["El color está en el hollejo; prensada con cuidado, la uva tinta da un mosto claro.","Se decoloró con productos, como se hace con casi todos los espumosos.","La Baga también tiene una versión blanca, que solo se usa en espumoso.","Le mezclaron vino blanco para aclarar el color antes de la segunda fermentación."],"a":0,"k":"La uva tinta, prensada con cuidado, da mosto claro.","e":["El mosto de la Baga es claro.","El color está en el hollejo y, con este prensado, casi no pasa al mosto.","Dile al cliente que es un «blanco de tintas» y que el estilo lleva el nombre francés blanc de noirs."],"fonte":"Fichas técnicas de espumantes Bairrada brancos de Baga (blanc de noirs); falta fonte oficial (CVB)."},{"id":"uva-1-s02","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente prueba un tinto del Douro y dice: «Me seca la boca». ¿Qué está notando?","o":["Taninos","Acidez","Alcohol","Azúcar"],"a":0,"k":"¿Boca seca? Son los taninos.","e":["La boca queda seca y áspera, como después de un té fuerte.","Los taninos vienen del hollejo y de las pepitas y se unen a las proteínas de la saliva.","Si al cliente no le gusta la sensación, sugiere un tinto menos tánico; si va a comer, la grasa del plato tiende a suavizar los taninos (Servicio 4)."]},{"id":"uva-1-s03","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Tras una copa de Vinhão, un cliente se da cuenta de que tiene los dientes morados. ¿Por qué?","o":["El Vinhão tiene muchos pigmentos y da vinos muy oscuros.","Al vino se le añade colorante para intensificar el color.","Es un vino muy viejo, que ganó color con los años.","Se sirvió demasiado frío y el color se pegó a los dientes."],"a":0,"k":"Vinhão: mucho color en la copa, y en los dientes.","e":["El vino tiene un color muy intenso.","El Vinhão es una variedad con muchos pigmentos (antocianos): da tintos muy oscuros, que pueden teñir la copa y los dientes.","Es una curiosidad estupenda para contar en la mesa y prepara al cliente para el color de la copa."],"fonte":"https://www.vinetowinecircle.com/en/castas_post/vinhao-3/"},{"id":"uva-1-s04","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"«¿El rosado es una mezcla de blanco y tinto?», pregunta un cliente. ¿Qué le respondes?","o":["Normalmente se hace con uvas tintas y poco tiempo de contacto con los hollejos.","Sí, siempre se mezcla blanco con tinto a partes iguales antes de embotellar.","Se hace con uvas rosadas, vendimiadas antes de volverse tintas.","Se hace con vino blanco al que se añade un colorante natural."],"a":0,"k":"Rosado: uvas tintas, poco tiempo con los hollejos.","e":["El color rosado viene de las propias uvas tintas.","El color depende sobre todo del contacto con los hollejos, pero la variedad y el método también cuentan.","Explicar el proceso pone en valor el rosado ante quien lo considera un «vino menor»."]},{"id":"uva-1-s05","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente pregunta por qué el vino de Oporto es dulce y tiene más alcohol que un tinto de mesa. ¿Cuál es la explicación?","o":["Se añade aguardiente vínico a mitad de la fermentación; esta se detiene y queda azúcar de la uva.","Se añaden azúcar y alcohol al final, cuando la fermentación ya terminó sola.","Las uvas del Duero se vendimian ya pasas, por eso dan más azúcar y alcohol.","Envejece en barricas que antes tuvieron vino dulce y le pasan azúcar."],"a":0,"k":"Oporto: aguardiente a media fermentación, y el azúcar se queda.","e":["El vino queda dulce y con más alcohol.","Con el aguardiente, las levaduras se detienen y el azúcar que aún no se ha convertido en alcohol se queda en el vino.","El Moscatel de Setúbal también es un vino fortificado. Basta una frase para que el cliente entienda el estilo."]},{"id":"uva-1-s06","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente pide «un tinto seco, sin nada de azúcar». ¿Qué conviene saber?","o":["La mayoría de los tintos de mesa ya son secos: casi todo el azúcar se volvió alcohol.","Los tintos casi siempre guardan algo de azúcar; solo los de gama alta son secos.","\"Seco\" quiere decir mucho tanino, el que deja la boca áspera.","\"Seco\" quiere decir poco alcohol, así que conviene un tinto ligero."],"a":0,"k":"La mayoría de los tintos de mesa ya son secos.","e":["«Seco» quiere decir casi sin azúcar.","En la fermentación, el azúcar se convierte sobre todo en alcohol.","Muchas veces, quien pide «seco» está pensando en taninos o en poca fruta. Pregúntale qué busca antes de sugerir nada."]},{"id":"uva-1-s07","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente dice que el blanco del Alentejo «no le raspa la boca como el tinto». ¿Por qué?","o":["Normalmente el blanco fermenta sin los hollejos, por eso tiene pocos taninos.","Las uvas blancas no tienen taninos, ni en el hollejo ni en las pepitas.","El blanco se sirve más frío, y el frío esconde todos los taninos.","El blanco tiene más alcohol, y el alcohol disimula la sequedad de los taninos."],"a":0,"k":"Blanco fermentado sin hollejos: casi sin taninos.","e":["El blanco casi no tiene astringencia.","Los taninos están en el hollejo y en las pepitas, y la mayoría de los blancos fermenta solo con el mosto.","Una excepción para contar: muchos blancos de talha (tinaja de barro) y de curtimenta (maceración con pieles) fermentan con los hollejos y pueden tener cierta textura tánica."],"fonte":"https://elle.com.br/lifestyle/saiba-o-que-e-vinho-de-talha (talha); falta fonte oficial (CVRA)."},{"id":"uva-1-s08","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"Al final de la cena, un cliente pide «un digestivo hecho de la uva, de lo que sobra del vino». ¿Qué le sugieres?","o":["Aguardiente de orujo (bagaceira)","Licor de almendra","Ginjinha (licor de guindas)","Oporto Tawny"],"a":0,"k":"Bagaceira: el aguardiente de lo que queda en la prensa.","e":["La bagaceira se destila a partir del orujo.","El orujo es lo que queda en la prensa: hollejos, pepitas y, a veces, raspón.","Buen momento para recordar que el vino y el aguardiente salen del mismo racimo."]},{"id":"uva-1-s09","nivel":1,"tipo":"escolha","sit":true,"tema":"sala","q":"«¿Este tinto tiene taninos porque ha estado en barrica?», pregunta un cliente. ¿Qué es más riguroso?","o":["Los taninos vienen sobre todo de la uva; la barrica puede añadir algunos.","Sí, solo la barrica da taninos; un tinto de inox no tiene ninguno.","No, la barrica quita todos los taninos y deja el vino más suave.","La barrica solo da color y aroma al vino, nunca taninos."],"a":0,"k":"El tanino viene sobre todo de la uva; la barrica puede sumar.","e":["Un tinto que nunca ha visto madera puede ser tánico.","El hollejo y las pepitas dan los taninos de la uva; el roble suma los suyos.","Evita prometer «madera» cuando el cliente solo nota tanino."]},{"id":"uva-2-s01","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente devuelve la copa de un blanco seco y joven, que estaba bien frío: «¡Hay vidrio en el fondo!». Son pequeños cristales transparentes. ¿Qué son?","o":["Azúcar del vino que quedó sin fermentar y cristalizó con el frío.","Trocitos de corcho del tapón, que se soltaron al abrir la botella.","Sales tartáricas de la uva, que pueden cristalizar con el frío.","Depósito de taninos y de color, que suele aparecer con la edad."],"a":2,"k":"Cristales transparentes en la copa: tartratos, naturales e inofensivos.","e":["Los cristales vienen del propio vino: son tartratos.","El ácido tartárico forma sales que cristalizan con el frío. El corcho dejaría trocitos marrones; en un blanco seco no queda azúcar que cristalice.","Muestra que no es vidrio y ofrece otra copa. Dile: «Son cristales naturales del vino, inofensivos»."]},{"id":"uva-2-s02","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"Un blanco del Dão se crió solo en acero inoxidable, sin madera. Un cliente encuentra notas de mantequilla y nota la acidez suave. ¿De dónde vienen, lo más probable?","o":["De la barrica de roble, que tiende a dar notas de vainilla y tostado.","De la maloláctica, que puede dar mantequilla y suavizar la acidez.","De las lías finas, que tienden a dar notas de pan y textura cremosa.","Del contacto con los hollejos, que tiende a dar aroma y algo de tanino."],"a":1,"k":"¿Mantequilla sin madera? Pista de la maloláctica.","e":["La mantequilla viene de una segunda fermentación, no de la madera.","En la maloláctica, el ácido málico pasa a láctico, más suave, y puede formarse diacetilo, con aroma a mantequilla. Las lías recuerdan más al pan.","Dile: «Es la maloláctica: suaviza la acidez y recuerda a mantequilla». Si no le gusta, sugiere un blanco fresco sin maloláctica."]},{"id":"uva-2-s03","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"«Quiero el rosado más seco, así que póngame el más pálido», pide un cliente. ¿Qué le dices?","o":["El color no indica el dulzor; lo mejor es mirar la etiqueta o preguntar al productor.","Tiene razón: cuanto más claro el rosado, más seco es, sin ninguna excepción.","Los rosados más oscuros siempre son dulces, así que mejor evitarlos.","Casi todos los rosados son dulces; lo más seco será un blanco."],"a":0,"k":"El color del rosado no dice si es dulce.","e":["Color y dulzor no van de la mano.","El color depende de la variedad, del método y del tiempo con los hollejos; el dulzor depende del azúcar que quedó sin fermentar.","Pregunta qué busca el cliente (seco, fresco, afrutado) y elige a partir de ahí."]},{"id":"uva-2-s04","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A un cliente le extraña el ribete parduzco de un tinto del Douro de 15 años. El vino huele bien y está limpio en boca. ¿Qué le explicas?","o":["Entró aire por el corcho y el vino se oxidó, así que ya ha pasado su momento.","Las uvas se vendimiaron poco maduras y dieron un color más débil.","La crianza en barrica nueva le pasó al vino el color marrón de la madera.","El color ha evolucionado: pierde el violeta y tiende al granate y la teja."],"a":3,"k":"Tinto con años: el ribete tiende a teja.","e":["El color ha cambiado con la edad, no por un defecto.","Los pigmentos se unen a otros compuestos y parte se deposita; el violeta desaparece y el ribete queda granate o teja.","Un aroma limpio descarta la oxidación. Dile: «Es el color de un tinto que ha tenido tiempo para evolucionar»."]},{"id":"uva-2-s05","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A un cliente le encanta el Aragonez del Alentejo, pero en la carta solo hay tintos del Douro con Tinta Roriz. ¿Qué le puedes decir?","o":["Es la misma variedad, con otro nombre; el estilo cambia con la región.","Son variedades sin ninguna relación, aunque den vinos parecidos.","La Tinta Roriz es una variedad blanca, así que el vino será otro.","La Aragonez solo existe en España; en el Duero se planta otra variedad."],"a":0,"k":"Aragonez en el Alentejo, Tinta Roriz en el Douro: la misma variedad.","e":["El cliente reconoce la variedad, aunque tenga otro nombre.","Tinta Roriz (Douro) y Aragonez (Alentejo) son la misma variedad, conocida internacionalmente como Tempranillo.","Un buen puente para llevar al cliente a probar otra región."]},{"id":"uva-2-s07","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente pide «un Fernão Pires», pero en la carta solo ve un blanco de la Bairrada de Maria Gomes. ¿Qué haces?","o":["Le explicas que Maria Gomes es el nombre de la Fernão Pires en la Bairrada.","Dices que no hay ninguno en la carta y sugieres otra variedad blanca.","Sugieres un tinto ligero, ya que no está el blanco pedido.","Dices que son variedades parecidas, de la misma familia, pero distintas."],"a":0,"k":"¿Maria Gomes en la carta? Es la Fernão Pires.","e":["El cliente tiene lo que ha pedido.","La misma variedad tiene nombres distintos según la región.","Conocer los sinónimos evita perder una venta y da confianza al cliente."]},{"id":"uva-2-s08","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente ve «Blanc de Noirs» en un espumoso portugués y pregunta qué significa. ¿Qué le respondes?","o":["Es un espumoso blanco elaborado con uvas tintas.","Es un espumoso tinto.","Está hecho con uvas blancas y negras mezcladas.","Quiere decir que es dulce."],"a":0,"k":"Blanc de Noirs: espumoso blanco de uvas tintas.","e":["El nombre es francés, pero el estilo también existe en Portugal.","La pulpa de la mayoría de las variedades tintas es clara; prensando con cuidado, el mosto sale blanco.","En la Bairrada hay espumosos blancos de Baga elaborados así."]},{"id":"uva-2-s09","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente pregunta por qué el Moscatel de Setúbal huele tanto a uva, a flores y a naranja. ¿Cuál es la mejor explicación?","o":["La variedad es muy aromática, y los hollejos pasan meses en el vino.","El aguardiente que detiene la fermentación es lo que aporta esos aromas.","La larga crianza en madera le da las notas de flores y de naranja.","El azúcar que queda sin fermentar es lo que le da el olor a uva."],"a":0,"k":"Moscatel: variedad perfumada y meses con los hollejos.","e":["El aroma viene sobre todo de la uva.","El Moscatel tiene muchos compuestos aromáticos en el hollejo, y la maceración prolongada los extrae. El aguardiente detiene la fermentación; no es el origen de estos aromas.","Dile: «Es la uva la que habla: una variedad perfumada y meses con los hollejos»."],"fonte":"https://jmf.pt/pdf/pt/ABT_P.pdf (ficha de produtor: maceração pelicular de 5 meses); falta fonte oficial (CVRPS)."},{"id":"uva-2-s10","nivel":2,"tipo":"escolha","sit":true,"tema":"sala","q":"A un cliente le extraña el 14,5 % de un tinto seco alentejano. ¿De dónde sale tanto alcohol?","o":["Se añadió aguardiente durante la fermentación, como en un Oporto.","Las uvas más maduras, de clima cálido, tienen más azúcar que fermentar.","La crianza en barrica tiende a concentrar el vino y a subir el alcohol.","Fermentó más tiempo, y cada semana de más añade alcohol."],"a":1,"k":"Uva más madura, más azúcar, más alcohol.","e":["El alcohol viene del azúcar de la uva.","Durante la maduración el azúcar sube; la fermentación lo convierte en alcohol. Sin más azúcar, fermentar más tiempo no da más alcohol.","Si el cliente quiere menos alcohol, sugiere una región más fresca. Dile: «Sol alentejano, uva madura, más grado»."]},{"id":"uva-3-s03","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"«¿Qué quiere decir “fermentación espontánea” en la etiqueta de este tinto?», pregunta un cliente. ¿Qué es riguroso decir?","o":["Fermentó sin control de temperatura, al ritmo natural de la propia bodega.","Fermentó sin sulfitos añadidos, así que se considera un vino natural.","Fermentó con levaduras de la uva y de la bodega, sin comprar levaduras.","Fermentó por segunda vez en la botella, sin la ayuda del enólogo."],"a":2,"k":"Espontánea: solo levaduras de la uva y de la bodega.","e":["La diferencia está en las levaduras, no en la temperatura ni en los sulfitos.","Muchas levaduras de la uva no aguantan mucho alcohol; la que suele terminar la fermentación vive sobre todo en la bodega.","Dile: «Fermentó con las levaduras de la casa». Preséntalo como una elección de estilo, no como garantía de calidad."]},{"id":"uva-3-s05","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente dice que el tinto del Minho no huele al «vinho morangueiro» (el vino casero «de fresa») de su abuelo. ¿Por qué?","o":["El morangueiro viene de uvas americanas, como la Isabel; la DOC usa solo Vitis vinifera.","El morangueiro viene de cepas viejas de Vinhão, con aroma a fresa.","El tinto del Minho perdió ese aroma con las nuevas técnicas de bodega y de viña.","Es la misma uva, pero el vino del abuelo era más viejo y evolucionado."],"a":0,"k":"El morangueiro es de uvas americanas; el DOC, de vinifera.","e":["Son uvas de especies distintas.","La Isabel es un híbrido con Vitis labrusca, que da ese aroma a fresa y a caramelo.","Responde con respeto por el recuerdo del cliente y presenta el Vinhão como el tinto tradicional del Minho."],"fonte":"https://stg.portugalresident.com/have-you-heard-of-portugals-forbidden-wine/"},{"id":"uva-3-s06","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A un cliente, un tinto joven de Colares, servido a la temperatura adecuada, le parece «duro y ácido». ¿Cuál es la explicación más probable?","o":["La Ramisco tiende a dar acidez alta y taninos firmes, que piden tiempo.","Se sirvió demasiado frío, y el frío tiende a realzar acidez y tanino.","Está al final de su vida: con la edad, la fruta cae y el tanino se endurece.","Las viñas en arena tienden a dar uvas poco maduras y vino aguado."],"a":0,"k":"Ramisco joven: ácido y firme, pide tiempo y comida.","e":["Con la temperatura correcta y el vino joven, lo más probable es el perfil de la variedad.","La Ramisco da tintos de acidez elevada y taninos firmes, que tienden a expresarse mejor con la edad.","Sugiérelo con un plato con algo de grasa, que tiende a suavizar el tanino (Servicio 4)."]},{"id":"uva-3-s07","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"Un cliente pide «Moscatel Roxo», pero solo hay Moscatel de Setúbal. ¿Puedes decirle que es lo mismo?","o":["Sí: Roxo es solo el nombre que se da al Moscatel de Setúbal con más años.","Sí: es la misma variedad, solo que vendimiada más tarde y más madura.","No: el Moscatel Roxo es un tinto seco de mesa, y no un vino generoso.","No: variedades distintas; Setúbal usa sobre todo Moscatel de Alejandría."],"a":3,"k":"Moscatel Roxo y Moscatel de Alejandría: variedades distintas.","e":["Los dos vinos vienen de variedades distintas; la edad y la fecha de vendimia no cambian la variedad.","El Moscatel de Setúbal tradicional es de Moscatel de Alejandría (Graúdo); el Moscatel Roxo es una variedad rara de la península.","Habla con honestidad y propón el Moscatel de Setúbal como alternativa cercana."]},{"id":"uva-3-s08","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A un cliente le parece que el Alvarinho «no huele a nada». Está servido muy frío. ¿Qué haces?","o":["Dejas que la copa se temple un poco: el frío excesivo esconde parte del aroma.","Vuelves a poner la botella en hielo para que el aroma sea más fresco e intenso.","Lo sirves en una copa más pequeña, que concentra mejor el aroma.","Dices que el Alvarinho es una variedad neutra, casi sin aroma."],"a":0,"k":"Un Alvarinho demasiado frío esconde su aroma.","e":["El aroma está ahí, pero escondido.","Los compuestos aromáticos (como los terpenos florales) se evaporan menos a temperaturas muy bajas.","Servir los blancos aromáticos frescos, pero no helados, ayuda al vino a expresarse."]},{"id":"uva-3-s10","nivel":3,"tipo":"escolha","sit":true,"tema":"sala","q":"A un cliente un tinto alentejano le parece «casi negro». En la contraetiqueta lee que el mosto ya sale tinto al estrujar la uva. ¿Qué variedad ayuda a explicarlo?","o":["La Touriga Nacional, de baya pequeña y hollejo grueso y oscuro.","La Alicante Bouschet, tintorera, con color en hollejo y pulpa.","El Aragonez, con larga crianza en barrica, que oscurece el color.","La Trincadeira, con maceración larga, que saca color de las pepitas."],"a":1,"k":"¿Mosto tinto al estrujar? Variedad tintorera, como la Alicante Bouschet.","e":["El color viene también de la pulpa, y la Alicante Bouschet está muy plantada en el Alentejo.","En la mayoría de las variedades,
