}":"highest level{2}","perguntas diferentes respondidas":"different questions answered","acertadas pelo menos uma vez":"right at least once","O teu repertório na Uva":"Your repertoire in The Grape","{1} de {2} perguntas acertadas":"{1} of {2} questions right","A tua rolha, o repertório e as próximas fases":"Your cork, your repertoire and the phases ahead","A tua adega":"Your cellar","Joga a primeira ronda e o teu repertório começa a encher.":"Play your first round and your repertoire starts filling up.","Vinha":"Vineyard","{3} guarda tudo aqui":"{3} keeps it all here","Repertório":"Repertoire","A planta e o bago":"The plant and the berry","Ciclo, solos e clima":"Cycle, soils and climate","Do mosto ao vinho":"From must to wine","Serviço e harmonização":"Service and food pairing","Portugal":"Portugal","As 14 regiões":"The 14 regions","Portugal a fundo":"Portugal in Depth","Castas raras e rótulos":"Rare varieties and labels","Superada":"Cleared","{1}Em breve":"{1}Coming soon","Atrevida e sabida":"Bold and brainy","Elegante e trapalhão":"Dapper and clumsy","A tua rolha":"Your cork","Desafio avançado superado!":"Advanced challenge cleared!","Ruby, Tawny e Vintage superados. Já acertaste {1} das {2} perguntas da Uva: ainda há mais para descobrir.":"Ruby, Tawny and Vintage cleared. You've got {1} of the {2} Grape questions right: there's still more to discover.","Antes da primeira prova":"Before your first tasting","Quem te acompanha?":"Who's coming with you?","A tua rolha está contigo em cada pergunta. Podes trocar depois.":"Your cork is with you for every question. You can switch later.","Agora não":"Not now","Fechar":"Close","↑ Mais evidente":"↑ More noticeable","↓ Menos evidente":"↓ Less noticeable","Verdadeiro":"True","Falso":"False","Sal":"Salt","O sal acalma o amargo":"Salt calms bitterness","Regra de ouro: o prato não muda o vinho no copo, muda o que sentes. Depois de algo salgado, o vinho tende a parecer menos amargo, menos áspero e menos ácido, seja branco, rosé, tinto ou espumante.":"Golden rule: food doesn't change the wine in the glass, it changes what you perceive. After something salty, wine tends to seem less bitter, less harsh and less acidic, whether white, rosé, red or sparkling.","Escolha · Princípios da harmonização":"Pick one · Pairing principles","Provaste um tinto da Bairrada, comeste uns tremoços salgados e voltaste a provar o mesmo vinho. Parece-te diferente. O que mudou?":"You tasted a Bairrada red, ate some salty tremoços (lupin beans) and tasted the same wine again. It seems different. What changed?","A tua perceção do vinho":"Your perception of the wine","A composição do vinho no copo":"The wine's composition in the glass","A cor do vinho":"The wine's colour","A quantidade de álcool no vinho":"The amount of alcohol in the wine","O vinho no copo continua igual; a forma como o sentes pode mudar depois de comeres.":"The wine in the glass stays the same; the way you perceive it can change after eating.","O sal, por exemplo, pode fazer o vinho parecer menos amargo e mais macio.":"Salt, for example, can make wine seem less bitter and smoother.","Harmonizar começa aqui: perceber como a comida influencia o próximo gole.":"Pairing starts here: understanding how food affects the next sip.","Um tinto de Baga, depois de uns tremoços bem salgados. O que tende a acontecer ao amargor e à aspereza do vinho?":"A Baga red, after some very salty tremoços. What tends to happen to the wine's bitterness and harshness?","Tendem a diminuir":"They tend to decrease","Tendem a aumentar":"They tend to increase","Ficam sempre iguais":"They always stay the same","O vinho passa a parecer doce":"The wine starts to seem sweet","O tinto parece mais macio.":"The red seems smoother.","Petiscos salgados aceitam tintos de taninos firmes, como a Baga.":"Salty snacks can take reds with firm tannins, such as Baga.","Sardinhas assadas com sal grosso e um Alvarinho de Monção e Melgaço. Pensa só no sal: a acidez do vinho vai parecer…":"Grilled sardines with coarse salt and an Alvarinho from Monção e Melgaço. Think only about the salt: the wine's acidity will seem…","A acidez parece mais suave e a fruta sobressai.":"The acidity seems softer and the fruit stands out.","O sal tende a baixar a perceção da acidez; o vinho continua com a mesma acidez. A gordura da sardinha também conta, mas aqui isolamos o sal.":"Salt tends to lower the perception of acidity; the wine keeps the same acidity. The oiliness of the sardines also plays a part, but here we isolate the salt.","Um branco que sozinho parece cortante pode ficar mais redondo à mesa com um prato salgado.":"A white that seems sharp on its own can turn rounder at the table with a salty dish.","Amêndoas torradas com sal e um tinto do Douro de Touriga Nacional. Pensa só no sal: a fruta do vinho vai parecer…":"Salted roasted almonds and a Douro red made from Touriga Nacional. Think only about the salt: the wine's fruit will seem…","A fruta vem mais à frente.":"The fruit comes further forward.","Com o amargor e a aspereza a parecerem menores, a fruta tende a destacar-se mais.":"With bitterness and harshness seeming lower, the fruit tends to stand out more.","Um tinto jovem e firme mostra-se mais simpático com um petisco salgado.":"A young, firm red shows a friendlier side with a salty snack.","Verdadeiro ou falso? O sal só funciona com vinhos brancos.":"True or false? Salt only works with white wines.","Nos brancos, a acidez tende a parecer mais baixa; nos tintos, o amargor e os taninos tendem a parecer mais suaves.":"In whites, acidity tends to seem lower; in reds, bitterness and tannins tend to seem softer.","O sal muda a perceção, seja qual for a cor do vinho; a intensidade varia de pessoa para pessoa.":"Salt changes perception whatever the wine's colour; the intensity varies from person to person.","Com salgados, podes servir branco, rosé, tinto ou espumante; decide pelo resto do prato.":"With salty food, you can serve white, rosé, red or sparkling; let the rest of the dish decide.","Acidez":"Acidity","Ácido pede ácido":"Acid calls for acid","Depois de limão, tomate ou vinagre, o vinho tende a parecer menos ácido e mais frutado. Se tiver menos acidez do que o prato, tende a parecer chato. Pista: acidez do vinho pelo menos igual à do prato.":"After lemon, tomato or vinegar, wine tends to seem less acidic and fruitier. If it has less acidity than the dish, it tends to seem flat. Hint: wine acidity at least equal to the dish's.","Salada de tomate com vinagre e, a seguir, um Arinto de Bucelas. O que tende a acontecer à acidez do vinho?":"Tomato salad with vinegar, followed by an Arinto from Bucelas. What tends to happen to the wine's acidity?","Parece mais baixa":"It seems lower","Parece mais alta":"It seems higher","Desaparece":"It disappears","Passa a parecer amarga":"It starts to seem bitter","O Arinto tende a parecer mais suave e frutado.":"The Arinto tends to seem softer and fruitier.","O paladar adapta-se ao ácido do prato e, a seguir, a mesma acidez do vinho sobressai menos. O vinho não perdeu acidez.":"The palate adapts to the acid in the dish, so the wine's same acidity stands out less afterwards. The wine hasn't lost any acidity.","Vinhos de acidez alta, como o Arinto, aguentam pratos ácidos sem ficar apagados.":"High-acid wines, like Arinto, stand up to acidic dishes without fading.","Porque é que um vinho de acidez baixa pode parecer \"chato\" ao lado de seitan grelhado com molho de limão?":"Why can a low-acid wine seem \"flat\" next to grilled seitan with lemon sauce?","Ao lado do ácido do prato, a pouca acidez do vinho quase não se nota":"Next to the acid in the dish, the wine's low acidity barely registers","O limão estraga o vinho":"Lemon ruins the wine","O limão aumenta o álcool do vinho":"Lemon raises the wine's alcohol","Os brancos não combinam com limão":"Whites don't go with lemon","O vinho tende a parecer mole, sem frescura.":"The wine tends to seem flabby, lacking freshness.","O paladar já se adaptou ao ácido do limão; uma acidez pequena tende a passar despercebida.":"The palate has already adapted to the lemon's acid; a little acidity tends to go unnoticed.","Com pratos ácidos, procura acidez pelo menos igual: um Vinho Verde, um Arinto, um espumante.":"With acidic dishes, look for at least equal acidity: a Vinho Verde, an Arinto, a sparkling wine.","Salada de polvo com vinagre e coentros e um Vinho Verde Loureiro. A fruta do vinho vai parecer…":"Octopus salad with vinegar and coriander, and a Loureiro Vinho Verde. The wine's fruit will seem…","O vinho tende a parecer mais frutado e redondo.":"The wine tends to seem fruitier and rounder.","Depois do vinagre, o paladar adapta-se ao ácido: a acidez do vinho nota-se menos e a fruta nota-se mais.":"After the vinegar, the palate adapts to the acid: the wine's acidity shows less and the fruit shows more.","Um vinho de acidez viva acompanha bem pratos temperados com vinagre ou limão.":"A wine with lively acidity goes well with dishes dressed with vinegar or lemon.","Arroz de tomate e um tinto maduro, de acidez baixa. Pensa na acidez do tomate: a frescura do vinho vai parecer…":"Arroz de tomate (tomato rice) and a ripe, low-acid red. Think about the tomato's acidity: the wine's freshness will seem…","Falta frescura; o vinho pode parecer pesado.":"It lacks freshness; the wine may seem heavy.","Ao lado da acidez do tomate, a pouca acidez do vinho tende a deixar de se notar.":"Next to the tomato's acidity, the wine's low acidity tends to go unnoticed.","Para arroz de tomate, um tinto com mais acidez, como a Baga, ou um rosé fresco tendem a funcionar melhor.":"For arroz de tomate, a red with more acidity, like Baga, or a fresh rosé tends to work better.","Verdadeiro ou falso? Um prato ácido faz o vinho perder acidez.":"True or false? An acidic dish makes the wine lose acidity.","Só a perceção muda; a acidez do vinho é a mesma.":"Only the perception changes; the wine's acidity is the same.","É adaptação do paladar, não uma reação química no copo.":"It's the palate adapting, not a chemical reaction in the glass.","Quando um vinho \"muda\" à mesa, a pergunta certa é o que o prato fez à tua boca.":"When a wine \"changes\" at the table, the right question is what the dish did to your mouth.","Doçura, Amargo e Umami":"Sweetness, Bitterness and Umami","Doçura":"Sweetness","Doce seca o vinho":"Sweet dries out wine","O doce do prato tende a secar o vinho: menos fruta, e mais acidez, amargor e álcool à vista. Pista: o vinho pelo menos tão doce como o prato.":"Sweetness in a dish tends to dry out the wine: less fruit, and more acidity, bitterness and alcohol on show. Hint: wine at least as sweet as the dish.","Marmelada e um tinto seco do Douro. O que tende a acontecer?":"Marmelada (quince paste) and a dry Douro red. What tends to happen?","O vinho parece mais seco, ácido e amargo":"The wine seems drier, more acidic and more bitter","O vinho parece mais doce":"The wine seems sweeter","O vinho parece com menos álcool":"The wine seems lower in alcohol","Nada muda":"Nothing changes","A fruta apaga-se e sobressaem acidez, amargor e álcool.":"The fruit fades and acidity, bitterness and alcohol stand out.","O paladar habitua-se ao doce e deixa de sentir a pouca doçura do vinho; e o doce, que costuma disfarçar o ácido e o amargo, deixa de fazer esse papel.":"The palate gets used to the sweetness and stops noticing the wine's small amount of sugar; and sweetness, which usually masks acidity and bitterness, no longer does that job.","Com marmelada, procura um vinho com pelo menos a mesma doçura, como um Porto Tawny.":"With marmelada, look for a wine at least as sweet, such as a Tawny Port.","Para arroz doce, que pista ajuda mais a escolher o vinho?":"For arroz doce (rice pudding), which hint helps most when choosing the wine?","Vinho pelo menos tão doce como a sobremesa":"Wine at least as sweet as the dessert","Vinho o mais seco possível":"The driest wine possible","Vinho com muito tanino":"Wine with lots of tannin","Vinho com muito álcool":"Wine with lots of alcohol","Com um vinho mais seco do que a sobremesa, o vinho parece magro e ácido.":"With a wine drier than the dessert, the wine seems thin and acidic.","É a mesma adaptação ao doce; só um vinho com doçura suficiente mantém a fruta à mesa.":"It's the same adaptation to sweetness; only a wine with enough sweetness keeps its fruit at the table.","Moscatel de Setúbal, Porto ou Madeira doce são pontos de partida seguros para sobremesas.":"Moscatel de Setúbal, Port or sweet Madeira are safe starting points for desserts.","Pão de ló e um espumante Bruto Natural (quase sem açúcar). A acidez do espumante vai parecer…":"Pão de ló (sponge cake) and a Brut Nature sparkling wine (almost no sugar). The sparkling wine's acidity will seem…","O espumante tende a parecer mais agressivo e magro.":"The sparkling wine tends to seem sharper and leaner.","O doce do pão de ló tira protagonismo à pouca doçura do vinho e deixa a acidez à vista.":"The sweetness of the pão de ló upstages the wine's slight sweetness and leaves the acidity exposed.","Para sobremesas, um espumante meio-seco ou doce, ou um Moscatel, tende a resultar melhor do que um Bruto Natural.":"For desserts, a medium-dry or sweet sparkling wine, or a Moscatel, tends to work better than a Brut Nature.","Tofu salteado com cebola caramelizada (um doce ligeiro) e um branco seco e muito leve. A fruta do vinho vai parecer…":"Stir-fried tofu with caramelised onion (lightly sweet) and a very light, dry white. The wine's fruit will seem…","O branco pode parecer diluído.":"The white may seem diluted.","Mesmo um doce ligeiro pode reduzir a sensação de doçura e fruta do vinho.":"Even slight sweetness can reduce the sense of sweetness and fruit in the wine.","Um branco com fruta madura e mais corpo, como um Encruzado do Dão, aguenta melhor pratos com algum doce.":"A white with riper fruit and more body, like an Encruzado from the Dão, copes better with dishes that have some sweetness.","Bolo de mel da Madeira e um Madeira Malvasia, doce. O vinho vai parecer mais seco do que é?":"Bolo de mel (Madeira honey cake) and a sweet Madeira Malvasia. Will the wine seem drier than it is?","Sim, muito":"Yes, very","Pouco ou nada":"Little or not at all","O vinho mantém a fruta e o equilíbrio.":"The wine keeps its fruit and balance.","Com doçura igual ou maior do que a do prato, a adaptação ao doce não chega a apagar o vinho.":"With sweetness equal to or greater than the dish's, adapting to the sweetness doesn't flatten the wine.","Este é o raciocínio para qualquer sobremesa: compara a doçura do prato com a do vinho.":"This is the reasoning for any dessert: compare the dish's sweetness with the wine's.","Amargo":"Bitterness","Amargo soma amargo":"Bitter adds to bitter","Grelos salteados com alho, quase sem sal, e um tinto jovem e tânico do Douro. O que tende a acontecer?":"Grelos sautéed with garlic, barely salted, and a young, tannic Douro red. What tends to happen?","O vinho parece mais amargo":"The wine seems more bitter","O amargor dos grelos desaparece":"The bitterness of the grelos disappears","O amargor do vinho vem mais à frente e os taninos parecem mais duros.":"The wine's bitterness comes forward and the tannins seem harder.","Em qual destes pratos o amargo é a característica principal?":"In which of these dishes is bitterness the main feature?","Salada de rúcula e endívia":"Rocket and endive salad","Arroz doce":"Arroz doce","Sardinhas assadas":"Grilled sardines","Tremoços":"Tremoços","Com rúcula e endívia, o amargor do vinho tende a notar-se mais.":"With rocket and endive, the wine's bitterness tends to show more.","São folhas naturalmente amargas; o arroz doce é doce, as sardinhas são gordas e salgadas, os tremoços são salgados.":"They're naturally bitter leaves; arroz doce is sweet, sardines are oily and salty, tremoços are salty.","Identificar a característica dominante do prato é o primeiro passo de qualquer escolha.":"Spotting the dish's dominant feature is the first step in any choice.","Chocolate negro e um tinto seco e tânico. O amargor do vinho vai parecer…":"Dark chocolate and a dry, tannic red. The wine's bitterness will seem…","O vinho pode parecer amargo e seco.":"The wine may seem bitter and dry.","Aqui há dois fatores no mesmo sentido: o amargo do chocolate soma-se ao do vinho, e o doce tende a secar o vinho.":"Here two factors pull the same way: the chocolate's bitterness adds to the wine's, and the sweetness tends to dry out the wine.","Com chocolate negro, um vinho doce e com fruta, como um Porto Ruby ou LBV, tende a resultar melhor.":"With dark chocolate, a sweet, fruity wine like a Ruby or LBV Port tends to work better.","Os mesmos grelos, agora bem temperados com flor de sal, e o mesmo tinto. Em comparação com antes, o amargor do vinho vai parecer…":"The same grelos, now well seasoned with flor de sal, and the same red. Compared with before, the wine's bitterness will seem…","O vinho tende a parecer mais macio.":"The wine tends to seem smoother.","Os grelos são os mesmos; só mudou o sal, que tende a atenuar a perceção do amargor.":"The grelos are the same; only the salt changed, and salt tends to soften the perception of bitterness.","Corrigir o tempero também é harmonizar.":"Adjusting the seasoning is pairing too.","Verdadeiro ou falso? Um prato amargo tende a tornar mais macio um tinto tânico.":"True or false? A bitter dish tends to make a tannic red smoother.","O contrário: o tinto tende a parecer mais amargo e áspero.":"The opposite: the red tends to seem more bitter and harsh.","O amargor do prato e o do vinho tendem a somar-se.":"The bitterness of the dish and of the wine tend to add up.","Para pratos amargos, guarda os tintos mais tânicos para outra ocasião.":"For bitter dishes, save the most tannic reds for another occasion.","Umami":"Umami","Umami endurece o tinto":"Umami toughens reds","Qual destes ingredientes é rico em umami?":"Which of these ingredients is rich in umami?","Molho de soja":"Soy sauce","Limão":"Lemon","Açúcar":"Sugar","Malagueta":"Chilli","Ganhas uma pista: onde há umami, um tinto tânico tende a parecer mais amargo e áspero.":"You earn a hint: where there's umami, a tannic red tends to seem more bitter and harsh.","O molho de soja, tal como os cogumelos, o queijo curado ou o presunto, tem glutamato natural, associado ao gosto umami. Mas também tem muito sal, que pode compensar parte do efeito.":"Soy sauce, like mushrooms, aged cheese or cured ham, contains natural glutamate, linked to umami taste. But it is also very salty, which can offset part of the effect.","Antes de escolher, vê se o prato tem umami e se tem sal ou acidez para o equilibrar.":"Before choosing, check whether the dish has umami and whether it has salt or acidity to balance it.","Cogumelos salteados, sem sal, e um tinto jovem e muito tânico. O que tende a acontecer?":"Sautéed mushrooms, unsalted, and a young, very tannic red. What tends to happen?","O vinho parece mais amargo e áspero":"The wine seems more bitter and harsh","O vinho parece mais frutado":"The wine seems fruitier","Amargor e taninos ficam mais duros; a fruta recua.":"Bitterness and tannins get harder; the fruit recedes.","É o efeito que se observa em prova com o umami. Sem sal nem acidez no prato, nada o compensa.":"It's the effect observed in tasting with umami. With no salt or acidity in the dish, nothing offsets it.","Tempera os cogumelos com sal e um toque de limão, ou escolhe um tinto com menos tanino e mais fruta.":"Season the mushrooms with salt and a touch of lemon, or choose a red with less tannin and more fruit.","Seitan estufado com molho de cogumelos, quase sem sal, e um branco seco e leve. O amargor do vinho vai parecer…":"Seitan braised in mushroom sauce, barely salted, and a light, dry white. The wine's bitterness will seem…","O branco pode ficar com um final amargo.":"The white may end up with a bitter finish.","Cogumelos e seitan trazem umami; sem sal no prato a compensar, o amargor do vinho tende a notar-se mais.":"Mushrooms and seitan bring umami; with no salt in the dish to offset it, the wine's bitterness tends to show more.","Com pratos ricos em umami, um branco com mais fruta e textura, ou um rosé, tende a resistir melhor; um pouco de sal no prato também ajuda.":"With umami-rich dishes, a white with more fruit and texture, or a rosé, tends to hold up better; a little salt in the dish also helps.","Os mesmos cogumelos, agora com flor de sal e limão, e o mesmo tinto tânico. Os taninos vão parecer…":"The same mushrooms, now with flor de sal and lemon, and the same tannic red. The tannins will seem…","↑ Mais ásperos do que antes":"↑ Harsher than before","↓ Mais macios do que antes":"↓ Smoother than before","O vinho fica mais macio do que com os cogumelos sem tempero.":"The wine is smoother than with the unseasoned mushrooms.","Os cogumelos e o vinho são os mesmos; o sal tende a reduzir o amargor, e sal e acidez tendem a contrariar os efeitos do umami.":"The mushrooms and the wine are the same; salt tends to reduce bitterness, and salt and acidity tend to counter umami's effects.","Às vezes a melhor harmonização faz-se no tempero do prato, não na troca de vinho.":"Sometimes the best pairing happens in the seasoning, not by swapping the wine.","Arroz de cogumelos, rico em umami e pouco salgado, e um tinto com 15% de álcool. O calor do álcool vai parecer…":"Mushroom rice, rich in umami and lightly salted, and a red at 15% alcohol. The heat of the alcohol will seem…","O vinho pode parecer quente e pesado.":"The wine may seem hot and heavy.","Com pratos muito ricos em umami, vinhos de álcool moderado e pouco tânicos são escolhas mais seguras.":"With very umami-rich dishes, wines with moderate alcohol and little tannin are safer choices.","Gordura e Picante":"Fat and Chilli Heat","Gordura":"Fat","Gordura amacia o tanino":"Fat softens tannin","Azeite, queijo, enchidos e fritos tendem a amaciar os taninos. Acidez viva ou bolha deixam a boca limpa entre garfadas. \"Cortar a gordura\" é uma imagem: muda a sensação, não o prato.":"Olive oil, cheese, cured sausages and fried food tend to soften tannins. Lively acidity or bubbles leave the mouth clean between bites. \"Cutting through fat\" is a figure of speech: it changes the sensation, not the dish.","Leitão da Bairrada e um tinto de Baga, de taninos firmes. O que tende a acontecer aos taninos?":"Leitão da Bairrada (roast suckling pig) and a Baga red with firm tannins. What tends to happen to the tannins?","Parecem mais macios":"They seem softer","Parecem mais ásperos":"They seem harsher","Desaparecem do vinho":"They vanish from the wine","Ficam iguais":"They stay the same","O tinto parece mais suave.":"The red seems smoother.","Adstringência e sensação de gordura puxam em sentidos opostos; estudos de perceção mostram que alternar as duas tende a equilibrá-las. O sal do leitão também ajuda.":"Astringency and the feeling of fat pull in opposite directions; perception studies show that alternating the two tends to balance them. The salt in the leitão also helps.","Pratos gordos, como o leitão, aceitam tintos de taninos firmes. Na Bairrada, o espumante é o outro par clássico.":"Fatty dishes such as leitão can take reds with firm tannins. In Bairrada, sparkling wine is the other classic match.","Peixinhos da horta (feijão-verde em polme, frito) e um espumante da Bairrada. Porque é que esta dupla costuma agradar?":"Peixinhos da horta (battered, fried green beans) and a Bairrada sparkling wine. Why does this duo usually go down well?","A acidez e a bolha deixam sensação de limpeza depois do frito":"Acidity and bubbles leave a clean feeling after fried food","O espumante dissolve a gordura":"Sparkling wine dissolves fat","A bolha tira as calorias":"Bubbles remove the calories","O espumante tem gordura própria":"Sparkling wine has its own fat","A boca fica mais fresca entre garfadas.":"The mouth feels fresher between bites.","A acidez faz salivar e a bolha dá frescura. Não há prova de que o vinho dissolva a gordura.":"Acidity makes you salivate and bubbles bring freshness. There's no evidence that wine dissolves fat.","Com fritos, pensa em espumante, Vinho Verde ou brancos de acidez alta.":"With fried food, think sparkling wine, Vinho Verde or high-acid whites.","Seitan panado e frito e um branco de acidez baixa, sem bolha. A sensação na boca vai ficar…":"Breaded, fried seitan and a low-acid still white. The feel in the mouth will be…","↑ Mais fresca":"↑ Fresher","↓ Mais pesada":"↓ Heavier","O conjunto pode parecer pesado.":"The combination may feel heavy.","Sem acidez a fazer salivar, nada dá a sensação de limpeza entre garfadas.":"With no acidity to make you salivate, nothing gives that clean feeling between bites.","Com fritos e pratos de muito azeite, escolhe brancos de acidez viva, como um Arinto ou um Alvarinho.":"With fried food and dishes rich in olive oil, choose whites with lively acidity, like an Arinto or an Alvarinho.","Queijo da Serra e um tinto do Dão de Touriga Nacional. A aspereza dos taninos vai parecer…":"Queijo da Serra and a Dão red made from Touriga Nacional. The harshness of the tannins will seem…","Os taninos tendem a parecer mais polidos.":"The tannins tend to seem more polished.","Aqui há dois fatores no mesmo sentido: a gordura tende a suavizar a adstringência e o sal do queijo também ajuda.":"Here two factors pull the same way: fat tends to soften astringency and the cheese's salt also helps.","Queijos gordos e curados são bons parceiros de tintos estruturados.":"Rich, aged cheeses are good partners for structured reds.","Verdadeiro ou falso? Quando se diz que o vinho \"corta a gordura\", o que muda é a sensação na boca, não a gordura do prato.":"True or false? When people say wine \"cuts through fat\", what changes is the feel in the mouth, not the fat in the dish.","A sensação de peso e de gordura na boca.":"The feeling of weight and fat in the mouth.","Acidez e bolha refrescam; nenhuma reação no copo tira gordura ao prato.":"Acidity and bubbles refresh; no reaction in the glass removes fat from the dish.","Explica a escolha ao cliente pelo efeito (\"refresca entre garfadas\"), não por química inventada.":"Explain the choice to the guest by its effect (\"refreshes between bites\"), not by made-up chemistry.","Picante":"Chilli heat","Malagueta + álcool = ardor":"Chilli + alcohol = burn","Picante é a malagueta (piri-piri); cominhos ou canela dão sobretudo aroma. Com malagueta, o álcool tende a arder mais e os taninos notam-se mais. Álcool moderado e um toque de doçura acalmam. Varia de pessoa para pessoa.":"Heat comes from chilli (piri-piri); cumin or cinnamon mainly bring aroma. With chilli, alcohol tends to burn more and tannins show more. Moderate alcohol and a touch of sweetness calm things down. It varies from person to person.","Qual destes ingredientes traz ardor, e não apenas aroma?":"Which of these ingredients brings heat, not just aroma?","Cominhos":"Cumin","Canela":"Cinnamon","Coentros":"Coriander","Com piri-piri, o vinho pode parecer mais quente.":"With piri-piri, the wine may seem hotter.","A capsaicina provoca uma sensação de ardor; cominhos, canela e coentros perfumam sem esse efeito.":"Capsaicin causes a burning sensation; cumin, cinnamon and coriander add fragrance without that effect.","Antes de escolher, pergunta: isto arde ou só perfuma?":"Before choosing, ask: does it burn, or just add aroma?","Porque é que um tinto com muito álcool pode arder mais com piri-piri?":"Why can a high-alcohol red burn more with piri-piri?","A capsaicina e o álcool ativam o mesmo sensor de ardor na boca":"Capsaicin and alcohol trigger the same heat sensor in the mouth","O piri-piri aumenta o álcool do vinho":"Piri-piri raises the wine's alcohol","O álcool torna o prato mais picante":"Alcohol makes the dish spicier","É só impressão: não acontece":"Just an impression: it doesn't happen","O ardor soma-se.":"The burn adds up.","A capsaicina ativa um recetor de calor e dor (TRPV1); o álcool torna esse recetor mais sensível. O vinho tem o mesmo álcool; tu tendes a senti-lo mais. A sensibilidade varia de pessoa para pessoa.":"Capsaicin activates a heat and pain receptor (TRPV1); alcohol makes that receptor more sensitive. The wine has the same alcohol; you tend to feel it more. Sensitivity varies from person to person.","Com pratos picantes, prefere vinhos de álcool moderado.":"With spicy dishes, go for wines with moderate alcohol.","Frango de churrasco com piri-piri e um tinto do Alentejo com 15% de álcool. O ardor vai parecer…":"Piri-piri grilled chicken and an Alentejo red at 15% alcohol. The burn will seem…","O vinho parece quente, e o prato também.":"The wine seems hot, and so does the dish.","Álcool alto e capsaicina tendem a somar-se no mesmo sensor.":"High alcohol and capsaicin tend to add up on the same sensor.","Guarda os tintos potentes para pratos sem malagueta.":"Save powerful reds for dishes without chilli.","Tofu salteado com piri-piri e um Vinho Verde leve, de álcool baixo e meio-seco. O ardor vai parecer…":"Stir-fried tofu with piri-piri and a light, low-alcohol, medium-dry Vinho Verde. The burn will seem…","O conjunto fica mais confortável.":"The pairing feels more comfortable.","Aqui há dois fatores no mesmo sentido: menos álcool soma menos ardor, e o açúcar tende a atenuar a sensação da capsaicina.":"Here two factors pull the same way: less alcohol means less burn, and sugar tends to soften the capsaicin sensation.","Com picante, brancos leves com um toque de doçura e rosés frutados são escolhas seguras.":"With chilli heat, light whites with a touch of sweetness and fruity rosés are safe choices.","Carne de porco à alentejana, temperada com massa de pimentão e cominhos, sem malagueta, e um tinto do Alentejo. O ardor do álcool vai parecer…":"Carne de porco à alentejana, seasoned with massa de pimentão and cumin, no chilli, and an Alentejo red. The alcohol burn will seem…","↑ Muito mais evidente":"↑ Much more noticeable","Praticamente igual":"Practically the same","Pouco; as especiarias dão aroma, não ardor.":"Barely; the spices bring aroma, not burn.","A massa de pimentão (de pimento doce) e os cominhos não trazem o ardor da malagueta.":"Massa de pimentão (sweet red pepper paste) and cumin don't bring chilli's burn.","Não é preciso fugir do tinto só porque o prato tem especiarias. O que pede cuidado é o picante.":"No need to avoid red just because the dish has spices. It's chilli heat that calls for care.","{3} perguntas · no jogo final abre depois d{4}{5}":"{3} questions · in the final game, opens after {4}{5}","Provar":"Taste","Rondas à mesa · em teste":"Table rounds · in testing","Antes de escolher vinhos, descobre como o prato muda o que sentes no copo.":"Before choosing wines, discover how a dish changes what you sense in the glass.","À mesa {5} ·":"Service {5} ·","Passo {2} de {3}":"Step {2} of {3}","Percebi. Testa-me":"Got it. Test me","Compreender":"Understand","Prever":"Predict","vf prever":"vf prever","O que muda":"What changes","Porquê":"Why","Como usar":"How to use it","Ver o resultado":"See the result","Serviço perfeito!":"Perfect service!","{1} em {2}: previste todos os efeitos de {3}. Leva estas pistas para a próxima refeição e confirma-as no copo.":"{1} out of {2}: you predicted every effect of {3}. Take these hints to your next meal and check them in the glass.","Bem servido!":"Well served!","{1} em {2}. Boa leitura de {3}. Revê as pistas abaixo e vai à mesa perfeita.":"{1} out of {2}. A good read of {3}. Review the hints below and go for the perfect table.","Quero a mesa perfeita":"I want the perfect table","A mesa está a compor-se":"The table is coming together","{1} em {2}. Já reconheces parte dos efeitos de {3}. Mais uma ronda ajuda a consolidar.":"{1} out of {2}. You already spot some of the effects of {3}. One more round helps lock them in.","Vamos rever a mesa":"Let's review the table","{1} em {2}. Estes efeitos pedem prática. Relê as pistas ho parece mais amargo e os taninos mais ásperos.":"The wine seems more bitter and the tannins harsher.","O amargor dos grelos junta-se ao do vinho: dois amargos seguidos tendem a reforçar-se.":"The bitterness of the grelos (turnip tops) adds to the wine's: two bitter things in a row tend to reinforce each other.","Com grelos, escolhe um tinto com fruta e pouco tanino, ou um branco com corpo.":"With grelos, pick a fruity red with little tannin, or a full-bodied white.","O sal tende a atenuar o amargor na boca, e a aspereza dos taninos também tende a parecer menor.":"Salt tends to soften bitterness in the mouth, and tannin harshness also tends to seem lower.","O umami tende a fazer o álcool parecer mais quente na boca.":"Umami tends to make the alcohol feel hotter in the mouth.","Fase {1} · {2}: abre quando chegares ao Vintage da Uva":"Phase {1} · {2}: opens when you reach Vintage in The Grape","Mesa":"Table","Serviço":"Service","Histórias e ícones":"Stories and icons","O vinho do Porto, o Douro e outras histórias":"Port wine, the Douro and other stories","Portugal no Mundo":"Portugal in the World","Os vinhos portugueses que ficaram famosos lá fora":"The Portuguese wines that became famous abroad","+ Serviço {1}":"+ Service {1}","As bases":"The basics","Portugal, região a região":"Portugal, region by region","O que a uva dá ao copo":"What the grape brings to the glass","Porque o mesmo vinho muda de sítio e de ano":"Why the same wine changes with place and year","Como se faz e porque sabe assim":"How it's made and why it tastes that way","Alvarinho, Loureiro e frescura atlântica":"Alvarinho, Loureiro and Atlantic freshness","Vinhas de altitude no interior norte":"High-altitude vineyards in the inland north","Socalcos de xisto e Vinho do Porto":"Schist terraces and Port wine","Espumantes de altitude":"High-altitude sparkling wines","Baga e espumante":"Baga and sparkling wine","Granito, Touriga Nacional e Encruzado":"Granite, Touriga Nacional and Encruzado","Vinhas altas ":"Back to the cellar","Refazer":"Redo","As perguntas que falhaste. Acerta e saem da lista; erra e voltam.":"The questions you missed. Get them right and they leave the list; miss them and they come back.","Nada para refazer. Quando errares uma pergunta, ela fica guardada aqui para a desforra.":"Nothing to redo. When you miss a question, it's kept here for your revenge.","dia seguido":"day in a row","dias seguidos":"days in a row","perguntas acertadas":"questions right","Por começar":"Not started","O que já sabes":"What you already know","Supera o primeiro nível e o resumo do que aprendeste fica aqui.":"Clear the first level and a summary of what you've learnt will appear here.","O teu nome":"Your name","Sair agora?":"Leave now?","Perdes o que fizeste nesta ronda.":"You'll lose what you've done this round.","Continuar a jogar":"Keep playing","Sair":"Leave","⏱ O copo esvazia: responde antes de acabar e ganhas +5 kg.":"⏱ The glass is emptying: answer before it runs out and get +5 kg.","Perdeste um bago. Tens 3 por ronda: ao terceiro erro, vira vinagre.":"You've lost a grape. You have 3 per round: on the third mistake, it turns to vinegar.","‹ Voltar":"‹ Back","Avançar ›":"Skip ›","Modo de teste: a ronda continua.":"Test mode: the round goes on.","Em modo de teste não desces: ficas no {1}. As que falhaste voltam na próxima ronda.":"In test mode you don't drop a level: you stay at {1}. The ones you missed come back next round.","Nas rondas e nas mesas, Voltar refaz uma resposta e Avançar salta uma pergunta. O vinagre não acaba a ronda nem te faz descer de nível.":"In rounds and at the tables, Back redoes an answer and Skip jumps a question. Vinegar doesn't end the round or drop your level.","Para refazer · {1}":"To redo · {1}","Modo de autora ligado neste aparelho.":"Author mode on for this device.","Modo de autora desligado neste aparelho.":"Author mode off for this device.","Vira vinagre: a ronda acaba, mas não desces de nível":"It turns to vinegar: the round ends, but you don't drop a level","Falhaste uma? No fim da ronda podes rever logo os erros, sem pontos nem bagos. E ela volta numa das rondas seguintes desse nível (até três por ronda), para te dares a desforra.":"Missed one? At the end of the round you can review your mistakes straight away, with no points or grapes at stake. It also comes back in one of the next rounds at that level (up to three per round), so you can get your revenge.","Percurso curto":"Short route","Uma ronda da Uva, o Serviço 1 e a revisão dos erros, com o resultado no fim.":"One Grape round, Service 1 and a review of your mistakes, with your result at the end.","Fazer o percurso curto":"Take the short route","O progresso fica guardado neste navegador e neste dispositivo.":"Your progress is saved in this browser, on this device.","Para rever as perguntas de cada nível, e as três mesas sem ter de lá chegar. {1} perguntas no total, {2} por ronda.":"To review the questions at each level, and all three tables without having to get there. {1} questions in total, {2} per round.","Modo de autora, só neste aparelho. Para o desligar, toca 5 vezes seguidas no nome Grape to Know.":"Author mode, on this device only. To turn it off, tap the Grape to Know name 5 times in a row.","Nas rondas e nas mesas, Voltar refaz uma resposta e Avançar salta uma pergunta. O vinagre não acaba a ronda.":"In rounds and at the tables, Back redoes an answer and Next skips a question. Vinegar doesn't end the round.","Três erros acabam a ronda, mas não te tiram o nível: ficas no {1}. Revê os erros e volta a tentar.":"Three mistakes end the round, but they don't cost you your level: you stay at {1}. Review your mistakes and try again.","O teu nível sobe com as boas rondas e não desce":"Your level goes up with good rounds and never goes down","Sair da revisão":"Leave the review","Revisão · sem pontos nem bagos":"Review · no points, no grapes","Certa, desta vez.":"Right, this time.","Ainda não. Guarda a ideia:":"Not yet. Keep the idea:","Terminar a revisão":"Finish the review","Na revisão, acertaste {1} de {2}.":"In the review, you got {1} of {2} right.","Três passos para começar":"Three steps to start","Uma ronda sobre a uva, uma mesa sobre sal e acidez e, se errares alguma, uma revisão rápida. No fim, vês o que praticaste.":"A round on the grape, a table on salt and acidity and, if you miss any, a quick review. At the end, you see what you practised.","Ronda da Uva":"Grape round","{1} perguntas · cerca de 4 min":"{1} questions · about 4 min","{1} lições e {2} perguntas · cerca de 6 min":"{1} lessons and {2} questions · about 6 min","Rever os erros":"Review your mistakes","Só se errares · sem pontos nem bagos":"Only if you miss any · no points, no grapes","Os tempos são uma estimativa. Podes sair a qualquer momento.":"Times are an estimate. You can leave at any moment.","Percurso curto · passo {1} de 3":"Short route · step {1} of 3","Ronda feita: {1} de {2}":"Round done: {1} of {2}","A seguir, a mesa: como o sal e a acidez do prato mudam o que sentes no copo.":"Next, the table: how salt and acidity in the dish change what you taste in the glass.","Terminar por agora":"Stop for now","Serviço feito: {1} de {2}":"Service done: {1} of {2}","Tens 1 erro para rever: a pergunta, as alternativas baralhadas e a explicação. Sem pontos nem bagos.":"You have 1 mistake to review: the question, the options shuffled and the explanation. No points, no grapes.","Tens {1} erros para rever: as perguntas, as alternativas baralhadas e a explicação. Sem pontos nem bagos.":"You have {1} mistakes to review: the questions, the options shuffled and the explanation. No points, no grapes.","Saltar para o resultado":"Skip to the result","Percurso curto · resultado":"Short route · result","Bom começo":"A good start","Primeira prova feita":"First tasting done","{1} de {2} certas na ronda e na mesa.":"{1} of {2} right in the round and at the table.","Uma ronda não prova domínio: mostra por onde continuar.":"One round doesn't prove  Nacional). Pensa só no sal: a fruta do vinho vai parecer…":"Salted roasted almonds and a young, firm Douro red (Touriga Nacional). Think only about the salt: the wine's fruit will seem…","Um tinto jovem e firme tende a mostrar-se mais simpático com um petisco salgado.":"A young, firm red tends to show a friendlier side with a salty snack.","Salada de tomate com vinagre e, a seguir, um Arinto de Bucelas, de acidez alta. O que tende a acontecer à acidez do vinho?":"Tomato salad with vinegar, followed by a high-acid Arinto from Bucelas. What tends to happen to the wine's acidity?","Vinhos de acidez alta tendem a aguentar pratos ácidos sem ficar apagados; um Arinto é um exemplo.":"High-acid wines tend to stand up to acidic dishes without fading; an Arinto is one example.","Com pratos ácidos, procura acidez pelo menos igual à do prato; um Vinho Verde ou um espumante são exemplos.":"With acidic dishes, look for acidity at least equal to the dish's; a Vinho Verde or a sparkling wine are examples.","Salada de polvo com vinagre e coentros e um Vinho Verde Loureiro, de acidez viva. A fruta do vinho vai parecer…":"Octopus salad with vinegar and coriander, and a crisp Loureiro Vinho Verde. The wine's fruit will seem…","Um vinho de acidez viva tende a acompanhar bem pratos temperados com vinagre ou limão.":"A wine with lively acidity tends to go well with dishes dressed with vinegar or lemon.","Para arroz de tomate, procura acidez alta, num rosé fresco ou num tinto; um Baga da Bairrada é um exemplo de tinto ácido.":"For arroz de tomate, look for high acidity, in a fresh rosé or a red; a Baga from Bairrada is one example of a high-acid red.","Com marmelada, procura um vinho pelo menos tão doce como ela; um Porto Tawny é um exemplo.":"With marmelada, look for a wine at least as sweet as it is; a Tawny Port is one example.","Para sobremesas, procura doçura igual ou maior; um Moscatel de Setúbal ou um Porto são exemplos.":"For desserts, look for equal or greater sweetness; a Moscatel de Setúbal or a Port are examples.","Para sobremesas, procura bolha com alguma doçura, como um espumante meio-seco ou doce, em vez de um Bruto Natural.":"For desserts, look for bubbles with some sweetness, such as a medium-dry or sweet sparkling wine, rather than a Brut Nature.","Para pratos com algum doce, procura um branco de fruta madura e mais corpo; um Encruzado do Dão pode ser um exemplo.":"For dishes with some sweetness, look for a white with riper fruit and more body; an Encruzado from the Dão can be one example.","Grelos, rúcula, chocolate negro ou café tendem a somar-se ao amargor do vinho, e um tinto tânico fica mais áspero. Fruta, pouco tanino ou um toque de doçura tendem a suavizar.":"Grelos (turnip tops), rocket, dark chocolate or coffee tend to add to the wine's bitterness, and a tannic red gets harsher. Fruit, low tannin or a touch of sweetness tend to soften it.","Com chocolate negro, procura um vinho doce, de fruta intensa; um Porto Ruby ou LBV é um exemplo.":"With dark chocolate, look for a sweet wine with intense fruit; a Ruby or LBV Port is one example.","Com pratos muito ricos em umami, vinhos de álcool moderado e pouco tânicos tendem a resultar melhor.":"With very umami-rich dishes, wines with moderate alcohol and little tannin tend to work better.","Pratos gordos, como o leitão, tendem a aceitar tintos de taninos firmes, como um Baga. Na Bairrada, o espumante é o outro par clássico.":"Fatty dishes such as leitão tend to take reds with firm tannins, like a Baga. In Bairrada, sparkling wine is the other classic match.","Com fritos, procura acidez alta ou bolha; um espumante ou um Vinho Verde são exemplos.":"With fried food, look for high acidity or bubbles; a sparkling wine or a Vinho Verde are examples.","Com fritos e pratos de muito azeite, procura brancos de acidez viva; um Arinto ou um Alvarinho podem ser exemplos.":"With fried food and dishes rich in olive oil, look for whites with lively acidity; an Arinto or an Alvarinho can be examples.","Queijo da Serra e um tinto do Dão de taninos firmes (Touriga Nacional). A aspereza dos taninos vai parecer…":"Queijo da Serra and a firm-tannined Dão red (Touriga Nacional). The harshness of the tannins will seem…","Queijos gordos e curados tendem a ir bem com tintos firmes, como um do Dão.":"Rich, aged cheeses tend to suit firm reds, such as one from the Dão.","Picante é a malagueta (piri-piri); cominhos ou canela dão sobretudo aroma. Com malagueta, o álcool tende a arder mais e os taninos notam-se mais. Álcool moderado e um toque de doçura tendem a acalmar. Varia de pessoa para pessoa.":"Heat comes from chilli (piri-piri); cumin or cinnamon mainly bring aroma. With chilli, alcohol tends to burn more and tannins show more. Moderate alcohol and a touch of sweetness tend to calm things down. It varies from person to person.","Com pratos picantes, prefere álcool moderado; um Vinho Verde leve é um exemplo.":"With spicy dishes, go for moderate alcohol; a light Vinho Verde is one example.","Frango de churrasco bem picante, com piri-piri, e um tinto do Alentejo com 15% de álcool. O ardor vai parecer…":"Fiery piri-piri grilled chicken and an Alentejo red at 15% alcohol. The burn will seem…","Guarda os tintos de álcool alto e muito tanino para pratos sem malagueta.":"Save high-alcohol, very tannic reds for dishes without chilli.","Tofu salteado com piri-piri (picante médio) e um Vinho Verde leve, de álcool baixo e meio-seco. O ardor vai parecer…":"Stir-fried tofu with piri-piri (medium heat) and a light, low-alcohol, medium-dry Vinho Verde. The burn will seem…","Com picante, procura álcool baixo e um toque de doçura; um Vinho Verde meio-seco ou um rosé frutado são exemplos.":"With chilli heat, look for low alcohol and a touch of sweetness; a medium-dry Vinho Verde or a fruity rosé are examples.","Toca no desenho ou escolhe pelo nome · {1}":"Tap the drawing or choose by name · {1}","Perceber as diferenças":"Telling them apart","Doçura, fruta e adstringência são diferentes":"Sweetness, fruit and astringency are different things","Um tinto seco tem aromas intensos de ameixa madura. Estas características são compatíveis?":"A dry red has intense aromas of ripe plum. Do these traits go together?","Sim: um vinho seco pode ser muito frutado":"Yes: a dry wine can be very fruity","Não: fruta madura significa sempre açúcar elevado":"No: ripe fruit always means high sugar","Apenas se o vinho tiver estagiado em barrica":"Only if the wine has been aged in barrel","Apenas se o vinho tiver pouco álcool":"Only if the wine is low in alcohol","“Frutado” descreve o perfil aromático. Um vinho pode lembrar ameixa madura e ter pouco açúcar residual.":"“Fruity” describes the aroma profile. A wine can remind you of ripe plum and still have little residual sugar.","Provas um tinto e sentes as gengivas ásperas, como se houvesse mais atrito. Como se chama essa sensação?":"You taste a red and your gums feel rough, as if there were more friction. What is that sensation called?","Adstringência":"Astringency","Corpo":"Body","A adstringência é uma sensação de secura e atrito. Os taninos podem provocá-la ao interagir com componentes da saliva. Não indica quanto açúcar tem o vinho.":"Astringency is a feeling of dryness and friction. Tannins can cause it by interacting with components of saliva. It doesn't tell you how much sugar the wine has.","Um branco cheira a pêssego. O que podes concluir apenas pelo aroma?":"A white smells of peach. What can you tell from the aroma alone?","É um vinho doce":"It's a sweet wine","É um vinho meio seco":"It's an off-dry wine","Tem pouco álcool":"It's low in alcohol","Tem uma nota frutada, mas ainda não sabes se é doce":"It has a fruity note, but you don't know yet if it's sweet","Reconhecer uma fruta no aroma não permite determinar a doçura. O mesmo tipo de aroma pode aparecer em vinhos secos e doces.":"Recognising a fruit in the aroma doesn't tell you how sweet the wine is. The same kind of aroma can turn up in dry and sweet wines.","Dois tintos são secos. Um é macio; o outro deixa a boca áspera. Como se explica?":"Two reds are both dry. One is smooth; the other leaves your mouth rough. How come?","O vinho macio tem necessariamente mais açúcar":"The smooth one must have more sugar","Podem ter pouca doçura e diferentes níveis de adstringência":"Both can have little sweetness and different levels of astringency","O vinho áspero tem necessariamente mais álcool":"The rough one must have more alcohol","Um deles foi classificado de forma errada":"One of them was classified wrongly","Doçura e adstringência são características diferentes. Um vinho seco pode ter taninos suaves ou provocar uma sensação de aspereza mais marcada.":"Sweetness and astringency are different traits. A dry wine can have soft tannins or give a more marked rough feeling.","Entender o pedido":"Understanding the request","Pergunta pela sensação antes de escolher":"Ask about the sensation before you choose","“Já distingues as sensações. Agora falta perceber quais delas o cliente procura.”":"“You can tell the sensations apart. Now work out which ones the guest is looking for.”","Um cliente pede “um tinto docinho, mas não Porto”. Qual é o melhor primeiro passo?":"A guest asks for “a red that's a bit sweet, but not Port”. What's the best first step?","Escolher o tinto mais frutado":"Pick the fruitiest red","Recomendar um tinto com mais álcool":"Recommend a red with more alcohol","Perguntar se procura alguma doçura ou um vinho macio e frutado":"Ask whether they want some sweetness or a smooth, fruity wine","Escolher um tinto com bastante madeira":"Pick a red with plenty of oak","“Docinho” pode referir-se a açúcar, fruta ou maciez. Ainda não tens informação suficiente para escolher.":"“A bit sweet” can mean sugar, fruit or smoothness. You don't have enough information to choose yet.","“Procura alguma doçura na boca ou um vinho sem doçura, mas macio e frutado?”":"“Are you after some sweetness on the palate, or a wine with no sweetness that's smooth and fruity?”","Uma cliente confirma que quer um branco com doçura percetível. Os brancos tranquilos da carta são todos secos. O que fazes?":"A guest confirms she wants a white with noticeable sweetness. The still whites on your list are all dry. What do you do?","Apresento o branco mais floral como doce":"Present the most floral white as sweet","Escolho o branco com mais álcool":"Pick the white with the most alcohol","Sirvo Porto Branco sem voltar a perguntar":"Serve White Port without asking again","Explico o que temos e vejo com ela se alguma alternativa lhe agrada":"Explain what we have and see with her if an alternative appeals","Um branco aromático não substitui automaticamente um branco doce. Explica a oferta com clareza e deixa a cliente decidir se quer experimentar outro estilo.":"An aromatic white isn't an automatic stand-in for a sweet white. Explain the options clearly and let the guest decide whether to try another style.","“Os nossos brancos tranquilos são secos. Posso mostrar-lhe as outras opções da carta, se quiser.”":"“Our still whites are all dry. I can show you the other options on the list, if you like.”","Um cliente pede um vinho “suave”. Que pergunta esclarece melhor o pedido?":"A guest asks for a “smooth” wine. Which question best clears up the request?","“Prefere um vinho jovem ou mais velho?”":"“Would you prefer a young wine or an older one?”","“Procura alguma doçura ou quer sobretudo evitar a sensação de aspereza?”":"“Are you after some sweetness, or mainly avoiding that rough feeling?”","“Prefere uma região quente?”":"“Would you prefer a warm region?”","“Gosta de vinhos com barrica?”":"“Do you like oaked wines?”","“Suave” pode descrever maciez na conversa e também pode estar associado à doçura, conforme as referências do cliente. Perguntar sobre a sensação evita assumir o significado.":"“Smooth” can describe a soft texture, and for some guests it can also hint at sweetness, depending on what they're used to. Asking about the sensation stops you assuming what they mean.","O cliente esclarece: “Não quero doçura. Gosto de fruta madura, mas não gosto que o vinho agarre nas gengivas.” Qual perfil corresponde melhor?":"The guest explains: “I don't want sweetness. I like ripe fruit, but I don't like it when the wine grips my gums.” Which profile fits best?","Doce e com taninos firmes":"Sweet, with firm tannins","Seco e muito adstringente":"Dry and very astringent","Seco, frutado e com taninos suaves":"Dry, fruity, with soft tannins","Meio doce e pouco aromático":"Medium sweet and not very aromatic","O pedido já está claro: pouca ou nenhuma doçura percetível, fruta madura e pouca adstringência. Procura esse conjunto no vinho, em vez de escolher apenas pela casta.":"The request is clear now: little or no noticeable sweetness, ripe fruit and low astringency. Look for that combination in the wine, rather than choosing by grape variety alone.","Interpretar o contexto":"Reading the context","“Seco” depende da categoria":"“Dry” depends on the category","“No rótulo, a palavra ‘seco’ também precisa de contexto. A categoria do vinho faz diferença.”":"“On the label, the word ‘dry’ needs context too. The wine's category makes a difference.”","Comparas dois espumantes portugueses: um “Bruto” e outro “Extra Seco”. Qual destas categorias corresponde a menos açúcar?":"You're comparing two Portuguese sparkling wines: a “Bruto” (brut) and an “Extra Seco” (extra dry). Which of these categories means less sugar?","Extra Seco":"Extra Seco (extra dry)","Bruto":"Bruto (brut)","São equivalentes":"They're the same","A categoria não dá informação sobre açúcar":"The category says nothing about sugar","Na escala dos espumantes, Bruto corresponde a menos açúcar do que Extra Seco. Não basta comparar o sentido habitual das palavras: é preciso conhecer a categoria.":"On the sparkling wine scale, Bruto (brut) means less sugar than Extra Seco (extra dry). Comparing what the words usually mean isn't enough: you need to know the category.","Um cliente espera que um Porto Branco Seco tenha tão pouco açúcar como um branco tranquilo seco. O que deves explicar?":"A guest expects a dry White Port to have as little sugar as a dry still white. What should you explain?","“Seco” significa sempre a mesma quantidade de açúcar":"“Dry” always means the same amount of sugar","O Porto Branco Seco não tem açúcar":"Dry White Port has no sugar","O Porto só se torna seco com o envelhecimento":"Port only becomes dry with age","As duas categorias usam critérios diferentes para a indicação “seco”":"The two categories use different criteria for the word “dry”","Um Porto classificado como seco pode ter bastante mais açúcar do que um branco tranquilo seco. A mesma palavra não corresponde aos mesmos limites nestas categorias.":"A Port classified as dry can have a good deal more sugar than a dry still white. The same word doesn't mean the same limits in these categories.","“Este Porto é seco dentro da classificação dos Portos, mas pode sentir mais doçura do que num branco tranquilo seco.”":"“This Port is dry by Port standards, but you may notice more sweetness than in a dry still white.”","Um branco tem algum açúcar residual, mas a doçura parece discreta. Que característica pode contribuir para isso?":"A white has some residual sugar, but the sweetness seems discreet. Which trait can contribute to that?","Uma acidez que torna a doçura menos evidente":"Acidity that makes the sweetness less obvious","Uma cor muito clara":"A very pale colour","A ausência de estágio em madeira":"No time in oak","Uma garrafa mais antiga":"An older bottle","A acidez pode atenuar a doçura percebida. O açúcar continua presente: o que muda é a forma como sentimos o equilíbrio do vinho.":"Acidity can soften the sweetness you perceive. The sugar is still there: what changes is how you feel the wine's balance.","Um cliente prova um vinho seco e diz: “Para mim, parece doce.” Qual é a melhor resposta?":"A guest tastes a dry wine and says: “To me, it tastes sweet.” What's the best reply?","“É seco, por isso não pode sentir doçura.”":"“It's dry, so you can't be tasting sweetness.”","“Então a ficha técnica está errada.”":"“Then the tech sheet must be wrong.”","“O que lhe dá essa impressão: a doçura na boca ou os aromas de fruta madura?”":"“What gives you that impression: sweetness on the palate, or the ripe fruit aromas?”","“Deve ser o álcool; é sempre isso.”":"“It must be the alcohol; it always is.”","A classificação e a experiência de quem prova não são a mesma coisa. Os aromas podem contribuir para uma impressão de doçura. Esclarece a sensação e usa essa informação para ajustar a recomendação.":"The classification and the taster's experience are not the same thing. Aromas can add to an impression of sweetness. Clarify the sensation and use what you learn to fine-tune your recommendation.","Preferes seco ou doce?":"Dry or sweet?","Brancos, tintos, rosés e espumantes podem ter diferentes níveis de doçura. Gostar de um destes estilos é só o começo: ainda há muito por escolher.":"Whites, reds, rosés and sparkling wines can all come with different levels of sweetness. Liking one of these styles is only the start: there's still plenty to choose from.","Comecemos pelo “seco”: o que significa, afinal?":"Let's start with “dry”: what does it actually mean?","O que significa “seco”?":"What does “dry” mean?","Num vinho seco, a doçura é geralmente pouco ou nada percetível. Isso não significa necessariamente zero açúcar.":"In a dry wine, sweetness is usually faint or not noticeable at all. That doesn't necessarily mean zero sugar.","Durante a fermentação, as leveduras transformam os açúcares da uva em álcool. O açúcar que não é consumido contribui para o açúcar residual do vinho.":"During fermentation, yeasts turn the grape's sugars into alcohol. Any sugar they don't use up adds to the wine's residual sugar.","Mas um vinho seco também pode lembrar fruta madura.":"But a dry wine can also remind you of ripe fruit.","Frutado também pode ser seco":"Fruity can be dry too","Pêssego, morango, ameixa… São aromas que podemos reconhecer ao cheirar o vinho e durante o gole.":"Peach, strawberry, plum… These are aromas you can pick up when you smell the wine and as you sip it.","Um vinho muito frutado pode continuar a ser seco. Esses aromas podem sugerir doçura, mas não revelam quanto açúcar tem.":"A very fruity wine can still be dry. Those aromas may suggest sweetness, but they don't reveal how much sugar there is.","E aquela sensação de boca seca? É outra característica.":"And that dry feeling in your mouth? That's another trait altogether.","Quando o vinho seca a boca":"When the wine dries your mouth","A sensação de secura ou aspereza nas gengivas e no interior das bochechas chama-se adstringência. Nos vinhos, está muito associada aos taninos.":"That dry, rough feeling on your gums and inside your cheeks is called astringency. In wine, it's closely linked to tannins.","Um vinho pode ser seco, frutado e macio ao mesmo tempo.":"A wine can be dry, fruity and smooth all at once.","“Agora vamos à sala. Quando alguém pede um vinho ‘seco’ ou ‘docinho’, como descobres o que procura?”":"“Now, to the floor. When someone asks for a ‘dry’ wine or ‘something a bit sweet’, how do you find out what they're after?”","Seco… em que sentido?":"Dry… in what sense?","Serviço de sala":"On the floor","Distingue doçura, aromas frutados e adstringência, e esclarece o pedido do cliente antes de recomendar.":"Tell sweetness, fruity aromas and astringency apart, and clear up the guest's request before you recommend.","{1} em {2}. Seco, frutado e macio podem descrever o mesmo vinho. Na próxima recomendação, começa por perceber que sensação o cliente procura.":"{1} out of {2}. Dry, fruity and smooth can all describe the same wine. Next time you recommend one, start by finding out what sensation the guest is after.","Parte {1} · {2}":"Part {1} · {2}","Vamos experimentar":"Let's try it","Voltar":"Back","Serviço 4":"Service 4","Abre quando concluíres a etapa 3 · Tawny.":"Opens when you complete stage 3 · Tawny.","Para rever as perguntas de cada nível, e as mesas, sem ter de lá chegar. {1} perguntas no total, {2} por ronda.":"To review the questions at each level, and the tables, without having to get there. {1} questions in total, {2} per round.","O limão estraga o vinho e deixa-o com sabor metálico":"Lemon spoils the wine and leaves a metallic taste","O limão aumenta o álcool do vinho e esconde a fruta":"Lemon raises the wine's alcohol and hides the fruit","Os brancos não combinam com limão, só os tintos":"Whites don't go with lemon, only reds do","Vinho o mais seco possível, para cortar o doce":"The driest wine possible, to cut the sweetness","Vinho com muito tanino, para equilibrar o prato":"A very tannic wine, to balance the dish","Vinho com muito álcool, para aquecer a boca":"A high-alcohol wine, to warm the mouth","O espumante dissolve a gordura do frito no estômago":"Sparkling wine dissolves the fat from the fried food","A bolha tira as calorias e torna o frito mais leve":"The bubbles remove calories and make the fry lighter","O espumante tem gordura própria, que combina com a do polme":"Sparkling wine has its own fat, which matches the batter's","O piri-piri aumenta o álcool do vinho que fica na boca":"Piri-piri raises the alcohol of the wine left in the mouth","O álcool apaga o picante, mas deixa o vinho mais amargo":"Alcohol puts out the heat but makes the wine more bitter","É só impressão: o álcool e o picante não se influenciam":"It's just an impression: alcohol and chilli don't interact","É um vinho doce, porque o pêssego é uma fruta doce":"It's a sweet wine, because peach is a sweet fruit","É um vinho meio seco, entre o seco e o doce":"It's a medium-dry wine, between dry and sweet","Tem pouco álcool, como a maioria dos vinhos frutados":"It's low in alcohol, like most fruity wines","O vinho macio tem necessariamente mais açúcar residual":"The smooth wine necessarily has more residual sugar","O vinho áspero tem necessariamente mais álcool e menos fruta":"The rough wine necessarily has more alcohol and less fruit","Um deles foi classificado de forma errada no rótulo":"One of them was wrongly classified on the label","Escolher logo o tinto mais frutado e maduro da carta":"Go straight for the fruitiest, ripest red on the list","Recomendar o tinto com mais álcool da carta":"Recommend the highest-alcohol red on the list","Escolher um tinto com bastante madeira e baunilha":"Choose a red with plenty of oak and vanilla","Apresento o branco mais floral como se fosse doce":"I present the most floral white as if it were sweet","Escolho o branco com mais álcool e digo que é mais doce":"I pick the highest-alcohol white and say it's sweeter","Sirvo um Porto Branco sem voltar a perguntar o que prefere":"I serve a White Port without asking again what they prefer","“Prefere um vinho jovem e fresco ou um mais velho e evoluído?”":"“Do you prefer a young, fresh wine or an older, more developed one?”","“Prefere um vinho de uma região quente, como o Alentejo?”":"“Do you prefer a wine from a warm region, like the Alentejo?”","“Gosta de vinhos que estagiaram em barrica de carvalho?”":"“Do you like wines aged in oak barrels?”","“Seco” significa sempre a mesma quantidade de açúcar, em qualquer vinho":"“Dry” always means the same amount of sugar, in any wine","O Porto Branco Seco não tem açúcar nenhum, tal como o branco seco":"Dry White Port has no sugar at all, just like a dry white","O Porto só se torna seco depois de muitos anos de envelhecimento":"Port only becomes dry after many years of ageing","Uma cor muito clara, que faz o vinho parecer leve":"A very pale colour that makes the wine look light","A ausência de qualquer estágio em madeira":"Having spent no time at all in wood","Uma garrafa mais antiga, já com alguns anos":"An older bottle, already a few years old","“É seco, por isso não pode sentir doçura nenhuma neste vinho.”":"“It's dry, so you can't taste any sweetness in this wine.”","“Então a ficha técnica deve estar errada; vou confirmar com o produtor.”":"“Then the tech sheet must be wrong; I'll check with the producer.”","“Deve ser o álcool; num vinho seco é sempre isso que parece doce.”":"“It must be the alcohol; in a dry wine that's always what seems sweet.”","O limão aumenta o álcool do vinho e esconde toda a fruta que ele tem":"Lemon raises the wine's alcohol and hides all of its fruit","O vinho parece mais leve e com menos álcool":"The wine seems lighter and lower in alcohol","O vinho parece mais doce e mais frutado":"The wine seems sweeter and fruitier","O vinho parece mais frutado e macio":"The wine seems fruitier and smoother","O piri-piri aumenta o teor de álcool do vinho que fica na boca":"Piri-piri raises the alcohol content of the wine left in the mouth","Escolher logo o tinto mais frutado e maduro que houver na carta":"Go straight for the fruitiest, ripest red there is on the list","Sirvo um Porto Branco sem voltar a perguntar o que ela prefere":"I serve a White Port without asking again what she prefers","“Prefere um vinho jovem e fresco ou um vinho mais velho e evoluído?”":"“Do you prefer a young, fresh wine or an older, more developed wine?”","Meio doce, leve e pouco aromático":"Medium-sweet, light and not very aromatic"},"es":{"Em que região de Portugal fica a Denominação de Origem Vinho Verde?":"¿En qué región de Portugal está la Denominación de Origen Vinho Verde?","Minho":"Minho","Alentejo":"Alentejo","Algarve":"Algarve","Dão":"Dão","O Vinho Verde vem do Minho, no noroeste do país. O nome não fala da cor do vinho: há quem o ligue à paisagem verde da região e quem o ligue a vinhos jovens e frescos.":"El Vinho Verde viene del Minho, en el noroeste del país. El nombre no habla del color del vino: hay quien lo relaciona con el paisaje verde de la región y quien lo relaciona con vinos jóvenes y frescos.","Qual é a casta branca estrela de Monção e Melgaço?":"¿Cuál es la variedad blanca estrella de Monção e Melgaço?","Arinto":"Arinto","Alvarinho":"Alvarinho","Encruzado":"Encruzado","Fernão Pires":"Fernão Pires","Monção e Melgaço é a casa do Alvarinho: aromático, com fruta de pomar e uma acidez viva.":"Monção e Melgaço es la casa del Alvarinho: aromático, con fruta de huerto y una acidez viva.","A Touriga Nacional é uma casta…":"La Touriga Nacional es una variedad…","Branca":"Blanca","Rosé":"Rosada","Tinta":"Tinta","De mesa, não de vinho":"De mesa, no de vino","Tinta, e das mais famosas de Portugal. Aromas florais (violeta) e fruta escura. Brilha no Douro e no Dão.":"Tinta, y de las más famosas de Portugal. Aromas florales (violeta) y fruta negra. Brilla en el Douro y en el Dão.","As uvas do Vinho do Porto vêm de que região?":"¿De qué región vienen las uvas del vino de Oporto?","Porto":"Oporto","Vila Nova de Gaia":"Vila Nova de Gaia","Douro":"Douro","Bairrada":"Bairrada","As uvas crescem no Douro. Gaia é onde o vinho tradicionalmente envelhecia nas caves, e daí a confusão.":"Las uvas crecen en el Douro. Gaia es donde tradicionalmente envejecía el vino en las bodegas, y de ahí la confusión.","O Encruzado é a casta branca mais emblemática de qual região?":"¿De qué región es el Encruzado la variedad blanca más emblemática?","Setúbal":"Setúbal","Tejo":"Tejo","Vinhos Verdes":"Vinhos Verdes","O Dão. O Encruzado dá brancos com estrutura e capacidade de guarda.":"El Dão. El Encruzado da blancos con estructura y capacidad de guarda.","A Baga, tinta de taninos firmes e muita acidez, é típica de…":"La Baga, tinta de taninos firmes y mucha acidez, es típica de…","Madeira":"Madeira","A Bairrada. A Baga também dá bons espumantes à região.":"La Bairrada. La Baga también da buenos espumosos en la región.","O vinho de talha, fermentado em grandes jarras de barro, é tradição de…":"El vino de talha, fermentado en grandes tinajas de barro, es tradición de…","Açores":"Açores","O Alentejo, onde a técnica vem desde os romanos e continua viva.":"El Alentejo, donde la técnica viene de los romanos y sigue viva.","Que vinho fortificado português vem de uma ilha do Atlântico?":"¿Qué vino fortificado portugués viene de una isla del Atlántico?","Moscatel de Setúbal":"Moscatel de Setúbal","Carcavelos":"Carcavelos","O Madeira. Aguenta calor e oxigénio como poucos vinhos e, depois de aberto, dura muito mais do que a maioria.":"El Madeira. Aguanta el calor y el oxígeno como pocos vinos y, una vez abierto, dura mucho más que la mayoría.","Bucelas, perto de Lisboa, é famosa pelos brancos de qual casta?":"¿Por los blancos de qué variedad es famosa Bucelas, cerca de Lisboa?","Loureiro":"Loureiro","Antão Vaz":"Antão Vaz","O Arinto, uma casta de acidez alta que mantém o vinho fresco mesmo em anos quentes.":"El Arinto, una variedad de acidez alta que mantiene el vino fresco incluso en años cálidos.","Um vinho \"corked\" (com defeito de rolha) costuma cheirar a…":"Un vino «corked» (con defecto de corcho) suele oler a…","Frutos vermelhos":"Frutos rojos","Cartão molhado ou cave húmida":"Cartón mojado o sótano húmedo","Baunilha":"Vainilla","Flores brancas":"Flores blancas","Cartão molhado ou cave húmida. É o defeito que dá nome ao nosso \"Corked!\". Nesse caso, pede-se outra garrafa.":"Cartón mojado o sótano húmedo. Es el defecto que da nombre a nuestro «Corked!». En ese caso, se pide otra botella.","Oh yeah! That was GRAPE TO KNOW!":"Oh yeah! That was GRAPE TO KNOW!","Grape job!":"Grape job!","Spot on!":"Spot on!","Cheers to that!":"Cheers to that!","Look at you, sommelier!":"Look at you, sommelier!","Corked! Lê a explicação e segue.":"Corked! Lee la explicación y sigue.","Corked! A próxima é tua.":"Corked! La próxima es tuya.","Corked! Next one is yours.":"Corked! Next one is yours.","Rolha em estágio":"Corcho en prácticas","Provador curioso":"Catador curioso","Sommelier de bancada":"Sumiller de sofá","Mestre das castas":"Maestro de variedades","Grape to Know total":"Grape to Know total","style=\"pointer-events:none\"":"style=\"pointer-events:none\"","Um ba idos?","Que parte tem os taninos mais amargos?":"¿Qué parte tiene los taninos más amargos?","Toca na camada cerosa e esbranquiçada.":"Toca la capa cerosa y blanquecina.","E agora: o esqueleto que segura o cacho?":"Y ahora: ¿el esqueleto que sujeta el racimo?","Cor, taninos e aromas":"Color, taninos y aromas","Água, açúcar e ácidos":"Agua, azúcar y ácidos","Taninos amargos e óleos":"Taninos amargos y aceites","O esqueleto do cacho":"El esqueleto del racimo","Camada cerosa e esbranquiçada que cobre o bago":"Capa cerosa y blanquecina que cubre la baya","A pele do bago: cor, taninos e aromas":"La piel de la baya: color, taninos y aromas","Parte suculenta: água, açúcar e ácidos":"La parte jugosa: agua, azúcar y ácidos","O esqueleto do cacho (o Ç escreve-se C)":"El esqueleto del racimo (la Ó se escribe O)","A semente do bago, de taninos amargos":"La semilla de la baya, de taninos amargos","Talhão 1 ·":"Parcela 1 ·","O bago por dentro":"La baya por dentro","kg de uva":"kg de uva","Voltar à vinha":"Volver al viñedo","Progresso":"Progreso","Toca em cada parte do bago e descobre o que faz. Depois, vem o teste.":"Toca cada parte de la baya y descubre qué hace. Después, llega la prueba.","Descobre as 5 partes ({1}/5)":"Descubre las 5 partes ({1}/5)","Já sei, testa-me!":"¡Ya lo sé, ponme a prueba!","Toca no desenho · {1} de {2}":"Toca el dibujo · {1} de {2}","Ver resultado":"Ver resultado","Continuar":"Continuar","Liga as peças":"Une las piezas","Toca numa parte e depois na sua função. Sem errar, ganhas bónus.":"Toca una parte y luego su función. Sin fallos, ganas un extra.","Perfect pairing!":"Perfect pairing!","Sem um único erro: +10 kg de bónus. A lição está feita: o Ruby espera por ti.":"Sin un solo error: +10 kg extra. Lección hecha: el Ruby te espera.","Todas ligadas. A lição está feita: o Ruby espera por ti.":"Todas unidas. Lección hecha: el Ruby te espera.","Terminar a lição":"Terminar la lección","Palavras cruzadas":"Crucigrama","Todas as partes do bago estão aqui. Cons  e voltaste a provar o mesmo vinho. Parece-te diferente. O que mudou?":"Has probado un tinto de la Bairrada, has comido unos altramuces salados y has vuelto a probar el mismo vino. Te parece distinto. ¿Qué ha cambiado?","A tua perceção do vinho":"Tu percepción del vino","A composição do vinho no copo":"La composición del vino en la copa","A cor do vinho":"El color del vino","A quantidade de álcool no vinho":"La cantidad de alcohol del vino","O vinho no copo continua igual; a forma como o sentes pode mudar depois de comeres.":"El vino en la copa sigue igual; la forma en que lo notas puede cambiar después de comer.","O sal, por exemplo, pode fazer o vinho parecer menos amargo e mais macio.":"La sal, por ejemplo, puede hacer que el vino parezca menos amargo y más suave.","Harmonizar começa aqui: perceber como a comida influencia o próximo gole.":"Maridar empieza aquí: entender cómo influye la comida en el siguiente sorbo.","Um tinto de Baga, depois de uns tremoços bem salgados. O que tende a acontecer ao amargor e à aspereza do vinho?":"Un tinto de Baga, después de unos altramuces bien salados. ¿Qué tiende a pasarles al amargor y a la aspereza del vino?","Tendem a diminuir":"Tienden a disminuir","Tendem a aumentar":"Tienden a aumentar","Ficam sempre iguais":"Siempre se quedan igual","O vinho passa a parecer doce":"El vino pasa a parecer dulce","O tinto parece mais macio.":"El tinto parece más suave.","O sal tende a atenuar o amargor na boca, e a aspereza dos taninos também tende a parecer menor.":"La sal tiende a atenuar el amargor en la boca, y la aspereza de los taninos también tiende a parecer menor.","Petiscos salgados aceitam tintos de taninos firmes, como a Baga.":"Los aperitivos salados admiten tintos de taninos firmes, como la Baga.","Sardinhas assadas com sal grosso e um Alvarinho de Monção e Melgaço. Pensa só no sal: a acidez do vinho vai parecer…":"Sardinas asadas con sal gruesa y un Alvarinho de Monção e Melgaço. Piensa solo en la sal: la acidez del vino pa
