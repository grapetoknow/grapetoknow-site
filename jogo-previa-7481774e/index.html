ede ácido":"Ácido pide ácido","Depois de limão, tomate ou vinagre, o vinho tende a parecer menos ácido e mais frutado. Se tiver menos acidez do que o prato, tende a parecer chato. Pista: acidez do vinho pelo menos igual à do prato.":"Después de limón, tomate o vinagre, el vino tiende a parecer menos ácido y más afrutado. Si tiene menos acidez que el plato, tiende a parecer plano. Pista: acidez del vino al menos igual a la del plato.","Salada de tomate com vinagre e, a seguir, um Arinto de Bucelas. O que tende a acontecer à acidez do vinho?":"Ensalada de tomate con vinagre y, a continuación, un Arinto de Bucelas. ¿Qué tiende a pasarle a la acidez del vino?","Parece mais baixa":"Parece más baja","Parece mais alta":"Parece más alta","Desaparece":"Desaparece","Passa a parecer amarga":"Pasa a parecer amarga","O Arinto tende a parecer mais suave e frutado.":"El Arinto tiende a parecer más suave y afrutado.","O paladar adapta-se ao ácido do prato e, a seguir, a mesma acidez do vinho sobressai menos. O vinho não perdeu acidez.":"El paladar se adapta al ácido del plato y, a continuación, la misma acidez del vino destaca menos. El vino no ha perdido acidez.","Vinhos de acidez alta, como o Arinto, aguentam pratos ácidos sem ficar apagados.":"Los vinos de acidez alta, como el Arinto, aguantan platos ácidos sin quedar apagados.","Porque é que um vinho de acidez baixa pode parecer \"chato\" ao lado de seitan grelhado com molho de limão?":"¿Por qué un vino de acidez baja puede parecer «plano» junto a un seitán a la plancha con salsa de limón?","Ao lado do ácido do prato, a pouca acidez do vinho quase não se nota":"Junto al ácido del plato, la poca acidez del vino casi no se nota","O limão estraga o vinho":"El limón estropea el vino","O limão aumenta o álcool do vinho":"El limón aumenta el alcohol del vino","Os brancos não combinam com limão":"Los blancos no combinan con limón","O vinho tende a parecer mole, sem frescura.":"El vino tiende a parecer flojo, sin frescura.","O paladar já se adaptou ao ácido do limão; uma acidez pequena tende a passar despercebida.":"El paladar ya se ha adaptado al ácido del limón; una acidez pequeña tiende a pasar desapercibida.","Com pratos ácidos, procura acidez pelo menos igual: um Vinho Verde, um Arinto, um espumante.":"Con platos ácidos, busca una acidez al menos igual: un Vinho Verde, un Arinto, un espumoso.","Salada de polvo com vinagre e coentros e um Vinho Verde Loureiro. A fruta do vinho vai parecer…":"Ensalada de pulpo con vinagre y cilantro y un Vinho Verde de Loureiro. La fruta del vino parecerá…","O vinho tende a parecer mais frutado e redondo.":"El vino tiende a parecer más afrutado y redondo.","Depois do vinagre, o paladar adapta-se ao ácido: a acidez do vinho nota-se menos e a fruta nota-se mais.":"Después del vinagre, el paladar se adapta al ácido: la acidez del vino se nota menos y la fruta se nota más.","Um vinho de acidez viva acompanha bem pratos temperados com vinagre ou limão.":"Un vino de acidez viva acompaña bien platos aliñados con vinagre o limón.","Arroz de tomate e um tinto maduro, de acidez baixa. Pensa na acidez do tomate: a frescura do vinho vai parecer…":"Arroz de tomate y un tinto maduro, de acidez baja. Piensa en la acidez del tomate: la frescura del vino parecerá…","Falta frescura; o vinho pode parecer pesado.":"Le falta frescura; el vino puede parecer pesado.","Ao lado da acidez do tomate, a pouca acidez do vinho tende a deixar de se notar.":"Junto a la acidez del tomate, la poca acidez del vino tiende a dejar de notarse.","Para arroz de tomate, um tinto com mais acidez, como a Baga, ou um rosé fresco tendem a funcionar melhor.":"Para un arroz de tomate, un tinto con más acidez, como la Baga, o un rosado fresco tienden a funcionar mejor.","Verdadeiro ou falso? Um prato ácido faz o vinho perder acidez.":"¿Verdadero o falso? Un plato ácido hace que el vino pierda acidez.","Só a perceção muda; a acidez do vinho é a mesma.":"Solo cambia la percepción; la acidez del vino es la misma.","É adaptação do paladar, não uma reação química no copo.":"Es adaptación del paladar, no una reacción química en la copa.","Quando um vinho \"muda\" à mesa, a pergunta certa é o que o prato fez à tua boca.":"Cuando un vino «cambia» en la mesa, la pregunta correcta es qué le ha hecho el plato a tu boca.","Doçura, Amargo e Umami":"Dulzor, Amargor y Umami","Doçura":"Dulzor","Doce seca o vinho":"Lo dulce seca el vino","O doce do prato tende a secar o vinho: menos fruta, e mais acidez, amargor e álcool à vista. Pista: o vinho pelo menos tão doce como o prato.":"El dulzor del plato tiende a secar el vino: menos fruta, y más acidez, amargor y alcohol a la vista. Pista: el vino, al menos tan dulce como el plato.","Marmelada e um tinto seco do Douro. O que tende a acontecer?":"Dulce de membrillo y un tinto seco del Douro. ¿Qué tiende a pasar?","O vinho parece mais seco, ácido e amargo":"El vino parece más seco, ácido y amargo","O vinho parece mais doce":"El vino parece más dulce","O vinho parece com menos álcool":"El vino parece tener menos alcohol","Nada muda":"No cambia nada","A fruta apaga-se e sobressaem acidez, amargor e álcool.":"La fruta se apaga y destacan la acidez, el amargor y el alcohol.","O paladar habitua-se ao doce e deixa de sentir a pouca doçura do vinho; e o doce, que costuma disfarçar o ácido e o amargo, deixa de fazer esse papel.":"El paladar se acostumbra al dulce y deja de notar el poco dulzor del vino; y el dulzor, que suele disimular lo ácido y lo amargo, deja de cumplir ese papel.","Com marmelada, procura um vinho com pelo menos a mesma doçura, como um Porto Tawny.":"Con dulce de membrillo, busca un vino con al menos el mismo dulzor, como un Oporto Tawny.","Para arroz doce, que pista ajuda mais a escolher o vinho?":"Para un arroz doce (el arroz con leche portugués), ¿qué pista ayuda más a elegir el vino?","Vinho pelo menos tão doce como a sobremesa":"Vino al menos tan dulce como el postre","Vinho o mais seco possível":"Vino lo más seco posible","Vinho com muito tanino":"Vino con mucho tanino","Vinho com muito álcool":"Vino con mucho alcohol","Com um vinho mais seco do que a sobremesa, o vinho parece magro e ácido.":"Con un vino más seco que el postre, el vino parece delgado y ácido.","É a mesma adaptação ao doce; só um vinho com doçura suficiente mantém a fruta à mesa.":"Es la misma adaptación al dulce; solo un vino con dulzor suficiente mantiene la fruta en la mesa.","Moscatel de Setúbal, Porto ou Madeira doce são pontos de partida seguros para sobremesas.":"Moscatel de Setúbal, Oporto o Madeira dulce son puntos de partida seguros para los postres.","Pão de ló e um espumante Bruto Natural (quase sem açúcar). A acidez do espumante vai parecer…":"Pão de ló (bizcocho tradicional) y un espumoso Brut Nature (casi sin azúcar). La acidez del espumoso parecerá…","O espumante tende a parecer mais agressivo e magro.":"El espumoso tiende a parecer más agresivo y delgado.","O doce do pão de ló tira protagonismo à pouca doçura do vinho e deixa a acidez à vista.":"El dulzor del pão de ló le quita protagonismo al poco dulzor del vino y deja la acidez a la vista.","Para sobremesas, um espumante meio-seco ou doce, ou um Moscatel, tende a resultar melhor do que um Bruto Natural.":"Para postres, un espumoso semiseco o dulce, o un Moscatel, tiende a funcionar mejor que un Brut Nature.","Tofu salteado com cebola caramelizada (um doce ligeiro) e um branco seco e muito leve. A fruta do vinho vai parecer…":"Tofu salteado con cebolla caramelizada (un dulzor ligero) y un blanco seco y muy ligero. La fruta del vino parecerá…","O branco pode parecer diluído.":"El blanco puede parecer diluido.","Mesmo um doce ligeiro pode reduzir a sensação de doçura e fruta do vinho.":"Incluso un dulzor ligero puede reducir la sensación de dulzor y de fruta del vino.","Um branco com fruta madura e mais corpo, como um Encruzado do Dão, aguenta melhor pratos com algum doce.":"Un blanco con fruta madura y más cuerpo, como un Encruzado del Dão, aguanta mejor platos con algo de dulzor.","Bolo de mel da Madeira e um Madeira Malvasia, doce. O vinho vai parecer mais seco do que é?":"Bolo de mel de Madeira (pastel de miel de caña) y un Madeira Malvasia, dulce. ¿El vino parecerá más seco de lo que es?","Sim, muito":"Sí, mucho","Pouco ou nada":"Poco o nada","O vinho mantém a fruta e o equilíbrio.":"El vino mantiene la fruta y el equilibrio.","Com doçura igual ou maior do que a do prato, a adaptação ao doce não chega a apagar o vinho.":"Con un dulzor igual o mayor que el del plato, la adaptación al dulce no llega a apagar el vino.","Este é o raciocínio para qualquer sobremesa: compara a doçura do prato com a do vinho.":"Este es el razonamiento para cualquier postre: compara el dulzor del plato con el del vino.","Amargo":"Amargor","Amargo soma amargo":"Amargo suma amargo","Grelos, rúcula, chocolate negro ou café tendem a somar-se ao amargor do vinho, e um tinto tânico fica mais áspero. Fruta, pouco tanino ou um toque de doçura suavizam.":"Grelos, rúcula, chocolate negro o café tienden a sumarse al amargor del vino, y un tinto tánico se vuelve más áspero. La fruta, el poco tanino o un toque de dulzor suavizan.","Grelos salteados com alho, quase sem sal, e um tinto jovem e tânico do Douro. O que tende a acontecer?":"Grelos salteados con ajo, casi sin sal, y un tinto joven y tánico del Douro. ¿Qué tiende a pasar?","O vinho parece mais amargo":"El vino parece más amargo","O amargor dos grelos desaparece":"El amargor de los grelos desaparece","O amargor do vinho vem mais à frente e os taninos parecem mais duros.":"El amargor del vino pasa a primer plano y los taninos parecen más duros.","Em qual destes pratos o amargo é a característica principal?":"¿En cuál de estos platos es el amargor la característica principal?","Salada de rúcula e endívia":"Ensalada de rúcula y endibia","Arroz doce":"Arroz doce","Sardinhas assadas":"Sardinas asadas","Tremoços":"Altramuces","Com rúcula e endívia, o amargor do vinho tende a notar-se mais.":"Con rúcula y endibia, el amargor del vino tiende a notarse más.","São folhas naturalmente amargas; o arroz doce é doce, as sardinhas são gordas e salgadas, os tremoços são salgados.":"Son hojas amargas por naturaleza; el arroz doce es dulce, las sardinas son grasas y saladas, los altramuces son salados.","Identificar a característica dominante do prato é o primeiro passo de qualquer escolha.":"Identificar la característica dominante del plato es el primer paso de cualquier elección.","Chocolate negro e um tinto seco e tânico. O amargor do vinho vai parecer…":"Chocolate negro y un tinto seco y tánico. El amargor del vino parecerá…","O vinho pode parecer amargo e seco.":"El vino puede parecer amargo y seco.","Aqui há dois fatores no mesmo sentido: o amargo do chocolate soma-se ao do vinho, e o doce tende a secar o vinho.":"Aquí hay dos factores en el mismo sentido: el amargor del chocolate se suma al del vino, y el dulzor tiende a secar el vino.","Com chocolate negro, um vinho doce e com fruta, como um Porto Ruby ou LBV, tende a resultar melhor.":"Con chocolate negro, un vino dulce y con fruta, como un Oporto Ruby o LBV, tiende a funcionar mejor.","Os mesmos grelos, agora bem temperados com flor de sal, e o mesmo tinto. Em comparação com antes, o amargor do vinho vai parecer…":"Los mismos grelos, ahora bien sazonados con flor de sal, y el mismo tinto. En comparación con antes, el amargor del vino parecerá…","O vinho tende a parecer mais macio.":"El vino tiende a parecer más suave.","Os grelos são os mesmos; só mudou o sal, que tende a atenuar a perceção do amargor.":"Los grelos son los mismos; solo ha cambiado la sal, que tiende a atenuar la percepción del amargor.","Corrigir o tempero também é harmonizar.":"Ajustar la sazón también es maridar.","Verdadeiro ou falso? Um prato amargo tende a tornar mais macio um tinto tânico.":"¿Verdadero o falso? Un plato amargo tiende a suavizar un tinto tánico.","O contrário: o tinto tende a parecer mais amargo e áspero.":"Al contrario: el tinto tiende a parecer más amargo y áspero.","O amargor do prato e o do vinho tendem a somar-se.":"El amargor del plato y el del vino tienden a sumarse.","Para pratos amargos, guarda os tintos mais tânicos para outra ocasião.":"Para platos amargos, guarda los tintos más tánicos para otra ocasión.","Umami":"Umami","Umami endurece o tinto":"El umami endurece el tinto","Qual destes ingredientes é rico em umami?":"¿Cuál de estos ingredientes es rico en umami?","Molho de soja":"Salsa de soja","Limão":"Limón","Açúcar":"Azúcar","Malagueta":"Guindilla","Ganhas uma pista: onde há umami, um tinto tânico tende a parecer mais amargo e áspero.":"Ganas una pista: donde hay umami, un tinto tánico tiende a parecer más amargo y áspero.","O molho de soja, tal como os cogumelos, o queijo curado ou o presunto, tem glutamato natural, associado ao gosto umami. Mas também tem muito sal, que pode compensar parte do efeito.":"La salsa de soja, como las setas, el queso curado o el jamón curado, tiene glutamato natural, asociado al gusto umami. Pero también tiene mucha sal, que puede compensar parte del efecto.","Antes de escolher, vê se o prato tem umami e se tem sal ou acidez para o equilibrar.":"Antes de elegir, mira si el plato tiene umami y si tiene sal o acidez para equilibrarlo.","Cogumelos salteados, sem sal, e um tinto jovem e muito tânico. O que tende a acontecer?":"Setas salteadas, sin sal, y un tinto joven y muy tánico. ¿Qué tiende a pasar?","O vinho parece mais amargo e áspero":"El vino parece más amargo y áspero","O vinho parece mais frutado":"El vino parece más afrutado","Amargor e taninos ficam mais duros; a fruta recua.":"El amargor y los taninos se endurecen; la fruta retrocede.","É o efeito que se observa em prova com o umami. Sem sal nem acidez no prato, nada o compensa.":"Es el efecto que se observa en la cata con el umami. Sin sal ni acidez en el plato, nada lo compensa.","Tempera os cogumelos com sal e um toque de limão, ou escolhe um tinto com menos tanino e mais fruta.":"Sazona las setas con sal y un toque de limón, o elige un tinto con menos tanino y más fruta.","Seitan estufado com molho de cogumelos, quase sem sal, e um branco seco e leve. O amargor do vinho vai parecer…":"Seitán guisado con salsa de setas, casi sin sal, y un blanco seco y ligero. El amargor del vino parecerá…","O branco pode ficar com um final amargo.":"El blanco puede quedarse con un final amargo.","Cogumelos e seitan trazem umami; sem sal no prato a compensar, o amargor do vinho tende a notar-se mais.":"Las setas y el seitán aportan umami; sin sal en el plato que lo compense, el amargor del vino tiende a notarse más.","Com pratos ricos em umami, um branco com mais fruta e textura, ou um rosé, tende a resistir melhor; um pouco de sal no prato também ajuda.":"Con platos ricos en umami, un blanco con más fruta y textura, o un rosado, tiende a resistir mejor; un poco de sal en el plato también ayuda.","Os mesmos cogumelos, agora com flor de sal e limão, e o mesmo tinto tânico. Os taninos vão parecer…":"Las mismas setas, ahora con flor de sal y limón, y el mismo tinto tánico. Los taninos parecerán…","↑ Mais ásperos do que antes":"↑ Más ásperos que antes","↓ Mais macios do que antes":"↓ Más suaves que antes","O vinho fica mais macio do que com os cogumelos sem tempero.":"El vino resulta más suave que con las setas sin sazonar.","Os cogumelos e o vinho são os mesmos; o sal tende a reduzir o amargor, e sal e acidez tendem a contrariar os efeitos do umami.":"Las setas y el vino son los mismos; la sal tiende a reducir el amargor, y la sal y la acidez tienden a contrarrestar los efectos del umami.","Às vezes a melhor harmonização faz-se no tempero do prato, não na troca de vinho.":"A veces el mejor maridaje está en la sazón del plato, no en cambiar de vino.","Arroz de cogumelos, rico em umami e pouco salgado, e um tinto com 15% de álcool. O calor do álcool vai parecer…":"Arroz con setas, rico en umami y poco salado, y un tinto con 15% de alcohol. El calor del alcohol parecerá…","O vinho pode parecer quente e pesado.":"El vino puede parecer cálido y pesado.","O umami tende a fazer o álcool parecer mais quente na boca.":"El umami tiende a hacer que el alcohol parezca más cálido en la boca.","Com pratos muito ricos em umami, vinhos de álcool moderado e pouco tânicos são escolhas mais seguras.":"Con platos muy ricos en umami, los vinos de alcohol moderado y poco tánicos son elecciones más seguras.","Gordura e Picante":"Grasa y Picante","Gordura":"Grasa","Gordura amacia o tanino":"La grasa suaviza el tanino","Azeite, queijo, enchidos e fritos tendem a amaciar os taninos. Acidez viva ou bolha deixam a boca limpa entre garfadas. \"Cortar a gordura\" é uma imagem: muda a sensação, não o prato.":"El aceite de oliva, el queso, los embutidos y los fritos tienden a suavizar los taninos. Una acidez viva o la burbuja dejan la boca limpia entre bocado y bocado. «Cortar la grasa» es una imagen: cambia la sensación, no el plato.","Leitão da Bairrada e um tinto de Baga, de taninos firmes. O que tende a acontecer aos taninos?":"Leitão da Bairrada (cochinillo asado) y un tinto de Baga, de taninos firmes. ¿Qué tiende a pasarles a los taninos?","Parecem mais macios":"Parecen más suaves","Parecem mais ásperos":"Parecen más ásperos","Desaparecem do vinho":"Desaparecen del vino","Ficam iguais":"Se quedan igual","O tinto parece mais suave.":"El tinto parece más suave.","Adstringência e sensação de gordura puxam em sentidos opostos; estudos de perceção mostram que alternar as duas tende a equilibrá-las. O sal do leitão também ajuda.":"La astringencia y la sensación grasa tiran en sentidos opuestos; los estudios de percepción muestran que alternar ambas tiende a equilibrarlas. La sal del leitão también ayuda.","Pratos gordos, como o leitão, aceitam tintos de taninos firmes. Na Bairrada, o espumante é o outro par clássico.":"Los platos grasos, como el leitão, admiten tintos de taninos firmes. En la Bairrada, el espumoso es la otra pareja clásica.","Peixinhos da horta (feijão-verde em polme, frito) e um espumante da Bairrada. Porque é que esta dupla costuma agradar?":"Peixinhos da horta (judías verdes rebozadas y fritas) y un espumoso de la Bairrada. ¿Por qué suele gustar esta pareja?","A acidez e a bolha deixam sensação de limpeza depois do frito":"La acidez y la burbuja dejan sensación de limpieza después del frito","O espumante dissolve a gordura":"El espumoso disuelve la grasa","A bolha tira as calorias":"La burbuja quita las calorías","O espumante tem gordura própria":"El espumoso tiene grasa propia","A boca fica mais fresca entre garfadas.":"La boca queda más fresca entre bocado y bocado.","A acidez faz salivar e a bolha dá frescura. Não há prova de que o vinho dissolva a gordura.":"La acidez hace salivar y la burbuja aporta frescura. No hay pruebas de que el vino disuelva la grasa.","Com fritos, pensa em espumante, Vinho Verde ou brancos de acidez alta.":"Con fritos, piensa en espumoso, Vinho Verde o blancos de acidez alta.","Seitan panado e frito e um branco de acidez baixa, sem bolha. A sensação na boca vai ficar…":"Seitán rebozado y frito y un blanco de acidez baja, sin burbuja. La sensación en boca será…","↑ Mais fresca":"↑ Más fresca","↓ Mais pesada":"↓ Más pesada","O conjunto pode parecer pesado.":"El conjunto puede parecer pesado.","Sem acidez a fazer salivar, nada dá a sensação de limpeza entre garfadas.":"Sin acidez que haga salivar, nada da sensación de limpieza entre bocado y bocado.","Com fritos e pratos de muito azeite, escolhe brancos de acidez viva, como um Arinto ou um Alvarinho.":"Con fritos y platos con mucho aceite de oliva, elige blancos de acidez viva, como un Arinto o un Alvarinho.","Queijo da Serra e um tinto do Dão de Touriga Nacional. A aspereza dos taninos vai parecer…":"Queijo da Serra y un tinto del Dão de Touriga Nacional. La aspereza de los taninos parecerá…","Os taninos tendem a parecer mais polidos.":"Los taninos tienden a parecer más pulidos.","Aqui há dois fatores no mesmo sentido: a gordura tende a suavizar a adstringência e o sal do queijo também ajuda.":"Aquí hay dos factores en el mismo sentido: la grasa tiende a suavizar la astringencia y la sal del queso también ayuda.","Queijos gordos e curados são bons parceiros de tintos estruturados.":"Los quesos grasos y curados son buenos compañeros de los tintos estructurados.","Verdadeiro ou falso? Quando se diz que o vinho \"corta a gordura\", o que muda é a sensação na boca, não a gordura do prato.":"¿Verdadero o falso? Cuando se dice que el vino «corta la grasa», lo que cambia es la sensación en boca, no la grasa del plato.","A sensação de peso e de gordura na boca.":"La sensación de peso y de grasa en boca.","Acidez e bolha refrescam; nenhuma reação no copo tira gordura ao prato.":"La acidez y la burbuja refrescan; ninguna reacción en la copa le quita grasa al plato.","Explica a escolha ao cliente pelo efeito (\"refresca entre garfadas\"), não por química inventada.":"Explica la elección al cliente por el efecto («refresca entre bocado y bocado»), no con química inventada.","Picante":"Picante","Malagueta + álcool = ardor":"Guindilla + alcohol = ardor","Picante é a malagueta (piri-piri); cominhos ou canela dão sobretudo aroma. Com malagueta, o álcool tende a arder mais e os taninos notam-se mais. Álcool moderado e um toque de doçura acalmam. Varia de pessoa para pessoa.":"El picante es la guindilla (piri-piri); el comino o la canela aportan sobre todo aroma. Con guindilla, el alcohol tiende a quemar más y los taninos se notan más. Un alcohol moderado y un toque de dulzor lo calman. Varía de una persona a otra.","Qual destes ingredientes traz ardor, e não apenas aroma?":"¿Cuál de estos ingredientes aporta ardor, y no solo aroma?","Cominhos":"Comino","Canela":"Canela","Coentros":"Cilantro","Com piri-piri, o vinho pode parecer mais quente.":"Con piri-piri, el vino puede parecer más cálido.","A capsaicina provoca uma sensação de ardor; cominhos, canela e coentros perfumam sem esse efeito.":"La capsaicina provoca una sensación de ardor; el comino, la canela y el cilantro perfuman sin ese efecto.","Antes de escolher, pergunta: isto arde ou só perfuma?":"Antes de elegir, pregúntate: ¿esto pica o solo perfuma?","Porque é que um tinto com muito álcool pode arder mais com piri-piri?":"¿Por qué un tinto con mucho alcohol puede quemar más con piri-piri?","A capsaicina e o álcool ativam o mesmo sensor de ardor na boca":"La capsaicina y el alcohol activan el mismo sensor de ardor en la boca","O piri-piri aumenta o álcool do vinho":"El piri-piri aumenta el alcohol del vino","O álcool torna o prato mais picante":"El alcohol hace el plato más picante","É só impressão: não acontece":"Es solo una impresión: no ocurre","O ardor soma-se.":"El ardor se suma.","A capsaicina ativa um recetor de calor e dor (TRPV1); o álcool torna esse recetor mais sensível. O vinho tem o mesmo álcool; tu tendes a senti-lo mais. A sensibilidade varia de pessoa para pessoa.":"La capsaicina activa un receptor de calor y dolor (TRPV1); el alcohol hace ese receptor más sensible. El vino tiene el mismo alcohol; tú tiendes a notarlo más. La sensibilidad varía de una persona a otra.","Com pratos picantes, prefere vinhos de álcool moderado.":"Con platos picantes, mejor vinos de alcohol moderado.","Frango de churrasco com piri-piri e um tinto do Alentejo com 15% de álcool. O ardor vai parecer…":"Pollo asado con piri-piri y un tinto del Alentejo con 15% de alcohol. El ardor parecerá…","O vinho parece quente, e o prato também.":"El vino parece cálido, y el plato también.","Álcool alto e capsaicina tendem a somar-se no mesmo sensor.":"El alcohol alto y la capsaicina tienden a sumarse en el mismo sensor.","Guarda os tintos potentes para pratos sem malagueta.":"Guarda los tintos potentes para platos sin guindilla.","Tofu salteado com piri-piri e um Vinho Verde leve, de álcool baixo e meio-seco. O ardor vai parecer…":"Tofu salteado con piri-piri y un Vinho Verde ligero, de alcohol bajo y semiseco. El ardor parecerá…","O conjunto fica mais confortável.":"El conjunto resulta más llevadero.","Aqui há dois fatores no mesmo sentido: menos álcool soma menos ardor, e o açúcar tende a atenuar a sensação da capsaicina.":"Aquí hay dos factores en el mismo sentido: menos alcohol suma menos ardor, y el azúcar tiende a atenuar la sensación de la capsaicina.","Com picante, brancos leves com um toque de doçura e rosés frutados são escolhas seguras.":"Con picante, los blancos ligeros con un toque de dulzor y los rosados afrutados son elecciones seguras.","Carne de porco à alentejana, temperada com massa de pimentão e cominhos, sem malagueta, e um tinto do Alentejo. O ardor do álcool vai parecer…":"Carne de porco à alentejana, sazonada con massa de pimentão (pasta de pimiento) y comino, sin guindilla, y un tinto del Alentejo. El ardor del alcohol parecerá…","↑ Muito mais evidente":"↑ Mucho más evidente","Praticamente igual":"Prácticamente igual","Pouco; as especiarias dão aroma, não ardor.":"Poco; las especias dan aroma, no ardor.","A massa de pimentão (de pimento doce) e os cominhos não trazem o ardor da malagueta.":"La massa de pimentão (de pimiento dulce) y el comino no aportan el ardor de la guindilla.","Não é preciso fugir do tinto só porque o prato tem especiarias. O que pede cuidado é o picante.":"No hace falta huir del tinto solo porque el plato lleve especias. Lo que pide cuidado es el picante.","{3} perguntas · no jogo final abre depois d{4}{5}":"{3} preguntas · en el juego final se abre tras {4}{5}","Provar":"Probar","Rondas à mesa · em teste":"Rondas en la mesa · en pruebas","Antes de escolher vinhos, descobre como o prato muda o que sentes no copo.":"Antes de elegir vinos, descubre cómo el plato cambia lo que notas en la copa.","À mesa {5} ·":"Servicio {5} ·","Passo {2} de {3}":"Paso {2} de {3}","Percebi. Testa-me":"Entendido. Ponme a prueba","Compreender":"Comprender","Prever":"Predecir","vf prever":"vf prever","O que muda":"Qué cambia","Porquê":"Por qué","Com da que repetir. Cuando falles una pregunta, se guarda aquí para la revancha.","dia seguido":"día seguido","dias seguidos":"días seguidos","perguntas acertadas":"preguntas acertadas","Por começar":"Por empezar","O que já sabes":"Lo que ya sabes","Supera o primeiro nível e o resumo do que aprendeste fica aqui.":"Supera el primer nivel y aquí aparecerá el resumen de lo que has aprendido.","O teu nome":"Tu nombre","Sair agora?":"¿Salir ahora?","Perdes o que fizeste nesta ronda.":"Perderás lo que has hecho en esta ronda.","Continuar a jogar":"Seguir jugando","Sair":"Salir","⏱ O copo esvazia: responde antes de acabar e ganhas +5 kg.":"⏱ La copa se vacía: responde antes de que se acabe y ganas +5 kg.","Perdeste um bago. Tens 3 por ronda: ao terceiro erro, vira vinagre.":"Has perdido una uva. Tienes 3 por ronda: al tercer error, se vuelve vinagre.","‹ Voltar":"‹ Volver","Avançar ›":"Avanzar ›","Modo de teste: a ronda continua.":"Modo de prueba: la ronda sigue.","Em modo de teste não desces: ficas no {1}. As que falhaste voltam na próxima ronda.":"En modo de prueba no bajas: te quedas en {1}. Las que has fallado vuelven en la próxima ronda.","Nas rondas e nas mesas, Voltar refaz uma resposta e Avançar salta uma pergunta. O vinagre não acaba a ronda nem te faz descer de nível.":"En las rondas y en las mesas, Volver rehace una respuesta y Avanzar salta una pregunta. El vinagre no acaba la ronda ni te hace bajar de nivel.","Para refazer · {1}":"Para repetir · {1}","Modo de autora ligado neste aparelho.":"Modo de autora activado en este dispositivo.","Modo de autora desligado neste aparelho.":"Modo de autora desactivado en este dispositivo.","Vira vinagre: a ronda acaba, mas não desces de nível":"Se avinagra: la ronda acaba, pero no bajas de nivel","Falhaste uma? No fim da ronda podes rever logo os erros, sem pontos nem bagos. E ela volta numa das rondas seguintes desse nível (até três por ronda), para te dares a desforra.":"¿Fallaste una? Al final de la ronda puedes repasar los s próximas rondas de ese nivel.","Obrigado por provares.":"Gracias por catar.","Quando voltares, a vinha está onde a deixaste.":"Cuando vuelvas, la viña estará donde la dejaste.","Rever os erros desta mesa":"Repasar los errores de esta mesa","Rever outra vez":"Repasar otra vez","Rever os erros desta ronda":"Repasar los errores de esta ronda","Situações de sala":"Situaciones de sala","Aprende sobre vinho a jogar: perguntas curtas e situações de sala, com a explicação logo a seguir a cada resposta.":"Aprende sobre vino jugando: preguntas cortas y situaciones de sala, con la explicación justo después de cada respuesta.","Percurso curto: cerca de 10 minutos (estimativa)":"Recorrido corto: unos 10 minutos (estimación)","Cerca de {1} min (estimativa)":"Unos {1} min (estimación)","Saber mais":"Saber más","Ou escolhe pelo nome":"O elige por el nombre","Toca no desenho ou escolhe pelo nome":"Toca el dibujo o elige por el nombre","Serviço {1} · {2}":"Servicio {1} · {2}","Muito velho, e ainda a evoluir.":"Muy viejo, y aún evolucionando.","Um tinto de Baga, jovem e tânico, depois de uns tremoços bem salgados. O que tende a acontecer ao amargor e à aspereza do vinho?":"Un tinto de Baga, joven y tánico, después de unos altramuces bien salados. ¿Qué tiende a pasarles al amargor y a la aspereza del vino?","Petiscos salgados tendem a aceitar tintos de taninos firmes; um Baga jovem é um exemplo.":"Los aperitivos salados tienden a admitir tintos de taninos firmes; un Baga joven es un ejemplo.","Sardinhas assadas com sal grosso e um Alvarinho de acidez viva, de Monção e Melgaço. Pensa só no sal: a acidez do vinho vai parecer…":"Sardinas asadas con sal gruesa y un Alvarinho de acidez viva, de Monção e Melgaço. Piensa solo en la sal: la acidez del vino parecerá…","Amêndoas torradas com sal e um tinto jovem e firme do Douro (Touriga Nacional). Pensa só no sal: a fruta do vinho vai parecer…":"Almendras tostadas con sal y un tinto joven y firme del Douro (Touriga Nacional). Piensa solo en la sal: la fruta del vino parecerá…","Um tinto jovem e firme tende a mostrar-se mais simpático com um petisco salgado.":"Un tinto joven y firme tiende a mostrarse más amable con un aperitivo salado.","Salada de tomate com vinagre e, a seguir, um Arinto de Bucelas, de acidez alta. O que tende a acontecer à acidez do vinho?":"Ensalada de tomate con vinagre y, a continuación, un Arinto de Bucelas, de acidez alta. ¿Qué tiende a pasarle a la acidez del vino?","Vinhos de acidez alta tendem a aguentar pratos ácidos sem ficar apagados; um Arinto é um exemplo.":"Los vinos de acidez alta tienden a aguantar platos ácidos sin quedar apagados; un Arinto es un ejemplo.","Com pratos ácidos, procura acidez pelo menos igual à do prato; um Vinho Verde ou um espumante são exemplos.":"Con platos ácidos, busca una acidez al menos igual a la del plato; un Vinho Verde o un espumoso son ejemplos.","Salada de polvo com vinagre e coentros e um Vinho Verde Loureiro, de acidez viva. A fruta do vinho vai parecer…":"Ensalada de pulpo con vinagre y cilantro y un Vinho Verde de Loureiro, de acidez viva. La fruta del vino parecerá…","Um vinho de acidez viva tende a acompanhar bem pratos temperados com vinagre ou limão.":"Un vino de acidez viva tiende a acompañar bien platos aliñados con vinagre o limón.","Para arroz de tomate, procura acidez alta, num rosé fresco ou num tinto; um Baga da Bairrada é um exemplo de tinto ácido.":"Para un arroz de tomate, busca acidez alta, en un rosado fresco o en un tinto; un Baga de la Bairrada es un ejemplo de tinto ácido.","Com marmelada, procura um vinho pelo menos tão doce como ela; um Porto Tawny é um exemplo.":"Con dulce de membrillo, busca un vino al menos tan dulce como él; un Oporto Tawny es un ejemplo.","Para sobremesas, procura doçura igual ou maior; um Moscatel de Setúbal ou um Porto são exemplos.":"Para postres, busca un dulzor igual o mayor; un Moscatel de Setúbal o un Oporto son ejemplos.","Para sobremesas, procura bolha com alguma doçura, como um espumante meio-seco ou doce, em vez de um Bruto Natural.":"Para postres, busca burbuja con algo de dulzor, como un espumoso semiseco o dulce, en lugar de un Brut Nature.","Para pratos com algum doce, procura um branco de fruta madura e mais corpo; um Encruzado do Dão pode ser um exemplo.":"Para platos con algo de dulzor, busca un blanco de fruta madura y más cuerpo; un Encruzado del Dão puede ser un ejemplo.","Grelos, rúcula, chocolate negro ou café tendem a somar-se ao amargor do vinho, e um tinto tânico fica mais áspero. Fruta, pouco tanino ou um toque de doçura tendem a suavizar.":"Grelos, rúcula, chocolate negro o café tienden a sumarse al amargor del vino, y un tinto tánico se vuelve más áspero. La fruta, el poco tanino o un toque de dulzor tienden a suavizarlo.","Com chocolate negro, procura um vinho doce, de fruta intensa; um Porto Ruby ou LBV é um exemplo.":"Con chocolate negro, busca un vino dulce, de fruta intensa; un Oporto Ruby o LBV es un ejemplo.","Com pratos muito ricos em umami, vinhos de álcool moderado e pouco tânicos tendem a resultar melhor.":"Con platos muy ricos en umami, los vinos de alcohol moderado y poco tánicos tienden a funcionar mejor.","Pratos gordos, como o leitão, tendem a aceitar tintos de taninos firmes, como um Baga. Na Bairrada, o espumante é o outro par clássico.":"Los platos grasos, como el leitão, tienden a admitir tintos de taninos firmes, como un Baga. En la Bairrada, el espumoso es la otra pareja clásica.","Com fritos, procura acidez alta ou bolha; um espumante ou um Vinho Verde são exemplos.":"Con fritos, busca acidez alta o burbuja; un espumoso o un Vinho Verde son ejemplos.","Com fritos e pratos de muito azeite, procura brancos de acidez viva; um Arinto ou um Alvarinho podem ser exemplos.":"Con fritos y platos con mucho aceite de oliva, busca blancos de acidez viva; un Arinto o un Alvarinho pueden ser ejemplos.","Queijo da Serra e um tinto do Dão de taninos firmes (Touriga Nacional). A aspereza dos taninos vai parecer…":"Queijo da Serra y un tinto del Dão de taninos firmes (Touriga Nacional). La aspereza de los taninos parecerá…","Queijos gordos e curados tendem a ir bem com tintos firmes, como um do Dão.":"Los quesos grasos y curados suelen ir bien con tintos firmes, como uno del Dão.","Picante é a malagueta (piri-piri); cominhos ou canela dão sobretudo aroma. Com malagueta, o álcool tende a arder mais e os taninos notam-se mais. Álcool moderado e um toque de doçura tendem a acalmar. Varia de pessoa para pessoa.":"El picante es la guindilla (piri-piri); el comino o la canela aportan sobre todo aroma. Con guindilla, el alcohol tiende a quemar más y los taninos se notan más. Un alcohol moderado y un toque de dulzor tienden a calmarlo. Varía de una persona a otra.","Com pratos picantes, prefere álcool moderado; um Vinho Verde leve é um exemplo.":"Con platos picantes, mejor un alcohol moderado; un Vinho Verde ligero es un ejemplo.","Frango de churrasco bem picante, com piri-piri, e um tinto do Alentejo com 15% de álcool. O ardor vai parecer…":"Pollo asado bien picante, con piri-piri, y un tinto del Alentejo con 15% de alcohol. El ardor parecerá…","Guarda os tintos de álcool alto e muito tanino para pratos sem malagueta.":"Guarda los tintos de alcohol alto y mucho tanino para platos sin guindilla.","Tofu salteado com piri-piri (picante médio) e um Vinho Verde leve, de álcool baixo e meio-seco. O ardor vai parecer…":"Tofu salteado con piri-piri (picante medio) y un Vinho Verde ligero, de alcohol bajo y semiseco. El ardor parecerá…","Com picante, procura álcool baixo e um toque de doçura; um Vinho Verde meio-seco ou um rosé frutado são exemplos.":"Con picante, busca alcohol bajo y un toque de dulzor; un Vinho Verde semiseco o un rosado afrutado son ejemplos.","Toca no desenho ou escolhe pelo nome · {1}":"Toca el dibujo o elige por el nombre · {1}","Perceber as diferenças":"Entender las diferencias","Doçura, fruta e adstringência são diferentes":"Dulzor, fruta y astringencia son cosas distintas","Um tinto seco tem aromas intensos de ameixa madura. Estas características são compatíveis?":"Un tinto seco tiene aromas intensos de ciruela madura. ¿Son compatibles estas características?","Sim: um vinho seco pode ser muito frutado":"Sí: un vino seco puede ser muy afrutado","Não: fruta madura significa sempre açúcar elevado":"No: la fruta madura siempre significa mucho azúcar","Apenas se o vinho tiver estagiado em barrica":"Solo si el vino ha pasado por barrica","Apenas se o vinho tiver pouco álcool":"Solo si el vino tiene poco alcohol","“Frutado” descreve o perfil aromático. Um vinho pode lembrar ameixa madura e ter pouco açúcar residual.":"“Afrutado” describe el perfil aromático. Un vino puede recordar a ciruela madura y tener poco azúcar residual.","Provas um tinto e sentes as gengivas ásperas, como se houvesse mais atrito. Como se chama essa sensação?":"Pruebas un tinto y notas las encías ásperas, como si hubiera más fricción. ¿Cómo se llama esa sensación?","Adstringência":"Astringencia","Corpo":"Cuerpo","A adstringência é uma sensação de secura e atrito. Os taninos podem provocá-la ao interagir com componentes da saliva. Não indica quanto açúcar tem o vinho.":"La astringencia es una sensación de sequedad y fricción. Los taninos pueden provocarla al interactuar con componentes de la saliva. No indica cuánto azúcar tiene el vino.","Um branco cheira a pêssego. O que podes concluir apenas pelo aroma?":"Un blanco huele a melocotón. ¿Qué puedes concluir solo por el aroma?","É um vinho doce":"Es un vino dulce","É um vinho meio seco":"Es un vino semiseco","Tem pouco álcool":"Tiene poco alcohol","Tem uma nota frutada, mas ainda não sabes se é doce":"Tiene una nota afrutada, pero aún no sabes si es dulce","Reconhecer uma fruta no aroma não permite determinar a doçura. O mesmo tipo de aroma pode aparecer em vinhos secos e doces.":"Reconocer una fruta en el aroma no permite saber el dulzor. El mismo tipo de aroma puede aparecer en vinos secos y dulces.","Dois tintos são secos. Um é macio; o outro deixa a boca áspera. Como se explica?":"Dos tintos son secos. Uno es suave; el otro deja la boca áspera. ¿Cómo se explica?","O vinho macio tem necessariamente mais açúcar":"El suave tiene necesariamente más azúcar","Podem ter pouca doçura e diferentes níveis de adstringência":"Pueden tener poco dulzor y distintos niveles de astringencia","O vinho áspero tem necessariamente mais álcool":"El áspero tiene necesariamente más alcohol","Um deles foi classificado de forma errada":"Uno de ellos está mal clasificado","Doçura e adstringência são características diferentes. Um vinho seco pode ter taninos suaves ou provocar uma sensação de aspereza mais marcada.":"El dulzor y la astringencia son características distintas. Un vino seco puede tener taninos suaves o dar una aspereza más marcada.","Entender o pedido":"Entender el pedido","Pergunta pela sensação antes de escolher":"Pregunta por la sensación antes de elegir","“Já distingues as sensações. Agora falta perceber quais delas o cliente procura.”":"“Ya distingues las sensaciones. Ahora falta entender cuáles busca el cliente.”","Um cliente pede “um tinto docinho, mas não Porto”. Qual é o melhor primeiro passo?":"Un cliente pide “un tinto dulcecito, pero que no sea Oporto”. ¿Cuál es el mejor primer paso?","Escolher o tinto mais frutado":"Elegir el tinto más afrutado","Recomendar um tinto com mais álcool":"Recomendar un tinto con más alcohol","Perguntar se procura alguma doçura ou um vinho macio e frutado":"Preguntar si busca algo de dulzor o un vino suave y afrutado","Escolher um tinto com bastante madeira":"Elegir un tinto con bastante madera","“Docinho” pode referir-se a açúcar, fruta ou maciez. Ainda não tens informação suficiente para escolher.":"“Dulcecito” puede referirse a azúcar, fruta o suavidad. Todavía no tienes información suficiente para elegir.","“Procura alguma doçura na boca ou um vinho sem doçura, mas macio e frutado?”":"“¿Busca algo de dulzor en boca o un vino sin dulzor, pero suave y afrutado?”","Uma cliente confirma que quer um branco com doçura percetível. Os brancos tranquilos da carta são todos secos. O que fazes?":"Una clienta confirma que quiere un blanco con dulzor perceptible. Los blancos tranquilos de la carta son todos secos. ¿Qué haces?","Apresento o branco mais floral como doce":"Presento el blanco más floral como dulce","Escolho o branco com mais álcool":"Elijo el blanco con más alcohol","Sirvo Porto Branco sem voltar a perguntar":"Sirvo Oporto Blanco sin volver a preguntar","Explico o que temos e vejo com ela se alguma alternativa lhe agrada":"Explico lo que tenemos y veo con ella si alguna alternativa le gusta","Um branco aromático não substitui automaticamente um branco doce. Explica a oferta com clareza e deixa a cliente decidir se quer experimentar outro estilo.":"Un blanco aromático no sustituye automáticamente a un blanco dulce. Explica la oferta con claridad y deja que la clienta decida si quiere probar otro estilo.","“Os nossos brancos tranquilos são secos. Posso mostrar-lhe as outras opções da carta, se quiser.”":"“Nuestros blancos tranquilos son secos. Si quiere, le enseño las otras opciones de la carta.”","Um cliente pede um vinho “suave”. Que pergunta esclarece melhor o pedido?":"Un cliente pide un vino “suave”. ¿Qué pregunta aclara mejor el pedido?","“Prefere um vinho jovem ou mais velho?”":"“¿Prefiere un vino joven o más viejo?”","“Procura alguma doçura ou quer sobretudo evitar a sensação de aspereza?”":"“¿Busca algo de dulzor o quiere sobre todo evitar la sensación de aspereza?”","“Prefere uma região quente?”":"“¿Prefiere una región cálida?”","“Gosta de vinhos com barrica?”":"“¿Le gustan los vinos con barrica?”","“Suave” pode descrever maciez na conversa e também pode estar associado à doçura, conforme as referências do cliente. Perguntar sobre a sensação evita assumir o significado.":"“Suave” puede describir una textura amable y también puede asociarse al dulzor, según las referencias del cliente. Preguntar por la sensación evita dar por hecho el significado.","O cliente esclarece: “Não quero doçura. Gosto de fruta madura, mas não gosto que o vinho agarre nas gengivas.” Qual perfil corresponde melhor?":"El cliente aclara: “No quiero dulzor. Me gusta la fruta madura, pero no que el vino se agarre a las encías.” ¿Qué perfil encaja mejor?","Doce e com taninos firmes":"Dulce y con taninos firmes","Seco e muito adstringente":"Seco y muy astringente","Seco, frutado e com taninos suaves":"Seco, afrutado y con taninos suaves","Meio doce e pouco aromático":"Semidulce y poco aromático","O pedido já está claro: pouca ou nenhuma doçura percetível, fruta madura e pouca adstringência. Procura esse conjunto no vinho, em vez de escolher apenas pela casta.":"El pedido ya está claro: poco o ningún dulzor perceptible, fruta madura y poca astringencia. Busca ese conjunto en el vino, en lugar de elegir solo por la variedad.","Interpretar o contexto":"Interpretar el contexto","“Seco” depende da categoria":"“Seco” depende de la categoría","“No rótulo, a palavra ‘seco’ também precisa de contexto. A categoria do vinho faz diferença.”":"“En la etiqueta, la palabra ‘seco’ también necesita contexto. La categoría del vino marca la diferencia.”","Comparas dois espumantes portugueses: um “Bruto” e outro “Extra Seco”. Qual destas categorias corresponde a menos açúcar?":"Comparas dos espumosos portugueses: un “Bruto” y un “Extra Seco”. ¿Cuál de estas categorías corresponde a menos azúcar?","Extra Seco":"Extra Seco","Bruto":"Bruto","São equivalentes":"Son equivalentes","A categoria não dá informação sobre açúcar":"La categoría no da información sobre el azúcar","Na escala dos espumantes, Bruto corresponde a menos açúcar do que Extra Seco. Não basta comparar o sentido habitual das palavras: é preciso conhecer a categoria.":"En la escala de los espumosos, Bruto corresponde a menos azúcar que Extra Seco. No basta con comparar el sentido habitual de las palabras: hay que conocer la categoría.","Um cliente espera que um Porto Branco Seco tenha tão pouco açúcar como um branco tranquilo seco. O que deves explicar?":"Un cliente espera que un Oporto Blanco Seco tenga tan poco azúcar como un blanco tranquilo seco. ¿Qué debes explicar?","“Seco” significa sempre a mesma quantidade de açúcar":"“Seco” significa siempre la misma cantidad de azúcar","O Porto Branco Seco não tem açúcar":"El Oporto Blanco Seco no tiene azúcar","O Porto só se torna seco com o envelhecimento":"El Oporto solo se vuelve seco con el envejecimiento","As duas categorias usam critérios diferentes para a indicação “seco”":"Las dos categorías usan criterios distintos para la indicación “seco”","Um Porto classificado como seco pode ter bastante mais açúcar do que um branco tranquilo seco. A mesma palavra não corresponde aos mesmos limites nestas categorias.":"Un Oporto clasificado como seco puede tener bastante más azúcar que un blanco tranquilo seco. La misma palabra no corresponde a los mismos límites en estas categorías.","“Este Porto é seco dentro da classificação dos Portos, mas pode sentir mais doçura do que num branco tranquilo seco.”":"“Este Oporto es seco dentro de la clasificación de los Oportos, pero puede notar más dulzor que en un blanco tranquilo seco.”","Um branco tem algum açúcar residual, mas a doçura parece discreta. Que característica pode contribuir para isso?":"Un blanco tiene algo de azúcar residual, pero el dulzor parece discreto. ¿Qué característica puede contribuir a ello?","Uma acidez que torna a doçura menos evidente":"Una acidez que hace el dulzor menos evidente","Uma cor muito clara":"Un color muy pálido","A ausência de estágio em madeira":"No haber pasado por madera","Uma garrafa mais antiga":"Una botella más antigua","A acidez pode atenuar a doçura percebida. O açúcar continua presente: o que muda é a forma como sentimos o equilíbrio do vinho.":"La acidez puede atenuar el dulzor percibido. El azúcar sigue ahí: lo que cambia es cómo sentimos el equilibrio del vino.","Um cliente prova um vinho seco e diz: “Para mim, parece doce.” Qual é a melhor resposta?":"Un cliente prueba un vino seco y dice: “Para mí, parece dulce.” ¿Cuál es la mejor respuesta?","“É seco, por isso não pode sentir doçura.”":"“Es seco, así que no puede notar dulzor.”","“Então a ficha técnica está errada.”":"“Entonces la ficha técnica está mal.”","“O que lhe dá essa impressão: a doçura na boca ou os aromas de fruta madura?”":"“¿Qué le da esa impresión: el dulzor en boca o los aromas de fruta madura?”","“Deve ser o álcool; é sempre isso.”":"“Será el alcohol; siempre es eso.”","A classificação e a experiência de quem prova não são a mesma coisa. Os aromas podem contribuir para uma impressão de doçura. Esclarece a sensação e usa essa informação para ajustar a recomendação.":"La clasificación y la experiencia de quien prueba no son lo mismo. Los aromas pueden contribuir a una impresión de dulzor. Aclara la sensación y usa esa información para ajustar la recomendación.","Preferes seco ou doce?":"¿Prefieres seco o dulce?","Brancos, tintos, rosés e espumantes podem ter diferentes níveis de doçura. Gostar de um destes estilos é só o começo: ainda há muito por escolher.":"Blancos, tintos, rosados y espumosos pueden tener distintos niveles de dulzor. Que te guste uno de estos estilos es solo el principio: aún queda mucho por elegir.","Comecemos pelo “seco”: o que significa, afinal?":"Empecemos por el “seco”: ¿qué significa, en realidad?","O que significa “seco”?":"¿Qué significa “seco”?","Num vinho seco, a doçura é geralmente pouco ou nada percetível. Isso não significa necessariamente zero açúcar.":"En un vino seco, el dulzor suele ser poco o nada perceptible. Eso no significa necesariamente cero azúcar.","Durante a fermentação, as leveduras transformam os açúcares da uva em álcool. O açúcar que não é consumido contribui para o açúcar residual do vinho.":"Durante la fermentación, las levaduras transforman los azúcares de la uva en alcohol. El azúcar que no se consume forma parte del azúcar residual del vino.","Mas um vinho seco também pode lembrar fruta madura.":"Pero un vino seco también puede recordar a fruta madura.","Frutado também pode ser seco":"Afrutado también puede ser seco","Pêssego, morango, ameixa… São aromas que podemos reconhecer ao cheirar o vinho e durante o gole.":"Melocotón, fresa, ciruela… Son aromas que podemos reconocer al oler el vino y durante el trago.","Um vinho muito frutado pode continuar a ser seco. Esses aromas podem sugerir doçura, mas não revelam quanto açúcar tem.":"Un vino muy afrutado puede seguir siendo seco. Esos aromas pueden sugerir dulzor, pero no revelan cuánto azúcar tiene.","E aquela sensação de boca seca? É outra característica.":"¿Y esa sensación de boca seca? Es otra característica.","Quando o vinho seca a boca":"Cuando el vino seca la boca","A sensação de secura ou aspereza nas gengivas e no interior das bochechas chama-se adstringência. Nos vinhos, está muito associada aos taninos.":"La sensación de sequedad o aspereza en las encías y en el interior de las mejillas se llama astringencia. En el vino, está muy asociada a los taninos.","Um vinho pode ser seco, frutado e macio ao mesmo tempo.":"Un vino puede ser seco, afrutado y suave a la vez.","“Agora vamos à sala. Quando alguém pede um vinho ‘seco’ ou ‘docinho’, como descobres o que procura?”":"“Ahora, a la sala. Cuando alguien pide un vino ‘seco’ o ‘dulcecito’, ¿cómo descubres lo que busca?”","Seco… em que sentido?":"Seco… ¿en qué sentido?","Serviço de sala":"Servicio de sala","Distingue doçura, aromas frutados e adstringência, e esclarece o pedido do cliente antes de recomendar.":"Distingue dulzor, aromas afrutados y astringencia, y aclara el pedido del cliente antes de recomendar.","{1} em {2}. Seco, frutado e macio podem descrever o mesmo vinho. Na próxima recomendação, começa por perceber que sensação o cliente procura.":"{1} de {2}. Seco, afrutado y suave pueden describir el mismo vino. En la próxima recomendación, empieza por entender qué sensación busca el cliente.","Parte {1} · {2}":"Parte {1} · {2}","Vamos experimentar":"Vamos a probar","Voltar":"Volver","Serviço 4":"Servicio 4","Abre quando concluíres a etapa 3 · Tawny.":"Se abre cuando completes la etapa 3 · Tawny.","Para rever as perguntas de cada nível, e as mesas, sem ter de lá chegar. {1} perguntas no total, {2} por ronda.":"Para repasar las preguntas de cada nivel, y las mesas, sin tener que llegar hasta ahí. {1} preguntas en total, {2} por ronda.","O limão estraga o vinho e deixa-o com sabor metálico":"El limón estropea el vino y le deja sabor metálico","O limão aumenta o álcool do vinho e esconde a fruta":"El limón aumenta el alcohol del vino y esconde la fruta","Os brancos não combinam com limão, só os tintos":"Los blancos no combinan con limón, solo los tintos","Vinho o mais seco possível, para cortar o doce":"El vino más seco posible, para cortar el dulce","Vinho com muito tanino, para equilibrar o prato":"Un vino con mucho tanino, para equilibrar el plato","Vinho com muito álcool, para aquecer a boca":"Un vino con mucho alcohol, para calentar la boca","O espumante dissolve a gordura do frito no estômago":"El espumoso disuelve la grasa del frito en el estómago","A bolha tira as calorias e torna o frito mais leve":"La burbuja quita calorías y hace el frito más ligero","O espumante tem gordura própria, que combina com a do polme":"El espumoso tiene grasa propia, que combina con la del rebozado","O piri-piri aumenta o álcool do vinho que fica na boca":"El piri-piri aumenta el alcohol del vino que queda en la boca","O álcool apaga o picante, mas deixa o vinho mais amargo":"El alcohol apaga el picante, pero deja el vino más amargo","É só impressão: o álcool e o picante não se influenciam":"Es solo impresión: el alcohol y el picante no se influyen","É um vinho doce, porque o pêssego é uma fruta doce":"Es un vino dulce, porque el melocotón es una fruta dulce","É um vinho meio seco, entre o seco e o doce":"Es un vino semiseco, entre el seco y el dulce","Tem pouco álcool, como a maioria dos vinhos frutados":"Tiene poco alcohol, como la mayoría de los vinos afrutados","O vinho macio tem necessariamente mais açúcar residual":"El vino suave tiene necesariamente más azúcar residual","O vinho áspero tem necessariamente mais álcool e menos fruta":"El vino áspero tiene necesariamente más alcohol y menos fruta","Um deles foi classificado de forma errada no rótulo":"Uno de ellos se clasificó mal en la etiqueta","Escolher logo o tinto mais frutado e maduro da carta":"Elegir directamente el tinto más afrutado y maduro de la carta","Recomendar o tinto com mais álcool da carta":"Recomendar el tinto con más alcohol de la carta","Escolher um tinto com bastante madeira e baunilha":"Elegir un tinto con bastante madera y vainilla","Apresento o branco mais floral como se fosse doce":"Presento el blanco más floral como si fuera dulce","Escolho o branco com mais álcool e digo que é mais doce":"Elijo el blanco con más alcohol y digo que es más dulce","Sirvo um Porto Branco sem voltar a perguntar o que prefere":"Sirvo un Oporto Blanco sin volver a preguntar qué prefiere","“Prefere um vinho jovem e fresco ou um mais velho e evoluído?”":"“¿Prefiere un vino joven y fresco o uno más viejo y evolucionado?”","“Prefere um vinho de uma região quente, como o Alentejo?”":"“¿Prefiere un vino de una región cálida, como el Alentejo?”","“Gosta de vinhos que estagiaram em barrica de carvalho?”":"“¿Le gustan los vinos criados en barrica de roble?”","“Seco” significa sempre a mesma quantidade de açúcar, em qualquer vinho":"“Seco” significa siempre la misma cantidad de azúcar, en cualquier vino","O Porto Branco Seco não tem açúcar nenhum, tal como o branco seco":"El Oporto Blanco Seco no tiene nada de azúcar, igual que el blanco seco","O Porto só se torna seco depois de muitos anos de envelhecimento":"El Oporto solo se vuelve seco tras muchos años de envejecimiento","Uma cor muito clara, que faz o vinho parecer leve":"Un color muy claro, que hace parecer ligero el vino","A ausência de qualquer estágio em madeira":"No haber pasado nada de tiempo en madera","Uma garrafa mais antiga, já com alguns anos":"Una botella más antigua, ya con algunos años","“É seco, por isso não pode sentir doçura nenhuma neste vinho.”":"“Es seco, así que no puede notar ningún dulzor en este vino.”","“Então a ficha técnica deve estar errada; vou confirmar com o produtor.”":"“Entonces la ficha técnica debe de estar mal; lo confirmo con el productor.”","“Deve ser o álcool; num vinho seco é sempre isso que parece doce.”":"“Será el alcohol; en un vino seco siempre es eso lo que parece dulce.”","O limão aumenta o álcool do vinho e esconde toda a fruta que ele tem":"El limón aumenta el alcohol del vino y esconde toda su fruta","O vinho parece mais leve e com menos álcool":"El vino parece más ligero y con menos alcohol","O vinho parece mais doce e mais frutado":"El vino parece más dulce y afrutado","O vinho parece mais frutado e macio":"El vino parece más afrutado y suave","O piri-piri aumenta o teor de álcool do vinho que fica na boca":"El piri-piri aumenta la graduación del vino que queda en la boca","Escolher logo o tinto mais frutado e maduro que houver na carta":"Elegir directamente el tinto más afrutado y maduro que haya en la carta","Sirvo um Porto Branco sem voltar a perguntar o que ela prefere":"Sirvo un Oporto Blanco sin volver a preguntarle qué prefiere","“Prefere um vinho jovem e fresco ou um vinho mais velho e evoluído?”":"“¿Prefiere un vino joven y fresco o un vino más viejo y evolucionado?”","Meio doce, leve e pouco aromático":"Semidulce, ligero y poco aromático"}};window.FASE_UVA_I18N={"en":{"fase":"uva","titulo":"The Grape","versao":"2026-10-17 v9, 83 perguntas (59 de teoria + 24 situações de sala). Retiradas 6 situações de sala que repetiam a Vinha (guardadas em fases/uva-retiradas-repetidas.json).","niveis":[{"n":1,"id":"iniciante","nome":"Beginner","alcunha":"Ruby"},{"n":2,"id":"intermedio","nome":"Intermediate","alcunha":"Tawny"},{"n":3,"id":"avancado","nome":"Advanced","alcunha":"Vintage"}],"regra":{"perguntas_por_ronda":8,"bagos":3,"sobe_com_erros_ate":1,"fica_com_erros":2,"desce_com_erros":3,"erradas_por_ronda_max":3,"nota_rever":"Perguntas com \"rever\": true ficam guardadas mas fora das rondas até serem confirmadas.","situacoes_por_ronda":2},"perguntas":[{"id":"uva-1-01","nivel":1,"tipo":"tocar","q":"Tap the part that gives red wine its colour.","a":"pelicula","k":"A red wine's colour lives in the skin.","e":"Most of the red pigments (anthocyanins) are concentrated in the skin, along with tannins and aromas. The pulp is usually pale, with exceptions such as teinturier (red-fleshed) varieties.","tema":"bago","sala":"If a guest is puzzled by a white sparkling wine made from black grapes, the explanation starts here: the colour is in the skin."},{"id":"uva-1-02","nivel":1,"tipo":"tocar","q":"Where are the water, sugar and acids?","a":"polpa","k":"Pulp: the tank of water, sugar and acids.","e":"In the pulp: the juicy part of the berry, full of water, sugars and acids. The grape's headquarters, so to speak.","tema":"bago","sala":"The sweetness and freshness you taste in the glass start in the pulp."},{"id":"uva-1-03","nivel":1,"tipo":"tocar","q":"Tap the berry's seeds.","a":"grainhas","k":"Pips: seeds with bitter tannins. Don't crush them.","e":"They're called pips, and they carry tannins and oils. Crushed, they can lend bitterness to the wine, which is why the press shouldn't turn into a seed crusher.","tema":"bago","sala":"A 'green' bitterness on the finish can come from roughly handled pips, which release harsher tannins."},{"id":"uva-1-04","nivel":1,"tipo":"tocar","q":"Tap the skeleton that holds the berries.","a":"engaco","k":"Stem: the hanger that holds the berries.","e":"That's the stem: the branching 'skeleton' that holds the berries in the bunch. The vine's very own coat hanger.","tema":"bago"},{"id":"uva-1-05","nivel":1,"tipo":"tocar","q":"Tap the whitish layer covering the skin.","a":"pruina","k":"Bloom: the berry's natural wax, not dust.","e":"That's the bloom, a natural waxy coating on the berry: factory-fitted protection, not dust to wipe off.","tema":"bago","sala":"With a plate of table grapes, a guest may notice the white 'dust' on the berries: it's the bloom, not dirt."},{"id":"uva-1-07","nivel":1,"tipo":"escolha","q":"A single grape on its own is called a…","o":["Berry","Bunch","Stem","Bud"],"a":0,"k":"Berry: each grape, one by one.","e":"Berry: each individual grape. Put several together and you have a bunch: small team, eye-catching result.","tema":"bago"},{"id":"uva-1-08","nivel":1,"tipo":"escolha","q":"A cluster of berries attached to the stem is called a…","o":["Bunch","Branch","Cane","Berry"],"a":0,"k":"Bunch: the team of berries on the stem.","e":"A bunch. When picking by hand, the whole bunch is cut. A machine works differently: it shakes the vine and mostly knocks off the berries.","tema":"bago"},{"id":"uva-1-09","nivel":1,"tipo":"escolha","q":"In fermentation, sugar turns into alcohol and…","o":["Carbon dioxide","Oxygen","Tartaric acid","Water"],"a":0,"k":"Yeasts eat sugar and leave alcohol and gas.","e":"Yeasts convert fermentable sugars mainly into alcohol and carbon dioxide. This is where the must starts taking on the personality of a wine.","tema":"composicao","sala":"In a dry wine, almost all the sugar has become alcohol. If some sugar is left, the wine is sweet or medium-sweet."},{"id":"uva-1-10","nivel":1,"tipo":"escolha","q":"Red wine gets its colour because it ferments with…","o":["The skins","The pips","The stems","The bloom"],"a":0,"k":"Red wine gets its colour fermenting with the skins.","e":"The skins: pigments pass from the skins into the must during maceration. In most varieties the juice is pale, though there are teinturier exceptions.","tema":"bago","sala":"For a rosé, the skins usually spend only a short time with the must; for a red, longer. The variety and the method also play a part in the colour."},{"id":"uva-1-11","nivel":1,"tipo":"vf","q":"Black grapes almost always have red pulp.","a":false,"k":"Pulp is almost always pale; the colour is in the skin.","e":"False! In most black varieties the pulp is pale and the colour comes from the skin. Teinturiers are the exception that proves the rule, and they colour the pulp as well.","tema":"bago","sala":"A classic teinturier is Alicante Bouschet, widely planted in the Alentejo: it has red pulp and gives very dark reds."},{"id":"uva-1-12","nivel":1,"tipo":"escolha","q":"Tannins leave your mouth feeling…","o":["Dry and rough, like strong tea","Warmer, like after a sip of brandy","Burning, like after a spicy dish","Fresh and watering, like after a lemon"],"a":0,"k":"Tannins: a dry mouth, like strong tea.","e":"Tannins create astringency: your mouth feels dry and slightly rough, like after a very strong cup of black tea. It's not a shortage of water in the glass; it's tannins interacting with proteins in your saliva.","tema":"composicao","sala":"When a guest says a red 'dries out the mouth', they're talking about tannins, not acidity or alcohol."},{"id":"uva-1-15","nivel":1,"tipo":"vf","q":"Bloom is dirt and should be washed off before making wine.","a":false,"k":"Bloom is natural wax: leave it be.","e":"False: bloom is a natural wax, not dirt. Yeasts may be found on the grape's surface, but the bloom isn't a guaranteed 'yeast hotel': spontaneous fermentation depends on a whole community of microorganisms.","tema":"bago"},{"id":"uva-1-17","nivel":1,"tema":"bago","tipo":"vf","q":"White grapes have no tannins at all.","a":false,"k":"White grapes have some tannin; white wine, very little.","e":"False: they have some, in the skins and pips. White wine ends up with very little because it usually ferments without the skins.","sala":"Many Alentejo talha whites (fermented in clay pots) ferment on their skins, so they can show more colour and some tannic texture."},{"id":"uva-1-18","nivel":1,"tema":"especies","tipo":"vf","q":"Table grapes usually have bigger berries and thinner skins than wine grapes.","a":true,"k":"Table: big berry, thin skin. Wine: smaller, thicker skin.","e":"True, as a rule: table grapes are chosen for eating. Wine grapes tend to have smaller berries and more skin, where colour, tannins and aromas sit. Every variety has its exceptions.","sala":"If a guest asks why wine isn't made from table grapes: wine varieties are chosen for their skins, acidity and sugar."},{"id":"uva-1-19","nivel":1,"tema":"bago","tipo":"escolha","q":"What is picked at harvest?","o":["The grapes","The leaves","The canes","The buds"],"a":0,"k":"At harvest, it's the ripe grapes that get picked.","e":"The grapes. By hand, the whole bunch is cut; by machine, the vine is shaken and mostly the berries come off. Either way, the aim is ripe fruit, not the leaves or the canes.","rever":true},{"id":"uva-1-20","nivel":1,"tema":"composicao","tipo":"escolha","q":"Grape juice, before it ferments, is called…","o":["Must","Wine","Syrup","Pomace"],"a":0,"k":"Must: grape juice that isn't wine yet.","e":"Must: freshly crushed grape juice, sometimes still with its skins and pips. After alcoholic fermentation it becomes wine: an official career change.","sala":"For Port, grape spirit is added to the must partway through fermentation. The fermentation stops, which is why the wine ends up sweet and higher in alcohol."},{"id":"uva-1-21","nivel":1,"tema":"bago","tipo":"escolha","q":"After pressing, what's left over (skins, pips and stems) is called…","o":["Pomace","Must","Lees","Cork"],"a":0,"k":"Pomace: what's left in the press.","e":"Pomace: the solid parts left after pressing, mainly skins and pips (plus stems, if they weren't removed). It can be distilled into aguardente bagaceira, Portugal's pomace brandy.","sala":"Aguardente bagaceira, offered as a digestif, is distilled from pomace."},{"id":"uva-1-24","nivel":1,"tema":"composicao","tipo":"escolha","q":"Which tastes come from the pulp?","o":["Sweetness and acidity","Bitterness and roughness","Sweetness and bitterness","Acidity and astringency"],"a":0,"k":"Sweetness and acidity come from the pulp.","e":"Sweetness, from the sugars; acidity, mainly from tartaric and malic acids. Astringency comes largely from the tannins in the skins and pips: the berry speaks with several 'voices' on the palate.","sala":"Sweetness and acidity come from the pulp; bitterness and that drying feel come mainly from the skins and pips."},{"id":"uva-1-25","nivel":1,"tema":"bago","tipo":"tocar","q":"Tap the part removed during destemming.","a":"engaco","k":"Destemming: taking off the stems before fermenting.","e":"The stems. Removing them is called destemming; it can reduce tannins and herbaceous notes, although some wine styles keep part of the stems on purpose.","sala":"A red made with some of the stems can have more tannin and more herbaceous notes."},{"id":"uva-1-26","nivel":1,"tema":"bago","tipo":"tocar","q":"Tap the part that holds fruity and floral aromas.","a":"pelicula","k":"Aromas: in the skin and just beneath it.","e":"The skin and the pulp just beneath it: that's where much of the aromatic potential is concentrated, although this varies with the variety and the compound.","sala":"An aromatic white from Loureiro or Alvarinho owes much of its aroma to the skin and the pulp right next to it."},{"id":"uva-1-27","nivel":1,"tema":"bago","tipo":"tocar","q":"Tap the part that's almost all water.","a":"polpa","k":"Pulp: mostly water, with sugar and acids.","e":"The pulp is mostly water, with dissolved sugars and acids. It's juice before anyone calls it must, and before fermentation rewrites the script."},{"id":"uva-1-28","nivel":1,"tema":"composicao","tipo":"escolha","q":"A ripe grape berry is, above all…","o":["Water","Sugar","Alcohol","Acid"],"a":0,"k":"A ripe berry is mostly water.","e":"Mostly water, often around 70–80% of its weight, followed by sugars, whose share depends on the variety and ripeness. The figures are approximate; every berry has its own little weather report."},{"id":"uva-1-29","nivel":1,"tema":"composicao","tipo":"vf","q":"The tannins in wine come only from the oak barrels.","a":false,"k":"Tannins: from the grape first, sometimes from oak.","e":"False. Skins and pips supply grape tannins; oak can add others, such as ellagitannins. Two contributions, different origins.","sala":"A red can be tannic without ever having seen a barrel: the tannins come mainly from the grape."},{"id":"uva-2-01","nivel":2,"tipo":"escolha","q":"What are the two main sugars in the pulp?","o":["Glucose and fructose","Sucrose and lactose","Sucrose only","Maltose and starch"],"a":0,"k":"Glucose and fructose: the grape's sweetness.","e":"Glucose and fructose are the main sugars in ripe grapes. The ratio between them can vary; together they account for almost all the sugar in the berry.","tema":"composicao","sala":"In a Moscatel de Setúbal, the sweetness comes mainly from the grape's glucose and fructose left unfermented: adding grape spirit stops the fermentation."},{"id":"uva-2-02","nivel":2,"tipo":"escolha","q":"Which acid is most characteristic of grapes?","o":["Tartaric","Citric","Acetic","Lactic"],"a":0,"k":"Tartaric: the grape's signature acid.","e":"Tartaric is one of the most characteristic grape acids, alongside malic. Acetic is the one you know from vinegar; in wine, in excess, it's no longer a welcome guest.","tema":"composicao","sala":"Tartrate crystals that may appear at the bottom of the bottle or on the cork are harmless. On their own, they don't mean the wine has gone bad."},{"id":"uva-2-03","nivel":2,"tipo":"escolha","q":"Where are most of the grape's aromas found?","o":["In the skin and just beneath it","In the stem that holds the berries together","In the seeds, which crack when crushed","In the centre of the pulp, by the seeds"],"a":0,"k":"Aromas are skin-deep: in the skin and just below.","e":"In the skin and the pulp immediately beneath it, although the distribution depends on the variety and the aroma compound. The berry doesn't keep all its aromas in the same drawer.","tema":"composicao","sala":"In some whites, the must is left in contact with the skins before fermentation to extract aroma compounds and their precursors."},{"id":"uva-2-04","nivel":2,"tipo":"escolha","q":"Why are grapes pressed gently?","o":["So the pips don't break and release bitter tannins","So the colour isn't lost","So the juice doesn't heat up","So the must doesn't start fermenting too early"],"a":0,"k":"Gentle press: whole pips, less bitterness.","e":"To avoid crushing the pips: their phenolic compounds can bring bitterness and astringency. Gentle pressing is finesse with science behind it.","tema":"bago","sala":"Harder pressing can extract compounds that bring bitterness and astringency. But a bitter finish on its own isn't enough to tell how the wine was pressed."},{"id":"uva-2-05","nivel":2,"tipo":"escolha","q":"Removing the stems before fermentation is called…","o":["Destemming","Crushing","Pressing","Pumping over"],"a":0,"k":"Destemming: separating the berries from the stems.","e":"Destemming: separating the berries from the stems. It can limit tannins and herbaceous aromas, but the decision depends on the intended style, and some winemakers prefer to keep the stems 'on stage': they can bring more structure and herbaceous notes, depending on the style.","tema":"bago"},{"id":"uva-2-06","nivel":2,"tipo":"escolha","q":"You can make white wine from black grapes because…","o":["The pulp is almost always pale","The colour comes out during filtration","The grapes lose their colour as they ripen","The black grapes are washed first"],"a":0,"k":"Pale pulp, juice off the skins fast: white from black grapes.","e":"Because the pulp of most black varieties is pale, separating the juice from the skins quickly gives a pale wine. In certain styles, such as some sparkling wines, this is called blanc de noirs.","tema":"bago","sala":"On a Portuguese sparkling wine, 'Blanc de Noirs' on the label means a white made from black grapes."},{"id":"uva-2-07","nivel":2,"tipo":"escolha","q":"Rosé has only a little colour because…","o":["The juice spends little time with the skins","It's made from pink grapes","It ferments at a lower temperature than red wine","It's aged in clear bottles"],"a":0,"k":"Rosé: only a short time between juice and skins.","e":"Rosé can get its colour from brief contact between the juice and the skins; there are also rosés made by direct pressing or by the saignée method. The colour depends on method and time, not on a magic stopwatch.","tema":"bago","sala":"A rosé's colour doesn't reveal its sweetness. A paler rosé isn't necessarily drier than a darker one."},{"id":"uva-2-08","nivel":2,"tipo":"escolha","q":"Almost all the world's wine is made from grapes of which species?","o":["Vitis vinifera","Vitis labrusca","Vitis riparia","Vitis rupestris"],"a":0,"k":"Vitis vinifera: the species behind almost all wine.","e":"Vitis vinifera is the species behind most wines. Other Vitis species, many of them American, are also used for rootstocks, hybrids and some wines.","tema":"especies"},{"id":"uva-2-09","nivel":2,"tipo":"escolha","q":"Touriga Nacional, Alvarinho and Chardonnay are…","o":["Varieties of the same species","Different vine species","American hybrids","Rootstocks"],"a":0,"k":"Different varieties, one species: Vitis vinifera.","e":"They're grape varieties: cultivated varieties of the same species, Vitis vinifera. Different names, different profiles; none of them is a separate vine species.","tema":"especies","sala":"The variety can give you clues when presenting a wine, but it doesn't tell the whole story: the region and the winemaking also shape the style."},{"id":"uva-2-16","nivel":2,"tema":"bago","tipo":"escolha","q":"What's the maximum number of pips a berry can have?","o":["4","2","6","10"],"a":0,"k":"Up to four pips per berry; many have fewer.","e":"Up to four: the ovary can form four ovules, although many berries end up with fewer pips."},{"id":"uva-2-17","nivel":2,"tema":"bago","tipo":"escolha","q":"Grapes without pips, like many table grapes, are technically called…","o":["Apyrenous","Teinturier","Hybrid","Raisins"],"a":0,"k":"Apyrenous: seedless grapes, stars of the fruit bowl.","e":"Apyrenous, better known as seedless: grapes without developed pips, very common as table grapes and raisins. They're less usual for wine, but 'hardly ever' is safer than 'never'."},{"id":"uva-2-18","nivel":2,"tema":"composicao","tipo":"escolha","q":"The pigments that colour the skins of black grapes are called…","o":["Anthocyanins","Tannins","Chlorophylls","Yeasts"],"a":0,"k":"Anthocyanins: the pigments that colour the skin.","e":"Anthocyanins: pigments in the skins of black grapes. Tannins are also phenolics, but they contribute mainly to astringency and structure: chemical cousins, different jobs.","sala":"The hue gives clues about development: many reds move from purple or ruby towards garnet and brick. But colour alone can't tell you the age."},{"id":"uva-2-19","nivel":2,"tema":"composicao","tipo":"escolha","q":"The two main acids in grapes are…","o":["Tartaric and malic","Citric and acetic","Lactic and citric","Acetic and tartaric"],"a":0,"k":"Tartaric and malic: the grape's acid duo.","e":"Tartaric and malic are the grape's two main acids. The ratio varies; malic recalls the acidity of green apples and tends to decrease during ripening.","sala":"In malolactic conversion, malic acid turns into lactic acid, lowering the acidity. On the palate, the wine can seem softer."},{"id":"uva-2-20","nivel":2,"tema":"composicao","tipo":"escolha","q":"As grapes ripen, what happens to sugar and acidity?","o":["Sugar rises and acidity falls","Both rise","Both fall","Sugar falls and acidity rises"],"a":0,"k":"As grapes ripen, sugar goes up and acidity goes down.","e":"In general, sugars build up and acidity drops during ripening, mainly because malic acid is used up. The grower is looking for the right balance for the wine they want, not a magic number.","sala":"Under similar conditions, grapes from warmer climates tend to build up more sugar and lose more acidity. In the wine, that can mean more alcohol and less freshness, though harvest timing and winemaking also count."},{"id":"uva-2-21","nivel":2,"tema":"especies","tipo":"escolha","q":"What is a grape variety?","o":["A type of vine with its own characteristics","A wine region with its own production rules","A type of soil where vines grow best","A wine brand registered by a producer"],"a":0,"k":"Grape variety: a type of vine with its own personality.","e":"A grape variety is a cultivated variety with its own characteristics; Touriga Nacional, Arinto and Baga are examples of Vitis vinifera. Each one carries its own genetic ID card."},{"id":"uva-2-22","nivel":2,"tema":"castas","tipo":"escolha","q":"Tinta Roriz and Aragonez are…","o":["The same variety under different names","Two different Douro varieties","White varieties","A crossing and a hybrid"],"a":0,"k":"Tinta Roriz and Aragonez: one grape, two names.","e":"They're the same variety, Tempranillo: Tinta Roriz and Aragonez are Portuguese names used in different regions. Vines cross borders more easily than names do.","sala":"Tinta Roriz and Aragonez are the same variety. If a guest likes Aragonez from the Alentejo, you can steer them towards a Douro wine with Tinta Roriz, without promising the same profile."},{"id":"uva-2-23","nivel":2,"tema":"castas","tipo":"escolha","q":"In the Tejo, the black variety Castelão is also known as…","o":["João de Santarém","Baga","Trincadeira","Touriga Franca"],"a":0,"k":"João de Santarém: Castelão's name in the Tejo.","e":"João de Santarém is one of Castelão's names, used in the Tejo. Same variety, different name depending on the region. Its official name is Castelão, widely planted in the Península de Setúbal.","fonte":"DN, 'Das margens do Tejo para a mesa' (Castelão conhecida como João de Santarém no Tejo); vinorandum (sinónimos)","sala":"On the wine list, Castelão and João de Santarém are the same variety. Tell the guest so they don't get confused."},{"id":"uva-2-24","nivel":2,"tema":"castas","tipo":"escolha","q":"In Bairrada, the white variety Fernão Pires is also known as…","o":["Maria Gomes","Bical","Cerceal","Malvasia Fina"],"a":0,"k":"Maria Gomes: Fernão Pires with a Bairrada accent.","e":"Maria Gomes is the name Fernão Pires goes by in Bairrada. Same variety, a different christening name depending on the region. It happens abroad too: in Galicia, Alvarinho is called Albariño.","sala":"On a Bairrada white, 'Maria Gomes' on the label means Fernão Pires."},{"id":"uva-2-29","nivel":2,"tema":"bago","tipo":"escolha","q":"What is the tiny stalk that attaches each berry to the axis of the bunch called?","o":["Pedicel","Petiole","Tendril","Scion"],"a":0,"k":"Pedicel: the tiny stalk that holds each berry.","e":"The pedicel is each berry's little stalk, linking it to the axis of the bunch. The petiole, on the other hand, links the leaf to the shoot."},{"id":"uva-3-05","nivel":3,"tipo":"escolha","q":"What is the black variety of Colares, planted ungrafted in the sand?","o":["Ramisco","Baga","Castelão","Touriga Franca"],"a":0,"k":"Ramisco: Colares' grape, ungrafted in the sand.","e":"Ramisco is the emblematic black variety of Colares. In the sandy soils, where phylloxera struggles to survive, vines can grow pé-franco: on their own roots, without grafting. It gives reds with high acidity and firm tannins that need time to reveal their full complexity.","tema":"castas","sala":"A young Ramisco red tends to come across as hard and acidic: give the guest a heads-up and serve it with food."},{"id":"uva-3-06","nivel":3,"tipo":"escolha","q":"Sercialinho, a Portuguese variety created by crossing, has Vital and Uva Cão as its parents. It is the result of…","o":["A crossing between two Vitis vinifera varieties","A hybrid of Vitis vinifera and an American species","A rootstock chosen to resist phylloxera","A clone selected from a single vine"],"a":0,"k":"Sercialinho: a cross of two varieties of one species.","e":"Vital and Uva Cão are both Vitis vinifera varieties, so Sercialinho is a crossing within the same species, not an interspecific hybrid. For years one of its parents was thought to be Alvarinho; DNA analysis corrected the family tree. Like Pinotage (Pinot Noir × Cinsault), it's a crossing between varieties.","tema":"especies","fonte":"Glossário wein.plus (Cercealinho/Sercialinho: Vital × Uva Cão, ADN 2020); artigo 'Sercialinho mystery' (Vital e Uva Cão, pais oficiais)"},{"id":"uva-3-07","nivel":3,"tipo":"escolha","q":"What do you call a grape variety that results from crossing Vitis vinifera with an American Vitis species?","o":["Hybrid","Crossing","Clone","Own-rooted vine"],"a":0,"k":"Hybrid: vinifera crossed with an American species.","e":"Different species, interspecific hybrid. A crossing between two Vitis vinifera varieties, by contrast, is intraspecific: it combines varieties of the same species. One example of a hybrid is Vidal, used in Canada to make icewine from grapes that freeze naturally on the vine.","tema":"especies","sala":"DOC wine is made from Vitis vinifera varieties, not hybrids."},{"id":"uva-3-08","nivel":3,"tipo":"escolha","q":"Which aroma is typical of Vitis labrusca?","o":["Foxy (strawberry, boiled sweets)","Black pepper","Petrol","Butter"],"a":0,"k":"Foxy: labrusca's strawberry-and-sweets aroma.","e":"'Foxy' is a sensory descriptor typical of some American grapes: it can recall grape juice, boiled sweets or wild berries. It's an aroma analogy, not a fox hiding in your glass.","tema":"especies","sala":"The 'foxy' aroma recalls home-made vinho morangueiro ('strawberry wine'), made from American grapes such as Isabel."},{"id":"uva-3-09","nivel":3,"tipo":"escolha","q":"Isabel (Isabella) is a grape of American origin. In terms of classification, it is…","o":["An interspecific hybrid","A Vitis vinifera variety","A rootstock","A clone of Touriga Nacional"],
