<!doctype html>
<html lang="pt-PT">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Grape to Know: o jogo para aprender vinho em rondas curtas. Prova o que sabes.">
<title>Grape to Know</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,500..800,0..100,0..1;1,9..144,500..800,0..100,0..1&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: uma noite de wine bar. Menu fixo no topo, hero com o jogo real em dois telemóveis,
   secções a toda a largura que alternam ameixa escuro e creme, "Sobre mim" com a Ms. Cork, rodapé com colunas. */
:root{
  --bg:#1D131B; --bg-2:#271A24; --line:rgba(251,243,230,.15);
  --pink:#EBA6CF; --red:#D9283C; --cream:#FBF3E6; --cream-2:#F3E7D3; --ink:#2C1C25; --plum:#5E2750;
  --mauve:#D9B9D9; --good:#A6CF72;
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.55;margin:0;overflow-x:hidden}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:clamp(30px,5.6vw,46px);line-height:1.08;letter-spacing:-.01em;font-variation-settings:"SOFT" 50,"WONK" 1}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
p{margin:0}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

/* menu */
.top{position:sticky;top:0;z-index:20;background:rgba(29,19,27,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:68px}
.marca{font-family:var(--display);font-weight:800;font-size:22px;color:var(--cream);text-decoration:none;white-space:nowrap;font-variation-settings:"SOFT" 50,"WONK" 1}
.marca i{font-weight:700;color:var(--cream);background:var(--red);padding:0 .18em;margin:0 .08em;border-radius:3px 8px 4px 9px;display:inline-block;transform:rotate(-4deg)}
.menu{display:flex;gap:4px;margin-left:auto}
.menu a{text-decoration:none;color:var(--mauve);font-weight:600;font-size:15px;padding:8px 12px;border-radius:999px}
.menu a:hover{color:var(--cream);background:rgba(251,243,230,.07)}
.lang{display:flex;gap:2px;border:1.5px solid var(--line);border-radius:999px;padding:3px}
.lang button{font:inherit;cursor:pointer;background:none;border:0;color:var(--mauve);font-weight:800;font-size:12.5px;letter-spacing:.05em;padding:6px 10px;border-radius:999px;min-height:34px}
.lang button[aria-pressed="true"]{background:var(--cream);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border-radius:999px;font-weight:800;min-height:52px;padding:0 26px;white-space:nowrap}
.btn-main{background:var(--pink);color:#2A1222;box-shadow:0 14px 30px -18px var(--pink)}
.btn-main:hover{background:#F3BEDD}
.btn-ghost{border:1.5px solid var(--line);color:var(--cream)}
.btn-ghost:hover{border-color:var(--pink)}
.btn svg{width:18px;height:18px}
.top .btn{min-height:42px;padding:0 18px;font-size:15px}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,64px);align-items:center;padding-block:clamp(36px,7vw,84px) clamp(40px,6vw,72px)}
.hero > *{min-width:0}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,68px);line-height:1;letter-spacing:-.025em;color:var(--cream);white-space:nowrap;
  font-variation-settings:"SOFT" 50,"WONK" 1,"opsz" 144;display:flex;flex-wrap:nowrap;align-items:baseline;column-gap:.2em}
.logo-to{position:relative;display:inline-block;font-style:italic;font-weight:700;padding:0 .14em;isolation:isolate;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144}
.logo-to span{position:relative;z-index:1}
.pincel{position:absolute;z-index:0;left:-.06em;top:.22em;width:calc(100% + .14em);height:.86em;transform:rotate(-5deg);fill:var(--red)}
.slogan{margin-top:.55em;font-weight:800;font-size:clamp(18px,3.6vw,22px);color:var(--pink)}
.hook{margin-top:clamp(20px,3.4vw,30px);font-family:var(--display);font-weight:700;font-size:clamp(28px,4.8vw,42px);line-height:1.1;letter-spacing:-.01em;font-variation-settings:"SOFT" 50,"WONK" 1}
.lede{margin-top:12px;color:var(--mauve);font-size:clamp(16.5px,2.2vw,19px);max-width:44ch}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.fine{font-size:13.5px;color:var(--mauve);margin-top:12px}

/* telemóveis */
.fones{position:relative;height:clamp(440px,52vw,600px)}
.fone{position:absolute;width:clamp(200px,24vw,280px);aspect-ratio:390/844;border-radius:34px;padding:9px;background:#0E0A0D;
  box-shadow:0 0 0 1.5px rgba(251,243,230,.14),0 30px 60px -34px #000}
.fone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:26px}
.fone-a{left:6%;top:0;transform:rotate(-3deg);z-index:2}
.fone-b{right:4%;top:12%;transform:rotate(3deg)}

/* números */
.numeros{border-block:1px solid var(--line)}
.numeros ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}
.numeros li{padding:22px 16px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line)}
.numeros li:first-child{border-left:0;padding-left:0}
.numeros b{font-family:var(--display);font-size:clamp(26px,4vw,34px);font-weight:700;color:var(--pink);line-height:1.1}
.numeros span{color:var(--mauve);font-size:15px}
.numeros b.pq{font-size:clamp(19px,2.4vw,24px);line-height:1.5}

/* secções */
section.s{padding-block:clamp(56px,9vw,104px)}
.claro{background:var(--cream);color:var(--ink)}
.claro .eyebrow{color:#8A2A3A}
.claro .s-head p{color:#6B5562}
.meio{background:var(--bg-2)}
.s-head{display:flex;flex-direction:column;gap:12px;max-width:50ch}
.s-head p{color:var(--mauve)}
.duas{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(28px,5vw,72px);align-items:center}
.duas > *{min-width:0}

/* pergunta de amostra */
.prova{background:#FFFAF1;color:var(--ink);border-radius:22px;padding:clamp(18px,3vw,28px);box-shadow:0 30px 60px -36px rgba(60,20,40,.45);border:1.5px solid #E8D9C2}
.prova .eyebrow{color:#8A2A3A}
.prova .q{font-family:var(--display);font-weight:700;font-size:clamp(18px,2.4vw,22px);line-height:1.3;margin-top:8px}
.ops{display:grid;gap:8px;margin-top:16px}
.op{font:inherit;cursor:pointer;text-align:left;background:#fff;color:var(--ink);border:1.5px solid #E2D3BD;border-radius:14px;padding:12px 14px;font-weight:600;font-size:15.5px;line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.op:hover:not(:disabled){border-color:var(--plum)}
.op:disabled{cursor:default}
.op .m{margin-left:auto;flex:none;font-size:13px;font-weight:800}
.op.ok{border-color:#3E7027;background:#E6EED6}.op.ok .m{color:#3E7027}
.op.no{border-color:#A63A2B;background:#F7E2DA}.op.no .m{color:#A63A2B}
.res{margin-top:14px;border-radius:14px;background:#F1E1EA;padding:12px 14px}
.res b{display:block;font-family:var(--display);font-size:19px}
.res p{margin-top:4px;font-size:15px}
.res a{font-weight:800;color:var(--plum)}
.res-k{font-weight:700;margin-top:6px}
.res-acoes{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px}
.outro{font:inherit;cursor:pointer;background:var(--plum);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:15px;min-height:44px}
.outro:hover{background:#74335F}
.modo{display:flex;gap:6px;background:#F1E6D5;border-radius:999px;padding:4px;margin-bottom:16px}
.modo-b{font:inherit;cursor:pointer;flex:1;min-width:0;border:0;background:transparent;color:#5A4652;border-radius:999px;padding:8px 10px;font-weight:800;font-size:14.5px;min-height:44px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.modo-b small{font-weight:600;font-size:12px;opacity:.85}
.modo-b[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 8px -4px rgba(60,20,40,.4)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.op:focus-visible,.modo-b:focus-visible,.outro:focus-visible,.res b:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.lista{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:14px}
.lista li{display:flex;gap:12px;align-items:flex-start;font-weight:600}
.lista li::before{content:"";flex:none;width:10px;height:10px;margin-top:8px;border-radius:50%;background:var(--red)}

/* como funciona */
.passos{list-style:none;margin:40px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2.4vw,24px);counter-reset:p}
.passos li{background:var(--bg-2);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:8px;min-width:0;counter-increment:p}
.passos li::before{content:counter(p);font-family:var(--display);font-weight:800;font-size:15px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#2A1222;margin-bottom:6px}
.passos h3{font-family:var(--display);font-size:22px;font-weight:700}
.passos p{color:var(--mauve);font-size:16px}
.niveis{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;align-items:center}
.niveis > span{color:var(--mauve);font-size:15px;margin-right:4px}
.nivel{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:16px;padding:10px 16px;min-width:0}
.nivel b{font-family:var(--display);font-size:19px}
.nivel span{font-size:14px;color:var(--mauve)}
.n1 b{color:#E2606F}.n2 b{color:#E0A36A}.n3 b{color:var(--cream)}

/* fases */
.fases{list-style:none;margin:40px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fases li{background:var(--bg);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fases li b{font-family:var(--display);font-size:21px}
.fases li small{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.fases li p{color:var(--mauve);font-size:15.5px}
.fases .ja small{color:var(--good)}
.fases .breve{background:transparent;border:1.5px dashed var(--line)}
.fases .breve small{color:var(--mauve)}

/* para quem */
.quem{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 40px;margin-top:36px}
.quem div{display:flex;flex-direction:column;gap:4px;padding-left:16px;border-left:3px solid var(--red);min-width:0}
.quem b{font-weight:800;font-size:18px}
.quem span{color:var(--mauve);font-size:16px}

/* sobre mim */
.sobre-img{position:relative;max-width:440px;justify-self:center;width:100%}
.sobre-img img{border-radius:28px;width:100%;height:auto;aspect-ratio:720/884;object-fit:cover;box-shadow:0 40px 70px -40px rgba(60,20,40,.6)}
.sobre-img figcaption{margin-top:12px;font-size:14.5px;color:#5A4652;text-align:center}
.sobre-img figcaption b{color:var(--ink)}
.sobre-txt{display:flex;flex-direction:column;gap:16px}
.sobre-txt p{font-size:clamp(17px,2vw,19px);color:#4A3742;max-width:52ch}
.sobre-txt .ass{font-family:var(--display);font-style:italic;font-size:22px;color:var(--plum)}
.selos{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.selos span{border:1.5px solid #DCC9B0;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;color:var(--plum)}

/* acesso */
.faixa{background:linear-gradient(120deg,#5E2750 0%,#3A1830 55%,#1D131B 100%);border-radius:28px;padding:clamp(28px,5vw,56px);display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.faixa > div{display:flex;flex-direction:column;gap:12px;max-width:52ch}
.faixa .lede{margin-top:0}

/* formulário testadores */
.form-t{margin-top:20px;background:var(--bg-2);border:1px solid var(--line);border-radius:28px;padding:clamp(24px,5vw,44px);display:grid;gap:16px}
.form-t .lede{color:var(--mauve)}
.form-t label{display:grid;gap:6px;font-weight:600;font-size:15px}
.form-t input[type=text],.form-t input[type=email],.form-t select,.form-t textarea{font:inherit;font-size:16px;color:var(--cream);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.form-t textarea{min-height:76px;resize:vertical}
.form-t .ok{display:flex;gap:10px;align-items:flex-start;font-weight:500;color:var(--mauve)}
.form-t .ok input{margin-top:5px;width:18px;height:18px;flex:none;accent-color:var(--red)}
.form-t .duas{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.form-t button{justify-self:start;font-family:var(--body);cursor:pointer;border:0}
.form-t .msg{font-weight:700;color:var(--good)}
.form-t .msg.erro{color:var(--pink)}
.form-t .feito-box{display:none}
.form-t.feito > *{display:none}
.form-t.feito > .feito-box{display:grid;gap:14px;justify-items:start;text-align:left}
.form-t .feito-box h3{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.1;color:var(--pink)}
.oculto{position:absolute;left:-9999px}

/* rodapé */
footer{border-top:1px solid var(--line);margin-top:clamp(56px,8vw,96px)}
.pe{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px;padding-block:44px 28px}
.pe h4{margin:0 0 10px;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
.pe p,.pe a{color:var(--mauve);font-size:15px;text-decoration:none;display:block;line-height:1.9}
.pe a:hover{color:var(--cream)}
.pe .marca{font-size:26px;display:inline-block;margin-bottom:6px;color:var(--cream);line-height:1.2}
.pe-fim{border-top:1px solid var(--line);padding-block:18px 32px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;color:var(--mauve);font-size:13.5px}

@media (max-width:960px){ .menu{display:none} }
@media (max-width:820px){
  .hero,.duas{grid-template-columns:1fr}
  .fones{height:470px;max-width:440px;width:100%;margin:0 auto}
  .fone{width:205px}
  .passos,.fases{grid-template-columns:1fr}
  .quem{grid-template-columns:1fr}
  .numeros ul{grid-template-columns:repeat(2,1fr)}
  .numeros li:nth-child(3){border-left:0;padding-left:0}
  .numeros li:nth-child(n+3){border-top:1px solid var(--line)}
  .pe{grid-template-columns:1fr 1fr}
  .pe > div:first-child{grid-column:1/-1}
  .sobre-img{max-width:300px}
}
@media (max-width:520px){
  .top .btn{display:none}
  .marca{font-size:20px}
  .fones{height:420px}
  .fone{width:178px;border-radius:28px;padding:7px}
  .fone img{border-radius:22px}
  .fone-a{left:0}.fone-b{right:0}
  }
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <a class="marca" href="#topo" aria-label="Grape to Know">Grape <i>to</i> Know</a>
    <nav class="menu" aria-label="Menu">
      <a href="#jogo" data-t="nav-jogo"></a>
      <a href="#como" data-t="nav-como"></a>
      <a href="#sobre" data-t="nav-sobre"></a>
      <a href="#acesso" data-t="nav-acesso"></a>
    </nav>
    <div class="lang" role="group" aria-label="Idioma · Language · Idioma">
      <button type="button" id="l-pt" data-l="pt" aria-pressed="true">PT</button>
      <button type="button" id="l-en" data-l="en" aria-pressed="false">EN</button>
      <button type="button" id="l-es" data-l="es" aria-pressed="false">ES</button>
    </div>
    <a class="btn btn-main" href="#" data-jogo target="_blank" rel="noopener" data-t="jogar"></a>
  </div>
</header>

<main id="topo">
  <div class="wrap hero">
    <div>
      <h1 class="logo" aria-label="Grape to Know"><span>Grape</span><i class="logo-to"><svg class="pincel" viewBox="0 0 120 60" preserveAspectRatio="none" aria-hidden="true"><path d="M6 20 C18 10 52 8 82 7 C96 6 108 6 116 9 L113 15 L118 19 L112 26 L117 31 L110 37 L114 43 C96 50 64 52 40 54 C26 55 14 56 4 52 L9 46 L2 41 L8 35 L3 29 Z"/></svg><span>to</span></i><span>Know</span></h1>
      <p class="slogan" data-t="slogan"></p>
      <h2 class="hook" data-t="hook"></h2>
      <p class="lede" data-t="lede"></p>
      <div class="ctas">
        <a class="btn btn-main" href="#" data-jogo target="_blank" rel="noopener"><span data-t="jogar"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a class="btn btn-ghost" href="#jogo" data-t="ver"></a>
      </div>
      <p class="fine" data-t="gratis"></p>

let L = "pt", modo = 0, escolha = null;
try{ const s = localStorage.getItem("gtk-site-lang"); if(T[s]) L = s; else { const n = (navigator.language||"").slice(0,2); if(n==="en"||n==="es") L = n; } }catch(e){}
const fmt = (t,v)=>t.replace("{1}", v);

function pergunta(foco){
  const P = Q[modo], q = P[L];
  document.querySelectorAll("[data-modo]").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.modo===modo)));
  document.getElementById("prova-eb").textContent = T[L]["eb-"+modo];
  document.getElementById("pq").textContent = q.q;
  const box = document.getElementById("ops"); box.innerHTML = "";
  box.setAttribute("aria-labelledby","pq");
  q.o.forEach((t,k)=>{
    const b = document.createElement("button"); b.type = "button"; b.className = "op";
    const s = document.createElement("span"); s.textContent = t; b.appendChild(s);
    if(escolha!==null){
      b.disabled = true;
      if(k===P.a){ b.classList.add("ok"); b.insertAdjacentHTML("beforeend", `<span class="m">${MARCA[L].ok}</span>`); }
      else if(k===escolha){ b.classList.add("no"); b.insertAdjacentHTML("beforeend", `<span class="m">${MARCA[L].no}</span>`); }
    }
    b.onclick = ()=>{ escolha = k; pergunta(true); };
    box.appendChild(b);
  });
  const res = document.getElementById("res");
  res.hidden = escolha===null;
  document.getElementById("anuncio").textContent = "";
  if(escolha!==null){
    const certo = escolha===P.a;
    document.getElementById("res-t").textContent = certo ? T[L].certo : T[L].errado;
    document.getElementById("res-k").textContent = (certo ? "" : fmt(T[L]["certa-era"], q.o[P.a].replace(/\.$/,""))+" ") + q.k;
    document.getElementById("res-p").textContent = q.e;
    document.getElementById("outro").textContent = T[L]["outro-"+modo];
    document.getElementById("desafia").href = "https://wa.me/?text=" + encodeURIComponent(fmt(T[L]["desafia-txt"], q.q) + " " + SITE_URL);
    if(foco){
      document.getElementById("anuncio").textContent = fmt(T[L][certo?"anuncio-ok":"anuncio-no"], document.getElementById("res-k").textContent);
      document.getElementById("res-t").focus();
    }
  }
}
document.querySelectorAll("[data-modo]").forEach(b=>b.onclick=()=>{ modo = +b.dataset.modo; escolha = null; pergunta(); });
document.getElementById("outro").onclick = ()=>{ modo = 1-modo; escolha = null; pergunta(); document.querySelector(`[data-modo="${modo}"]`).focus(); };
function aplicar(){
  document.documentElement.lang = L==="pt" ? "pt-PT" : L;
  document.querySelectorAll("[data-t]").forEach(el=>{ const v = T[L][el.dataset.t]; if(v!==undefined) el.textContent = v; });
  document.querySelectorAll("[data-ta]").forEach(el=>{ const v = T[L][el.dataset.ta]; if(v!==undefined) el.alt = v; });
  document.querySelectorAll("[data-ta-label]").forEach(el=>{ const v = T[L][el.dataset.taLabel]; if(v!==undefined) el.setAttribute("aria-label", v); });
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===L ? "true" : "false"));
  pergunta();
}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ L = b.dataset.l; try{ localStorage.setItem("gtk-site-lang", L); }catch(e){} aplicar(); });
aplicar();

document.getElementById("form-t").addEventListener("submit", e=>{
  e.preventDefault();
  const f = e.target, msg = document.getElementById("f-msg"), b = f.querySelector("button");
  document.getElementById("f-lingua").value = L;
  b.disabled = true;
  fetch("/", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams(new FormData(f)).toString()})
    .then(r=>{ if(!r.ok) throw 0; f.classList.add("feito"); msg.hidden=true; f.scrollIntoView({behavior:"smooth",block:"center"}); document.getElementById("f-feito-h").focus(); })
    .catch(()=>{ msg.className="msg erro"; msg.textContent=T[L]["f-erro"]; msg.hidden=false; b.disabled=false; });
});
</script>
